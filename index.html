하며 자금 보상을 요구하더라도 거절할 수 없다."],"ans":4,"passage":null,"topic":"신용장"},{"id":"61-1-12","subj":1,"no":12,"head":"다음 중 신용장 관련 수수료의 내용과 청구인 및 일반적인 수수료 부담자의 연결로 잘못된 것은?","body":[],"opts":["수수료 환가료 · 내용 은행이 수출환어음 매입 후 현금화할 때 까지 이자 보전 명목의 기간 수수료 · 청구인 매입은행 · 부담자 수출자","수수료 대체료 · 내용 외국환거래에서 원화의 매매가 수반되지 않고, 동종의 외국환으로 거래 시 수수료 · 청구인 외국환은행 · 부담자 은행 고객","수수료 L/G보증료 · 내용 기한부 L/C의 환어음 인수할 때 수수료 · 청구인 매입은행 · 부담자 수출자","수수료 통지수수료 · 내용 신용장을 수익자에게 통지할 때 수수료 · 청구인 통지은행 · 부담자 수출자"],"ans":3,"passage":null,"topic":"신용장"},{"id":"61-1-13","subj":1,"no":13,"head":"다음 중 신용장 요구서류의 수리 요건에 관한 설명으로 가장 적절한 것은?","body":[],"opts":["신용장 물품명세란(45A description of goods)에 인코텀즈 버전이 기재되지 않았더라도 상업송장에 최신의 버전(Incoterms 2020)을 반드시 기재해야 한다.","살물(bulk cargo)의 수출입대금 결제를 위해 개설되는 신용장에 용선운송 가능성을 고려하여 charterparty B/L acceptable 문구를 포함시키는 것이 적절하다.","신용장이 선적전 검사증명서(preshipment inspection certificate)를 요구하는 경우, 선적전 검사증명서의 발행일이 선적일보다 늦으면 수리 거절된다.","신용장이 원본 선화증권 중 일부만 제시하도록 요구하는 경우에 모두 원본으로 제시하면 수리 거절된다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"61-1-14","subj":1,"no":14,"head":"SWIFT 신용장의 조항별 해석에 대한 설명으로 잘못된 것은?","body":[],"opts":["39B maximum credit amount： Up to, maximum, not exceeding 등을 사용하여 신용장 최대 금액을 표시한다.","44B for transportation to：최종 목적지를 표시한다.","48 period for presentation：선적서류가 지정된 은행에 제시되어야 하는 기한을 표시한다.","71B charges：수수료가 개설의뢰인의 부담인 경우를 표시한다. 명시가 없는 경우에 개설수수료와 확인수수료를 제외한 모든 수수료는 수익자의 부담으로 간주한다."],"ans":4,"passage":null,"topic":"신용장"},{"id":"61-1-15","subj":1,"no":15,"head":"다음 중 SWIFT 신용장의 각 항목(field)에 대한 해설로 가장 옳은 것은?","body":[],"opts":["[59 Beneficiary： 한밭상사, 대전, KOREA]로 기재된 경우, 상업송장의 수익자 주소가 창원이라면 수리가 거절된다.","[47 Additional Conditions： Stale B/L acceptable]로 기재된 경우, 신용장에 기재된 서류 제시기간과 유효기간을 모두 충족시켜야 한다.","[46 Docs Required： Signed Commercial Invoice in 4 copies]로 기재된 경우, 반드시 수기로 서명된 원본 송장 4장을 제시해야 한다.","[46 Docs Required： AWB consigned to the order of 개설은행]으로 기재된 경우, 개설은행 기명식 AWB를 제시할 수 있다."],"ans":4,"passage":null,"topic":"신용장"},{"id":"61-1-16","subj":1,"no":16,"head":"무역결제 관련 국제규칙에 대한 설명으로 잘못된 것은?","body":[],"opts":["UCP 600은 화환신용장의 관습 및 서류에 관한 통일규칙으로 보증신용장에는 적용되지 않는다. 마지막 개정은 2007년이다.","URC 522는 환어음 등의 추심에 관한 내용의 Collection 거래에 적용되는 규칙이다. 마지막 개정은 1995년이다.","ISBP 821은 신용장 서류심사에 관한 국제표준은행관습으로 종전 ISBP 745에서 일부 조항이 추가된 2023년 개정판이다.","URBPO 750은 신용장 또는 O/A가 아닌 새로운 국제무역 결제 시스템에 관한 국제규칙으로 2013년부터 사용되고 있다."],"ans":1,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"61-1-17","subj":1,"no":17,"head":"UCP 600과 ISBP 745에서 규정한 날짜에 관한 내용으로 잘못된 것은?","body":[],"opts":["은행은 유효기간 이내라 하더라도 영업시간 외에 제시된 서류를 수리할 의무는 없다.","본선 선적일이 다른 두 개의 선하증권이 제시되었다면, 만기 산정을 위한 선적일자는 가장 늦은 선적일자가 된다.","대금 지급을 위한 만기일이 은행 국가(대한민국)의 대체 공휴일이라면 대금은 그 다음 첫 은행 영업일에 지급될 수 있다.","분할선적이 허용되는 화환신용장에서 선적일자가 다른 운송서류가 한 번에 제시되었다면 가장 늦은 선적일자를 사용하여 제시기간을 심사한다."],"ans":4,"passage":null,"topic":"신용장"},{"id":"61-1-18","subj":1,"no":18,"head":"지급조건이 “at 90 days sight”로 발행된 환어음이 적격한 서류와 함께 제시되었을 경우, 만기일에 대한 설명으로 올바른 것은?","body":[],"opts":["매입은행이 지정은행으로 서류를 발송한 날로부터 90일이 되는 일자","지급인인 은행이 환어음을 제시받은 다음 날로부터 90일이 되는 일자","확인은행이 개설은행으로 환어음과 서류를 발송한 날로부터 90일이 되는 일자","개설은행에 서류가 제시된 날로부터 90일이 되는 일자"],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"61-1-19","subj":1,"no":19,"head":"ISBP 745가 적용되는 화환신용장에 대한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 원산지증명서는 제조자 국가가 아닌 판매자 국가의 상공회의소에서 발행하여도 된다.","B. 상업송장의 하인은 선하증권의 하인에 추가적인 내용이 함께 표기되어도 된다.","C. 동일 선적에 대해 두 개의 보험서류가 제시되었다면, 둘 중 어느 서류의 보험금이 먼저 지급되어야 하는지 각각에 표시되어야 한다.","D. 중량명세서상의 수량이 상업송장과 운송서류에 나타난 수량을 초과한다면 서로 상이하여도 허용된다."],"opts":["A, B, C","B, C, D","A, B","모두"],"ans":3,"passage":null,"topic":"신용장"},{"id":"61-1-20","subj":1,"no":20,"head":"화환신용장과 보증신용장을 비교한 것으로 올바르지 못한 것은?","body":[],"opts":["지급구조에서 보증신용장은 개설의뢰인이 수익자에 대한 의무를 이행하면 약정된 금액이 지급되는 구조이다.","채무의 발생시점에서 화환신용장은 수익자가 정당한 서류를 제시하고 지급을 요청함으로써 은행의 채무가 발생한다.","제출서류에서 보증신용장은 기본적으로 수익자의 진술서만 있으면 되기 때문에 부당청구(unfair calling)의 위험성이 있다.","거래형태에서 화환신용장은 같은 거래가 같은 서류에 의해서 몇 회라도 반복하여 행해질 수도 있다."],"ans":1,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"61-1-21","subj":1,"no":21,"head":"국제거래에서 전통적인 결제방식이 아닌 국제금융방식을 이용할 수도 있다. 다음이 설명하고 있는 국제금융방식은 무엇인가?","body":["A. 2개국 이상의 국가 간 이루어지는 국제거래이다.","B. 물품을 소유하지 않고도 이용할 수 있으며, 절세가 가능하고, 국제금융을 이용할 수 있다.","C. 이용 목적에 따라서 금융( )와 운용( )으로 구분된다.","D. 특정거래형태로서 임대차방식의 수출입거래에 해당한다."],"opts":["International Leasing","International Forfaiting","International Factoring","International Demand Guarantee"],"ans":1,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"61-1-22","subj":1,"no":22,"head":"수출보험과 수출보증에 대한 설명으로 잘못된 것은?","body":[],"opts":["수출보험은 채권자(수출자)가 자신의 채권에 대한 손실을 방지하기 위해 자기 자신을 위해 보험에 가입하는 것이다.","수출보증은 채무자가 채권자에게 자신의 신용을 보강하기 위해서 보증인(예를 들어 은행)에게 보증을 요청하는 타인을 위한 계약이다.","수출보험과 수출보증에서 지급 사유가 발생하는 것은 채무자의 채무불이행이라는 점에서 동일하다.","한국무역보험공사는 정책금융기관으로서 수출보험 상품은 제공하지만, 수출보증 상품은 제공하지 않는다."],"ans":4,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"61-1-23","subj":1,"no":23,"head":"한국무역통계를 기준으로 최근에 우리나라 기업이 가장 많이 사용하는 결제방식은무엇인가?","body":[],"opts":["일람출급 및 기한부 신용장방식(At sight L/C &amp; Usance L/C)","단순 송금방식(T/T, M/T)","추심방식(D/P, D/A)","임가공료 지급방식의 위탁 또는 수탁 가공무역방식"],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"61-1-24","subj":1,"no":24,"head":"다음 중 환율의 중요성에 대한 설명으로 올바르지 못한 것은?","body":[],"opts":["환율이 상승하면 수출물품의 가격이 상승하고, 수입물품의 가격은 하락하므로 수출은 감소하고 수입은 증가하여 경상수지가 악화된다.","환율이 상승하면 외국에서 한국산 물품의 구매비용은 줄어들고, 한국에서 외국 물품을 구매하는 가격은 오르기 때문에 한국의 물가가 상승한다.","환율이 상승하면 외화에 대비한 원화의 가치가 하락하여 기업의 외화부채 상환 부담이 증가한다.","환율이 상승하면 외국인 관광객은 유리하지만, 내국인의 해외여행 부담은 증가한다."],"ans":1,"passage":null,"topic":"외환·환리스크"},{"id":"61-1-25","subj":1,"no":25,"head":"㈜한국무역은 영국에서 수입한 원재료를 가공하여 미국에 완제품을 수출한다. 수입대금은 영국 파운드로 지급하고, 수출대금은 미 달러로 수령한다. 이 회사의 담당자는 수입대금을 송금하기 위해 달러를 파운드로 환전하려고 은행에 문의했다. 아래와 같이 GBP/USD 환율을 각각 제시받았다면 이 회사는 어느 은행에서 어떤 환율로 환전하는 것이 가장 유리한가? (환율표시에서 앞의 통화가 기준통화. 은행의 수수료는 없다.)","body":["<div class=\"timg\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2gAAACaCAAAAAD5zzRuAAAHcklEQVR42u2d25arIBBEu7P8/1+ueZjEgIKiiRHtvV/mcpKzVmosaaClXAYAR/NAAgCMBnALBjMzRweA49C/0Zx5GsBxOKUjAHM0AIwGABgNAKMBYDQAwGgAGA0AMBqAndmCBdZPC4GZ6fWtst8rfaHMk3+WZW+ZvR4wGqQ2U9Z46plZ0p9UervM0346x2sYDYpGSS0kM/OXb/4HqtdPXnu70kHRzB2rMUeDks9s2vZd/an8drW subj":2,"no":3,"head":"무역계약 관련 법원(source of law)의 「명칭－내용－제정기관」이 잘못된 것은?","body":[],"opts":["명칭(약칭) CISG · 내용 국제물품매매계약에 적용되는 통일법 · 제정기관 UNCITRAL","명칭(약칭) Incoterms · 내용 정형거래조건에 관한 국제 해석규칙 · 제정기관 ICC","명칭(약칭) New York Convention · 내용 국제물품 및 서비스거래에 관한 통일법 · 제정기관 UNCITRAL","명칭(약칭) PICC · 내용 국제상사계약을 위한 일반원칙 · 제정기관 UNIDROIT"],"ans":3,"passage":null,"topic":"계약 일반"},{"id":"61-2-4","subj":2,"no":4,"head":"다음 Incoterms 2020에 대한 설명으로 올바른 것을 모두 고른 것은?","body":["A. EXW는 매도인의 최소 의무 조건으로 국내 공장도가격과 가장 유사하다.","B. FCA에서 지정 장소가 매도인 영업 구내인 경우는 물품이 매수인이 제공한 운송 수단에 적재되는 때에 인도된다.","C. CFR, CIF, CPT, CIP는 위험분기점과 비용분기점이 다른 규칙이다.","D. FOB, CFR, CIF의 위험분기점은 모두 선적항에서 본선에 적재하거나, 그렇게 인도된 물품을 조달할 때이다.","E. DDP에서 매도인은 매수인에게 보험계약 체결 의무를 부담한다.","F. DAP는 지정 목적지에서 도착 운송수단에서 양하한 상태로 매수인의 처분하에 두거나, 그렇게 인도된 물품을 조달함으로써 인도된다."],"opts":["A, B, C, D","A, B, D, E","A, C, E, F","B, C, E, F"],"ans":1,"passage":null,"topic":"인코텀즈"},{"id":"61-2-5","subj":2,"no":5,"head":"Incoterms 2020의 무역조건을 기준에 따라 구분한 것으로 잘못된 것은?","body":["(해당 무역조건은 전체 또는 일부임)"],"opts":["구분기준 위험이 본선 적재 시 이전되는 해상운송 전용 조건 · 해당 무역조건 FOB, FAS, CFR, CIF","구분기준 물품이 지정 목적지에서 도착 운송수단에 실린 채 인도되는 조건 · 해당 무역조건 DAP, DDP","구분기준 수출통관 의무를 매도인이 부담하는 조건 · 해당 무역조건 DAP, DDP","구분기준 해상보험을 매도인이 가입해야 하는 조건 · 해당 무역조건 CIF, CIP"],"ans":1,"passage":null,"topic":"인코텀즈"},{"id":"61-2-6","subj":2,"no":6,"head":"Vienna Convention(1980)에서 규정하고 있는 매도인의 의무에 관한 설명으로 잘못된 것은?","body":[],"opts":["매수인의 물품 검사는 계약에 물품의 운송이 포함되는 경우라면 물품이 목적지에 도착한 후까지 연기될 수 있다.","매도인은 위험이 매수인에게 이전하는 때 있었던 물품의 부적합에 대하여, 그 부적합이 위험 이전 후에 판명된 경우라면 책임을 지지 않는다.","매수인이 물품의 부적합을 발견한 때부터 합리적인 기간 내에 매도인에게 통지하지 않은 경우에는 매수인은 물품의 부적합을 주장할 권리를 상실한다.","매도인은 공업소유권 등을 제외하고 매수인이 제3자의 권리 대상이 된 물품의 수령에 동의한 경우에는 해당 물품을 인도할 수 있다."],"ans":2,"passage":null,"topic":"계약 성립·CISG"},{"id":"61-2-7","subj":2,"no":7,"head":"Vienna Convention(1980) 규정에서 매수인의 권리구제에 관한 설명으로 올바른 것은?","body":[],"opts":["매수인이 계약위반에 대한 구제를 구하는 경우 법원 또는 중재판정부는 매도인에게 유예기간을 부여한다.","대체품의 인도청구는 본질적인 위반이 아닌 경우에도 청구할 수 있다.","매수인이 추가기간을 지정한 경우에 매도인으로부터 지정된 추가기간 내에 이행할 의사가 없다는 통지를 받는 경우를 제외하고, 매수인은 그 기간 중 계약위반에 대한 구제를 구할 수 없다.","매도인이 계약에서 정한 것보다 초과해서 물품을 인도한 경우에 매수인은 이를 거절해야 한다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"61-2-8","subj":2,"no":8,"head":"Vienna Convention(UN협약)의 적용 가능성에 관한 기본원칙으로 옳은 것은?","body":[],"opts":["국적이 서로 다른 국가에 소재하는 체약국 사이의 물품 및 서비스의 매매계약","주소가 서로 다른 국가에 소재하는 당사자 사이의 물품 및 서비스의 매매계약","물품이 서로 다른 국가에 소재하는 당사자 사이의 물품매매계약","영업소가 서로 다른 국가에 소재하는 당사자 사이의 물품매매계약"],"ans":4,"passage":null,"topic":"계약 성립·CISG"},{"id":"61-2-9","subj":2,"no":9,"head":"무역계약의 일반적 특성에 관한 설명으로 잘못된 것은?","body":[],"opts":["거래 당사자 사이의 상이한 언어, 법률, 정형화된 상관습이 존재한다.","주계약은 운송계약, 보험계약 등 다수의 종속계약을 수반한다.","서류에 의한 상징적 인도로 이루어지는 경우가 많으므로 서류가 중요하다.","무역계약에서 특정물 거래와 현물거래가 큰 비중을 차지한다."],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"61-2-10","subj":2,"no":10,"head":"Vienna Convention에 따를 때 청약이 충분하게 확정적이기 위해서 반드시 지정되어야 하는 조건은?","body":[],"opts":["수량의 지정, 가격의 지정, 인도기일의 지정","수량의 지정, 인도기일의 지정, 결제기일의 지정","물품의 지정, 수량의 지정, 가격의 지정","물품의 지정, 수량의 지정, 인도장소의 지정, 결제방식의 지정"],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"61-2-11","subj":2,"no":11,"head":"무역계약에서 당사자의 진술 또는 기타행위에 대한 해석순서로서 옳은 것은?","body":[],"opts":["주관적 의도 → 객관적 의도 → 모든 관련 상황","주관적 의도 → 모든 관련 상황 → 객관적 의도","객관적 의도 → 주관적 의도 → 모든 관련 상황","객관적 의도 → 모든 관련 상황 → 주관적 의도"],"ans":1,"passage":null,"topic":"계약 일반"},{"id":"61-2-12","subj":2,"no":12,"head":"선적지연(Delayed Shipment)에 대한 설명으로 잘못된 것은?","body":[],"opts":["약정한 물품을 선적 기간 내에 선적하지 못하는 경우 선적지연이 발생한다.","수출업자의 고의, 과실, 태만으로 인한 선적지연은 수출업자가 책임을 져야 한다.","전쟁과 같은 불가항력(Force Majeure)으로 인한 선적지연의 경우 매매계약서에 불가항력 조항과 선적지연 조항을 설정하면 책임을 면할 수 있다.","불가항력에 대한 입증책임은 수출자에게 있으며 공식적인 회사의 공문을 발행하여 수입자에게 발송함으로써 불가항력 존재 사실을 입증하고 면책한다."],"ans":4,"passage":null,"topic":"거래조건"},{"id":"61-2-13","subj":2,"no":13,"head":"국제상사계약원칙상 계약의 성립에 관한 설명 중에서 가장 잘못된 것은?","body":[],"opts":["계약은 승낙에 의하거나, 합의를 보여주기에 충분한 당사자의 행위에 의하여 체결될 수 있다.","계약체결의 제안은 충분히 확정적이고 승낙 시 그에 구속된다는 청약자의 의사가 표시가 있는 경우에 청약이 된다.","신속한 계약의 성립을 위하여 청약은 피청약자에게 발신된 때에 효력이 발생한다.","침묵 또는 부작위는 그 자체만으로 승낙이 되지 아니한다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"61-2-14","subj":2,"no":14,"head":"다음이 설명하는 특정거래 형태의 수출입을 무엇이라 하는가?","body":["A. 수수료 지급을 조건으로 외국에서 제조(조립, 재생, 개조를 포함)할 원료 전부(일부)를 국내에서 보내거나, 외국에서 조달하여 제조 등을 수행한 물품을 국내로 들여오거나 외국으로 판매하는 계약이다.","B. 수수료를 통상 CMT charge라 하며, CMT는 Cutting, Making, Trimming을 말한다.","C. 기본계약에서 원자재 및 물품의 수량, 인도방법, 수수료 지급방법, 계약기간 등을 명시한 Consignment Processing Contract를 약정한다."],"opts":["외국인도수출","수탁가공무역","위탁가공무역","임대차수출입"],"ans":3,"passage":null,"topic":"거래조건"},{"id":"61-2-15","subj":2,"no":15,"head":"무역계약의 선적조건 중 환적(transshipment)에 대한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 환적은 운송 중 다른 선박 또는 다른 운송수단에 적재하는 것을 의미한다.","B. 환적은 해상운송과 내수로운송에만 적용될 수 있다.","C. 환적 중 파손에 취약한 물품(도자기, 유리제품 등)은 환적을 금지한다.","D. 환적 허용 여부에 대한 약정이 없다면 컨테이너운송의 경우에는 허용된다."],"opts":["A, B","B, C","C, D","A, D"],"ans":4,"passage":null,"topic":"거래조건"},{"id":"61-2-16","subj":2,"no":16,"head":"살물(bulk cargo)에 대한 설명으로 잘못된 것은?","body":[],"opts":["살물은 곡물, 광물, 모래, 자갈 등과 같이 비포장상태로 거래되는 불가산물품(uncountable goods)을 의미한다.","살물은 화물의 특성상 인도 과정에 감량이 필연적이므로 정확한 수량을 인도하는 것은 불가능하다.","과부족용인조항은 기재된 범위 내에서 과부족에 대한 클레임을 제기할 수 없으므로 클레임 예방 효과가 있다.","신용장이 아닌 다른 결제방식을 사용하는 경우 10%의 과부족이 관행적으로 허용된다."],"ans":4,"passage":null,"topic":"거래조건"},{"id":"61-2-17","subj":2,"no":17,"head":"개별무역계약서 이면사항에 포함되는 일반조항(general terms &amp; conditions)에 대한 설명 중 잘못된 것은?","body":[],"opts":["Severability Clause는 계약서 내용 중 일부가 법원의 판정 등으로 무효가 되더라도 해당 조항만이 무효로 될 뿐 나머지 조항의 효력 또는 계약 자체는 문제없도록 약정하는 조항이다.","Claims Clause는 클레임이 발생할 경우 클레임의 통지 방법, 제기 기한, 증빙자료 등을 규정하는 조항이다.","Arbitration Clause는 기본계약서에서 분쟁의 해결을 중재로 할 것을 합의하는 조항이다. 중재조항이 유효하기 위해서는 중재지, 중재기관, 중재비용 3가지를 반드시 합의해야 한다.","계약체결의 당사자 자격을 분명히 하기 위해서 Privity Clause 또는 Principal to Principal 등을 규정한다."],"ans":3,"passage":null,"topic":"계약 일반"},{"id":"61-2-18","subj":2,"no":18,"head":"다음 중 CISG 1980의 계약해제의 효력에 대한 설명으로 잘못된 것은?","body":[],"opts":["무역계약을 해제하면 양 당사자들은 물품인도의무, 대금지급의무 등 이행하지 않은 의무에 대해서는 해방되지만, 손해배상의무, 계약해제 후의 권리․의무에 관한 합의조항, 중재조항 등은 여전히 남는다.","계약해제 시 매수인은 물품을 수령한 상태와 실질적으로 동일한 상태로 매도인에게 그 물품을 반환하지 못하면 계약해제권을 상실하게 된다.","매수인이 물품을 수령한 상태와 실질적으로 동일한 상태로 반환을 할 수 없음에도 계약을 해제하고자 하는 경우에 매수인은 지출 비용, 발생 이익, 발생될 수 있는 모든 이익을 반환하여야 한다.","계약해제 시 매도인은 이미 영수한 물품 대금에 이자를 포함하여 매수인에게 반환하여야 한다. 이때 이자는 대금이 지급된 날로부터 완전히 반환되는 날까지 발생하는 이자이다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"61-2-19","subj":2,"no":19,"head":"다음 중 중재에 대한 설명으로 올바른 것은?","body":[],"opts":["중재합의는 사전 합의보다는 주로 분쟁이 발생한 후에 당사자들이 중재합의를 하는 방식으로 이루어지며, 합의가 이루어지면 당사자의 재판청구권은 제한된다.","중재합의는 서면주의를 원칙으로 하므로 중재신청 시 중재합의문 원본을 중재기관에 제시하도록 규정되어 있다. 이메일, 모사전송과 같은 통신수단에 의해 교환된 중재합의문은 서면 중재합의문으로 인정받지 못한다.","중재판정에 의해 확정된 손해배상금액은 법원의 집행판결 절차에서 다시 다툴 수 없고 중재판정의 패소자는 그에 관해 항변할 수 없다. 중재판정은 중재판정 취소의 사유가 없는 한 중재판정에 대한 집행판결은 법원에서 그대로 인용된다.","외국 중재판정의 승인 및 집행에 관한 유엔협약에서는 중재판정의 원활한 국제집행을 보장하기 위해서 동 협약의 체약국 여부를 불문하고 유엔 회원국에는 모두 적용될 수 있도록 규정하고 있다."],"ans":3,"passage":null,"topic":"클레임·분쟁"},{"id":"61-2-20","subj":2,"no":20,"head":"Vienna Convention 1980이 적용되는 청약과 승낙에 대한 설명으로 잘못된 것은?","body":[],"opts":["청약이 취소 불능이라도 청약의 의사표시가 도달하기 전 또는 그와 동시에 철회(withdrawal)의 의사가 상대방에게 도달하면 철회가 가능하다.","청약자가 USD10,000로 시장가격 연동조건(offer subject to market fluctuation)으로 청약하였고, 피청약자는 유효기간 내에 이를 승낙하였다. 이후 제품 가격이 USD15,000로 인상되었다면 피청약자가 USD10,000로 승낙했더라도 USD15,000로 계약이 성립된 것으로 해석될 수 있다.","취소 불능 취지의 청약이더라도 승낙기간이 정해지지 않았다면 불확정 청약이므로, 상대방이 합리적으로 신속한 기간 내 승낙을 했더라도 계약은 성립되지 않는다.","전화로 하는 구두청약은 특별한 사정이 없는 한 즉시 승낙되어야 한다. 만약 즉시 승낙하지 않으면 청약의 거절이 된다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"61-2-21","subj":2,"no":21,"head":"다음 중 Incoterms 2020의 개별 조건 다음에 표기되는 장소의 표기가 올바른 것을 모두 고르시오.","body":["A. CFR SHANGHAI CFS B. EXW BUSAN CFS","C. CIF INCHEON AIRPORT D. DPU DAEGU WAREHOUSE","E. FOB BUSAN CY F. FCA SELLER'S DAEJEON FACTORY","G. CIP UIWANG DEPOT, GYEONGGI-DO"],"opts":["A, B, F, G","A, B, D, E","B, C, D, F","B, D, F, G"],"ans":4,"passage":null,"topic":"인코텀즈"},{"id":"61-2-22","subj":2,"no":22,"head":"항공화물대리점(air cargo agent)과 항공운송주선업자(air freight forwarder)의 업무를 비교한 내용 중 가장 옳은 것은?","body":[],"opts":["항공화물운송장 · 항공화물대리점 House Air Waybill 사용 · 항공운송주선업자 항공사 Master Air Waybill 사용","화주에 대한 책임 · 항공화물대리점 항공사 책임 · 항공운송주선업자 항공운송주선업자 책임","자체 Tariff · 항공화물대리점 있음 · 항공운송주선업자 있음","자체 운송약관 · 항공화물대리점 있음 · 항공운송주선업자 없음(항공사 약관에 준함)"],"ans":2,"passage":null,"topic":"운송"},{"id":"61-2-23","subj":2,"no":23,"head":"Surrendered B/L 관련 내용을 표현한 것 중 잘못된 것은?","body":[],"opts":["수하인이 양하지에서 Original B/L 없이 화물을 찾을 수 있게 하는 B/L이다.","대금결제조건이 신용장방식보다는 주로 T/T 방식에서 사용된다.","Surrendered의 의미는 선하증권의 권리증권 기능을 포기하는 것이다.","Surrendered B/L 발급은 수출자가 운송인에게 요청하는 것만으로 이루어지며, 수입자의 동의 여부와는 관계없이 자동으로 발행된다."],"ans":4,"passage":null,"topic":"운송"},{"id":"61-2-24","subj":2,"no":24,"head":"부정기선과 정기선운송에 대한 설명으로 잘못된 것은?","body":[],"opts":["부정기선 운송은 항로가 일정치 않고, 수백 종류의 화물을 실어 나르는 개품운송계약을 특징으로 한다.","정기선운송은 공중 일반운송인이 합법적인 화물에 대해서 차별 없이 운송하고, 운임은 운임률표(tariff)로 공시된다.","부정기선은 여객 운송이 금지되며, 주로 벌크화물을 전 세계에 운송할 수 있도록 정기선에 비해서 단순하게 설계되어 있다.","정기선사는 화주에게 통일된 선하증권(B/L)을 발급하며, 일반적으로 부정기선 화물보다 고가이기 때문에 상대적으로 운임이 높다."],"ans":1,"passage":null,"topic":"운송"},{"id":"61-2-25","subj":2,"no":25,"head":"다음은 항공화물 운임에 관련한 내용이다. 내용 중 올바른 것은?","body":[],"opts":["항공사 및 포워더의 항공화물 운임은 일반적으로 항공사의 요율표에 의거하여 결정되며, 항공사마다 고유의 tariff인 요율표를 갖고 있다.","항공화물 운임은 반드시 출발지에서 수출 항공화물을 핸들링하는 포워더가 항공사에 무조건 먼저 지불해야 한다.","항공운임의 지불 기준인 운임산출 중량인 chargeable weight는 실제 중량에 의한 방법, 용적 중량에 의한 방법, 높은 중량단계에서의 낮은 운임 적용 규정에 의한 방법으로 먼저 결정한다.","단위탑재용기 운임은 ULD 작업을 통하여 단위탑재용기 사이즈에 따라 적용되는 운임으로 ULD 작업 자체가 항공사의 책임하에 이루어진다."],"ans":3,"passage":null,"topic":"운송"},{"id":"61-2-26","subj":2,"no":26,"head":"추정전손이 인정되기 위한 위부에 관한 설명으로 잘못된 것은?","body":[],"opts":["피보험자가 보험의 목적을 위부할 것을 결정하였으면 위부의 통지를 보험자에게 해야 한다.","위부의 통지는 서면이나 구두로 할 수 있으나, 일부는 서면으로 하고 일부는 구두로 하는 것은 허용되지 않는다.","위부의 통지는 손해에 관한 신뢰할 만한 정보를 수취한 후에 부당한 지체 없이 행해야 한다. 단, 그 정보가 의심스러운 경우에는 피보험자는 이를 조사하기 위하여 합리적인 시간적 여유를 가질 권리가 있다.","위부의 통지가 수락되었다면 손해에 대한 정보가 미흡하거나 사정의 변경이 있어도 피보험자는 위부를 철회할 수 없다."],"ans":2,"passage":null,"topic":"해상보험"},{"id":"61-2-27","subj":2,"no":27,"head":"적하보험증권 관련 내용 중 잘못된 것은?","body":[],"opts":["claims, if any, payable at : 보험금 지급지를 의미하며 수출의 경우 최종 목적항에서 보험자를 대신하여 보험금을 지급하는 회사명이 표기되며, 수입의 경우 당해 보험자명이 통상 기입된다.","at and from : 선적항 혹은 출발 공항으로 통상 화물의 선적항과 공항의 도시명 혹은 공항명이 표기된다.","thence to : 화물의 최종 도착지로 인코텀즈 조건에 관계 없이 모두 표기되어야 한다.","place and date signed in : 보험증권 발행 장소와 발행일이 표기된다."],"ans":3,"passage":null,"topic":"해상보험"},{"id":"61-2-28","subj":2,"no":28,"head":"담보위험약관인 ICC(W/A)에 대한 설명으로 가장 잘못된 것은?","body":[],"opts":["S.G.Policy 상의 담보위험인 침몰, 좌초, 악천후, 충돌, 행방불명, 화재, 투하, 강도 등에 기인된 전손과 분손을 보상해 준다.","WAIOP 조건은 담보위험에 기인한 단독해손이 발생한 경우 손해율과 상관없이 보상하여 주는 조건이다.","선적, 환적, 양하 시의 포장당 전손과 조난항에서 양하작업에 기인한 전손과 분손의 비용손해를 보상하여 준다.","WA 3% 조건은 담보위험인 전손, 단독해손, 공동해손이 발생한 경우에 손해율이 3% 미만인 경우에는 손해율을 산정하여 공제하고 나머지를 보상한다."],"ans":4,"passage":null,"topic":"해상보험"},{"id":"61-2-29","subj":2,"no":29,"head":"보험클레임 처리 관련한 내용 중 올바르지 않는 것은?","body":[],"opts":["일반 손해가 발행한 경우에는 피보험자는 손해통지 의무, 손해방지의무, 손해배상청구권 보전의무를 다해야 한다.","수입자는 선주의 공동해손 선포를 통해 자신의 화물이 공동해손에 포함되었음을 알게 된다.","해상적하보험은 화물이 선창에 실려 운송되는 것을 전제로, 운송 중 발생할 수 있는 위험을 반영하여 보험료율을 산정한다.","피보험자는 보험자에게 모든 손해의 통지를 반드시 서면으로 하여 증거보전을 우선하여야 한다."],"ans":4,"passage":null,"topic":"해상보험"},{"id":"61-2-30","subj":2,"no":30,"head":"다음의 보험사고 사례에서 피보험자가 받을 수 있는 보험금은 얼마인가?","body":["ㅇ 커피머신 100대를 수출하면서 보험금액 USD55,000(USD50,000×110%)로 적하보험에 부보하였다.","ㅇ 해상운송 중 보험사고로 100대 모두 심한 훼손을 입고 중간항에서 양하되었다.","ㅇ 피보험자는 보험자의 승인을 얻어 중간항에서 커피머신을 USD10,000에 매각하고, 매각 수수료로 USD500를 지급하였다.","ㅇ 만약 화물이 정상적으로 목적지에 도착하였다면 USD80,000에 매각될 수 있었다."],"opts":["USD70,000","USD70,500","USD45,000","USD45,500"],"ans":4,"passage":null,"topic":"해상보험"},{"id":"61-3-1","subj":3,"no":1,"head":"다음 서신의 내용에 대한 설명으로 올바른 것은?","body":["We are pleased to offer you the articles mentioned below as per the conditions and details described as follows.","- Articles: Automobile Tube","- Price: USD5.50/unit CIP Auckland (Trade terms are subject to Incoterms 2020)","- Quantity: 50,000 units","- Payment: 90 days after sight under an irrevocable and confirmed L/C in our favor","- Validity: April 10, 2024"],"opts":["The seller is required to obtain a cargo insurance complying with the cover provided by Clauses (C) of the Institute Cargo Clauses.","The seller must contract for carriage to Auckland where the risk passes to the buyer.","Two separate banks will guarantee the payment to the seller independently.","The buyer should issue an L/C by April 10, 2024 to conclude a contract."],"ans":3,"passage":null,"topic":"서신·이메일"},{"id":"61-3-2","subj":3,"no":2,"head":"다음은 국제물품매매계약에 관한 UN협약(CISG 1980)의 일부이다. 공란 (A)와 (B)에 들어가기에 가장 적절한 내용으로 짝지어진 것은?","body":["If the goods do not conform with the contract, the buyer may require ( (A) ) only if the lack of conformity constitutes a fundamental breach of contract. Also, the buyer may ( (B) ) if the failure by the seller to perform any of his obligations under the contract or this Convention amounts to a fundamental breach of contract."],"opts":["(A) repair of the goods · (B) require exchange of the goods","(A) claim for damages · (B) ask to extend the contractual period for performance","(A) delivery of substitute goods · (B) declare the contract avoided","(A) additional period for delivery · (B) require guarantee"],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"61-3-3","subj":3,"no":3,"head":"다음은 Incoterms 2020의 어떤 조건에 대한 설명인가?","body":["The seller fulfills his delivery obligation and transfers the risk to the buyer by handing the goods over to the carrier contracted by the seller. Once the goods have been delivered to the buyer in this way, the seller does not guarantee that the goods will reach the place of destination in sound condition, in the stated quantity or indeed at all. This is because the risk transfers from the seller to the buyer when the goods are delivered to the buyer by handing them over to the carrier; the seller must nonetheless contract for the carriage of the goods from delivery to the agreed destination."],"opts":["FCA","CIF","CPT","DAP"],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"61-3-4","subj":3,"no":4,"head":"아래 빈 공란 (A)에 들어가기에 가장 적합한 정형거래조건은?","body":["Where the goods are sold under ( (A) ) rule, it would be rather uncommon to expect a bill of lading with an on-board notation to be issued by the carrier because delivery is completed before the goods are actually on board the vessel. So, the seller who is required to present an on-board bill of lading under L/C transaction will be in trouble. To cater for this situation, ( (A) ) rule under Incoterms 2020 has provided for an additional option. If the parties have so agreed in the contract, the buyer must instruct its carrier to issue a bill of lading with an on-board notation to the seller. The carrier may or may not, of course, accede to the buyer’s request, given that the carrier is only bound and entitled to issue such a bill of lading once the goods are on board."],"opts":["FCA","FOB","CPT","DAP"],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"61-3-5","subj":3,"no":5,"head":"이 서신 내용으로 볼 때 매매계약서에서 당사자 사이에 합의된 정형거래조건으로가장 적합한 것은?","body":["Dear Sir/Madam;","Thank you very much for your order No.4567-9 on September 20 for 5,000 pairs of golf shoes.","As we explained in the meeting with your representative and as stipulated in the contract under the article regarding the time of shipment, the delivery for models made to your specifications cannot be made in less than 60 days. However, we are prioritizing your order. Please be assured that all models will be completed by November 29. If you could send us your shipping instructions, we would be able to arrange the shipment without delay.","We are confident that you will be satisfied with the goods in every respect.","Very truly yours,"],"opts":["FOB","CIF","CFR","DAP"],"ans":1,"passage":null,"topic":"서신·이메일"},{"id":"61-3-6","subj":3,"no":6,"head":"다음 계약조항의 공란 (A)에 들어갈 용어는?","body":["All disputes, controversies, or differences which may arise between the parties, out of or in relation to or in connection with this contract or for the breach thereof, shall be finally settled by arbitration in Seoul, Korea in accordance with the Commercial Arbitration Rules of The Korean Commercial Arbitration Board.","The ( (A) ) rendered by the arbitrator(s) shall be final and binding upon both parties concerned."],"opts":["Mediation","Award","Appeal","Reconciliation"],"ans":2,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"61-3-7","subj":3,"no":7,"head":"다음 계약서의 내용으로 올바른 것은?","body":["Article 2. Characteristics of the goods","2.1 It is agreed that any information relating to the goods and their use, such as weight, dimension, capacities, prices, colors and other date contained in catalogs shall not take effect as terms of the Contract unless expressly referred to in the Contract.","2.2 Unless otherwise agreed, the Buyer does not acquire any property rights in software, drawings, etc. which may have been made available to him.","2.3 It is agreed that the goods are suitable for the purpose for which they are intended by their very nature or which is evident from the contract of sale.","2.4 If express reference is made in the contract of sale to technical, safety, quality or other regulations and documents clearly designated in the agreement, even if not attached to the contract, the Seller shall be deemed to have knowledge of these."],"opts":["Any information regarding the items included in the seller’s catalog and their use shall be effective as terms of this contract, unless otherwise specified in the contract.","The buyer is deemed to obtain ownership rights for the drawings available to him/her under this contract.","The goods must be suitable for their intended purpose based on their nature or clarified in the sales contract.","If a document related to technology is explicitly referenced in the sales contract, the seller will be considered to recognize this only when it is included in the contract."],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"61-3-8","subj":3,"no":8,"head":"다음은 일반거래조건협정서의 일부이다. 그 내용으로 올바른 것은?","body":["Article 3. Shipment","3.1 The date of issuance of the bill of lading will be deemed to be the date of shipment unless the bill of lading contains an on-board notation indicating the date of shipment, in which case the date stated in the on-board notation will be deemed to be the date of shipment.","3.2 Partial shipment and/or transshipment shall not be permitted unless otherwise stated in this Sales Contract.","3.3 The Seller shall not be responsible for any delay in shipment due to the Buyer’s failure to provide timely a documentary credit. The Seller shall not be responsible for any damages incurred by the Buyer due to either delay in the arrival of the ship designated by the Buyer beyond the prearranged date of shipment.","3.4 If the parties agreed upon a cancellation date for late shipment in the Specific Conditions, the Buyer may avoid the Sales Contract by notification to the Seller in case the shipment has not occurred by the cancellation date."],"opts":["For the seller’s convenience, the goods may be dispatched by two different vessels.","The buyer should nominate the ship and provide the seller with all necessary information about arrangement of shipment at the seller’s request.","The seller shall not be responsible for non-conformity of the goods if the buyer delays arrangement of shipment.","If the date stated in the on-board notation is different from the date of issuance of the bill of lading, the latter shall be regarded as the date of shipment."],"ans":2,"passage":null,"topic":"신용장·결제"},{"id":"61-3-9","subj":3,"no":9,"head":"다음 환어음에 기재된 내용으로 올바른 것은?","body":["BILL OF EXCHANGE","NO. 220204PU Date. 2024.12.20.","FOR USD58,780 Seoul, Korea","AT XXXXXXX SIGHT OF THE FIRST BILL OF EXCHANGE (SECOND OF THE SAME TENOR AND DATE BEING UNPAID) PAY TO KOREA NATIONAL BANK OR ORDER THE SUM OF US DOLLARS FIFTY EIGHT THOUSAND SEVEN HUNDRED EIGHTY ONLY VALUE RECEIVED AND CHARGE THE SAME TO ACCOUNT OF PUERUCO. CO., LTD.","DRAWN UNDER TKJP BANK, TOKYO, JAPAN","L/C NO: LC-815462-001 DATED 2024.10.16","TO: TKJP BANK, JAPAN","KITA CO., LTD"],"opts":["The Korea National Bank is a payer.","The beneficiary of L/C-815462-001 is PUERUCO. CO., LTD.","The payment will be made after the issuing bank accepts this draft.","The drawee of this draft is TKJP BANK, TOKYO, JAPAN."],"ans":4,"passage":null,"topic":"신용장·결제"},{"id":"61-3-10","subj":3,"no":10,"head":"아래 신용장을 제3자에게 양도할 경우 밑줄 친 (A)～(D) 중에서 감축 또는 감액만될 수 있는 것을 모두 고른 것은?","body":["40A/ FORM OF DOCUMENTARY CREDIT: IRREVOCABLE, TRANSFERABLE","31D/ DATE AND PLACE OF EXPIRY: <u>(A) 04/20/2023<\/u>, SEOUL, KOREA","32B/ CURRENCY CODE AMOUNT: <u>(B) USD12,000.00<\/u>","41D/ AVAILABLE WITH..BY..: KITA BANK BY NEGOTIATION","44C/ LATEST DATE OF SHIPMENT: <u>(C) 03/25/2023<\/u>","46A/ DOCUMENTS REQUIRED:","+ SIGNED COMMERCIAL INVOICE IN QUINTUPLICATE","+ PACKING LIST IN TRIPLICATE","+ FULL SET OF CLEAN ON BOARD OCEAN BILL OF LADING MADE OUT TO THE ORDER OF WOORI BANK MARKED FREIGHT COLLECT AND NOTIFY APPLICANT","+ INSURANCE POLICY <u>(D) COVERING INVOICE VALUE PLUS TEN<\/u>","<u>PERCENT<\/u> WITH INSTITUTE CARGO CLAUSE (A) IN DUPLICATE","* This credit is subject to the Uniform Customs and Practice for Documentary Credits(Publication No.600)",""],"opts":["(A)","(A), (B)","(A), (B), (C)","(A), (B), (C), (D)"],"ans":3,"passage":null,"topic":"신용장·결제"},{"id":"61-3-11","subj":3,"no":11,"head":"다음 밑줄 친 신용장의 명칭으로 부적합한 것은?","body":["<u>This credit<\/u> is intended to assist the exporter in the production or procurement of the goods contracted. <u>This credit<\/u> is payable at a time prior to the shipment of the goods and against a document other than a transport document."],"opts":["Standby L/C","Packing L/C","Advance payment L/C","Red Clause L/C"],"ans":1,"passage":null,"topic":"신용장·결제"},{"id":"61-3-12","subj":3,"no":12,"head":"다음 서신의 내용상 밑줄 친 부분(A)가 의미하는 것은?","body":["Dear Mr. Smith,","Upon receiving your letter dated September 18, which enclosed Invoice No. W. 562, I was surprised to find that you had included a draft for USD23,600, requesting my acceptance to clear my account with you.","In all our previous transactions, I have consistently settled my accounts promptly via banker’s draft, and at no point have you raised any objections to this payment method. Therefore, I see no reason to change a system that has worked well for both of us. Unless there are specific reasons for this change, I regret to inform you that I cannot accept your draft. Accordingly, I am returning it with this letter. Unless I hear otherwise from you, I will assume that you agree to continue with <u>(A) our previous arrangement<\/u>, and I will settle the outstanding amount punctually by banker’s draft when payment is due at the end of next month.","Sincerely,"],"opts":["payment by bank usance bill","payment by document against payment","payment by usance bill drawn on the buyer","payment by open account"],"ans":1,"passage":null,"topic":"서신·이메일"},{"id":"61-3-13","subj":3,"no":13,"head":"아래 공란(A)에 공통으로 들어가기에 가장 적절한 무역결제방식은 무엇인가?","body":["( (A) ) occurs when goods are available to the buyer before payment is due, depending on how the products are shipped and the length of the payment option. So, ( (A) ) is a very low-risk option for the buyer and is typically used between established and trusted traders who have a long-established trading relationship with a good track record. ( (A) ) can be used to avoid high banking fees, but the seller may be exposed to the risk where payment is blocked due to political events in the buyer’s country."],"opts":["demand guarantee","documentary collection","open account","forfaiting"],"ans":3,"passage":null,"topic":"신용장·결제"},{"id":"61-3-14","subj":3,"no":14,"head":"다음 서류에 대한 설명으로 잘못된 것은?","body":["<table><tr><th><\/th><th>Shipper/Exporter ABC KOREA CO., LTD. 334 GASAN-RO, YEONGDEUNGPO-GU, SEOUL, KOREA<\/th><th><\/th><th>B/L NO. WSLI010200300521 WS LINE BILL OF LADING<\/th><th><\/th><\/tr><tr><td><\/td><td>Consignee WEIHAI TRADE CO, LTD. TECH &amp; DEVELOPMENT ZONE, WEIHAI, SHANDONG, CHINA<\/td><td><\/td><td>WOSUNG LINE CO.,LTD Received td., Busan Agent, as we initially believed the deterioration was caused by rough handling during transit. However, an investigation conducted by a licensed INTECO surveyor has confirmed that the deterioration resulted from the use of coarse raw wool. For further details, please refer to the enclosed surveyor’s report.","In light of this, we must formally request compensation for the deterioration, amounting to USD4,800 as specified in the report. We would appreciate your prompt settlement of this claim.","Sincerely Yours,","Mr. Connell"],"opts":["Mr. Connell realized that the bales were badly damaged when they arrived.","Mr. Connell is sending the investigation report issued by a surveyor with this letter.","Mr. Connell is planning to make a claim against the carrier.","Mr. Connell will receive claim amount of USD4,800 from the insurer."],"ans":2,"passage":null,"topic":"서신·이메일"},{"id":"61-3-23","subj":3,"no":23,"head":"이 서신의 내용을 논리 전개에 따라 가장 잘 나열한 것은?","body":[],"opts":["(D) － (A) － (C) － (B)","(A) － (B) － (D) － (C)","(D) － (B) － (C) － (A)","(A) － (D) － (C) － (B)"],"ans":3,"passage":"61-3-23","topic":"서신·이메일"},{"id":"61-3-24","subj":3,"no":24,"head":"이 서신에서 고객사가 결제와 관련하여 제기한 문제는 무엇인가?","body":[],"opts":["Payment method","Expiry date of L/C","Shipment date","Tenor of draft"],"ans":4,"passage":"61-3-23","topic":"서신·이메일"},{"id":"61-3-25","subj":3,"no":25,"head":"이 서신의 목적으로 가장 적절한 것은?","body":[],"opts":["To offer trade discounts on a consignment of rowing machines","To apologize for a delay in the delivery of rowing machines","To respond to an inquiry about the advertised rowing machines","To request immediate payment for an order previously placed for rowing"],"ans":3,"passage":"61-3-25","topic":"서신·이메일"},{"id":"61-3-26","subj":3,"no":26,"head":"이 서신에 대해서 회신하는 내용으로 적절하지 않은 것은?","body":[],"opts":["Since we have the rowing machine in stock, we can ship it immediately after you place your order.","Thank you for the information. We are considering placing an order and will contact you again shortly.","We received the brochures and would like to know more about the warranty provided with the rowing machines.","We would like to know if these rowing machines are suitable for commercial gym use."],"ans":1,"passage":"61-3-25","topic":"서신·이메일"},{"id":"61-3-27","subj":3,"no":27,"head":"이 서신에 대한 설명으로 옳지 않은 것은?","body":[],"opts":["The shipping documents will be sent directly to Mr. Golugh by the sender.","The seller has included information about new models.","The letter confirms that the goods have been insured.","The SS America is expected to arrive in Liverpool on April 27, 2024"],"ans":1,"passage":"61-3-27","topic":"서신·이메일"},{"id":"61-3-28","subj":3,"no":28,"head":"이 서신의 공란 (A)에 들어가기에 가장 적절한 문장은?","body":[],"opts":["You should note that we will not present these documents if you delay the issuance of L/C.","We are confident that you will be pleased with the consignment and that it will be successful in your market.","Unfortunately, that price is beyond our budget, so we are unable to match your offer.","We deeply apologize for the inconvenience you are experiencing."],"ans":2,"passage":"61-3-27","topic":"서신·이메일"},{"id":"61-3-29","subj":3,"no":29,"head":"다음 서신의 내용을 논리 전개에 따라 가장 잘 나열한 것은?","body":["Dear Jennifer,","Thank you for your recent offer for the Laptop Computer Mercury II. <u>(A) We are prepared to order at least 10,000 units once we make a purchasing decision. (B) While we appreciate the quality of your product, we find that your price is rather high for the US market, where competition for this type of device is very strong. (C) However, if you could offer a 10% discount, we would be very interested in placing an order with you, as we value the quality of your product. (D) We have found similar models available from other Asian and European manufacturers at prices 15% to 20% lower than your quote.<\/u> To allow us to finalize our decision by the end of the month, we would appreciate a response by October 26th. We hope to receive a favorable reply.","Best wishes,"],"opts":["(B) － (C) － (D) － (A)","(B) － (D) － (C) － (A)","(D) － (A) － (C) － (B)","(D) － (B) － (A) － (C)"],"ans":2,"passage":null,"topic":"서신·이메일"},{"id":"61-3-30","subj":3,"no":30,"head":"다음 중 주어진 문장을 영작한 것 중 적절하지 않은 것은?","body":[],"opts":["저희는 한국에서 1979년부터 농산물 수입업에 종사해 오고 있는 회사이며, 귀사의 밀가루를 구입하고자 합니다. ⇒ We are a Korean import business specializing in agricultural products operating since 1979, and we would like to purchase your wheat flour.","귀사의 웹사이트에 새로 광고하신 구강청정 시스템에 대한 구체적 정보를 보내주시면 감사하겠습니다. ⇒ I would appreciate more details about the newly advertised dental cleaning system in your website.","FOB가격을 견적해 주시고 다른 거래조건들에 대해서도 알려주십시오. ⇒ Please quote us your FOB price and let us know other terms and conditions.","당사는 주로 계약서 서명 30일 후 사전 송금하는 방식으로 거래해왔습니다. ⇒ We'd like to point out that we usually settle our accounts on a D/A basis with payment by 30-day bill of exchange."],"ans":4,"passage":null,"topic":"서신·이메일"}],"p":{"61-3-18":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Sirs:","We are pleased to make an offer, subject to your acceptance reaching us by July 20, of Tablet PC, as specified below:","- Article: Tablet PC Model No. 8909","- Quantity: 1,000 sets","- Price: USD2,000.00 per set, CIF New York, USA.","- Shipment: During October 2025","- Shipping Port: Incheon","- Payment: Draft at sight under an Irrevocable L/C","- Packing: Import Standard Packing of United States of America","<u>( (A) )<\/u> .","We look forward to your favorable reply by e-mail.","Yours sincerely,"]},"61-3-20":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Mr. Whaton,","We have instructed <u>(A) our bank, Woori Bank, Seoul<\/u>, to open an irrevocable letter of credit for USD22,000.00 (twenty two thousand dollars) in your favor to cover the consignment, shipment (CIF Incheon), and bank charges. The credit is valid until August 10, 2024.","You will receive confirmation from <u>(B) our bank's agents, Citi Bank Ltd, Denver<\/u>, and you can draw a draft on them at 60 (sixty) days for the full amount of the invoice. When submitting your draft, please enclose the following documents as the L/C is required; commercial invoice, packing list, bill of lading, and insurance policy.","We hope that you will prepare the goods properly and ship them in time.","Sincerely yours,"]},"61-3-23":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Mr. Williams,","We are writing to clarify the payment terms of the Letter of Credit (L/C). <u>(A) The goods will be shipped as soon as possible once it is settled. (B) However, as agreed between us and as clearly stated in your order sheet, payment should be made at sight. (C) Therefore, we kindly request you to amend the L/C to reflect the agreed-upon payment terms of at sight. (D) According to the L/C we received, the payment was to be made at 120 days.<\/u>","","We would appreciate your prompt attention to this matter and the immediate amendment of the L/C as requested.","Sincerely,"]},"61-3-25":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Sirs,","Thank you for your enquiry dated May 12th regarding the Rowing Machines advertised in this month's issue of 'Lectron.'","I can confirm that these are high-quality rowing machines suitable for home use. They are Kolby products, a well-known brand. The reason we can offer them at such competitive prices is that they are from a consignment of bankrupt stock we recently acquired.","Due to the low price and small profit margin, we are unable to offer trade discounts on this particular consignment. However, we do sell a wide range of electronic and fitness equipment and have enclosed a price list detailing our trade, quantity, and cash discounts.","We have also sent you brochures and specifications of the advertised Rowing Machines, as well as other fitness equipment we stock, by separate post. We encourage you to place your order as soon as possible, as we have received a very strong response thanks to our advertisement.","Thank you for your interest.","Sincerely,"]},"61-3-27":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Mr. Golugh,","This letter concerns your order, No. 890, which was shipped on April 17, 2024, aboard the SS America. The vessel is scheduled to arrive in Liverpool on April 27, 2024.","We have notified your agent, Eddis Jones, who will arrange for the consignment to be forwarded to you, as requested.","Our bank's agents, Westmorland Bank Ltd., High Street, Nottingham, will release the shipping documents to you upon your acceptance of our bill. These documents include a clean shipped bill of lading (No. 517302), invoice (No. EH3314), and insurance certificate (AR 118 4531).","<u>( (A) )<\/u>","We have enclosed a catalog of our new models and believe you will be particularly interested in the machinery illustrated on pages 103-110.","We look forward to hearing from you soon.","Sincerely,"]}}},"62":{"date":"2025.5","q":[{"id":"62-0-1","subj":0,"no":1,"head":"대외무역법령에서 규정하고 있는 전자적 형태 무체물의 수출에 관한 설명 중 잘못된 것은?","body":[],"opts":["소프트웨어 진흥법에 따른 소프트웨어는 전자적 형태의 무체물에 포함된다.","캐릭터를 제외한 영상물은 전자적 형태의 무체물에 포함된다.","컴퓨터와 같은 정보처리 능력을 갖춘 장치에 저장한 상태로 반출한 후 인도하는 것을 포함한다.","거주자가 비거주자에게 정보통신망을 통해 전송하는 것을 포함한다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"62-0-2","subj":0,"no":2,"head":"대외무역법령에서 규정하고 있는 수출입 승인의 변경 승인 대상에 해당하는 것은?","body":[],"opts":["물품 등의 수량ㆍ가격","원산지","규격","수출입 물품 등의 용도(다만, 수출입 승인 용도가 지정된 경우에만 해당)"],"ans":1,"passage":null,"topic":"대외무역법"},{"id":"62-0-3","subj":0,"no":3,"head":"대외무역법령에서 규정하는 수출입실적에 대한 설명 중 올바른 것은?","body":[],"opts":["외국인으로부터 외화를 영수하고 외화획득용 시설 기재를 외국인과 임대차계약을 맺은 국내업체에 인도하는 경우에 수출실적으로 인정된다.","외화를 받고 외항 선박에 선박용품 등 관리에 관한 고시에 따른 내국선박용품을 공급하는 경우의 수출실적 인정금액은 적재허가서에 기재된 금액이다.","수출의 정의에 해당하는 수출 중 유상으로 거래되는 수출(대북한 유무상 반출실적 포함)은 수출실적으로 인정된다.","수입실적의 인정 범위는 유상으로 거래되는 수입이고, 인정금액은 수입통관액(FOB가격 기준)으로 한다. 다만 외국인수수입과 용역 또는 전자적 형태 무체물의 수입은 외국환은행의 지급액으로 한다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"62-0-4","subj":0,"no":4,"head":"대외무역법령에서 규정하는 외화획득의 범위 등에 대한 설명 중 잘못된 것은?","body":[],"opts":["외화획득의 범위에는 관광, 용역 및 건설의 해외 진출에 따라 외화를 획득하는 것도 포함된다.","외화획득용 원료란 외화획득에 제공되는 물품 등을 생산하는 데에 필요한 원자재ㆍ부자재ㆍ부품 및 구성품을 말한다.","무역거래자가 외국의 수입업자로부터 수수료를 받고 행한 수출 알선은 외화획득행위에 준하는 행위로 본다.","외화획득용 제품이란 수입 후 생산과정을 거치지 않은 상태로 외화획득에 제공되는 물품 등을 말하며, 국내 구매 후 생산과정을 거치지 않은 상태로 외화획득에 제공되는 것은 해당하지 않는다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"62-0-5","subj":0,"no":5,"head":"우리나라의 대외무역법령에서 규정하고 있는 전략물자의 수출입에 관한 설명 중 올바른 것은?","body":[],"opts":["전략물자의 판정을 신청받은 산업통상자원부장관이나 관계 행정기관의 장은 30일 이내에 신청한 물품 등이 전략물자인지 또는 상황허가 대상 물품 등인지를 판정하여 신청인에게 알려야 한다.","전략물자 판정의 유효기간은 1년으로 한다.","산업통상자원부장관이나 관계 행정기관의 장은 10일 이내에 전략물자 수입목적확인서를 발급해야 한다.","전략물자 허가 의무 위반자에 대한 교육 시간은 8시간 이내로 한다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"62-0-6","subj":0,"no":6,"head":"대외무역법령에서 규정하고 있는 전략물자의 수출허가 및 상황허가 기준에 해당하지 않는 것은?","body":[],"opts":["해당 전략물자 등이 평화적 목적에 사용될 것","해당 전략물자 등의 거래가 국제평화 및 안전유지와 국가안보에 영향을 미치지 아니할 것","해당 전략물자 등이 인간의 생명ㆍ건강 및 안전을 위하여 필요할 것","해당 전략물자 등의 최종사용자 등이 거래에 적합한 자격을 가지고 있고 사용 용도를 신뢰할 수 있을 것"],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"62-0-7","subj":0,"no":7,"head":"대외무역법령에서 규정하고 있는 원산지 표시방법에 관한 설명으로 잘못된 것은?","body":[],"opts":["원산지표시 대상 물품을 수입하려는 자는 해당 물품에 한글ㆍ한문 또는 영문으로 원산지를 표시하여야 한다.","원산지를 특정하기 곤란한 단순 혼합물품은 “Imported from 국명”으로 원산지를 표시할 수 있다.","개인이 자가소비용으로 수입하는 물품으로서 세관장이 타당하다고 인정하는 물품은 원산지를 표시하지 아니할 수 있다.","해당 세트를 구성하는 개별 물품들의 원산지가 2개국 이상이고, 세트 물품으로 최종구매자에게 판매될 때는 개별 물품별로 각각 원산지를 표시하여야 하며, 용기에 모든 개별 물품들의 원산지를 표시하여야 한다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"62-0-8","subj":0,"no":8,"head":"대외무역법령에서 규정하고 있는 조정의 종료 사유에 해당하지 않는 것은?","body":[],"opts":["당사자가 조정안을 거부한 경우","당사자 간에 합의가 이루어진 경우","당사자가 조정신청을 철회한 경우","일방의 당사자가 다른 당사자가 지급하여야 할 조정비용을 지급한 경우"],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"62-0-9","subj":0,"no":9,"head":"HS협정 및 관세법령에서 규정하고 있는 HS 품목분류표에 대한 설명으로 올바른 것은?","body":[],"opts":["HS 품목분류의 법적 구속력이 있는 것은 통칙, 주의 규정과 호의 용어이며, 소호의 용어는 권고사항이다.","수출입 물품의 품목분류 사전심사를 신청할 수 있는 자는 물품을 수출입 하려는 자, 수출할 물품의 제조자, 관세사 등이다.","HS 품목분류표의 분류체계는 부, 류, 호, 소호로 세분되며, 10단위 코드는 WCO 회원국에서 모두 동일하게 사용한다.","HS 품목분류표는 물품의 가공도가 낮은 것에서부터 높아지는 순서로 분류되어 있으며, 모든 물품은 하나의 호에 분류되지만, 필요시 두 개의 호에 분류될 수도 있다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"62-0-10","subj":0,"no":10,"head":"다음 중 수출입통관에서 사용되는 관세법령상 용어 설명이 가장 올바른 것은?","body":[],"opts":["“반송”이란 국내에 도착한 외국물품이 수입통관절차를 거치지 아니하고 다시 외국으로 반출되는 것을 말한다.","“통관”이란 관세법에 따른 절차를 이행하여 물품을 수출ㆍ수입 또는 반송ㆍ환적하는 것을 말한다.","“외국물품”이란 우리나라의 선박 등이 공해에서 채집하거나 포획한 수산물 등을 포함한다.","“수출”이란 보세판매장에서 외국인에게 국내에서 생산(제조ㆍ가공ㆍ조립ㆍ수리ㆍ재생 또는 개조하는 것)된 물품을 매도하는 것을 말한다."],"ans":1,"passage":null,"topic":"관세법"},{"id":"62-0-11","subj":0,"no":11,"head":"우리나라의 관세법령에서 규정하고 있는 관세의 납부기한에 관한 설명 중 잘못된 것은?","body":[],"opts":["세관장이 납세의무자에게 납부고지를 한 경우 납부고지를 받은 날부터 15일 이내에 관세를 납부하여야 한다.","납세의무자는 수입신고가 수리되기 전에 관세를 미리 납부할 수 없다.","세관장은 관세청장이 정하는 요건을 갖춘 성실납세자가 월별납부 신청을 한 경우, 납부기한이 같은 달의 세액에 대하여 그달의 말일까지 한꺼번에 납부하게 할 수 있다.","납세의무자가 월별납부를 유지하기 어렵다고 인정될 경우 세관장은 월별납부 승인을 취소할 수 있다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"62-0-12","subj":0,"no":12,"head":"관세법상 과세물건 확정시기 및 적용 법령에 관한 설명으로 올바른 것은?","body":[],"opts":["관세는 수입신고 당시의 법령에 따라 부과하나, 입항전 수입신고를 한 경우에는 세관장이 입항전 수입신고를 수리한 때의 법령이 적용된다.","수입신고가 수리되기 전에 소비하거나 사용하는 물품(제239조에 따라 소비 또는 사용을 수입으로 보지 아니하는 물품 제외)은 해당 물품을 소비하거나 사용한 때의 물품의 성질과 수량에 따라 관세를 부과한다.","관세는 수입신고를 하는 때의 물품의 가격 또는 수량에 따라 부과된다.","사용 전 수입신고를 하고 보세건설장에 반입된 물품은 그 수입신고일을 기준으로 시행되는 법령에 따라 관세를 부과한다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"62-0-13","subj":0,"no":13,"head":"우리나라의 관세법령에서 규정하고 있는 관세징수권 등의 소멸시효에 관한 설명 중 잘못된 것은?","body":[],"opts":["관세징수권은 5억원 미만의 관세(내국세 포함)에 대해 이를 행사할 수 있는 날부터 5년 이내에 행사하지 않으면 소멸된다.","월별납부의 경우 관세징수권을 행사할 수 있는 날은 월별납부에 따른 납부기한이 경과한 날의 다음 날이다.","부과고지하는 관세의 경우 관세징수권을 행사할 수 있는 날은 납부고지를 받은 날부터 15일이 경과한 날의 다음 날이다.","관세징수권의 소멸시효는 관세의 분할납부 기간에도 진행된다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"62-0-14","subj":0,"no":14,"head":"우리나라의 관세법령에서 규정하고 있는 과세가격의 결정에 관한 설명 중 잘못된 것은? (모든 금액은 객관적이고 수량화할 수 있는 자료에 근거)","body":[],"opts":["수입항에 도착한 후 발생한 내륙운송비가 구매자가 지급하였거나 지급하여야 할 총금액에 포함된 경우, 해당 비용은 수입물품 과세가격 산정 시 공제된다.","구매자가 부담하는 중개료는 수입물품 과세가격 산정 시 가산된다.","관세의 과세표준은 수입물품의 가격으로만 한다.","거래가격이 금액으로 계산할 수 없는 조건이거나, 사정에 따라 영향을 받으면 1방법으로 과세가격 산정은 불가하며, 2방법 이하의 방법에 따라 결정한다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"62-0-15","subj":0,"no":15,"head":"우리나라의 관세법령에서 규정하고 있는 신고납부에 관한 설명으로 잘못된 것은?","body":[],"opts":["물품을 수입하려는 자는 수입신고를 할 때에 세관장에게 납세신고를 하여야 한다.","세관장은 수입신고 수리 전에 세액심사를 하는 것이 적당하지 아니하다고 인정되는 경우를 제외하고는 수입신고 수리 전 세액심사를 하여야 한다.","세관장은 납세신고 내용에 대한 심사 시 제출된 신고서나 그 밖의 서류에 미비한 점이나 오류가 있는 경우에는 보완을 요구할 수 있다.","납세의무자는 납세신고한 세액을 납부하기 전에, 그 세액이 과부족하다는 것을 알게 되었을 때는 납세신고한 세액을 정정할 수 있다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"62-0-16","subj":0,"no":16,"head":"관세법상 할당관세를 부과할 수 있는 경우로 올바른 것을 모두 고른 것은?","body":["A. 원활한 물자수급 또는 산업의 경쟁력 강화를 위하여 특정물품의 수입을 촉진할 필요가 있는 경우","B. 수입가격이 급등한 물품 또는 이를 원재료로 한 제품의 국내가격을 안정시키기 위하여 필요한 경우","C. 산업구조의 변동 등으로 물품 간의 세율 불균형이 심하여 이를 시정할 필요가 있는 경우","D. 관세 또는 무역에 관한 국제협정이나 양자 간의 협정 등에 규정된 우리나라의 권익을 부인하거나 제한하는 경우","E. 국내에서 개발된 물품을 일정 기간 보호할 필요가 있는 경우"],"opts":["A, B","A, E","C, D","B, E"],"ans":1,"passage":null,"topic":"관세법"},{"id":"62-0-17","subj":0,"no":17,"head":"다음 상황에서 납부해야 하는 관세로 올바른 것은? (모든 가격은 객관적이고 수량화할 수 있는 자료에 근거)","body":["- 수입물품 가격 : 15,000,000원","- 수입물품 가격에 포함된 우리나라에 도착한 후 발생한 내륙운송비 : 2,400,000원- 수입물품 가격에 포함되지 않은 구매자가 부담하는 중개료 : 400,000원","- 수입물품 가격에 포함되지 않은 수입 이후 발생하는 수입물품 유지비용",": 1,500,000원","- 기본관세율 : 6.5%"],"opts":["845,000원","812,500원","780,000원","747,500원"],"ans":1,"passage":null,"topic":"관세법"},{"id":"62-0-18","subj":0,"no":18,"head":"다음 신문 기사와 관련된 관세 감면 제도는 무엇인가?","body":["“항공기 부분품 관세 면제…3월 13일까지 수입분, 6월 12일까지 환급신청”","항공기 부분품에 대한 관세 면제(관세감면율 '80%→100%')가 올 연말까지 연장됨에 따라, 올해 1월 1일부터 3월 13일까지 해당 물품을 수입한 경우 납부한 관세를 환급받을 수 있게 된다.","[출처] 한국세정신문 (2025.03.17.)"],"opts":["정부용품 등의 면세","세율불균형물품의 면세","특정물품의 면세","종교용품, 자선용품, 장애인용품 등의 면세"],"ans":2,"passage":null,"topic":"관세법"},{"id":"62-0-19","subj":0,"no":19,"head":"해외 온라인 쇼핑몰에서 자가사용 목적으로 수입한 후, 반품 신청을 통해 수입한 상태 그대로 수출하는 물품에 대해 수입 시에 납부한 관세를 돌려받을 수 있다. 다음 중 환급이 되지 않는 경우는?","body":[],"opts":["수입신고 수리일로부터 8개월 되는 날에 보세구역에 반입하였다가 다시 수출하는 경우","수입신고 수리일로부터 5개월이 되는 날에 관세청장이 정하는 바에 따라 세관장의 확인을 받고 다시 수출하는 경우","수출신고가 생략되는 우편물로서 수출신고가격(FOB가격)이 150만원인 물품을 수입신고 수리일로부터 5개월이 되는 날에 수출한 후 세관장의 확인을 받은 경우","여행자가 항공기에서 구매한 물품을 입국 시 자진 신고한 뒤 구매한 물품을 환불한 경우"],"ans":1,"passage":null,"topic":"관세환급"},{"id":"62-0-20","subj":0,"no":20,"head":"다음은 ㈜한국무역의 수출입통관 업무에 관한 내용이다. ㈜한국무역이 수입 통관 시 납부한 관세를 받을 수 있는 환급 방법으로 맞게 짝지어진 것은?","body":["A. ㈜한국무역은 베트남에서 전자제품 100개를 수입하였다. 이 중 60개는 국내에 판매하고 남은 40개는 수입한 상태 그대로 중국으로 수출하였다.","B. ㈜한국무역은 12월에 중국에서 수입 통관한 자전거에 일부 하자가 있는 것을 발견하고 다시 중국으로 수출하기 위해 이듬해 4월에 수입한 상태 그대로 보세구역에 반입한 후 수출하였다.","C. ㈜한국무역이 수입 통관 시에 적용한 관세율이 잘못되어 납부해야 할 관세보다 더 많이 납부한 것을 발견하고 관세환급을 신청하였다."],"opts":["A : 원상태환급 B : 위약환급 C : 과오납환급","A : 원상태환급 B : 원상태환급 C : 개별환급","A : 위약환급 B : 위약환급 C : 개별환급","A : 위약환급 B : 원상태환급 C : 과오납환급"],"ans":1,"passage":null,"topic":"관세환급"},{"id":"62-0-21","subj":0,"no":21,"head":"관세법상 보세구역에 관한 설명으로 잘못된 것은?","body":[],"opts":["국제무역선에서 물품을 하역하기 전에 외국물품의 일부를 견본품으로 반출하려는 경우에는 세관장의 허가를 받아야 한다.","보세구역은 지정보세구역ㆍ특허보세구역 및 종합보세구역으로 구분하고, 지정보세구역은 지정장치장 및 세관검사장으로 구분한다.","지정장치장은 세관장이 통관하려는 물품을 검사하기 위한 장소로서 지정하는 구역이다. 지정장치장에 반입한 물품은 운영인이 그 보관의 책임을 진다.","보세공장에서는 외국 물품을 원료 또는 재료로 하거나 외국 물품과 내국물품을 원료 또는 재료로 하여 제조·가공하거나 그밖에 이와 비슷한 작업을 할 수 있다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"62-0-22","subj":0,"no":22,"head":"관세법령에서 규정하고 있는 우편물 통관에 대한 설명으로 잘못된 것은?","body":[],"opts":["체신관서가 외국으로 발송한 우편물은 관세법에 따라 적법하게 수출되거나 반송된 것으로 본다.","우편물이 수출입의 승인을 받은 것이거나 관세법 제226조에 따라 세관장의 확인이 필요한 것이면 해당 우편물의 수취인이나 발송인은 세관장에게 신고하여야 한다.","우편물에 대한 관세의 납세의무는 해당 우편물이 반송되면 소멸한다.","수출ㆍ수입 또는 반송하려는 우편물(서신도 포함)은 통관우체국을 경유하여야 한다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"62-0-23","subj":0,"no":23,"head":"관세법령에서 규정하고 있는 관세행정 구제제도에 대한 설명으로 올바른 것은?","body":[],"opts":["이의신청을 거친 후 심사청구를 하려는 경우에는 이의신청에 관한 결정을 통지받은 날부터 60일 이내에 하여야 한다.","청구기간이 지났거나 보정기간 내에 보정하지 아니하는 경우의 과세전 적부심사 청구에 대해서는 심사하지 아니한다는 결정을 한다.","관세청장은 심사청구를 한 처분 외의 처분에 대해서도 그 처분의 일부를 취소 또는 변경할 수 있다.","이의신청의 재결청은 불복방법을 통지할 때, 결정서를 받은 날부터 90일 이내에 행정소송을 제기할 수 있음을 통지하여야 한다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"62-0-24","subj":0,"no":24,"head":"다음은 관세 환급과 관련된 용어에 대한 설명이다. 맞게 짝지어진 것은?","body":["A. 수출물품을 생산(가공·조립·수리·재생 또는 개조하는 것을 포함한다)하는 데 드는 원재료의 양으로서 생산과정에서 정상적으로 발생하는 손모량 포함한 것을 말한다.","B. 수출용 원재료가 내국신용장 등에 의하여 거래된 경우, 관세 등의 환급업무를 효율적으로 수행하기 위하여 제조·가공 후 거래된 수출용 원재료에 대한 납부세액을 증명하는 서류로 세관장이 발급한다.","C. 수입된 상태 그대로 거래된 수출용 원재료에 대한 납부세액을 증명하는 서류로 세관장이 발급한다."],"opts":["A : 소요량 B : 수입세액분할증명서 C : 기초원재료납세증명서","A : 투입량 B : 기초원재료납세증명서 C : 수입세액분할증명서","A : 투입량 B : 수입세액분할증명서 C : 기초원재료납세증명서","A : 소요량 B : 기초원재료납세증명서 C : 수입세액분할증명서"],"ans":4,"passage":null,"topic":"관세환급"},{"id":"62-0-25","subj":0,"no":25,"head":"다음 수출 물품에 사용된 원재료 중 관세 등 환급 대상에 해당하지 않는 것은?","body":[],"opts":["생산된 자동차 표면에 색을 입히는 페인트의 점성을 낮추기 위해 사용하는 혼합용제인 시너(thinner)","반도체를 생산하고 이를 수출하는데 소요된 포장용품","자동차 핸들을 생산하는 공정에 직접 투입되는 기계를 원활하게 작동하는데 소요된 윤활유","베트남에서 생산된 스마트 TV를 수입한 후 그 상태 그대로 수출하는 스마트 TV"],"ans":3,"passage":null,"topic":"관세환급"},{"id":"62-0-26","subj":0,"no":26,"head":"관세환급특례법령에서 규정하고 있는 관세환급에 관한 설명으로 잘못된 것은?","body":[],"opts":["관세환급은 개별환급과 간이정액환급이 있으며, 중소기업으로 환급신청일이 속하는 연도의 직전 2년간 매년 환급실적이 8억원 이하인 업체의 경우 간이정액환급 대상이다.","관세청장은 생산공정이 특수한 수출물품과 중소기업 수출물품에 대한 관세 등의 환급 절차를 간소화하는 데 필요하다고 인정하는 경우에 수출물품별로 정액환급률표를 정하여 고시할 수 있다.","관세 등을 환급받으려는 자는 환급신청을 하기 전에 소요량 및 간이정액환급액의 적정 여부를 관세청장에게 미리 심사하여 줄 것을 신청할 수 있다.","주한미군이 시행하는 공사로서 우리나라 안에서 외화를 획득하는 경우에는 관세환급 대상 수출에 포함된다."],"ans":3,"passage":null,"topic":"관세환급"},{"id":"62-0-27","subj":0,"no":27,"head":"다음 중 수입물품에 대하여 협정관세의 적용을 위해 충족해야 하는 요건을 모두 고른 것은?","body":["A. 해당 수입물품이 협정에 따른 협정관세의 적용 대상일 것","B. 원산지 결정기준에 따라 결정된 해당 수입물품의 원산지가 해당 체약상대국일 것C. 해당 수입물품이 국내에서 최종 소비될 것","D. 해당 수입물품에 대하여 협정관세의 적용 또는 협정관세 사후 적용을 신청할 것E. 해당 수입물품의 수출국과의 무역수지 균형을 맞출 경우에만 적용될 것"],"opts":["A, C, E","A, B, D","A, D, E","A, B, C, D"],"ans":2,"passage":null,"topic":"FTA·원산지"},{"id":"62-0-28","subj":0,"no":28,"head":"자유무역협정(FTA)관세법령상 원산지 결정기준에 대한 설명 중 잘못된 것은?","body":[],"opts":["원산지로 결정된 경우에도 해당 물품이 생산ㆍ가공 또는 제조된 이후에 원산지가 아닌 국가에서 선적된 경우에는 그 물품의 원산지로 인정하지 아니한다. 다만, 해당 물품이 원산지가 아닌 국가의 보세구역에서 운송 목적으로 환적되었거나 일시적으로 보관되었다고 인정되는 경우에는 그러하지 아니하다.","세번변경기준이란 해당 물품이 2개국 이상에 걸쳐 생산된 경우로서 해당 물품의 품목번호와 해당 물품의 생산에 사용된 원산지 재료의 품목번호가 일정 단위 이상이 다른 경우 해당 물품을 최종적으로 생산한 국가를 원산지로 인정하는 기준을 말한다.","대체가능물품이란 원산지 물품과 비원산지 물품이 상업적으로 동일한 질과 특성을 가지고 상호 대체 사용이 가능한 물품(재료 포함)을 말한다.","해당 물품이 2개국 이상에 걸쳐 생산ㆍ가공 또는 제조된 경우에는 실질적 변형기준에 따라 원산지를 결정하며, 부가가치기준, 세번변경기준, 가공공정기준 등이 있다."],"ans":2,"passage":null,"topic":"FTA·원산지"},{"id":"62-0-29","subj":0,"no":29,"head":"다음 중 해당 체약상대국과의 협정에 따라 원산지증명서의 발급 방식이 잘못된 것은?","body":[],"opts":["미합중국과의 협정에 따라 수출자, 생산자 또는 수입자가 자율적으로 서면 또는 전자적 방식으로 작성한 것","튀르키예와의 협정에 따라 수출자가 자율적으로 작성ㆍ서명한 것","호주와의 협정에 따라 수출자 또는 생산자가 자율적으로 서면 또는 전자적 방식으로 작성ㆍ서명한 것","뉴질랜드와의 협정에 따라 수출자 또는 수입자가 자율적으로 작성ㆍ서명한 것"],"ans":4,"passage":null,"topic":"관세법"},{"id":"62-0-30","subj":0,"no":30,"head":"자유무역협정(FTA)관세법령상 원산지에 관한 조사에 대한 설명 중 잘못된 것은?","body":[],"opts":["세관장은 수출입 물품의 원산지 또는 협정관세 적용의 적정 여부 등에 관한 확인이 필요하다고 인정하는 경우에는 수입자, 수출자 또는 생산자, 원산지증빙서류 발급기관 등을 대상으로 필요한 서면조사 또는 현지조사를 할 수 있다.","세관장은 서면조사 또는 현지조사를 마치면 조사 결과와 그에 따른 결정 내용을 협정에서 달리 정하지 않았으면 조사를 완료한 날로부터 30일 이내에 조사대상자 및 체약상대국의 관세당국에 서면으로 통지하여야 한다.","세관장은 현지조사를 하려면 조사를 시작하기 60일 전까지 조사대상자에게 통지하여야 한다. 다만, 국내에 거주하는 수입자, 수출자 또는 생산자 등에 대해서는 조사를 시작하기 30일 전까지 현지조사의 통지를 할 수 있다.","세관장은 협정에서 정한 범위 내에서 원산지 확인을 위해 체약상대국에 증빙서류 검증을 요청할 수 있다."],"ans":3,"passage":null,"topic":"FTA·원산지"},{"id":"62-1-1","subj":1,"no":1,"head":"전년도 수출실적이 USD 5,000,000인 ㈜한무상사는 이번에 미국 업체와 USD 30,000 의 수출계약을 체결하고 전액을 사전 송금받았다. 다음 설명 중 올바른 것을 모두 고른 것은?","body":["A. ㈜한무상사는 USD 30,000의 수출대금을 지급받을 때 거래 외국환은행에 지급 등의 사유와 금액을 입증하는 서류(예: 수출입계약서)를 제출해야 한다.","B. ㈜한무상사는 미국 업체로부터 USD 30,000을 사전송금방식으로 수령한 것에 대해 외국환거래규정에 따른 대응수출을 이행해야 할 의무가 있다.","C. ㈜한무상사가 선택한 사전송금방식은 일반적으로 구매자 우위 시장(buyer’s market)에서 발생한다."],"opts":["A","B","A, B","A, B, C"],"ans":1,"passage":null,"topic":"송금·추심·어음"},{"id":"62-1-2","subj":1,"no":2,"head":"수출입자가 무역결제를 위해 외국환은행과 체결하는 「외국환거래약정서」에 대한 설명으로 잘못된 것은?","body":[],"opts":["외국환거래약정서는 수출, 수입, 내국신용장 발행, 내국신용장 환어음 매입(추심)거래 등을 위해서 외국환 거래자와 은행이 체결하는 기본약정서이다.","외국환거래약정서에 정하는 수입 거래란 신용장 발행, 화환어음의 인도 및 결제, 보증신용장에 의한 무화환어음의 인도 및 결제 등이다.","외국환거래약정서에서 약정하지 않은 사항은 신용장통일규칙, 추심에 관한 통일규칙 등 국제규칙과 은행의 관련 규정을 따르기로 한다.","외국환거래에 적용하는 환율은 매입(추심) 또는 신용장 개설 등 해당 외국환거래를 신청한 날의 대고객 매입률 또는 매도율로 한다."],"ans":4,"passage":null,"topic":"외환·환리스크"},{"id":"62-1-3","subj":1,"no":3,"head":"O/A 결제방식과 관련된 설명으로 잘못된 것을 모두 고른 것은?","body":["A. 수출자 입장에서 O/A 결제방식은 본지사 간 거래나 신용위험이 높은 해외 고정 거래처와 거래 시 이용해야 결제위험을 줄일 수 있다.","B. ‘O/A Nego’는 수출금융의 일종인데, 신용장 매입 관련 수출채권을 거래은행에 매각하는 금융거래이다.","C. 다른 조건이 동일하다면 수입자는 O/A 결제방식보다 T/T in advance 결제방식을 더 선호한다."],"opts":["A, B","B, C","A, C","A, B, C"],"ans":4,"passage":null,"topic":"송금·추심·어음"},{"id":"62-1-4","subj":1,"no":4,"head":"은행 실무에서 「선적통지 조건부 사후송금방식 수출거래에 의한 수출대금채권 매입거래」라고 하는 결제방식은 무엇인가?","body":[],"opts":["현물상환방식(Cash on delivery)","서류상환방식(Cash against documents)","상호계산(Open account)","보증신용장(Stand-by letter of credit)"],"ans":3,"passage":null,"topic":"송금·추심·어음"},{"id":"62-1-5","subj":1,"no":5,"head":"추심결제방식과 관련된 올바른 설명을 모두 고른 것은?","body":["A. D/P 방식은 추심결제방식의 하나로, CAD 방식과 유사한 점이 있다. 그러나 두 방식은 환어음 발행 여부에서 근본적인 차이점이 있다.","B. 추심결제방식의 하나인 D/A 방식은 Usance L/C 방식에 비해 수출자에게 대금 회수의 안정성이 떨어진다.","C. 실무에서는 추심결제방식을 변형한 ‘D/P Usance’도 활용된다.","D. 수출자로부터 추심의 취급을 의뢰받는 은행을 presenting bank라고 한다."],"opts":["A, B, C","B, C, D","A, C, D","A, B, C, D"],"ans":1,"passage":null,"topic":"송금·추심·어음"},{"id":"62-1-6","subj":1,"no":6,"head":"추심결제방식에 대한 설명으로 잘못된 것은?","body":[],"opts":["추심지시서에 D/P인지 D/A인지 명시가 없는 경우에 은행은 D/P로 간주한다.","화환추심에 있어서 추심지시서에 분할지급을 금지하는 문구가 없다면 분할지급은 허용된다.","추심거래에서 환어음의 어음기한(tenor)이 ‘45 days after sight’인 경우는 D/P 조건이 아닌 D/A 조건에 해당한다.","D/P 거래에서 수입자가 추심대금을 결제하기 전까지 화물의 소유권은 일반적으로 수출자가 갖게 된다."],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"62-1-7","subj":1,"no":7,"head":"추심결제를 취급하는 추심의뢰은행, 추심은행 등의 의무와 책임에 관한 설명으로 잘못된 것은?","body":[],"opts":["은행은 서류의 형식, 진정성, 법적 효력 등에 대하여 어떠한 의무나 책임을 지지 아니한다.","추심의뢰은행은 자신이 추심은행을 선택하였으면 전달한 지시가 이행되지 않은 때에는 그 책임을 부담해야 한다.","은행은 접수된 서류들이 누락되거나 열거된 것과 다른 서류에 대해서 지체없이 추심지시서를 송부한 당사자에게 통지해야 한다.","은행은 접수된 지시의 설명을 취득하기 위해서 지연이 발생하더라도 책임을 지지 않는다."],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"62-1-8","subj":1,"no":8,"head":"다음 중 신용장의 효용에 대한 설명으로 가장 부적절한 것은?","body":[],"opts":["수출자는 신용장을 근거로 무역금융에서 필요한 자금지원을 받을 수 있다.","수출자는 물품을 선적한 후 신용장 조건에 일치하는 서류를 은행에 제시하여 수출대금을 회수할 수 있다.","기한부 신용장의 수입자는 수입 물품을 먼저 매각하여 판매대금을 가지고 만기일에 결제할 수 있다.","신용장에 선적기일과 유효기일이 명시되어 있으므로 수입자는 계약에서 정한 물품을 입수할 수 있다는 보장이 있다."],"ans":4,"passage":null,"topic":"신용장"},{"id":"62-1-9","subj":1,"no":9,"head":"신용장의 개념과 관계당사자에 대한 설명으로 가장 잘못된 것은?","body":[],"opts":["신용장이란 수입자가 수출자에 대해서 대금 지급을 보증하는 개설은행의 수익자에 대한 지급보증서이다.","신용장 거래에서 최소 단위의 기본관계 당사자는 개설은행과 수익자이다. 만약 신용장에 확인이 추가된 경우라면 확인은행도 기본관계 당사자에 포함될 수 있다.","지정은행(nominated bank)이란 개설은행이 신용장의 사용을 위해서 지정한 매입은행, 지급은행, 인수은행 등을 말한다.","신용장의 근거인 매매계약의 당사자는 매도인(seller)과 매수인(buyer)이며, 이들은 신용장 거래에서 각각 수익자(beneficiary)와 개설의뢰인(applicant)이 된다."],"ans":1,"passage":null,"topic":"신용장"},{"id":"62-1-10","subj":1,"no":10,"head":"다음과 같은 상황에서 활용하기에 가장 적절한 신용장의 종류는?","body":["∙ 수출자는 상품생산에 필요한 원자재 구매에 필요한 자금을 확보하기 위해 사전송금방식과 신용장 결제를 혼합하고자 한다.","∙ 수입자는 선급금 지급에 따른 위험을 피하기 위해 신용장만으로 결제하고자 한다."],"opts":["Revolving Credit","Packing Credit","Escrow Credit","Bid Standby Credit"],"ans":2,"passage":null,"topic":"신용장"},{"id":"62-1-11","subj":1,"no":11,"head":"수출자가 거래은행으로부터 거절 통지문(MT734)을 받았을 때, 여러 사정을 고려해서 취할 태도 중 가장 부적절한 것은?","body":[],"opts":["신용장 유효기간과 서류 제시기간 내에 하자를 정정하여 다시 제시한다.","개설은행이 제5은행영업일 후에 거절통지가 되었음을 근거로 신용장 대금 지급을 요청한다.","거절 통지문에 서류 보관 중이라고 기재 후 다시 서류를 반송했음을 근거로 신용장 대금 지급을 요청한다.","신용장 결제방식에서 추심결제방식으로의 전환을 시도한다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"62-1-12","subj":1,"no":12,"head":"신용장의 개설 및 절차에 관한 내용으로 잘못된 것은??","body":[],"opts":["신용장은 “Irrevocable”이라는 표시가 없더라도 취소불능신용장으로 본다.","신용장에 “Shipment is subject to our further instruction”이라는 문구는 수익자에게 불리하므로 수익자는 해당 문구를 변경(amend)을 요청하는 것이 좋다.","신용장에 사용방법으로 매입, 지급, 연지급, 인수신용장 중에 하나를 명시하지 않았다면 매입신용장으로 본다.","신용장에 “Surrendered B/L acceptable”이라고 기재됐다면 개설은행은 수입화물에 대한 담보권 확보가 어렵다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"62-1-13","subj":1,"no":13,"head":"화환신용장의 서류심사에서 서류의 수리 요건에 관한 설명으로 잘못된 것은?","body":[],"opts":["선하증권에 선장의 대리인이 서명할 때, 반드시 선장의 이름과 함께 대리인 자신의 이름을 기재해야 한다.","신용장이 항공운송을 요구하면서 환적을 금지하고 있는 경우라도 환적사실이 기재된 항공운송 서류는 수리될 수 있다.","신용장이 피보험자를 지정하지 않았다면, 보험서류에 피보험자로 개설은행, 개설의뢰인을 기재할 수 있다.","신용장에서 보험서류 원본 1통과 사본 1통을 요구한 경우, 보험서류에 원본이 2부 발행되었다고 기재되었다면, 원본 2통과 사본 1통을 제시해야 수리될 수 있다."],"ans":1,"passage":null,"topic":"신용장"},{"id":"62-1-14","subj":1,"no":14,"head":"다음 중 신용장 서류심사 기준에 관한 내용으로 가장 옳은 것은?","body":[],"opts":["상업송장의 발행일이 신용장 개설일보다 앞서면 수리 거절된다.","보험서류의 발행일이 운송서류의 선적일보다 늦으면 원칙적으로 수리 거절된다.","선하증권에 선장의 대리인이 서명하는 경우, 선장의 이름이 없으면 수리 거절된다.","신용장이 수출자 발행 원산지증명서를 요구한 경우, 상공회의소 발행 원산지증명서는 수리 거절된다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"62-1-15","subj":1,"no":15,"head":"SWIFT 신용장 「47A. Additional conditions」의 기재 내용에 대한 설명으로 잘못된 것은?","body":["+ 3 PERCENT MORE OR LESS IN QUANTITY AND AMOUNT ALLOWED.","+ AT THE TIME OF NEGOTIATION, THE NEGOTIATING BANK WILL PAY YOU THE AMOUNT OF THE DRAFT LESS REIMBURSING BANK'S CHARGES.","+ A FEE OF USD 50.00, PLUS ALL RELATED CHARGES WILL BE DEDUCTED FROM THE REIMBURSEMENT CLAIM FOR EACH PRESENTATION OF DISCREPANT DOCUMENTS UNDER THIS DOCUMENTARY CREDIT.","+ DOCUMENTS MUST BE PRESENTED WITHIN 7 DAYS AFTER THE DATE OF SHIPMENT BUT WITHIN THE VALIDITY OF THIS CREDIT."],"opts":["신용장 금액과 수량은 3%의 범위에서 과부족이 허용된다.","매입은행은 어음대금에서 미입금 수수료 등을 공제하고 수익자에게 지급한다.","신용장 서류 매입에서 하자가 있을 때마다 USD 50의 하자 수수료와 관련 수수료가 대금에서 공제된다.","서류는 신용장의 유효기일과 관계없이 선적일자 후 7일 이내 제시되면 된다."],"ans":4,"passage":null,"topic":"신용장"},{"id":"62-1-16","subj":1,"no":16,"head":"신용장에서 다르게 정하지 않았다면, 신용장통일규칙에 따라서 해석되는 사항 중 잘못된 것은?","body":[],"opts":["“To”, “until”, “till”이라는 단어가 선적 기간을 결정하기 위해서 사용될 때, 언급된 일자를 포함한다.","“Before”, “after”라는 단어가 선적 기간을 결정하기 위해서 사용될 때, 언급된 일자를 제외한다.","“From”과 “after”라는 단어가 만기일을 결정하기 위하여 사용될 때, 언급된 일자를 포함한다.","“On or about”은 어떤 사건의 명시된 일자의 이전 5일부터 이후 5일까지 총 11일간을 말한다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"62-1-17","subj":1,"no":17,"head":"다음 중 화환신용장의 확인에 대한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 원신용장이 확인신용장이라면, 양도된 신용장도 확인신용장이다.","B. 확인은행은 신용장 금액의 일부에 대해서만 확인을 추가할 수 있다.","C. 통지와 함께 확인을 요청받은 통지은행은 확인 여부를 결정한 후 신용장을 통지하여야 한다.","D. 확인은행이 매입한다면, 상환청구권 행사 없이 매입하여야 한다.","E. 수익자 국가 내에서 발생한 확인수수료는 수익자가 부담한다."],"opts":["A, B, C","B, C, E","A, B, D","C, D, E"],"ans":3,"passage":null,"topic":"신용장"},{"id":"62-1-18","subj":1,"no":18,"head":"서류심사에 관한 국제표준은행관행(ISBP)에 따라서 신용장에 사용되는 환어음에 관한 내용으로 잘못된 것은?","body":[],"opts":["신용장 결제에 사용하는 환어음은 개설의뢰인을 지급인으로 발행해서는 안 된다.","환어음에 표시되는 통화는 신용장의 통화와 일치해야 한다.","환어음의 금액은 상업송장의 금액과 일치시켜야 한다.","만일 환어음에 기재된 숫자금액과 문자금액이 상이하면 문자금액을 기준으로 심사해야 한다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"62-1-19","subj":1,"no":19,"head":"다음 중 ISBP에 규정한 상업송장에 대한 설명으로 잘못된 것은?","body":[],"opts":["신용장에 명시되어 있지 않다면, 물품의 단가는 기재하지 않아도 된다.","신용장에 요구되지 않더라도, 발행인과 발행인의 서명은 반드시 표시되어야 한다.","신용장에 표시되어 있지 않더라도, 매매계약서상에 기재된 선지급금이 표시될 수 있다.","신용장에서 요구된 총 부수를 충족하였다면, 포장명세서와 하나의 서류로 작성되어도 무방하다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"62-1-20","subj":1,"no":20,"head":"국제거래에서 채무자의 의무이행을 담보하기 위해 사용되는 Clean L/C에 관한 설명으로 잘못된 것은?","body":[],"opts":["Clean L/C란 무화환신용장으로서, 은행 실무에서는 Standby L/C(보증신용장)와 Bank guarantee(은행 보증서)가 혼용되어 사용된다.","Clean L/C의 장점은 부당 청구(unfair calling)의 가능성이 없고, 단점은 수출입 대금결제에 사용될 수 없고, 금융보증용과 이행보증용으로 용도가 제한된다는 점이다.","Standby L/C에서 개설은행의 채무는 기본계약 관계가 성립하면 개시된다.","Standby L/C의 근거 규정은 ISP 98이지만, 적용할 수 있는 범위 안에서 UCP 600도 적용될 수 있다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"62-1-21","subj":1,"no":21,"head":"다음 중 팩터링과 포페이팅에 대한 공통된 설명으로 올바른 것을 모두 고른 것은?","body":["A. 무신용장 방식에서만 활용되는 대금결제 위험관리 방안이다.","B. 수출자가 활용하는 금융거래로, 수입자가 별도로 체결할 계약은 없다.","C. 수입자의 대금결제 만기일은 기초거래의 만기일과 동일하다.","D. 수입자가 물품의 하자를 이유로 대금 지급을 거절하는 경우, 수출자는 대금을 상환하여야 한다.","E. 수출자는 추가적인 수수료를 부담할 뿐 별도의 담보를 제공하지 않는다."],"opts":["B, C, E","A, B, D","C, E","모두"],"ans":3,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"62-1-22","subj":1,"no":22,"head":"국내에서만 사용되는 내국신용장(Local L/C)에 대한 설명으로 잘못된 것은?","body":[],"opts":["내국신용장(Local L/C)은 외국환은행이 대금 지급을 확약하는 국내에서 사용되는 신용장이다. 반면, 구매확인서는 은행의 지급 확약이 없는 단순한 구매 사실 확인서이다.","내국신용장의 거래대상 물품은 수출용 원자재 및 물품의 구매에 한정되지만, 구매확인서는 외화획득용 물품 구매에도 발급할 수 있다.","내국신용장은 사전 발급만 가능하지만, 구매확인서는 부가가치세 신고 기간 내에서는 사후 발급도 가능하다.","내국신용장의 매입은행은 일반 수출신용장과 마찬가지로 반드시 존재해야 하는 필수 관계당사자이다."],"ans":4,"passage":null,"topic":"신용장"},{"id":"62-1-23","subj":1,"no":23,"head":"다음이 설명하는 외국환은행이 부과하는 외국환 수수료를 무엇이라 하는가?","body":["A. 외국환의 매매를 수반하지 않고 외국환의 수취 또는 지급이 이루어질 때 외국환은행이 외환 거래자에게 부과하는 수수료다.","B. 해외송금 시 대금을 외국환 계정에서 지급하거나, 내도한 매입대금을 외국환 계정에 입금할 때 외국환 매매에 따른 이익이 발생하지 않기 때문에 이러한 기대이익 상실에 대해 부과되는 수수료다.","C. 원화의 개재 없이 단순한 외국환 자체로 지급 또는 영수하거나 외국환 계정을 활용할 때 외국환은행이 외환 매매익을 취득할 수 없어서 이를 보전하기 위하여 부과한다."],"opts":["Exchange commission","Commission in lieu of exchange","Negotiation charge","Less charge"],"ans":2,"passage":null,"topic":"외환·환리스크"},{"id":"62-1-24","subj":1,"no":24,"head":"외환거래의 내용 및 외환거래에 속하는 거래사례에 대한 설명으로 잘못된 것은?","body":[],"opts":["외환거래는 외환의 매매계약 후 외환의 인수도와 결제가 실행되는 시점에 따라 현물환거래와 선물환거래로 구분된다.","수출기업인 ㈜을화무역은 달러화로 표시된 수출신용장을 은행에서 네고(nego)하여 원화 예금계좌에 입금하였다.","㈜을화상사는 호주 현지 사무소 운영비로 맥쿼리은행으로부터 100만 호주달러(AUD)를 3년간 차입하였다.","㈜을화통상의 장그래 부장은 일본 출장을 가기 위해 신한은행에서 100만 엔(JPY)을 환전하였다."],"ans":3,"passage":null,"topic":"외환·환리스크"},{"id":"62-1-25","subj":1,"no":25,"head":"환율에 관한 기술 내용 중에서 잘못된 것은?","body":[],"opts":["환율의 상승은 외국통화의 가치가 높아지는 것으로 자국 통화의 대외가치가 하락하는 것을 의미한다.","직접표시환율은 외국통화 한 단위와 교환되는 자국통화의 금액으로 표시하는 것을 의미하며, 한국을 비롯한 다수의 국가에서 사용하는 방식이다. 일부 국가에서는 자국통화 한 단위와 교환되는 외국통화의 금액으로 나타내는 간접표시환율을 사용하기도 한다.","현물환거래는 계약일로부터 통상 제2영업일 이내에 외환의 인수도와 대금의 결제가 이루어지는 거래를 말한다.","우리나라는 외국과 통상마찰을 줄이기 위해서 현재 시장평균환율제도를 시행하고 있으며, 그동안 일일 환율변동제한폭도 지속하여 확대해 왔다."],"ans":4,"passage":null,"topic":"외환·환리스크"},{"id":"62-1-26","subj":1,"no":26,"head":"다음은 2025년 3월 중 서울 외환시장의 USD/KRW 현물환율, 스왑레이트, 선물환율을 나타낸 것이다. 여기서 스왑레이트가 마이너스(-)로 산출되면서 선물환율은 현물환율보다 낮은 수준으로 거래되고 있음을 알 수 있다. 그 이유를 가장 적절하게 설명한 것은?","body":["<div class=\"timg\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1oAAACNCAAAAACLGlRIAAAK20lEQVR42u2d25brKAxEqbP4/1+u85BL+wIYJxgKp/QwqyfdmZFlhIQEGzBYLJb28s8msFjsWhaLXcti+W2JIYQA28FiaSp8uFa4TS0DrsrY
