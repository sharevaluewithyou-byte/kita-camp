passage":null,"topic":"관세법"},{"id":"60-0-12","subj":0,"no":12,"head":"다음 조건에서 관세법령상 과세물건 및 적용법령 등에 관한 설명으로 올바른 것은?","body":["Ÿ 2023년 11월 26일: 한국의 ㈜KITA와 영국 A사는 물품 B의 매매계약 체결","(계약수량: 1,000대, 계약 체결 당시 물품 B의 관세율 8%)","Ÿ 2024년 1월 1일: 관세법 개정으로 관세율 변경, 물품 B의 관세율 6.5%","Ÿ 2024년 2월 26일: 해당 물품 인천항 도착","Ÿ 2024년 3월 2일: 계약물품 중 20대는 운송 중 분실된 것으로 확인","Ÿ 2024년 3월 15일: ㈜KITA는 수량 ○○○대에 대해 수입신고","Ÿ 2024년 3월 17일: 수입신고 수리되어 보세구역에서 물품 반출","Ÿ 2024년 4월 7일: ㈜KITA의 창고 입고 후 보관 중 10대는 도난당함"],"opts":["해당 물품의 과세물건 수량은 1,000대이고, 적용 관세율은 8%이다.","관세는 수입신고 수리 당시의 법령에 따라 부과하므로 적용 관세율은 6.5%이다.","도난 또는 분실된 물품의 과세물건의 확정시기는 도난되거나 분실된 때이므로, 과세물건의 수량은 970대이다.","㈜KITA는 980대에 대해 수입신고를 진행했으며, 적용관세율은 6.5%이다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"60-0-13","subj":0,"no":13,"head":"관세법령상 납세의무자에 관한 내용으로 잘못된 것은?","body":[],"opts":["수입신고를 한 물품인 경우, 수입신고하는 때의 화주가 관세의 납세의무자이다.","화주가 불분명한 경우로서 수입신고 전에 수입물품을 양도하면 양도인이 관세의 납세의무자가 된다.","수입신고 수리 전에 수입으로 보는 물품을 소비 및 사용하는 경우, 소비자 또는 사용자가 관세의 납세의무자가 된다.","우편으로 수입되는 물품의 경우, 관세의 납세의무자는 수취인이다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"60-0-14","subj":0,"no":14,"head":"관세법상 납세의무의 소멸에 관한 내용으로 잘못된 것은?","body":[],"opts":["관세를 납부한 경우에는 관세의 납부의무가 소멸된다.","부정한 방법으로 관세를 포탈했거나 환급 또는 감면받은 경우를 제외하고는 관세를 부과할 수 있는 날부터 5년이 지나면 부과할 수 없다.","관세징수권의 소멸시효는 관세의 분할납부기간 중에는 진행되지 않는다.","5억 원 이상의 관세에 대한 징수권은 행사할 수 있는 날부터 5년 내 행사하지 않으면 소멸된다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"60-0-15","subj":0,"no":15,"head":"다음 상황에서 설명하고 있는 수입물품 과세가격의 공제요소로 올바른 것은?","body":["Ÿ 최근 물류 지연으로 선박의 국내 도착 후 대기시간이 길어지면서 예기치 못한 체선료 발생이 증가하는 추세이며 과세대상 체선료도 늘고 있다.","Ÿ 관세청은 국내 입항 후 발생하는 체선료 등이 수입물품 과세가격에 포함되지 않도록 관련 고시를 개정, 2023년 2월 1일부터 시행 중이다.","Ÿ 개정 전에는 우리나라에 입항하는 시점이 수입항 부두에 접안하는 시점으로 해석됐지만, 개정 후에는 하역준비 완료 통지시점으로 명확히 규정함으로써 체선료가 수입물품 과세가격에 포함되지 않도록 했다."],"opts":["수입 후에 하는 해당 수입물품의 건설, 설치, 조립, 정비, 유지 또는 기술지원에 필요한 비용","수입항 도착 후 해당 수입물품의 운송에 필요한 운임·보험료, 기타 운송과 관련된 비용","우리나라에서 해당 수입물품에 부과된 관세 등의 세금과 기타 공과금","연불조건(延拂條件)의 수입인 경우에 해당 수입물품에 대한 연불이자"],"ans":2,"passage":null,"topic":"관세법"},{"id":"60-0-16","subj":0,"no":16,"head":"관세법상 세액의 확정 및 ‘징수금액의 최저한’에 관한 설명으로 올바른 것은?","body":[],"opts":["납세의무자는 신고납부한 세액의 부족이나 세액산출의 기초가 되는 과세가격 또는 품목분류 등의 오류를 알게 됐을 때 신고납부한 날부터 2년 안에 해당 세액의 보정을 세관장에게 신청할 수 있다.","세관장은 경정청구를 받은 날로부터 6개월 이내에 세액을 경정하거나 경정해야 할 이유가 없다는 뜻을 청구인에게 통지해야 한다.","세관장은 납세의무자가 납부해야 하는 관세액이 1만 원 미만인 경우, 징수하지 않으며 징수금액의 최저한은 휴대품이나 탁송품의 과세에도 적용된다.","납세의무자는 납세신고한 세액의 납부 전에 세액의 과부족(過不足)을 알게 됐을 때 납세신고한 세액을 정정할 수 있다. 이 경우 납부기한은 당초 납부기한으로 한다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"60-0-17","subj":0,"no":17,"head":"다음 괄호 안에 들어갈 관세로 올바른 것은?","body":["Ÿ A국은 B국산 철강 제품에 대한 값싼 전기요금이 사실상 정부보조금에 해당하는 만큼 B국산 철강 제품에 ( )를 부과한다고 최종 결정했다.","Ÿ 이에 B국은 해당 결정에 대해 국제재판소 제소 등을 통해 전기요금 보조금 쟁점을 적극 방어해 나갈 계획이라고 밝혔다."],"opts":["덤핑방지관세","보복관세","상계관세","긴급관세"],"ans":3,"passage":null,"topic":"관세법"},{"id":"60-0-18","subj":0,"no":18,"head":"다음 상황에서 납부해야 하는 관세로 올바른 것은? (단, 모든 가격은 객관적이고 수량화할 수 있는 자료에 근거하는 것으로 가정한다)","body":["Ÿ 수입물품 가격: 10,000,000원","Ÿ 수입물품 가격에 포함되지 않은 우리나라에 도착할 때까지 발생한 해상운임: 2,000,000원","Ÿ 구매자가 부담하는 중개료: 300,000원","Ÿ 수입물품 가격에 포함되지 않은 우리나라에 도착한 후 발생한 내국 운송료: 500,000원","Ÿ 기본관세율: 8%"],"opts":["944,000원","984,000원","1,004,000원","1,044,000원"],"ans":2,"passage":null,"topic":"관세법"},{"id":"60-0-19","subj":0,"no":19,"head":"다음 기사의 내용 중 ( ) 안에 들어갈 용어로 올바른 것은?","body":["Ÿ 수입 항공기 부품에 대한 관세 면제 조치가 2024년 말로 일몰되면서 2025년부터 매년 20%p씩 관세 감면율이 줄어 2029년부터는 관세 감면 혜택이 모두 사라진다.","Ÿ 항공기 부품의 관세 면제 조치내용은 관세법 제89조( )에 들어 있다. &lt;출처: 조선비즈(2024. 9. 2.)&gt;"],"opts":["학술연구용품의 감면","특성물품의 면세","환경오염방지물품 등에 대한 감면","세율불균형물품의 면세"],"ans":4,"passage":null,"topic":"관세법"},{"id":"60-0-20","subj":0,"no":20,"head":"관세법상 납세의무자가 납부한 관세를 돌려받을 수 있는 제도에 관한 설명 중 잘못된 것은?","body":[],"opts":["수입신고가 수리된 물품이 계약 내용과 다르고 수입신고 당시의 성질이나 형태가 변경되지 않은 상태에서 수입신고 수리일부터 1년 이내 보세구역에 반입하면 관세를 환급할 수 있다.","수입신고가 수리된 개인의 자가사용물품이 수입한 상태 그대로 수입신고 수리일로부터 6개월 이내에 보세구역에 반입됐다가 다시 수출되는 경우 관세를 환급할 수 있다.","납세의무자가 신고납부한 세액이 과다한 사실을 알았을 경우, 수입신고 수리일부터 3년 이내에 신고 세액의 경정을 세관장에게 청구할 수 있다.","세관장은 납세의무자가 관세 등을 초과해 납부한 금액을 청구하면 지체없이 이를 관세환급금으로 결정하고 30일 안에 환급해야 한다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"60-0-21","subj":0,"no":21,"head":"관세법령상 보세구역의 장치 및 화물관리에 관한 설명으로 올바른 것은?","body":[],"opts":["보세구역에 장치된 외국 물품의 전부 또는 일부를 견본품으로 반출하려는 자는 해당 보세구역의 운영인이나 화물관리인의 허가를 받아야 한다. 국제무역선에서 물품 하역 전에 외국 물품의 일부를 견본품으로 반출하려는 경우에도 마찬가지다.","보세구역이 아닌 장소에 장치하려는 자는 세관장의 허가를 받아야 한다. 이 때 세관장은 외국 물품에 대해 그 물품의 관세에 상당하는 담보의 제공, 필요한 시설의 설치 등을 명할 수 있다.","부패·손상되거나 기타 사유로 보세구역에 장치된 물품을 폐기하려는 자는 세관장의 승인을 받아 폐기할 수 있으나, 보세구역에 장치된 물품의 경우에 원형을 변경하거나 해체·절단 등의 작업을 할 수 없다.","보세구역에 장치된 물품의 현상 유지를 위해 필요한 보수작업과 일정한 범위에서 포장을 바꾸거나 구분·분할·합병을 하거나 기타 유사한 보수작업은 할 수 있다. 이 경우 외국 물품은 수입될 물품의 보수작업의 재료로 사용될 수 있다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"60-0-22","subj":0,"no":22,"head":"다음 통관에 관한 설명 중 잘못된 것은?","body":[],"opts":["상표권·저작권·특허권 등 관세법에서 정하는 지식재산권을 침해하는 물품은 수출하거나 수입할 수 없다.","수입할 때 법령상 허가·승인·표시 등을 갖출 필요가 있는 물품의 경우, 수입통관이 완료된 후 각 법령의 중앙행정기관의 장에게 반드시 해당 조건이 충족된 사실을 증명해야 한다.","세관장은 안전성 검사에서 불법·불량·유해 물품으로 확인된 경우, 해당 물품의 통관을 보류할 수 있다.","세관장은 법령에 따라 원산지를 표시해야 하는 물품에 관련 표시가 없는 경우, 해당 물품의 통관을 허용해서는 안 된다. 다만, 해당 위반사항이 경미한 경우에는 이를 보완·정정하도록 한 후 통관을 허용할 수 있다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"60-0-23","subj":0,"no":23,"head":"관세법령상 관세행정구제제도에 관한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 수입물품에 부과하는 내국세 등의 환급에 관한 세관장의 처분에 불복하는 자는 심사청구 및 심판청구를 할 수 없다.","B. 해당 처분에 대해 당사자가 이의신청·심사청구 또는 심판청구를 하면 해당 처분의 집행은 정지된다.","C. 관세청장은 심사청구의 내용이나 절차가 보정될 수 있다고 인정되는 경우, 20일 이내의 기간을 정해 해당 사항의 보정을 요구할 수 있다. 다만, 보정할 사항이 경미한 경우에는 직권으로 보정할 수 있다.","D. 동일한 처분에 대하여 심사청구와 심판청구를 중복해 제기할 수 없다.","E. 행정소송은 심사청구나 심판청구에 따른 결정을 통지받은 날부터 90일 이내에 제기해야 한다."],"opts":["A, C, D","B, C, D","B, D, E","C, D, E"],"ans":4,"passage":null,"topic":"관세법"},{"id":"60-0-24","subj":0,"no":24,"head":"㈜KITA는 수입 원재료를 이용해 국내에서 의류를 제조‧수출하는 회사이다. 다음 중 관세환급특례법에 따라 관세환급을 신청한 경우에 해당하는 것을 모두 고른 것은?","body":["A. ㈜KITA는 관세를 납부하고 프랑스에서 원단을 수입했으나, 당초 요구했던 품질에 미흡한 원단임이 확인돼 다시 프랑스로 수출하고 관세환급을 신청했다.","B. ㈜KITA는 미국에서 원단을 수입해 관세를 납부한 후, 수입한 상태 그대로 일본에 유상 수출하고 관세환급을 신청했다.","C. ㈜KITA은 미국에서 원단, 실, 단추 등을 수입한 후 의류를 제조했다. 이들 의류를 영국에 유상으로 수출하고, 수입 시 납부한 관세의 환급을 신청했다.","D. ㈜KITA는 베트남에서 원단 수입 시 관세(10%)를 납부하고 수입통관을 한 후, FTA 사후 협정세율(0%)을 적용하기 위해 관세환급을 신청했다."],"opts":["A, C","B, C","B, D","C, D"],"ans":2,"passage":null,"topic":"관세환급"},{"id":"60-0-25","subj":0,"no":25,"head":"관세환급특례법상 관세 등을 환급 신청할 때 필요한 서류에 관한 설명으로 잘못된 것은?","body":[],"opts":["개별환급에 필요한 증명서류에는 수입세액분할증명서, 소요량계산서, 원산지증명서 등이 있다.","수입된 원재료를 국내에서 제조, 가공 후 납품할 때 수출용 원재료에 대해 납부한 관세액을 증명하는 서류는 기초원재료납세증명서이다.","세관장은 내국신용장 등에 의해 물품을 공급한 자에게 관계 법령에서 정하는 바에 따라 기초원재료납세증명서 또는 수입세액분할증명서를 발급하게 할 수 있다.","세관장은 관세 등의 환급이 제한되는 물품의 경우, 환급이 제한된 세액을 공제하고 기초원재료납세증명서 등을 발급해야 한다."],"ans":1,"passage":null,"topic":"관세환급"},{"id":"60-0-26","subj":0,"no":26,"head":"다음 관세환급특례법상 설명에 해당하는 소요량 산정 방법은?","body":["Ÿ 소요량은 제조사양서상의 원재료 중 환급을 받으려는 원재료의 종류별 양으로 산정한다.","Ÿ 소요량의 적용기간은 소요량이 변경되기 전까지 생산된 수출물품의 소요량 계산에 적용한다.","Ÿ 비료, 염료, 페인트 등 화학제품류 생산업체에 적합하다."],"opts":["단위실량 산정방법","수출건별 등 총소요량 산정방법","위탁건별 총소요량 산정방법","단위설계소요량 산정방법"],"ans":4,"passage":null,"topic":"관세환급"},{"id":"60-0-27","subj":0,"no":27,"head":"관세환급특례법상 소요량 산정방법과 관련된 설명으로 잘못된 것은?","body":[],"opts":["소요원재료의 등급이 다른 이유 등으로 소요량이 불안정한 농·수·축·임산물을 원재료로 생산되는 수출물품은 수출건별 등 총소요량 산정방법 또는 위탁건별 총소요량 산정방법으로 소요량을 산정해야 한다.","소요량은 수출물품 생산에 쓰이는 원재료의 양을 말하며, 생산과정에서 정상적으로 발생되는 손모량도 여기에 포함된다.","시제품 생산단계로 손모율이 불안정한 수출물품은 일정기간별 단위소요량 산정방법 또는 1회계연도 단위소요량 산정방법으로 소요량을 산정해야 한다.","관세환급특례법상 소요량 산정방법 중 소요량 산출은 용이하나 수출물품 제조에 소요된 실제소요량보다 적게 산출되는 소요량은 단위실량 산정방법이다."],"ans":3,"passage":null,"topic":"관세환급"},{"id":"60-0-28","subj":0,"no":28,"head":"자유무역협정(FTA)관세법령상 협정관세의 적용에 관한 설명으로 잘못된 것은?","body":[],"opts":["협정관세를 적용받으려는 자는 수입신고 수리 전까지 대통령령으로 정하는 바에 따라 세관장에게 협정관세의 적용을 신청해야 한다.","협정관세의 세율이 관세법에 따른 적용세율과 같거나 높은 경우에는 관세법에 따른 적용세율을 우선해 적용한다.","수입신고 수리 전까지 협정관세의 적용신청을 하지 못한 수입자는 해당 물품의 수입신고일부터 1년 안에 대통령령으로 정하는 바에 따라 협정관세의 적용을 신청할 수 있다.","세관장은 협정관세의 적용신청을 받은 경우에는 수입신고를 수리한 후에 심사한다. 다만, 관세 채권을 확보하기가 곤란하거나 수입신고 수리 후 원산지 및 협정관세 적용의 적정 여부를 심사하는 것이 부적당하다고 인정해 기획재정부령으로 정하는 물품은 수입신고 수리 전에 심사한다."],"ans":3,"passage":null,"topic":"FTA·원산지"},{"id":"60-0-29","subj":0,"no":29,"head":"FTA관세법상 원산지 결정기준에 관한 설명으로 올바르지 못한 것은?","body":[],"opts":["해당 물품의 전부를 생산·가공 또는 제조한 국가를 원산지로 한다.","‘세번변경기준’은 해당 물품이 2개국 이상에 걸쳐 생산된 경우로서 해당 물품의 품목번호와 물품의 생산에 사용된 원산지 재료의 품목번호가 일정 단위 이상 다를 때, 해당 물품의 최종 생산국을 원산지로 인정하는 기준이다.","‘부가가치기준’은 해당 물품이 2개국 이상에 걸쳐 생산된 경우, 해당 물품에 대해 일정 수준 이상의 부가가치를 창출한 국가를 원산지로 인정하는 기준이다.","해당 물품이 생산·가공 또는 제조된 후에 원산지가 아닌 국가를 경유해 운송되거나 원산지가 아닌 국가에서 선적된 경우, 해당 물품의 원산지로 인정하지 않는다. 다만, 해당 물품이 원산지가 아닌 국가의 보세구역에서 운송 목적으로 환적됐거나 일시적으로 보관됐다고 인정되는 경우에는 그렇지 않다."],"ans":2,"passage":null,"topic":"FTA·원산지"},{"id":"60-0-30","subj":0,"no":30,"head":"FTA관세법상 원산지증명서에 관한 설명으로 올바른 것은?","body":[],"opts":["한-중 FTA협약의 원산지증명서는 중국과의 협정에 따라 수출자 또는 생산자가 자율적으로 작성하고 서명한 것이어야 한다.","FTA관세법령상 미합중국과의 협정의 원산지증명서 유효기간은 발급일로부터 1년이다.","수입자·수출자 및 생산자는 원산지증빙서류를 2년의 범위에서 대통령령으로 정하는 기간 동안 보관해야 한다.","원산지증명서의 기재사항은 협정에서 다르게 규정하는 경우를 제외하고는 영문으로 작성돼야 한다."],"ans":4,"passage":null,"topic":"FTA·원산지"},{"id":"60-1-1","subj":1,"no":1,"head":"외국환거래에 관한 일반적인 설명으로 잘못된 것은?","body":[],"opts":["환(exchange)은 금융기관의 중개를 통한 지급위탁의 방법으로 결제하는 것이다.","외국환거래의 특징은 환율 문제의 발생, 대차 관계의 발생, 이자 요소의 개입, 국가 간 국제수지의 발생 등이다.","무역과 관련된 외환거래에서 전신환매도율이 적용되는 경우는 당발송금, 타발추심, 수입신용장 결제 등이다.","외국환의 발생 원인 중에서 경상거래는 해외직접투자와 서비스거래, 자본거래는 대부나 차관거래 등이다."],"ans":4,"passage":null,"topic":"외환·환리스크"},{"id":"60-1-2","subj":1,"no":2,"head":"송금 방식 거래에 관한 설명으로 잘못된 것은?","body":[],"opts":["건당 미화 100만 달러의 수출대금을 사전송금 방식으로 영수한 국내기업 ㈜KB상사는 외국환거래규정에 따라 대응수출을 하거나 해당 대금을 반환해야 한다.","직접 물품 품질의 확인이 중요한 귀금속을 수입하는 국내 수입기업 ㈜한무상사는 다른 조건이 동일하다면 CAD 방식 거래보다 COD 방식 거래를 이용하는 것이 유리하다.","CAD 거래는 수출자가 물품을 선적한 후 자신이 발행한 환어음과 선적서류를 수입자에게 제시해 대금을 결제받는 방식으로 ‘유럽식 D/P’라고도 한다.","수출자인 ㈜한역상사가 기존 사후송금 방식 거래를 사전송금 방식 거래로 변경한다면 해외 수입자의 신용위험을 더 효과적으로 관리할 수 있다."],"ans":3,"passage":null,"topic":"송금·추심·어음"},{"id":"60-1-3","subj":1,"no":3,"head":"O/A 결제 방식에 관한 설명으로 올바른 것은?","body":[],"opts":["O/A 방식에서 수출자가 물품을 수입국에 소재하는 수출자의 지사에 송부하면 수입자는 현물상환 방식으로 즉시 송금해야 한다.","O/A 결제 방식으로 거래하는 수출자는 O/A Nego라는 일종의 수출금융을 제공받을 수도 있다.","다른 조건이 동일하다면, O/A 결제 방식으로 거래하는 수출자는 일람불신용장 결제 방식으로 거래하는 경우보다 더 낮은 가격으로 계약하려 할 가능성이 크다.","다른 조건이 동일하다면, 수출자는 CWO 방식에 비해 O/A 방식을 더 선호하게 된다."],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"60-1-4","subj":1,"no":4,"head":"다음 중 수출자가 기한부 환어음을 발행하고, 수입자가 환어음을 인수(acceptance)하는 결제 방식은?","body":[],"opts":["T/T","COD","D/P","D/A"],"ans":4,"passage":null,"topic":"송금·추심·어음"},{"id":"60-1-5","subj":1,"no":5,"head":"대금교환 방식(COD, CAD)에 대한 설명으로 잘못된 것은?","body":[],"opts":["COD, CAD는 물품 또는 선적서류의 인도와 동시에 수출대금을 결제하는 방식이다. 수출자가 선적을 먼저 진행하고 송금받기 때문에 사후송금 방식으로 구분할 수 있다.","COD는 수출자가 물품을 수입지에 있는 자신의 대리인에게 보내고, 수입자가 물품의 품질 등을 검사한 후 물품과 대금을 교환하는 방식으로 직접 물품을 검사하기 전에는 품질을 파악하기 어려운 경우에 활용된다.","CAD는 수출자가 선적 후 선적서류를 수출국에 있는 수입자의 대리인에게 제시하거나 수입자에게 직접 송부하고, 서류와 상환해 대금을 받는 방식이다.","CAD는 현물상환 방식으로서 가장 부합하는 정형거래조건은 DDP(관세지급 인도) 조건이다."],"ans":4,"passage":null,"topic":"송금·추심·어음"},{"id":"60-1-6","subj":1,"no":6,"head":"추심결제 방식에 대한 설명으로 올바른 것은?","body":[],"opts":["추심의뢰은행은 외국의 법률과 관행에 따라 부과되는 모든 의무와 책임을 최종적으로 부담해야 하며, 이로 인해 발생한 다른 은행의 비용과 손실에 대해서도 최종적으로 보상해야 한다.","화환추심(documentary collection)에서 ‘분할지급’은 추심지시서에 명시가 없더라도 허용된다.","추심지시서(collection instruction)에 추심의 방식이 D/A인지 D/P인지 명시되지 않았다면 D/A인 것으로 간주된다.","환어음의 지급인(drawee)은 은행이 아닌 수입자로 표시돼야 한다."],"ans":4,"passage":null,"topic":"송금·추심·어음"},{"id":"60-1-7","subj":1,"no":7,"head":"신용장 거래의 기본원칙에 관한 설명으로 올바른 것은?","body":[],"opts":["개설의뢰인이 개설은행의 도움 없이 수입품을 회수했다면, 개설은행은 하자 있는 서류를 거절할 수 없다.","개설은행이 신용장 대금을 매입은행에 상환한 후 법원이 injunction을 발급했다면, 개설은행은 injunction을 근거로 상환자금의 반환을 청구할 수 없다.","신용장을 이용하면 수출자는 credit risk를 낮출 수 있고, 수입자는 commercial risk를 제거하는 효과를 얻을 수 있다.","UCP 600은 신용장 거래의 기본원칙으로 한계성을 규정하고 있다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"60-1-8","subj":1,"no":8,"head":"국제결제 시스템인 SWIFT에 관한 설명으로 잘못된 것은?","body":[],"opts":["SWIFT는 전 세계적으로 통용되는 금융기관 간 금융정보 통신망으로 한국은 1992년부터 도입해 대부분의 외국과의 자금 이체 및 금융 메시지 교환 등이 SWIFT를 통해 이루어진다.","BIC(Business/Bank Bank Identifier Code)는 SWIFT에 가입한 은행 등 금융기관에 부여된 고유번호이다.","중국은 2015년부터 위안화의 안정성과 효율성을 높이기 위해 SWIFT를 사용하지 않고, 위안화의 국제결제 시스템인 CIPS로 대체해 사용 중이다.","SWIFT에서 MT는 정형화된 Message Type으로서 MT200~210(은행 간 자금 이체), MT100~112(고객 송금), MT700~754(신용장) 등과 같이 구분해 사용되고 있다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"60-1-9","subj":1,"no":9,"head":"화환신용장에 관한 설명으로 올바른 것은?","body":[],"opts":["수출자가 신용장 조건변경서를 전달받은 후 통지은행에 별도 통보 없이 수출계약을 실행했다면, 신용장의 조건 변경에 동의한 것으로 해석한다.","신용장 금액 중 10%에 대해 선급을 허용하고 있는 신용장을 받은 수출자가 선급금을 청구하지 않으면 해당 신용장은 모두 무효가 되어 사용할 수 없게 된다.","신용장에 “transferable” 표기가 없더라도 신용장 대금의 양도는 가능하다.","수출신용장을 근거로 내국신용장이 개설된 경우, 수출신용장의 조건 변경이 유효하려면 내국신용장 수익자의 동의가 필요하다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"60-1-10","subj":1,"no":10,"head":"신용장의 개설 및 절차에 관한 내용으로 잘못된 것은?","body":[],"opts":["신용장은 “irrevocable”이라는 표시가 없더라도 취소 불능이지만, 일반적으로 SWIFT신용장 40A(form of documentary credit)에는 “irrevocable”이라는 문구가 표시된다.","신용장의 “Shipment is subject to our further instruction”이라는 문구는 수익자에게 불리한 독소조항이므로 수익자는 삭제하는 조건변경을 하는 것이 좋다.","신용장에 사용방법으로 매입, 지급, 연지급, 인수신용장 중에 하나를 명시하지 않았다면 매입신용장으로 간주해 진행한다.","신용장에 “Surrendered B/L acceptable”이라고 기재됐다면 개설은행은 수입화물에 대한 담보권 확보가 어렵다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"60-1-11","subj":1,"no":11,"head":"신용장 요구서류의 수리 요건에 관한 설명으로 잘못된 것은?","body":[],"opts":["선하증권 발행 시 서명한 대리인(갑)과 선하증권 정정 후 인증(authentication) 시에 서명한 대리인(을)이 다른 경우에는 수리 거절의 근거가 된다.","신용장 통화가 미 달러화(US$)인 경우, [수익자 주소 – 대한민국의 주소, 금액 – 달러화($)]로 표기한 송장은 수리 거절된다.","신용장에서 상업회의소가 발행한 원산지증명서를 요구하는 경우, 세관이 발행한 원산지증명서를 제시하더라도 수리 가능하다.","신용장이 항공운송서류 원본 전통을 요구하는 경우, 수익자가 원본 1부(제3 원본)를 제시하더라도 수리 가능하다."],"ans":1,"passage":null,"topic":"신용장"},{"id":"60-1-12","subj":1,"no":12,"head":"SWIFT 신용장의 각 항목(field)에 관한 해설로 가장 올바른 것은?","body":[],"opts":["[41D Available with 한솔은행 by negotiation]으로 기재된 경우에 수출자는 서류를 개설은행에 직접 제시할 수 없고 반드시 한솔은행을 경유해 제시해야 한다.","[48 Period for Presentation: ____ ]로 되어 있고, Forwarder’s Cargo Receipt(FCR)를 요구한다면, 수익자는 서류를 신용장 유효기간 내에 제시하면 된다.","수출국 상업회의소 발행 원산지증명서(C/O issued by chamber of commerce in exporting country)를 요구했다면, 반드시 수익자 소재국 상업회의소가 발행한 것을 제시해야 한다.","[46A Documents Required: Signed Commercial Invoice]로 기재된 경우, 상업송장에 반드시 수기로 서명해야 한다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"60-1-13","subj":1,"no":13,"head":"SWIFT 신용장 46A(Documents Required)에 다음과 같이 명기됐다면, 관련 설명으로 잘못된 것은?","body":["FULL SET ORIGINAL CLEAN ON BOARD MARINE BILLS OF LADING MADE OUT TO THE ORDER OF XYZ BANK, MARKED \"FREIGHT PREPAID\" AND NOTIFY APPLICANT WITH FULL ADDRESS AND MENTIONING THIS DC NO."],"opts":["물품이 본선에 적재됐음을 나타내는 본선적재 선하증권을 요구한다.","수하인란에 TO THE ORDER OF XYZ BANK가 표시된 지시식 선하증권을 요구한다.","운임선불조건으로 수익자가 선하증권을 발급받기 위해서는 운송인에게 운임을 지불해야 한다.","개설의뢰인의 주소와 화환신용장 번호가 기재된 선하증권 원본 1통을 제시하면 된다."],"ans":4,"passage":null,"topic":"신용장"},{"id":"60-1-14","subj":1,"no":14,"head":"다음 신용장통일규칙 조항이 의미하는 설명으로 올바른 것은?","body":["The fact that a credit is not stated to be transferable shall not affect the right of the beneficiary to assign any proceeds to which it may be or may become entitled under the credit, in accordance with the provisions of applicable law. This article relates only to the assignment of proceeds and not to the assignment of the right to perform under the credit."],"opts":["신용장에 관한 권리와 의무를 양도하는 양도가능신용장에 관한 조항이다.","네고서류 등 신용장에 따른 의무를 이행해야 하는 자는 제2 수익자인 양수인이고, 대금을 받을 수 있는 권리를 가지는 자도 제2 수익자인 양수인이다.","Proceed(대금) 양도를 위해서는 신용장에 “양도 가능(transferable)”이라는 문구가 반드시 있어야 하는 것은 아니다.","신용장에 별도의 명시가 없는 한 양도는 1회에 한하며, 양도는 특별히 지정된 은행만 취급할 수 있다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"60-1-15","subj":1,"no":15,"head":"신용장 결제에 사용되는 환어음에 관한 내용으로 잘못된 것은?","body":[],"opts":["환어음은 신용장에 명시된 지급인 앞으로 신용장의 통화와 일치시켜 발행해야 한다.","신용장상 어음조건이 “30 days after shipment date”와 “30 days from shipment date”인 경우 두 조건의 만기일은 동일하다.","환어음은 수익자를 포함해 매입은행 등 대금 지급을 청구하는 자가 발행해야 하며, 서명과 발행일의 표시는 없어도 된다.","만일 환어음에 기재된 숫자금액과 문자금액이 상이하면 문자금액을 기준으로 심사해야 한다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"60-1-16","subj":1,"no":16,"head":"다음 UCP 600과 ISBP 745가 적용되는 화환신용장에 관한 해석 중 모두 올바른 것으로만 짝지어진 것은?","body":["A. 지정은행에서 매입이 가능한 신용장의 경우, 환어음은 해당 지정은행을 지급인으로 해 발행돼야 한다.","B. 비서류적 조건이라 하더라도 비서류적 조건 사이에 정보의 저촉이 있어서는 안 된다.","C. 신용장에서 별다른 명시가 없다면, 상업송장의 금액과 보험서류의 부보금액은 신용장에 표시된 통화와 동일하게 표기돼야 한다.","D. 수익자가 발행한 중량명세서라면 다른 서류에 나타난 송장번호, 운송항로와 상이하게 기재돼 있어도 된다.","E. 원산지증명서에 표시된 송하인과 운송서류에 나타난 송하인이 상이해도 된다."],"opts":["A, B","C, D, E","A, C, D","B, C, E"],"ans":4,"passage":null,"topic":"신용장"},{"id":"60-1-17","subj":1,"no":17,"head":"ISBP 745의 규정에 따라 작성된 서류에 관한 설명으로 잘못된 것은?","body":[],"opts":["Commercial Invoice를 요구했다면 Invoice도 수리 가능하다.","Packing List에 컨테이너 번호를 기재했다면 컨테이너 봉인번호도 기재돼야 한다.","Quality Certificate상에 기재된 수량은 운송서류에 기재된 수량과 상이할 수 있다.","Beneficiary’s Certificate에는 발행일자는 없어도 되지만, 반드시 서명이 있어야 한다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"60-1-18","subj":1,"no":18,"head":"Standby L/C와 청구보증서(Demand Guarantee)에 관한 설명으로 잘못된 것은?","body":[],"opts":["Standby L/C와 청구보증서는 보증용으로 사용되기 때문에 주채무에 대한 부종성과 추상성을 특성으로 한다.","개설은행의 보증채무 발생 시점은 기본적인 계약관계가 성립하는 때이다. 한편 화환신용장은 수익자가 정당한 서류를 제시해 지급을 요청하는 때에 채무가 발생한다.","장점은 이행보증 및 금융보증 등 용도의 다양성이며, 단점은 기본 계약상 의무가 이행되지 않았다는 수익자의 진술서만 있으면 되는 부당청구의 우려이다.","국제규칙으로 Standby L/C는 ISP 98과 UCP 600이 적용되며, 청구보증서는 URDG 758이 적용된다."],"ans":1,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"60-1-19","subj":1,"no":19,"head":"보증서에 관한 설명으로 올바른 것은?","body":[],"opts":["계약이행보증서의 경우에 보증서의 금액은 계약금액으로, 보증서의 기간은 계약기간으로 명시해 발급된다.","입찰보증서의 경우, 보증서의 유효기간은 입찰 결과 발표일까지이다.","현지금융보증서의 경우, 보증서 기간이 만료되면 해당 기간을 연장하는 경우가 많다.","선수금환급보증서의 경우, 보증서 유효기간 내에 화환신용장이 개설돼야 한다."],"ans":3,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"60-1-20","subj":1,"no":20,"head":"Factoring과 Forfaiting 거래의 비교에서 잘못된 것으로만 짝지어진 것은?","body":["<table><tr><th><\/th><th>비교<\/th><th>Factoring<\/th><th>Forfaiting<\/th><\/tr><tr><td>A<\/td><td>금액<\/td><td>일반적으로 소액<\/td><td>비교적 거액<\/td><\/tr><tr><td>B<\/td><td>외상기간<\/td><td>단기(1년 이내)<\/td><td>장기(2~10년)<\/td><\/tr><tr><td>C<\/td><td>소구권<\/td><td>Without Recourse<\/td><td>With / Without Recourse<\/td><\/tr><tr><td>D<\/td><td>금리<\/td><td>제한 없음<\/td><td>고정금리로만 할인<\/td><\/tr><tr><td>E<\/td><td>지급근거<\/td><td>Factor의 사용승인<\/td><td>수입자은행의 지급보증(Aval)<\/td><\/tr><tr><td>F<\/td><td>거래방식<\/td><td>Usance 환어음, 약속어음<\/td><td>사후송금 방식<\/td><\/tr><tr><td>G<\/td><td>대상채권<\/td><td>현재 및 미래 발생할 매출채권<\/td><td>개별로 확정된 매출채권<\/td><\/tr><tr><td>H<\/td><td>국제규칙<\/td><td>URF 800<\/td><td>없음<\/td><\/tr><tr><td>I<\/td><td>취급은행<\/td><td>수출입은행, 기업은행 등 일부<\/td><td>외국계 은행, 대부분 외국환은행<\/td><\/tr><\/table>"],"opts":["A, C, E","B, F, I","C, F, H","D, G, H"],"ans":3,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"60-1-21","subj":1,"no":21,"head":"수출업자가 활용할 수 있는 주요 무역보험에 관한 설명 중 잘못된 것은?","body":[],"opts":["환변동보험은 수출입을 통해 외화를 획득 또는 지급하는 과정에서 발생할 수 있는 환차손익을 제거, 미리 외화 금액을 원화로 확정해 환율변동에 따른 위험을 헤지(hedge)한다.","수출신용보증(선적후)은 중소·중견기업이 수출물품을 제조, 가공하거나 조달할 수 있도록 금융기관에서 필요한 자금을 대출받을 때 한국무역보험공사가 연대 보증한다.","단기수출보험(단체보험)은 지방자치단체 등 지원기관 또는 협회 등 단체가 보험계약 절차를 진행해 일괄 보험계약을 체결하고, 수출자는 단체보험의 피보험자로서 수출대금 미회수 위험 발생 시 최대 미화 10만 달러(지자체별 상이)까지 보상받는다.","단기수출보험(포페이팅)은 은행이 포페이팅 수출금융 취급 후 신용장 개설은행으로부터 만기에 수출대금을 회수하지 못해 입게 되는 손실을 보상한다."],"ans":2,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"60-1-22","subj":1,"no":22,"head":"내국신용장의 개념, 개설조건, 관계당사자 등에 관한 설명으로 잘못된 것은?","body":[],"opts":["내국신용장은 무역금융을 활용하려는 업체가 과거 수출실적 또는 Master L/C 등 융자 대상 증빙을 근거로 신청할 수 있는 국내용 신용장이다.","내국신용장 표시통화는 원화, 외화, 개설일 매매기준율로 환산한 외화 금액을 부기한 원화 중 하나이어야 한다.","수익자는 거래 대상 물품을 국내에서 생산(가공)할 능력을 보유한 제조업체만 해당한다.","서류 제시기간은 물품수령증명서 발급일로부터 5영업일 이내이다. 단, 개설의뢰인과 수혜자의 소재지가 원격지이면 7영업일로 연장된다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"60-1-23","subj":1,"no":23,"head":"국제금융시장에서 자국 통화와 미국 달러화의 환율을 미국식(American term)으로 표시 하는 국가가 아닌 것은?","body":[],"opts":["영국","스웨덴","그리스","핀란드"],"ans":2,"passage":null,"topic":"외환·환리스크"},{"id":"60-1-24","subj":1,"no":24,"head":"다음 국제금융시장에서 USD/KRW, USD/JPY의 환율을 나타낸 표에서 6개월 전 환율과 현재 환율에 관한 설명으로 잘못된 것은? (환율표시에서 앞의 것이 기준통화)","body":["<table><tr><th>구분<\/th><th>6개월 전<\/th><th>현재<\/th><\/tr><tr><td>USD/KRW<\/td><td>1400.00<\/td><td>1200.00<\/td><\/tr><tr><td>USD/JPY<\/td><td>140.00<\/td><td>130.00<\/td><\/tr><\/table>"],"opts":["6개월 전과 비교할 때 미 달러화는 원화에 대해 평가절하됐다.","6개월 전과 비교할 때 일본 엔화는 미 달러화에 대해 평가절상됐다.","6개월 전과 비교할 때 미국으로 수출해 달러를 수령하는 한국업체는 가격경쟁력이 약화됐다.","6개월 전과 비교할 때 일본으로 여행하는 한국의 관광객은 원화로 지불하는 여행경비의 부담이 증가했다."],"ans":4,"passage":null,"topic":"외환·환리스크"},{"id":"60-1-25","subj":1,"no":25,"head":"외환시장에서 USD/KRW의 현물환율과 간편식으로 산출한 6개월 선물환율이 다음과 같다. 단기금융시장에서 USD의 6개월 금리가 연율 3%로 거래된다면 KRW의 6개월 금리와 가장 가까운 것은? (환율표시에서 앞의 것이 기준통화)","body":["<table><tr><th>USD/KRW 현물환율<\/th><th>1400<\/th><\/tr><tr><td>USD/KRW 6개월 선물환율<\/td><td>1414<\/td><\/tr><tr><td>USD 6개월 금리<\/td><td>연율 3%<\/td><\/tr><\/table>"],"opts":["연율 5%","연율 4%","연율 2%","연율 1%"],"ans":1,"passage":null,"topic":"외환·환리스크"},{"id":"60-1-26","subj":1,"no":26,"head":"우리나라의 환율제도 및 환율 등에 관한 설명으로 올바른 것은?","body":[],"opts":["한국의 환율제도는 외환의 수요와 공급으로 환율이 결정되며, 변동제한폭 없이 외국환은행이 자유롭게 환율을 고시하는 자유변동환율제를 택하고 있다.","뉴스에서 환율이 올랐다고 표현하는 것은 미 달러화를 기준으로 원화 가치가 올랐다는 것을 의미한다.","외국환은행이 매일 1회차로 고시하는 환율은 통화별로 가중치를 부여한 복수통화바스켓 환율이다.","당발 송금환이란 국내 수입자가 외국환을 전신환(T/T)으로 매입해 외국의 수출자에게 보내는 매입환(buying exchange)을 말한다."],"ans":1,"passage":null,"topic":"외환·환리스크"},{"id":"60-1-27","subj":1,"no":27,"head":"다음은 어떤 환위험에 관한 설명인가? (환율표시에서 앞의 것이 기준통화)","body":["(주)한국축산은 국산 사료로 한우를 길러 거래처인 국내 백화점에 납품하고 원화로 대금을 수령한다. 이 회사는 수입은 전혀 하지 않으며 쇠고기의 수출 또한 없다. 외화표시 부채도 없고, 해외 현지법인도 없다.","그런데 이 회사는 최근 급속한 USD/KRW 환율 하락으로 고전하고 있다. 왜냐하면 환율 영향으로 미국산 등 수입 쇠고기 가격이 인하되면서 한우의 가격경쟁력이 약화되고 있기 때문이다."],"opts":["거래 환위험","영업 환위험","무역 환위험","환산 환위험"],"ans":2,"passage":null,"topic":"외환·환리스크"},{"id":"60-1-28","subj":1,"no":28,"head":"외환 수요가 많은 수입업체가 선택할 수 있는 환위험 관리방법 중에서 가장 바람직한 것은?","body":[],"opts":["리딩(leading)으로 일정 기간의 외환포지션을 산출한 후, 통화선물 매도거래를 통해 환위험을 헤지(hedge)한다.","매칭(matching)으로 일정 기간의 외환포지션을 산출한 후, 선물환 매입거래를 통해 환위험을 헤지한다.","상계(netting)로 일정 기간의 외환포지션을 산출한 후, 통화 풋옵션 매입거래를 통해 환위험을 헤지한다.","포트폴리오(portfolio)로 일정 기간의 외환포지션을 산출한 후, 통화 콜옵션 매도거래를 통해 환위험을 헤지한다."],"ans":2,"passage":null,"topic":"외환·환리스크"},{"id":"60-1-29","subj":1,"no":29,"head":"다음 중 환리스크의 내부적 관리기법이 아닌 것은?","body":[],"opts":["한국에 본사가 있는 ㈜K물산은 미국 현지법인과의 채권과 채무에서 같은 금액을 소멸시키고 차액만을 결제했다.","한국전자㈜는 일본에서 전자부품을 수입하면서 수입대금을 엔화로 지급하는데, 엔화 환율 상승이 예상돼 상승하기 전에 수입대금을 서둘러 지급했다.","㈜영돈축산은 국내에서 수요가 적은 돼지고기 부위를 가공해 수출하면서 환율 하락이 우려되어 한국무역보험공사의 환변동보험에 가입했다.","푸른산목재㈜는 인도네시아 원목을 수입, 합판으로 가공해 중국에 수출하면서 수출대금 수취시기와 수입대금 지출시기를 일치시켰다."],"ans":3,"passage":null,"topic":"외환·환리스크"},{"id":"60-1-30","subj":1,"no":30,"head":"다음에서 설명하는 환리스크 외부적 관리기법은 무엇인가?","body":["∙ 불특정 다수가 참여하는 시장에서 거래가 이뤄지기 때문에 거래이행의 보장이 확실하다.","∙ 환율변동 위험을 제거하기 위한 수단으로 사용할 수 있으며, 변동에 따른 수익을 목적으로 하는 투기적 거래도 있다.","∙ 모든 계약에 증거금이 필요하며, 많은 경우 만기 이전에 청산이 이루어지기 때문에 현물 시세의 변동상황에 따라 적절하게 대응할 수 있다.","∙ 거래통화, 거래금액, 가격, 계약단위, 만기일 등이 표준화돼 있다.","∙ 특정 통화를 미래의 일정 시점에 매입(call option) 또는 매도(put option)하기로 약정하는 방법으로 사용된다."],"opts":["선물환","통화선물","통화옵션","포트폴리오"],"ans":2,"passage":null,"topic":"외환·환리스크"},{"id":"60-2-1","subj":2,"no":1,"head":"무역계약의 준거법(governing law)에 관한 설명으로 잘못된 것은?","body":[],"opts":["계약당사자 간의 약정에 따라 일방 당사자가 속한 국가의 국내법이 계약의 준거법이 되기도 한다.","당사자 간 합의는 최우선으로, 국제무역계약법의 강행규정보다도 우선 적용된다.","준거법에 대한 당사자 간의 합의가 없는 경우는 법정지(法庭地)의 법원이 국제사법에 따라 준거법을 결정한다.","Incoterms와 UCP 600은 국제통일규칙이며, 적용을 명시적으로 의도한 경우에만 적용된다."],"ans":2,"passage":null,"topic":"계약 일반"},{"id":"60-2-2","subj":2,"no":2,"head":"Incoterms 2020에 관한 설명으로 올바른 것은?","body":[],"opts":["EXW에서 매도인은 지정 인도장소에서 물품을 수취용 차량에 적재한 상태로 매수인의 처분하에 둠으로써 인도한다.","FCA에서 매도인은 수입을 위하거나 제3국 통과를 위한 통관을 할 의무가 있다.","CPT에서 매도인은 운송계약상 지정목적지에서 양하비용이 발생한 경우, 당사자 간 합의가 없으면 이 비용을 매수인으로부터 별도로 상환받을 권리가 없다.","DDP에서 매도인은 물품을 지정목적지에서 도착운송수단으로부터 양하해 매수인의 처분하에 두거나 그렇게 인도된 물품을 조달함으로써 인도해야 한다."],"ans":3,"passage":null,"topic":"인코텀즈"},{"id":"60-2-3","subj":2,"no":3,"head":"한국의 무역업자가 미국의 무역업자와 무역계약을 체결할 때 사용에 주의해야 할 무역조건으로서 Incoterms 2020의 FOB 조건과 유사한 ‘미국식 FOB’는 어느 것인가?","body":[],"opts":["FOB(named inland carrier at named inland point of departure)","FOB vessel(named port of shipment)","FOB(named inland carrier at named inland point of exportation)","FOB(named inland point in the country of importation)"],"ans":2,"passage":null,"topic":"인코텀즈"},{"id":"60-2-4","subj":2,"no":4,"head":"무역거래에서 Incoterms의 사용에 관한 실무상 유의점으로 올바르지 못한 것은?","body":[],"opts":["무역실무에서 Incoterms는 가격조건으로 사용되지만, 전적으로 가격조건만을 의미하는 것은 아니며, 운송‧보험‧통관 등의 복합조건을 의미한다.","Incoterms 2020 규칙 자체는 매매계약이 아니므로 매매계약에 편입될 때 비로소 계약의 일부가 된다. 특히 인코텀즈의 버전(예: Incoterms 2020)을 명기하는 것이 중요하다.","Incoterms에서 거래조건 의미의 통일을 위해 변형(variants)을 금지하기 때문에 Incoterms 2020의 11개 조건 이외의 변형된 조건을 사용할 수 없다.","Incoterms는 의무, 위험, 비용 등에 대해 언제 어디에서 매도인으로부터 매수인에게 이전되고 할당되는지를 규정하고 있다."],"ans":3,"passage":null,"topic":"인코텀즈"},{"id":"60-2-5","subj":2,"no":5,"head":"Vienna Convention(1980)과 Incoterms 2020의 관계에 관한 설명 중 잘못된 것은?","body":[],"opts":["Vienna Convention은 국제물품매매계약에서 청약과 승낙, 청약과 승낙의 취소, 철회, 효력 발생시기 및 계약의 성립 시점 등을 규정하고 있다.","Incoterms와 Vienna Convention은 국제물품매매에서 당사자의 권리와 의무를 다루고 있다는 점에서는 공통의 역할을 수행한다.","Incoterms는 매도인과 매수인의 의무와 함께 당사자가 의무를 위반했을 때 상대방은 어떻게 구제권을 행사할 수 있는지에 대해 규정하고 있다.","계약서에서 Incoterms 2020을 적용한다고 약정했다면 관습인 Incoterms가 법률인 Vienna Convention에 우선해 적용된다."],"ans":3,"passage":null,"topic":"인코텀즈"},{"id":"60-2-6","subj":2,"no":6,"head":"Vienna Convention(1980) 규정상 본질적 계약위반의 효과에 관한 설명으로 잘못된 것은?","body":[],"opts":["매도인의 의무 불이행이 본질적 계약위반이고, 이 사실을 매수인이 매도인에게 합리적인 기간 안에 통지한 경우라면 매수인은 대체품 인도를 청구할 수 있다.","물품의 일부 불일치가 계약 전체의 본질적 위반인 경우, 매수인은 계약 전체를 해제할 수 있다.","계약의 이행기일 전에 당사자 일방이 본질적 계약위반을 할 것이 명백한 경우에 상대방은 계약을 해제할 수 있다.","매도인이 본질적 계약위반을 한 경우라도 매수인에게 위험이 이전되었다면 권리 구제의 행사를 할 수 없다."],"ans":4,"passage":null,"topic":"계약 성립·CISG"},{"id":"60-2-7","subj":2,"no":7,"head":"Vienna Convention(1980)에서 규정하고 있는 계약해제에 관한 설명으로 올바른 것은?","body":[],"opts":["계약해제를 위한 일정한 요건이 충족되면 당사자의 별도 의사표시가 없더라도 자동으로 계약은 해제된다.","계약해제는 기존의 계약상 의무뿐만 아니라 이미 발생한 모든 손해배상 의무로부터 양 당사자를 면하게 한다.","계약의 전부 또는 일부를 이행한 이후에는 당사자 일방은 상대방에게 해당 계약에서 이미 공급했거나 지급한 것에 대한 반환 청구 권리를 상실한다.","매수인이 지정한 추가기간 안에 매도인이 물품을 인도하지 않거나, 해당 기간 내 의무를 이행하지 않겠다고 명백히 밝힌 때 매수인은 계약을 해제할 수 있다."],"ans":4,"passage":null,"topic":"계약 성립·CISG"},{"id":"60-2-8","subj":2,"no":8,"head":"무역계약의 특성에 관한 설명으로 잘못된 것은?","body":[],"opts":["무역계약은 일정한 채권, 채무 관계의 발생을 목적으로 복수의 당사자 사이에 서로 다른 의사표시를 합치시킴으로써 성립하는 법률행위를 말한다.","국제물품매매의 경우 상이한 국가에 속하는 거래 당사자를 구속하는 통일법이 존재하지 않으므로 정형화된 국제상관습에 준해 계약을 체결, 이행해야 한다.","서류에 의한 상징적 인도가 대부분인 무역거래에서 서류가 물품을 대신하므로 서류의 중요성이 크다.","무역계약의 대상에 불특정물이나 미래의 물품인 선물거래는 포함되지 않는다."],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"60-2-9","subj":2,"no":9,"head":"Vienna Convention(1980)의 청약과 승낙에 관한 설명 중 올바른 것은?","body":[],"opts":["청약은 특정인 앞으로 행해져야 한다. 청약자의 명확한 의사가 없는 불특정 다수에 대한 의사표시는 청약의 유인으로 간주된다.","청약의 효력이 발생한 이후에는 청약자는 어떠한 경우에도 청약을 철회 및 취소할 수 없다.","피청약자의 침묵에 대해 청약자가 계약이 성립된 것으로 간주하고 물품을 발송하면 피청약자는 이를 받아야 한다.","확정청약은 청약서상에 유효기간이 반드시 설정돼야 하고, “확정(firm)” 또는 “취소 불능(irrevocable)”이라는 표현이 있어야만 한다."],"ans":1,"passage":null,"topic":"계약 성립·CISG"},{"id":"60-2-10","subj":2,"no":10,"head":"조건부 청약에 관한 설명으로 잘못된 것은?","body":[],"opts":["재고 잔류 조건부 청약(offer subject to being unsold)은 확정청약으로 추가 생산계획에 따라 성수기에 필요한 물품을 미리 확보해 판매하려고 할 때 활용된다.","반품 허용 조건부 청약(offer on sale or return)은 청약과 함께 물품을 송부하고, 피청약자가 판매하며 미판매분을 반품하는 조건을 포함한다.","점검매매 조건부 청약(offer on approval)은 청약과 함께 견본 등을 피청약자에게 송부해 점검하고, 구매의사에 따라 대금을 지급하거나 반품을 허용하는 내용을 포함한다.","최종 확인 조건부 청약(sub-con offer)은 피청약자의 승낙 이후에 청약자의 최종 확인이 필요한 경우에 활용된다."],"ans":1,"passage":null,"topic":"계약 성립·CISG"},{"id":"60-2-11","subj":2,"no":11,"head":"개별계약 방식과 포괄계약 방식에 관한 설명으로 올바른 것은?","body":[],"opts":["포괄계약 방식은 중장기연불 방식에 의한 수출입 등 거래내용이 복잡할 때 주로 사용된다.","건별로 번번이 체결하는 포괄매매계약에서는 일방 당사자가 해당 시점의 반대청약을 승낙함으로써 계약이 성립된다.","지속적인 거래에서는 일정 기간 내의 모든 매매계약 조건을 약정하는 일반거래조건협정서를 체결하고, 이를 근거로 매수인의 주문이 있을 때마다 매도인이 물품을 인도하는 형태를 취한다.","개별계약 방식은 특정품목을 거래할 때마다 매번 구체적인 거래조건에 합의하는 방식으로 최초 거래나 1회로 끝나지 않고 지속되는 거래에 사용된다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"60-2-12","subj":2,"no":12,"head":"다음에서 설명하는 수출입 거래형태는 무엇인가?","body":["• 사전에 무역계약을 체결하지 않은 상태에서 수입국 내 관리인에게 물품을 무환으로 반출한다.","• 국제물류 촉진을 위해 보세창고에 장치가 필요한 물품으로서 세관장이 인정하는 물품의 경우, 비축에 필요한 기간만큼 장치할 수 있다.","• 매수인이 구매를 결정하면 매도인이 상업송장, B/L 등 선적서류를 발행하고, 이를 근거로 대금결제와 수입통관이 가능하다.","• 매수자 입장에서는 현물 확인 후 구매하므로 비용 절감, 납기 단축 등이 장점이다. • 반입된 물품이 판매되지 않으면 매도인에게 반송이 가능하다."],"opts":["BWT 방식 수출입","연계무역 방식 수출입","임대차 방식 수출입","남북교역 방식 수출입"],"ans":1,"passage":null,"topic":"운송"},{"id":"60-2-13","subj":2,"no":13,"head":"무역계약의 수량조건 중 용적에 관한 설명으로 올바른 것을 모두 고른 것은?","body":["A. CBM(Cubic Meter)=m2이다.","B. 액체는 Liter, Barrel, Gallon 등의 단위를 사용한다.","C. 가로 1ｍ, 세로 1ｍ, 높이 1ｍ인 화물의 용적은 1CBM이다.","D. CBM은 일반적으로 CFS charge 부대비용 산출과 FCL 해상운임 계산에 활용된다."],"opts":["A, B","B, C","C, D","A, D"],"ans":2,"passage":null,"topic":"거래조건"},{"id":"60-2-14","subj":2,"no":14,"head":"무역계약의 품질결정기준 가운데 상표를 활용해 약정할 수 있는 설명으로 올바른 것은?","body":[],"opts":["봉제완구 등의 비규격품은 상표를 기준으로 품질을 결정하고 약정할 수 있다.","곡물 등 1차 산물은 선적 시 내용물의 결함을 확인할 수 없으므로 상표를 기준으로 품질을 결정하고 약정할 수 있다.","Rolex(손목시계)처럼 전 세계적으로 알려져 견본 제공이 불필요한 경우에는 상표로 거래대상물의 규격을 약정할 수 있다.","KS, JIS, ISO 등 국가·공인기관이 설정한 요건을 충족한 물품은 상표를 기준으로 품질을 결정하고 약정할 수 있다."],"ans":3,"passage":null,"topic":"거래조건"},{"id":"60-2-15","subj":2,"no":15,"head":"다음 무역계약서의 일부 조건에 관한 설명으로 잘못된 것은?","body":["Marine Insurance: All shipments shall be covered on All Risks or ICC(A) including War Risks and S.R.C.C. for the invoice amount plus 10 percent by the Seller. All Policies shall be made out in U.S. Dollar and claims payable in New York."],"opts":["모든 선적분은 ICC(A/R) 또는 ICC(A)에 추가해 전쟁 및 동맹파업에 부보해야 한다.","보험가액은 상업송장 금액의 110%이어야 하며, 보험증권에는 미국 달러화로 표시해야 한다.","보험계약의 체결과 보험료의 부담자는 매도인으로 무역거래 조건이 CIF 또는 CIP라는 것을 알 수 있다.","보험계약의 체결지가 불분명하지만, 보험금 청구지는 뉴욕이다."],"ans":2,"passage":null,"topic":"계약 일반"},{"id":"60-2-16","subj":2,"no":16,"head":"무역계약상 수량조건에 관한 설명으로 올바른 것은?","body":[],"opts":["신용장 결제 방식으로 살화물(bulk cargo) 거래를 할 때 계약서의 수량 과부족 조건이 ±3%로 규정되어 있더라도 신용장에서 기본적으로 ±5%가 허용되므로 범위가 큰 쪽인 신용장의 과부족 조건이 적용된다.","계약서에 과부족 범위를 명시적으로 합의한 경우에도, 개수로 수량을 표시할 수 있는 물품은 과부족 조항이 적용되지 않으므로 수출자는 계약수량과 동일하게 물품을 인도해야 한다.","신용장의 중량 앞에 “about” 또는 “approximately”를 사용하는 경우, ±10%의 과부족이 허용되지만 신용장 금액 앞에는 해당 단어를 쓸 수 없으므로 기본적으로 ±5%의 과부족만 허용된다.","매수인이 인수한 물품에 과부족 범위 이내의 과부족이 있으면 매도인은 해당 수량에 대한 금액을 결제할 때 정산해야 한다."],"ans":4,"passage":null,"topic":"거래조건"},{"id":"60-2-17","subj":2,"no":17,"head":"다음은 무역계약의 기본조건은 아니지만, 정식계약서에 포함해 문제가 발생할 때 적용할 수 있는 유용한 조건들에 관한 설명이다. 잘못된 것은?","body":[],"opts":["Entire agreement는 해당 계약서가 당사자의 합의를 전부 표시하고 있는 유일한 합의서이며, 그 이외의 내용은 인정할 수 없다는 완전합의조항이다.","Limitation of liability clause는 계약위반에 따른 직접적 손해만 배상을 청구할 수 있을 뿐이고, 기업 명성 등에 입은 피해를 주장하며 완전한 배상을 요구할 수 없다는 책임제한조항이다.","Severability clause는 계약 내용의 일부가 어떠한 사유로 실효 또는 무효가 되더라도 문제의 조항이 아닌 것들은 유효하다는 분리가능조항이다.","Hardship clause는 상대방의 계약불이행에 대비하여 청구할 손해배상액을 미리 계약서에 명시해 약정된 금액까지만 청구할 수 있다는 손해배상액 예정조항이다."],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"60-2-18","subj":2,"no":18,"head":"다음에서 설명하는 클레임은 무엇인가?","body":["• 평소에는 클레임 대상이 안 되지만 시장 상황이 나빠진 경우에 경미한 과실을 빌미로 제기하는 사례가 많다.","• 계약 체결 후 시세 하락으로 손해가 예상될 때 매수인이 제기하는 경우가 있다.","• 당사자가 상당한 주의를 기울여도 사전에 방지할 수 없는 경우도 있다.","• 부당한 클레임이지만 때에 따라 정당한 클레임과 구분이 어렵다.","• 이러한 클레임 예방을 위해 거래 전 철저한 신용조사가 필요하다."],"opts":["Avoidable claim","Market claim","Contractual claim","Claim for monetary compensation"],"ans":2,"passage":null,"topic":"클레임·분쟁"},{"id":"60-2-19","subj":2,"no":19,"head":"무역분쟁 해결에 관한 설명으로 잘못된 것을 모두 고른 것은?","body":["A. 중재합의를 한 경우 조정으로 진행해서는 안 되며, 중재로 분쟁을 해결해야 한다.","B. 양 당사자가 조정을 선택한 경우, 구속력이 있는 조정안에 따라야 한다.","C. 계약서에 중재조항이 있는 경우, 서면 중재합의로 인정되며 중재 개시 전이나 중재 종료 후 일방에 의한 소송 제기는 불가능하다.","D. Vienna Convention(1980)의 체약국들은 체약국 간 사법협정 체결과 상관없이 소송으로 분쟁을 해결하는 경우, 해당 판결은 외국에서 승인 및 집행이 보장된다.","E. New York Convention(1958)의 체약국이 아닌 국가와 중재로 분쟁을 해결하는 경우, 중재판정은 외국에서 강제집행이 제한될 수 있다.","F. 중재합의는 반드시 서면으로 해야 하며 구두합의, 전보, 팩스에 의한 중재합의는 무효가 된다."],"opts":["A, C, D, E","B, C, D, E","B, D, E, F","A, B, D, F"],"ans":4,"passage":null,"topic":"클레임·분쟁"},{"id":"60-2-20","subj":2,"no":20,"head":"분쟁 해결수단(dispute resolution)에 관한 설명 중 잘못된 것은?","body":[],"opts":["중재는 사인인 제3자를 중재인으로 선정해 중재인의 결정에 따라 당사자끼리 합의해 분쟁을 해결하는 제도이며, 국내 상설 법정 중재기관은 대한상사중재원이다.","소송과 중재를 위해서는 당사자 사이에 소송 또는 중재에 대한 합의가 있어야 한다.","중재는 절차의 비공개 원칙이 있으므로 소송에 비해 기업의 영업비밀이 보호되고, 기업 신용도의 하락을 방지할 수 있다.","중재판정은 국내적 효력 외에 뉴욕협약에 가입한 체약국 사이에 외국 중재판정의 상호 승인 및 강제집행도 보장된다."],"ans":2,"passage":null,"topic":"클레임·분쟁"},{"id":"60-2-21","subj":2,"no":21,"head":"Incoterms 2020에서 규정하고 있는 개별 조건별 사용 방법으로 가장 올바른 것은?","body":[],"opts":["화물 인도장소인 매도인의 공장에서 매수인이 지정한 운송인의 트럭에 매도인의 책임으로 화물을 적재하려는 경우, ‘EXW loaded’ 규칙을 사용한다.","매도인이 운송비를 부담하지만 수입국의 항만 적체가 심해 demurrage 등 추가 물류비 발생이 예상되는 경우, 매도인은 해당 비용을 매수인이 부담하는 CPT 또는 CIP 규칙으로 계약을 체결하는 것이 유리하다.","‘FCA 수출국 port’로 계약을 체결한 경우, 운송인의 지시에 따라 지정된 수출국 항구에 화물을 입고한 후 본선 적재 전 화물에 발생한 화재에 대해서 매도인이 책임져야 한다.","‘FOB Incheon airport’로 계약을 체결한 경우, 지정된 항공기에 선적되기 전에 발생하는 모든 위험과 비용은 매도인이 부담해야 한다."],"ans":2,"passage":null,"topic":"인코텀즈"},{"id":"60-2-22","subj":2,"no":22,"head":"Vienna Convention(1980)이 준거법으로 적용될 수 있는 계약이 아닌 것은?","body":[],"opts":["한국 본사와 미국 지사(현지법인) 간 자동차부품의 거래 계약","일본 법인과 한국 개인사업자 간 섬유제품의 수출입 계약","가족용으로 해외 온라인 사이트를 통한 태블릿PC 구매 계약","한국의 매도인이 중국 매수인에게 유상으로 견본을 제공하는 계약"],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"60-2-23","subj":2,"no":23,"head":"무역계약을 체결할 때 고려해야 할 결제조건에 관한 설명으로 잘못된 것은?","body":[],"opts":["결제조건에서는 결제시기, 결제방법, 결제수단, 결제통화 등을 매도인과 매수인이 유불리를 따져서 정하게 된다.","결제계약은 매매계약의 한 부분인 결제조건을 실행하기 위해 매도인과 매수인이 은행 등 제3자와 체결하는 종속계약이다.","매도인은 결제조건이 불리하면 가격조건에 반영하고, 위험을 회피하는 헤지(hedge) 수단으로 수출보험, factoring, forfaiting 등을 고려해야 한다.","결제위험 관점에서 매도인에게는 CWO &gt; O/A &gt; L/C &gt; D/P &gt; D/A 순으로 유리하다."],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"60-2-24","subj":2,"no":24,"head":"해상운송에 사용되는 컨테이너에 관한 설명으로 잘못된 것은?","body":[],"opts":["20feet 컨테이너 1개를 1TEU라고 하며, 1TEU에 적재되는 용적은 최대 33CBM, 평균 25CBM이다.","컨테이너 문의 오른쪽 위에 표시되는 tare는 빈 컨테이너 자체의 무게, payload는 컨테이너 안에 실을 수 있는 화물의 무게, max gross는 tare weight와 payload를 합한 총무게를 의미한다.","컨테이너의 장점을 최대로 이용한 컨테이너 운송 방식은 선적항의 CFS에서 목적항의 CFS까지 운송하는 FCL/FCL 방식이다.","표준 컨테이너 규격을 초과하는 중량화물 또는 장척화물 등을 선적하기 위해서는 open top container, flat rack container, side open container 등을 사용한다."],"ans":3,"passage":null,"topic":"운송"},{"id":"60-2-25","subj":2,"no":25,"head":"항만과 내륙컨테이너기지에 관한 설명 중 잘못된 것은?","body":[],"opts":["항만은 해륙운송의 중계지로서 육상운송된 화물의 원활한 선적과 양하를 위한 시설을 갖추고 산업활동이 이루어지고 있는 장소를 의미한다.","우리나라의 항만은 사용목적상 외국과의 무역 및 국내 상거래를 주로 하는 상업항을 비롯해 공업항, 어항, 피난항, 검역항으로 분류된다.","컨테이너 터미널의 하역장비로는 갠트리 크레인, 트랜스퍼 크레인, 스트래들 캐리어, 리치 스태커, 포크리프트 등이 있다.","우리나라 최초의 내륙컨테이너기지는 양산ICD로 부산 시내의 교통난 완화와 컨테이너의 내륙유통구조 개선을 위해 2000년 4월에 개장됐다."],"ans":4,"passage":null,"topic":"운송"},{"id":"60-2-26","subj":2,"no":26,"head":"국제해상운송에 사용되는 운송서류의 비교로 잘못된 것은?","body":["<table><tr><th><\/th><th>비교<\/th><th>Bill of Lading<\/th><th>Sea Waybill<\/th><\/tr><tr><td>A<\/td><td>운송서류의 기능<\/td><td>․ 화물수취증 ․ 운송계약의 증거 ․ 화물 권리증권<\/td><td>․ 화물수취증 ․ 운송계약의 증거<\/td><\/tr><tr><td>B<\/td><td>정당한 수하인<\/td><td>계약에서 지정된 수하인<\/td><td>적정히 배서된 운송서류 소 지인<\/td><\/tr><tr><td>C<\/td><td>화물인도 시 원본 상환 여부<\/td><td>원본 상환 필요<\/td><td>원본 상환 불필요<\/td><\/tr><tr><td>D<\/td><td>수하인 기재 방식<\/td><td>지시식 또는 기명식<\/td><td>기명식<\/td><\/tr><\/table>"],"opts":["A","B","C","D"],"ans":2,"passage":null,"topic":"운송"},{"id":"60-2-27","subj":2,"no":27,"head":"수출입운송 물류비용에 관한 내용 중 올바른 것은?","body":[],"opts":["컨테이너 육상요금 중 20ft 컨테이너 운임은 40피트 운임의 50%이며, 45피트 운임은 40피트 운임의 125%를 적용하고 있다.","해상운임을 선내 하역비 부담에 따라 분류한 Berth term, FIO, FI, FO운임 중에서 수출입화주에게 가장 불리하게 적용되는 것은 FIO운임이다.","특정 국가의 수출 항공화물을 목적지까지 운송할 때 소요되는 항공운임은 노선별로 구분돼 IATA 인가를 받아 공식 발효된다.","수출입통관 수수료는 관세사가 화주로부터 위임받아 통관업무를 수행한 대가로 받는 요금이다. 2024년 9월 현재 수출통관의 경우 FOB 가격의 0.15%, 수입통관은 CIF 가격의 0.2%로서 최저 27,000원에서 최고 950,000원이다."],"ans":3,"passage":null,"topic":"운송"},{"id":"60-2-28","subj":2,"no":28,"head":"해상보험에 대한 설명 중에서 잘못된 것은?","body":[],"opts":["해상보험계약은 보험자가 피보험자에게 계약에 따라 합의한 방법과 범위 안에서 해상손해의 보상을 약속하는 계약이다.","해상보험에는 운송수단인 선박 자체를 보험의 목적물로 하는 선박보험도 포함된다.","보험계약자는 보험료 산정에 영향을 미치는 중요사항에 대해서 보험계약 체결 전까지 고지해야 한다.","보험자의 책임은 당사자 간에 다른 약정이 없으면 최초의 보험료를 지급받은 때로부터 개시된다."],"ans":4,"passage":null,"topic":"해상보험"},{"id":"60-2-29","subj":2,"no":29,"head":"해상보험 조건에 관한 설명으로 잘못된 것은?","body":[],"opts":["ICC(FPA) 조건은 분손부담보약관을 말하는 것으로 전손, 공동해손, 특정분손을 담보범위로 한다.","ICC(WA 3%) 조건은 면책비율(3%)을 초과하는 손해가 나면 전체를 보상하고, 면책비율 이하의 손해가 나면 보상하지 않는다는 소손해 면책조건이다.","ICC(WAIOP) 조건은 면책비율을 적용하지 않고 손해율과 상관없이 작은 분손이라도 보험자가 보상해주는 조건이다.","해상보험에서 보험자의 담보위험과 보상범위는 A/R &gt; WAIOP &gt; WA 3% &gt; FPA &gt; TLO 순으로 크다."],"ans":1,"passage":null,"topic":"해상보험"},{"id":"60-2-30","subj":2,"no":30,"head":"화물별 대표적인 사고의 유형 가운데 보상받을 수 있는 손해가 아닌 것은?","body":[],"opts":["섬유류 – 컨테이너 내부에 발생한 한습(sweat)에 의한 수침손","곡물류 및 사료 – 부족손(shortage) 혹은 한습손과 열손(heating)","금속류 – 녹손(rust) 및 부족손","의약품 – 지연"],"ans":4,"passage":null,"topic":"운송"},{"id":"60-3-1","subj":3,"no":1,"head":"다음은 무역거래의 당사자들이 계약체결 이전 및 과정에 상호교환하는 서신 내용의 일부이다. 이를 당사자 간 서신교환의 흐름에 따라 올바른 순서대로 나열한 것은?","body":["<u>(A)<\/u> We are not in a position to accept your offer of travel bags on these terms. We are sourcing the same quality through another channel at a price well below your quoted price. We trust that you will make every effort to revise your prices.","<u>(B)<\/u> Thank you for your inquiry of October 21, 2024 and we are pleased to offer you firm the following goods, subject to your reply reaching us on or before November 8, 2024.","<u>(C)<\/u> Your name and address were given through the Greater New York Chamber of Commerce as one of the well-known importers handling various travel bags and we are writing to you with a keen desire to open an account with you.","<u>(D)<\/u> We are pleased to accept your offer as specified in our Purchase Note enclosed with this correspondence. We are deeply pleased that the first contract between our two firms was agreed upon so quickly, and we ask that you thoroughly review the material as this transaction is important to both of us."],"opts":["(C) – (B) – (D) – (A)","(C) – (B) – (A) – (D)","(B) – (C) – (A) – (D)","(B) – (D) – (C) - (A)"],"ans":2,"passage":null,"topic":"서신·이메일"},{"id":"60-3-2","subj":3,"no":2,"head":"다음 중 counter offer의 내용으로 가장 적절한 것은?","body":[],"opts":["In response to your offer in the e-mail dated April 20, 2024, we accept the terms as suggested.","We are pleased to offer you the following conditions subject to market fluctuation.","After reviewing the terms and conditions you proposed, we are very glad to accept your offer, except for the shipment period.","Upon considering your terms, we would like to accept your offer and hope that the goods will be shipped without delay."],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-3","subj":3,"no":3,"head":"다음 주문서에 대한 내용으로 올바른 것은?","body":["We are pleased to place the following order with you.","Ÿ Item: Ladies 100% Polyester Golf Gloves (Cat No. WA1002)","Ÿ Quantity: 1,000 dozen","Ÿ Price: USD250/dozen DPU New York port CY","Ÿ Shipment: During December 2023","Ÿ Packing: Each piece wrapped in polybag, 1 doz in a box","Ÿ Payment: At sight under Irrevocable L/C","Ÿ Remark: Certificate of Inspection &amp; Shipment Samples to be sent by airmail prior to shipment. We will instruct our bank to issue upon receipt of your shipment sample."],"opts":["The seller should draw an usance draft on the issuing bank.","The issuing bank will issue an L/C after the seller makes a shipment.","The seller should deliver the goods ready for loading at New York port CY.","The seller may procure insurance up to New York port to cover his/her own risk."],"ans":4,"passage":null,"topic":"신용장·결제"},{"id":"60-3-4","subj":3,"no":4,"head":"Incoterms 2020의 각 조건에서 인도에 대한 설명으로 잘못된 것은?","body":[],"opts":["In EXW, delivery occurs when the seller loads the goods on the collecting vehicle arranged by the buyer at the named place.","In FCA, if the named place is not the seller’s premises, delivery occurs when the goods, having been loaded on the seller’s means of transport, reach the named place.","In CIP, delivery occurs when the seller hands over the goods to the carrier contracted by the seller.","In DDP, delivery occurs when the goods, which are cleared for import, are placed at the buyer’s disposal at the named place of destination."],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-5","subj":3,"no":5,"head":"다음 국제물품매매계약서의 밑줄 친 부분에 해당되는 비용은 어느 것인가?","body":["Art. 4 PRICE","The price indicated in the contract includes any costs which are at the Seller’s charge according to this contract. However, should the Seller bear <u>any costs<\/u> which, according to this contract, are for the Buyer’s account, such sum shall not be considered as have been included in the price."],"opts":["Loading cost under FOB","Loading cost under CFR","Unloading cost under CFR","Unloading cost under DPU"],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-6","subj":3,"no":6,"head":"다음 CISG(1980)의 내용 중 올바른 것은?","body":[],"opts":["Even after the offeree dispatches the acceptance, an offer may be revoked if the revocation reaches the offeree before the acceptance becomes effective.","A reply to an offer which purports to be an acceptance but contains the terms of offer which are partially accepted constitutes an acceptance and concludes a contract.","A reply to an offer purports to be an acceptance but contains different terms which are not material concludes a contract unless the offeror objects to the discrepancy or dispatches a notice to that effect.","A reply to an offer which purports to be an acceptance but contains additions, limitations or other modifications is an invitation to make an offer."],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-7","subj":3,"no":7,"head":"다음 계약과 관련된 매도인과 매수인의 의무 중 올바른 것은?","body":["PURCHASE NOTE","We are pleased to purchase the following goods on the terms and conditions stated below.","Goods: RICE","Price: USD7.00/bag FOB BUSAN","Quantity: 6,000kg","Packing: 30kg in a sound bag","Shipment: During March 2024","Payment: Draft at 30 days under an irrevocable L/C","This contract is subject to the application and interpretation of Incoterms 2020 and UCP 600."],"opts":["The buyer should nominate the vessel on which the seller could load the goods at Busan port.","The seller should procure an insurance for the goods up to Busan port.","The seller should draw a sight draft and present shipping document to the negotiating bank for payment.","The buyer should make a contract for insurance for the goods from Busan port to the place of destination."],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-8","subj":3,"no":8,"head":"다음 계약서의 내용에 따르면 품질결정방법은 무엇인가?","body":["Goods: Goods in business, their unit to be quoted, and their mode of packing shall be stated in the order sheet attached. The Seller shall supply the Buyer with samples free of charge, and the quality of the goods to be shipped should be equal to the sample on which an order is given at the time of arrival.","Prices: Unless otherwise specified, prices shall be quoted in USD on FOB Busan basis.","Payment: The draft shall be drawn under an irrevocable credit at sight, documents attached, for the full invoice amount."],"opts":["Sale by sample","Sale by description","Sale by standard","Sale by grade"],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-9","subj":3,"no":9,"head":"다음 중 계약서의 내용으로 올바른 것은?","body":["Description: Automobile Tube","Price: USD3.43 CIP Auckland, 50,000 units (USD171,500 total)","Shipment: Within two months after receipt of the order","Shipping port: Busan, Korea","Destination: Auckland, New Zealand","Payment: 60 days draft under D/A"],"opts":["The quality of the goods will be determined when the goods arrive in Auckland, New Zealand.","The price of the goods includes the cost of carriage and insurance up to Auckland.","The seller shall bear the risk of loss of or damage to the goods until the goods reach Auckland.","For payment, the issuing bank will open an irrevocable L/C in favor of the seller."],"ans":2,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-10","subj":3,"no":10,"head":"다음 계약 내용에 따른 계약조항이 올바르게 짝지어진 것은?","body":["<table><tr><th>(A)<\/th><th>The seller shall not be responsible for non-performance or late performance of all or part of the contract due to orders, regulations, and/or ordinances by the government, act of God, war, blockade, insurrection, mobilization or due to any other causes or circumstances beyond seller’s control.<\/th><\/tr><tr><td>(B)<\/td><td>If the seller fails to deliver any or all of the products within the time period specified in the Agreement, the buyer shall deduct from the contract price, a sum equivalent to [one(1)%] of the price of the delayed products for each week of delay until to a maximum deduction of [five(5)%] of the price of the delayed products. Once the maximum is reached, the buyer may terminate this agreement.<\/td><\/tr><tr><td>(C)<\/td><td>In the event of avoidance of this contract or rejection of the goods, the seller shall be entitled to resell or otherwise dispose of the goods to the third parties, regardless of the trademark, design, copyright, utility model etc., thereon the buyer shall not raise any objection to such disposition.<\/td><\/tr><\/table>"],"opts":["(A) Force majeure · (B) Liquidated damages · (C) Product release","(A) Late delivery · (B) Liquidated damages · (C) Intellectual property right","(A) Force majeure · (B) Guaranteed compensation · (C) Avoidance of contract","(A) Delayed shipment · (B) Termination of contract · (C) Product release"],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-11","subj":3,"no":11,"head":"다음 국제판매점계약의 내용 해석이 잘못된 것은?","body":["The Supplier shall warrant the Product for a period of [twelve(12) months] from the date of delivery (or the date of installation) of the Product for defects due to materials or workmanship. In the event any defect is found in the Product, the Distributor shall advise the Supplier of such defect which the Supplier shall repair, replace the defective part and/or furnish the replacement part to the Distributor free of charge. If the Distributor desires the defective Product to be replaced, the Supplier shall send a replacement part within [fifteen(15) days] upon notice of such desire by the Distributor."],"opts":["물품의 품질보증기간은 인도일 기준으로 하여 12개월이다.","본 계약에서 공급자의 물품 담보 방법은 무상수리와 교체이다.","판매점계약에서 공급자가 판매점에 대해 물품의 품질로 인한 하자를 담보하는 내용이다.","공급자가 하자물품을 교체하려는 경우, 공급자는 판매점에 15일 이내에 해당 내용을 통지해야 한다."],"ans":4,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-12","subj":3,"no":12,"head":"다음 화환신용장 조건에서 서류 발행자가 부적절해 수리가 거절되는 경우는?","body":["MT700 Issue of a Documentary Credit","42C Draft at: SIGHT","46A Documents required:","+ Commercial Invoice in 3 copies","+ Full set of B/L...","+ Certificate of Quality issued by independent surveyor in triplicate","47A Additional conditions:","+ Third party documents are acceptable(except commercial invoice)"],"opts":["Certificate of Quality issued by the beneficiary","B/L issued by the freight forwarder","Commercial Invoice issued by the beneficiary","Draft drawn by the beneficiary"],"ans":1,"passage":null,"topic":"신용장·결제"},{"id":"60-3-13","subj":3,"no":13,"head":"다음 화환신용장에 관한 설명 중 올바른 것을 모두 고른 것은?","body":["41D / AVAILABLE WITH..BY..: ANY BANK BY NEGOTIATION","46A / DOCUMENT REQUIRED","+ PACKING LIST IN TRIPLICATE","+ FULL SET OF CLEAN ON BOARD OCEAN BILL OF LADING MADE OUT TO OUR ORDER MARKED FREIGHT PREPAID","+ INSURANCE POLICY COVERING INVOICE VALUE PLUS TEN PERCENT WITH INSTITUTE CARGO CLAUSE (A) IN DUPLICATE MARKED PREMIUM PAID","49 / CONFIRMATION: WITHOUT","(A) B/L covering from the departing port to the arriving port will be accepted.","(B) The negotiating bank is nominated and the seller should present documents to the bank nominated.","(C) The seller should procure the insurance with the maximum coverage under the I.C.C. and bear its cost.","(D) The seller is allowed to present the documents to the confirming bank for payment.","(E) All copies of the packing list should be original."],"opts":["(A), (B)","(A), (C)","(B), (C), (D)","(C), (D), (E)"],"ans":2,"passage":null,"topic":"신용장·결제"},{"id":"60-3-14","subj":3,"no":14,"head":"다음 중 UCP 600 제2조 정의조항의 내용으로 올바른 것은?","body":[],"opts":["Credit means an arrangement, which should be named as Letter of Credit, that is irrevocable and constitutes a definite undertaking of the issuing bank to honour a complying presentation.","Honour means to pay at sight if the credit is available by acceptance.","Applicant means the party in whose favour a credit is issued.","Confirming bank means the bank that adds its confirmation to a credit upon the issuing bank’s authorization or request."],"ans":4,"passage":null,"topic":"신용장·결제"},{"id":"60-3-15","subj":3,"no":15,"head":"다음 서신의 내용에 대한 설명으로 올바른 것은?","body":["MT 734 Advice of Refusal","L/C No : AI2024-1256","Bank Ref : No. ACS-240-12","Date : 03/25/2024","Total Amount Claimed : USD200,000","Discrepancies : L/C Expired","We are holding the shipping documents pending receipt of an acceptable waiver from the applicant or until we receive further instructions."],"opts":["The issuing bank is requesting that the beneficiary resubmit the documents.","The issuing bank is informing the negotiating bank that the presented documents have been rejected.","The issuing bank will make a final decision after the negotiating bank corrects the defective documents and submits them to the issuing bank.","The issuing bank is extending the expiry date of L/C to 03/25/2024 because the L/C has been expired."],"ans":2,"passage":null,"topic":"서신·이메일"},{"id":"60-3-16","subj":3,"no":16,"head":"다음 환어음에 대한 설명으로 올바른 것은?","body":["BILL OF EXCHANGE","NO. 240204PU Date. 2024.07.10.","FOR USD58,000 Seoul, Korea","AT XXXXX SIGHT OF THE FIRST BILL OF EXCHANGE","(SECOND OF THE SAME TENOR AND DATE BEING UNPAID)","PAY TO KOREA NATIONAL BANK OR ORDER","THE SUM OF US DOLLARS FIFTY EIGHT THOUSAND ONLY","VALUE RECEIVED AND CHARGE THE SAME TO ACCOUNT OF KITA","DRAWN UNDER TK BANK TOKYO, JAPAN","L/C NO L/C-2024AB-100 DATED 2024.05.10","TO TK BANK, JAPAN","JP International CO., LTD"],"opts":["The payee of this draft is KOREA NATIONAL BANK.","The drawer of this draft is KITA.","The drawee of this draft is JP International.","The L/C(L/C-2024AB-100) was issued by KOREA NATIONAL BANK."],"ans":1,"passage":null,"topic":"신용장·결제"},{"id":"60-3-17","subj":3,"no":17,"head":"다음 화환신용장의 내용에 따라 수리가 가능한 선하증권의 내용으로 잘못된 것은?","body":["50 / APPLICANT: ELLA TRADING","59 / BENEFICIARY: VINCENT INDUSTRY","44C / LATEST DATE OF SHIPMENT: APRIL 30, 2024","45A / Description:","Ladies 100 pct Polyester Knit Jacket (Style No. 1512SD)","46A / DOCUMENT REQUIRED:","+ FULL SET OF CLEAN ON BOARD OCEAN BILL OF LADING","MADE OUT TO OUR ORDER MARKED FREIGHT PREPAID"],"opts":["Shipper : VINCENT INDUSTRY","Consignee : ELLA TRADING","Loaded on Board Date : 24/04/2024","Freight : PAID AT DEPARTURE"],"ans":2,"passage":null,"topic":"신용장·결제"},{"id":"60-3-18","subj":3,"no":18,"head":"AWB의 특성에 관한 설명으로 잘못된 것은?","body":[],"opts":["The AWB serves as a conclusive evidence of the contract between the shipper and the carrier for transporting the goods to the consignee under specified terms and conditions.","The AWB acts as a receipt for the shipper, confirming that the airline has accepted the goods for transport.","The AWB does not serve as a document of title to the goods being transported.","It is generally treated as conclusive evidence of the contract in cases where the AWB has been transferred to a third party in good faith."],"ans":4,"passage":null,"topic":"서신·이메일"},{"id":"60-3-19","subj":3,"no":19,"head":"다음은 영국해상보험법(MIA)에 규정된 추정전손에 대한 내용이다. 빈칸(A～C)에 들어갈용어들이 올바르게 짝지어진 것은?","body":["Where there is a constructive total loss ( A ) may either treat the loss as a partial loss, or abandon the subject-matter insured to ( B ) and treat the loss as if it were ( C )."],"opts":["A the insurer · B the insured · C a general average loss","A the insured · B the insurer · C an actual total loss","A the insurer · B the insured · C a particular charge loss","A the insured · B the insurer · C a particular average loss"],"ans":2,"passage":null,"topic":"운송·보험"},{"id":"60-3-20","subj":3,"no":20,"head":"위 서신의 목적으로 가장 적절한 것은?","body":[],"opts":["To provide a notice about the issuance of the Letter of Credit","To inquire about the price of travel bags","To propose a business relationship for exporting travel bags","To report a problem with a previous order"],"ans":3,"passage":"60-3-20","topic":"서신·이메일"},{"id":"60-3-21","subj":3,"no":21,"head":"위 서신에 대한 회신의 내용으로 적절하지 않은 것은?","body":[],"opts":["We are pleased to consider your offer to import travel bags to Korea.","We have reviewed your company's information and are impressed by your extensive experience in the travel bag industry and your strong connections with Korean manufacturers.","In addition to letters of credit, would you consider other payment terms such as open account or documentary collection?","Please let us know your FOB Busan prices for various quantities and product lines."],"ans":1,"passage":"60-3-20","topic":"서신·이메일"},{"id":"60-3-22","subj":3,"no":22,"head":"위 서신의 내용으로 올바르지 않은 것은?","body":[],"opts":["The primary purpose of this letter is to place an order for cotton goods.","The buyer will pay for the goods by wire transfer(T/T) after the shipment.","The buyer requests appropriate packaging for the shipment.","The buyer needs the goods to be delivered by the end of March."],"ans":2,"passage":"60-3-22","topic":"서신·이메일"},{"id":"60-3-23","subj":3,"no":23,"head":"위 서신의 밑줄 친 부분(A)에 들어가기에 가장 적절한 문장은?","body":[],"opts":["Considering these circumstances, we propose accepting the offer with a 20% price reduction.","We ask you to amend the L/C immediately so that we can execute your order.","We are unable to fulfill the order by the requested delivery date.","We have already instructed Bank of America in New York to establish an irrevocable letter of credit in your favor to cover this purchase."],"ans":4,"passage":"60-3-22","topic":"서신·이메일"},{"id":"60-3-24","subj":3,"no":24,"head":"다음 서신의 내용을 논리 전개에 따라 가장 잘 나열한 것은?","body":["Dear Mr. Lee,","Thank you for your order number 4567-9, dated September 20, for 5,000 pairs of golf shoes.","(A) <u>However, we are prioritizing your order and expect to complete all models by November 29.<\/u>","(B) <u>We are confident that you will be completely satisfied with the quality of the shoes you ordered.<\/u>","(C) <u>As discussed during our meeting with your representative and outlined in the contract's shipping timeline, custom-made models require at least 60 days for delivery.<\/u>","(D) <u>To ensure a smooth shipping process, please provide us with your shipping instructions so we can arrange for immediate delivery.<\/u>","Sincerely,"],"opts":["(A) － (C) － (D) － (B)","(B) － (A) － (C) － (D)","(C) － (A) － (D) － (B)","(D) － (A) － (C) － (B)"],"ans":3,"passage":null,"topic":"서신·이메일"},{"id":"60-3-25","subj":3,"no":25,"head":"다음 서신에서 밑줄 친 (A)∼(D) 중 문맥상 가장 어색한 것은?","body":["Dear Richard,","I was surprised to receive your letter dated November 20 stating that you hadn't received payment for invoice number H931.","(A) <u>On November 2, I instructed my bank, Welsh Co-operative Bank in Swansea, to transfer $919.63 to your account at Barnley's Bank in Cardiff.<\/u>","(B) <u>Since my bank statement confirmed that the funds were withdrawn from my account, I assumed they were successfully credited to your account.<\/u>","(C) <u>It's possible that your bank has not notified you yet<\/u>.","(D) <u>Please check with Welsh Co-operative Bank in Swansea to see if there is any issue with the transfer.<\/u>","If you encounter any problems, please let me know so I can investigate further with our bank.","Sincerely,"],"opts":["(A)","(B)","(C)","(D)"],"ans":4,"passage":null,"topic":"서신·이메일"},{"id":"60-3-26","subj":3,"no":26,"head":"다음 중 문장의 순서가 가장 논리적으로 나열된 것은?.","body":["Dear Sirs,","(A) <u>We expect this business to be feasible and we are willing to proceed if they can meet our requirements.<\/u>","(B) <u>Kyle Textile is interested in establishing a joint venture with us to manufacture fashionable clothes in Kazakhstan<\/u>.","(C) <u>Any information you provide will, of course, be treated with the utmost confidentiality, and we would be pleased to offer a service in return should an opportunity arise in the future<\/u>.","(D) <u>They would like to procure raw and sub-materials from Korea and to take advantage of high-skilled labor here.<\/u>","(E) <u>We are particularly interested in learning about their primary areas of business and, if possible, would appreciate your honest assessment of their activities.<\/u> Please let us know any expenses associated with our request so that we can arrange prompt payment. Thank you for your kind cooperation.","Faithfully yours,"],"opts":["(A) － (B) － (D) － (E) － (C)","(B) － (E) － (C) － (A) － (D)","(B) － (D) － (A) － (E) － (C)","(E) － (D) － (A) － (B) － (C)"],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"60-3-27","subj":3,"no":27,"head":"다음 중 주어진 문장의 영작이 올바르지 않은 것은?","body":[],"opts":["당사가 생산하는 셔츠는 한 색상당 12개 묶음으로 판매합니다. 낱개로는 판매할 수 없음을 유감스럽게 생각합니다. ⇒ The shirts we manufacture are sold by the dozen in single colors. We regret to inform you that we do not sell individual garments.","선적지연이 불가피하기에 L/C(No. 7)의 선적기일을 5월 15일로 연장해주시기 바랍니다. ⇒ Due to the unavoidable delay in shipment, please extend the validity of the letter of credit(No. 7) to May 15th.","“운임 선불”이라는 문구를 “운임 착불”로 대체해 신용장을 수정하도록 은행에 요청 바랍니다. ⇒ Please have your banker amend the L/C by replacing the term “freight prepaid” with “freight collect”.","조만간 상품들을 선적할 것이므로 신용장을 빠른 시일 안에 개설해주실 것을 요청합니다. ⇒ We will soon be ready to ship the goods and, therefore, request that you open a letter of credit as soon as possible to ensure timely shipment"],"ans":2,"passage":null,"topic":"서신·이메일"},{"id":"60-3-28","subj":3,"no":28,"head":"다음 서신에 대한 답신 내용으로 적절하지 않은 것은?","body":["Dear Mr. Richard,","We have received your shipment for order No.516 of 100 units of Infinity laptops, model A246. Unfortunately, we have found that thirty cases out of the 100 have been badly damaged. Among the damaged units, twenty are broken beyond repair. It seems that the damage was due to inadequate packaging and a lack of shock-absorbing material within the packing crates.","As you indicated in our survey report, twenty units of Infinity laptops, model A246, are now unsaleable due to the damage that sustained during shipping. This is the first time such an issue has occurred in our business relationship. We hope that you will give your immediate attention to this matter. We look forward to continuing our positive working relationship.","Sincerely,"],"opts":["Therefore, we request that you ship replacements for the damaged products as soon as possible.","We are sorry for the inconvenience we have caused and kindly ask you to let us know which of the above two solutions is preferable to you.","Regarding this matter, we will try to resolve it as best as we can.","We would like to inform you that all necessary measures have been taken to prevent a recurrence of similar issues."],"ans":1,"passage":null,"topic":"서신·이메일"},{"id":"60-3-29","subj":3,"no":29,"head":"위 서신에서 밑줄 친 부분(A)에 들어가기에 적절하지 않은 문장은?","body":[],"opts":["From the Chamber of Commerce of your city we understand that you are one of the most reliable importers of electric machinery.","We understand from the World Business Directory that your firm is one of the leading dealers in your market.","Through the courtesy of the Consul, we have learned that you are one of the largest firms in your city.","Your name has been recently given to us as a reference by ABC Traders Co., who wants to open an account with us."],"ans":4,"passage":"60-3-29","topic":"서신·이메일"},{"id":"60-3-30","subj":3,"no":30,"head":"위 비즈니스 메일의 제목으로 적절한 것은?","body":[],"opts":["Credit inquiry","Re: Circular Letter","Business proposal","Re: New business partners"],"ans":3,"passage":"60-3-29","topic":"서신·이메일"}],"p":{"60-3-20":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Sirs,","The Greater New York Chamber of Commerce recommended your firm as a reputable importer of travel bags. We are writing to express our interest in establishing a business relationship with you.","As shown in our enclosed catalog, we have been exporting travel bags from Korea for over three decades. Our direct connections with top-tier manufacturers in Korea allow us to offer the lowest market prices and the best possible terms.","We prefer to conduct business using letters of credit. Prices are quoted FOB Busan in U.S. dollars, but we can also provide CIF or delivery prices to any port in your country if needed.","If you are interested in our travel bags, please let us know the terms under which you would be willing to do business.","We look forward to receiving a trial order from you.","Sincerely,"]},"60-3-22":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Sirs,","Thank you for your letter dated June 15, offering us 500 dozen cotton goods. We are pleased to accept your offer as outlined in the attached Purchase Order. We are delighted to have entered into this first contract so quickly. As previously discussed, we require the shipment to arrive at our warehouse no later than the end of March. Given our current inventory levels, timely delivery is of the utmost importance.","Also, please ensure that the goods are carefully packed to prevent any damage during transit. We recommend using sturdy cartons and appropriate cushioning materials.","<u>(A)<\/u>","Please notify us by email once the shipment is complete.","Sincerely,"]},"60-3-29":{"head":"다음 비즈니스 메일의 내용을 읽고 질문에 답하시오.","body":["Gentlemen:","<u>(A)<\/u> . We are therefore, writing to you with a keen desire of opening an account with you.","In introducing ourselves, we are pleased to share that for over thirty years we have been established here as an exporter of electric machinery, and maintaining extensive and close connections with leading manufacturers in this country. We have exported various kinds of electric machine to many countries, gaining a strong reputation for the high quality, prompt delivery and competitive pricing.","As to our standing, please refer to KEB Hana Bank, Seoul. We will be happy to provide any other information you may require upon request.","We look forward to your favorable reply.","Yours very truly,","Gil-Dong Hong","Export Manager"]}}},"61":{"date":"2025.3","q":[{"id":"61-0-1","subj":0,"no":1,"head":"대외무역법령에서 규정하고 있는 용어에 관한 설명으로 잘못된 것은?","body":[],"opts":["수출실적이란 산업통상자원부장관이 정하여 고시하는 기준에 해당하는 수출통관액ㆍ입금액, 가득액(稼得額)과 수출에 제공되는 외화획득용 원료ㆍ기재의 국내공급액을 말한다.","무역에는 대통령령으로 정하는 용역의 수출과 수입이 포함되며, 「부가가치세법 시행령」 제3조에 따른 용역(출판업과 영상ㆍ오디오 기록물 제작 및 배급업을 포함)이 해당한다.","보세판매장에서 외국인에게 국내에서 생산(재생ㆍ개조하는 것 포함)된 물품을 매도하는 것은 수출에 해당한다.","임대수출이란 임대(사용대차를 제외)계약에 의하여 물품 등을 수출하여 일정기간 후 다시 수입하거나 그 기간의 만료 전 또는 만료 후 해당 물품 등의 소유권을 이전하는 수출을 말한다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"61-0-2","subj":0,"no":2,"head":"대외무역법에서 규정한 통상의 진흥에 관한 설명으로 올바른 것은?","body":[],"opts":["산업통상자원부장관은 무역과 통상을 진흥하기 위하여 국제통상 여건의 분석과 전망 및 기업의 해외 진출 지원 방안 등을 포함하여 반기별로 다음 반기의 통상진흥 시책을 세워야 한다.","전년도 수출실적 또는 직전 3개 연도의 연평균 수출실적이 미화 100만달러 이상인 자는 전문무역상사로 지정받을 수 있다.","산업통상자원부장관은 기업의 해외 진출과 관련된 상담ㆍ안내ㆍ홍보ㆍ조사 및 지원 업무를 종합적으로 수행하기 위하여 시군구에 해외진출지원센터를 둔다.","산업통상자원부장관은 종합무역상사를 통한 신시장의 개척, 신제품의 발굴 및 중소기업의 수출 확대 등을 위하여 필요하다고 인정되는 경우에는 종합무역상사의 국내외 홍보, 우수제품의 발굴, 해외 판로개척 등에 필요한 사항을 지원할 수 있다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"61-0-3","subj":0,"no":3,"head":"대외무역법에 따른 수출입 승인에 관한 설명으로 잘못된 것은?","body":[],"opts":["수출입 승인의 유효기간은 통상 1년이다.","수출입 승인을 받은 자가 물품 등의 수량이나 가격을 변경하려면 변경 승인을 받아야 한다.","수출입 승인의 변경 신고는 당초 승인한 기관의 장에게 변경 신고를 해야 한다.","하나의 수출입에 대해서는 둘 이상의 승인을 받아야 하는 경우더라도 하나의 승인만 받으면 된다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"61-0-4","subj":0,"no":4,"head":"대외무역법에서 규정하는 수출실적의 인정 금액에 관한 설명으로 올바른 것은?","body":[],"opts":["중계무역에 의한 수출의 경우에는 수출금액(CIF가격)에서 수입금액(FOB가격)을 공제한 가득액으로 한다.","위탁가공된 물품을 외국에 판매하는 경우는 외국환은행의 입금액으로 한다.","전자적 형태 무체물의 수출은 한국무역협회장 등이 외국환은행을 통해 입금을 확인한 금액으로 한다.","원양 어로에 의한 수출 중 현지 경비사용분은 수출실적으로 인정되지 않는다."],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"61-0-5","subj":0,"no":5,"head":"대외무역법에서 규정하는 외화획득용 원료ㆍ기재의 수입 승인에 관한 설명으로 잘못된 것은?","body":[],"opts":["외화획득용 원료의 기준 소요량을 정하는 경우는 생산 공정에서 생기는 평균 손실량은 제외해야 한다.","무역거래자가 외국의 수입업자로부터 수수료를 받고 행한 수출 알선은 외화획득 행위에 준하는 것으로 본다.","외화획득용 원료를 수입한 자가 직접 외화획득의 이행을 하는 경우의 이행 기간은 통상 수입통관일 또는 공급일로부터 2년으로 한다.","품목별 외화획득 이행 의무의 미이행률이 10퍼센트 이하인 경우, 사후 관리를 하지 않을 수 있다."],"ans":1,"passage":null,"topic":"대외무역법"},{"id":"61-0-6","subj":0,"no":6,"head":"대외무역법령에서 규정하고 있는 전략물자의 수출입에 관한 설명으로 잘못된 것은?","body":[],"opts":["산업통상자원부장관은 수출허가, 상황허가, 경유 또는 환적허가 및 중개허가 신청을 받으면 허가기준에 따라 심사하여 해당 허가를 할 수 있으며, 조건을 붙여 해당 허가를 할 수 있다.","전략물자에는 해당되지 아니하나 대량파괴무기 등의 제조ㆍ개발ㆍ사용 또는 보관 등의 용도로 이용 또는 전용될 가능성이 높은 물품 등을 수출하려는 자 또는 수출신고하려는 자는 수입자나 최종사용자 등이 이를 대량파괴무기 등의 제조ㆍ개발ㆍ사용 또는 보관 등의 용도로 이용 또는 전용할 의도가 있음을 알았거나 그러한 의도가 있다고 의심되면 상황허가를 받아야 한다.","물품 등을 수출, 수출신고, 경유, 환적 또는 중개하려는 자로서 산업통상자원부장관이 고시하는 교육을 이수한 자는 해당 물품 등이 전략물자인지 또는 상황허가 대상 물품 등인지를 스스로 확인하기 위하여 자가판정을 할 수 있다.","산업통상자원부장관은 자율준수무역거래자에게 대통령령으로 정하는 바에 따라 전략물자에 대한 수출입관리 업무의 전부를 자율적으로 관리하게 할 수 있다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"61-0-7","subj":0,"no":7,"head":"대외무역법령에서 규정하고 있는 전략물자의 수출허가에 관한 설명으로 올바른 것은?","body":[],"opts":["무역거래자는 전략물자 등을 수출, 수출신고한 자의 경우 수출허가에 관한 서류를 1년간 보관하여야 한다.","산업통상자원부장관 또는 관계 행정기관의 장은 수출허가를 받지 아니하고 전략물자를 수출하거나 수출신고한 자에게 1년 이내의 범위에서 일정 기간 동안 전략물자 등의 전부 또는 일부의 수출을 제한할 수 있다.","전략물자 수출허가의 유효기간은 5년이며, 전략기술의 수출 등의 경우에는 유효기간을 달리 정할 수 있다.","선박 또는 항공기의 안전운항을 위하여 긴급 수리용으로 사용되는 기계, 기구 또는 부분품 등을 수출하는 경우 수출허가 또는 상황허가를 면제한다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"61-0-8","subj":0,"no":8,"head":"우리나라의 대외무역법령에서 규정하고 있는 원산지의 표시 등에 관한 설명 중 올바르지 않은 것은?","body":[],"opts":["산업통상자원부장관 또는 시·도지사는 원산지의 표시 위반에 대한 시정명령에 따라 과징금을 부과하려면 그 위반행위의 종류와 과징금의 금액을 명시하여 과징금을 낼 것을 서면으로 알려야 한다.","산업통상자원부장관 또는 시·도지사는 과징금의 금액이 1천만원 이상이거나 중소기업인 경우에는 과징금의 납부기한을 연기하거나 분할 납부하게 할 수 있다. 분할납부를 하게 하는 경우 각 분할된 납부기한 간의 간격은 3개월을 초과할 수 없으며, 분할 횟수는 3회를 초과할 수 없다.","산업통상자원부장관 또는 시·도지사는 무역거래자 등의 수출입 규모, 중소기업 여부, 위반 정도 및 위반 횟수 등을 고려하여 과징금 금액의 2분의 1의 범위에서 가중하거나 경감할 수 있다.","산업통상자원부장관 또는 시·도지사는 원산지의 표시 위반에 대한 시정명령 등을 위반한 자에게 3억원 이하의 과징금을 부과할 수 있다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"61-0-9","subj":0,"no":9,"head":"대외무역법령에서 규정하고 있는 수입수량제한조치에 관한 설명으로 올바른 것은?","body":[],"opts":["산업통상자원부장관이 수입수량을 제한하는 경우 그 제한수량은 기준수량 이상으로 하여야 하며, 해당 산업의 심각한 피해를 방지하거나 구제하기 어렵다고 명백하게 인정되는 경우에도 기준수량 미만으로 수입수량을 제한할 수 없다.","무역위원회의 건의가 있고 필요하다고 인정하면 수입수량제한조치의 내용을 변경할 수 있으며, 해당 산업의 피해 구제를 위해 필요한 경우에 변경 조치 내용은 최초 조치 내용보다 강화될 수 있다.","수입수량제한조치는 조치 시행일 이후 수입되는 물품에만 적용하며, 적용 기간은 2년을 넘어서는 아니 된다.","산업통상자원부장관은 수입수량제한조치의 대상이었던 물품에 대하여는 그 수입수량제한조치의 적용기간이 끝난 날부터 그 적용 기간에 해당하는 기간(적용기간이 2년 미만인 경우에는 2년)이 지나기 전까지는 다시 수입수량제한조치를 시행할 수 없다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"61-0-10","subj":0,"no":10,"head":"다음 중 대외무역법령에 따라 산업통상자원부장관이 수출입 질서유지와 관련하여 취할 수 있는 조치로 잘못된 것은?","body":[],"opts":["선적 전 검사기관은 선적 전 검사가 기업의 수출에 대한 무역장벽으로 작용하도록 해서는 안되며, 산업통상자원부장관은 선적 전 검사와 관련하여 수출자와 선적전 검사기관 간에 분쟁이 발생하였을 경우에는 그 해결을 위하여 필요한 조정(調整)을 할 수 있다.","산업통상자원부장관은 조정신청을 받은 때에는 15일 이내에 조정 사건의 표시, 조정의 일시 및 장소, 당사자의 성명 또는 명칭, 조정안의 주요 내용을 포함한 조정안을 작성하여 당사자에게 제시하여야 한다.","산업통상자원부장관은 조정안이 작성된 경우에는 당사자에게 알려야 하며, 조정안을 통지받은 분쟁 당사자는 7일 이내에 조정안에 대한 수락 여부를 서면으로 산업통상자원부장관에게 알려야 한다.","산업통상자원부장관은 당사자 간에 합의가 이루어지거나 조정안이 수락된 경우, 조정신청인이나 당사자가 조정신청을 철회한 경우, 당사자가 조정안을 거부하는 경우에는 해당 조정 사건을 끝낼 수 있다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"61-0-11","subj":0,"no":11,"head":"대외무역법령에서 산업통상자원부장관이 무역거래자에게 수출하는 물품 등의 가격, 수량, 품질, 그 밖에 거래조건 또는 그 대상지역 등에 관하여 필요한 조정을 명할 수 있는 경우에 해당하는 것을 모두 기재한 것은?","body":["A. 우리나라 또는 교역상대국의 관련 법령에 위반되는 경우","B. 물품 등의 수출과 관련하여 부당하게 다른 무역거래자의 상대방에 대하여 다른 무역거래자와 거래하지 아니하도록 유인하거나 강제하는 경우","C. 물품 등의 수출과 관련하여 부당하게 다른 무역거래자의 해외에서의 사업활동을 방해하는 경우","D. 헌법에 따라 체결ㆍ공포된 조약과 일반적으로 승인된 국제법규에 따른 의무 이행을 위하여 필요한 경우","E. 국제평화와 안전유지를 위한 국제공조에 따른 교역여건의 급변으로 교역상대국과의 무역에 관한 중대한 차질이 생기거나 생길 우려가 있는 경우"],"opts":["A, B, C, D","A, C, D, E","A, B, D, E","B, C, D, E"],"ans":1,"passage":null,"topic":"대외무역법"},{"id":"61-0-12","subj":0,"no":12,"head":"대외무역법령상 구매확인서와 내국신용장에 관한 설명으로 올바른 것은?","body":[],"opts":["구매확인서를 받고 수출자에게 수출용 물품을 공급하면 부가가치세법상 면세 적용이 가능하다.","내국신용장이란 한국은행총재가 정하는 바에 따라 외국환은행의 장이 발급하여 국내 및 외국에서 통용되는 신용장을 말한다.","구매확인서를 발급한 후 신청 첨부서류의 외화획득용 원료ㆍ기재의 내용 변경 등으로 이미 발급받은 구매확인서와 내용이 상이하여 재발급을 요청하는 경우에는 새로운 구매확인서를 발급할 수 있다.","구매확인서를 받고 수출자에게 수출용 물품을 공급한 공급자는 한국무역협회장으로부터 수출실적을 인정받을 수 있으며 증명서를 발급받을 수 있다."],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"61-0-13","subj":0,"no":13,"head":"우리나라의 관세법령에서 규정하고 있는 품목분류 사전심사에 관한 설명 중 잘못된 것은?","body":[],"opts":["물품을 수출입하려는 자는 수출입신고를 하기 전에 관세청장에게 품목분류를 미리 심사하여 줄 것을 신청할 수 있다.","관세청장은 사전심사를 신청한 품목과 관련하여 소송이 진행 중인 경우에는 해당 신청을 반려할 수 있다.","관세청장은 사전심사를 위하여 해당 물품에 대한 구성재료의 물리적ㆍ화학적 분석이 필요한 경우에는 해당 심사를 신청한 자에게 수수료를 납부하게 할 수 있다.","관세청장은 사전심사 신청을 받은 경우 해당 물품에 적용될 품목분류를 심사하여 신청을 받은 날부터 7일 이내에 그 결과를 신청인에게 통지하여야 한다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"61-0-14","subj":0,"no":14,"head":"우리나라의 관세법령에서 규정하고 있는 외국물품과 내국물품에 관한 설명 중 올바른 것은?","body":[],"opts":["우리나라의 선박이 외국의 영해에서 포획한 수산물은 내국물품에 해당한다.","수출신고가 된 물품은 외국물품에 해당한다.","입항전수입신고가 수리된 물품은 내국물품에 해당한다.","외국으로부터 우리나라에 도착한 물품으로서 수입신고가 된 물품은 내국물품에 해당한다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"61-0-15","subj":0,"no":15,"head":"관세법상 내국세 등의 부과ㆍ징수에 관한 설명으로 잘못된 것은?","body":[],"opts":["수입물품에 대하여 세관장이 부과ㆍ징수하는 내국세 등(가산세 및 강제징수비 제외)의 부과ㆍ징수ㆍ환급 등에 관하여 개별 내국세 규정과 관세법의 규정이 상충되는 경우에는 관세법의 규정을 우선하여 적용한다.","수입물품에 대하여 세관장이 부과ㆍ징수하는 내국세 등에 대한 담보제공 요구, 담보금액 등에 관하여는 관세법 중 관세에 대한 담보 관련 규정을 적용한다.","수입물품에 대하여 세관장이 부과ㆍ징수하는 내국세 등의 체납이 발생하였을 때에는 징수의 효율성 등을 고려하여 필요하다고 인정되는 경우에는 관할지 세무서장이 체납세액을 징수할 수 있다.","관세법에 따른 이의신청·심사청구·심판청구 또는 행정소송이 계류 중인 경우에는 체납된 내국세 등을 세무서장이 징수하게 할 수 없다."],"ans":1,"passage":null,"topic":"관세법"},{"id":"61-0-16","subj":0,"no":16,"head":"관세법상 관세를 부과하는 기준인 과세요건에 대한 설명으로 올바른 것은?","body":[],"opts":["관세의 4대 과세요건은 과세물건, 납세의무자, 과세표준, 과세환율이다.","관세는 수입신고(입항전수입신고 제외)를 하는 때의 물품의 성질과 그 수량에 따라 부과한다.","수입신고 전 즉시반출신고를 하고 반출한 물품은 수입신고 전 즉시반출신고를 한 때의 물품의 성질과 그 수량에 따라 관세를 부과한다.","관세의 과세표준은 수입물품의 가격이며, 수입물품의 가격을 표준으로 하여 세액을 결정하는 것을 종량세라고 한다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"61-0-17","subj":0,"no":17,"head":"우리나라의 관세법령에서 규정하고 있는 납세의무의 소멸 등에 관한 내용으로 잘못된 것은?","body":[],"opts":["관세를 납부하거나 관세부과가 취소된 때에는 관세를 납부해야 하는 의무가 소멸한다.","5억원 이상의 관세(내국세 포함)에 대한 관세 징수권은 이를 행사할 수 있는 날부터 10년 동안 행사하지 아니하면 소멸시효가 완성된다.","관세징수권의 소멸시효는 관세의 분할납부기간 중에는 진행하지 않는다.","납세자의 관세 환급청구권에 대해서는 소멸시효가 규정되어 있지 않다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"61-0-18","subj":0,"no":18,"head":"관세법령에서 규정하고 있는 잠정가격신고 및 확정가격신고에 관한 설명으로 잘못된 것은?","body":[],"opts":["거래관행상 거래가 성립된 때부터 일정기간이 지난 후 가격이 정하여지는 것으로, 수입신고일 현재 그 가격이 정하여지지 아니한 모든 물품은 잠정가격신고를 할 수 있다.","잠정가격으로 가격신고를 한 자는 2년의 범위 안에서 구매자와 판매자 간의 거래계약의 내용 등을 고려하여 세관장이 지정하는 기간 내에 확정된 가격을 신고하여야 한다.","세관장은 확정가격신고를 받은 경우 잠정가격을 기초로 신고납부한 세액과 확정된 가격에 따른 세액의 차액을 징수하거나 환급하여야 한다.","잠정가격을 기초로 신고납부한 세액과 확정가격에 의한 세액과의 차액을 환급하는 때에는 관세환급 가산금을 지급하지 않는다."],"ans":1,"passage":null,"topic":"관세법"},{"id":"61-0-19","subj":0,"no":19,"head":"우리나라 관세법령상 구매자가 지급하였거나 지급하여야 할 금액에서 다음에 해당 하는 금액을 명백히 구분할 수 있을 때에는 그 금액을 뺀 금액이 실제 지급가격이된다. 공제요소에 대한 설명으로 잘못된 것은?","body":[],"opts":["연불조건(延拂條件)의 수입인 경우에는 해당 수입물품에 대한 연불이자","수입항에 도착하기 전 해당 수입 물품을 운송하는 데에 필요한 보험료","수입 후 해당 수입 물품의 정비, 유지에 필요한 비용","우리나라에서 해당 수입 물품에 부과된 관세"],"ans":2,"passage":null,"topic":"관세법"},{"id":"61-0-20","subj":0,"no":20,"head":"다음 상황에서 납세의무자가 관세를 납부해야 하는 기한으로 올바른 것은?","body":["납세의무자 A는 세관장으로부터 24년 12월 17일에 신고납부한 세액이 부족하므로 보정기간 내 보정 신청을 할 것을 25년 1월 10일자로 통지받았다. 이에 따라 납세의무자 A는 25년 1월 15일에 부족한 세액에 대한 세액의 보정을 세관장에게 신청하였다.","<table><tr><th>금<\/th><th>토<\/th><th>일<\/th><th>월<\/th><th>화<\/th><th>수<\/th><th>목<\/th><\/tr><tr><td>25-01-10<\/td><td>25-01-11<\/td><td>25-01-12<\/td><td>25-01-13<\/td><td>25-01-14<\/td><td>25-01-15<\/td><td>25-01-16<\/td><\/tr><\/table>"],"opts":["2025년 1월 16일","2025년 1월 15일","2025년 1월 13일","2025년 1월 14일"],"ans":1,"passage":null,"topic":"관세법"},{"id":"61-0-21","subj":0,"no":21,"head":"우리나라의 관세법령에서 규정하고 있는 관세율의 종류에 대한 설명으로 잘못된 것은?","body":[],"opts":["교역상대국이 우리나라의 수출물품 등에 대하여 관세 또는 무역에 관한 국제협정이나 양자 간의 협정 등에 규정된 우리나라의 권익을 부인하거나 제한하는 경우 보복관세를 부과할 수 있다.","상계관세의 부과대상과 관련하여 보조금 등이란 정부·공공기관 등의 재정지원 등에 의한 혜택 중 특정성이 있는 것을 말한다.","긴급관세는 해당 국내산업의 보호 필요성, 국제통상관계, 긴급관세 부과에 따른 보상 수준 및 국민경제 전반에 미치는 영향 등을 검토하여 부과 여부와 그 내용을 결정한다.","산업구조의 변동 등으로 물품 간의 세율 불균형이 심하여 이를 시정할 필요가 있는 경우, 공중도덕 보호, 인간·동물·식물의 생명 및 건강 보호, 환경보전, 한정된 천연자원 보존 및 국제평화와 안전보장 등을 위하여 필요한 경우에는 할당관세를 부과할 수 있다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"61-0-22","subj":0,"no":22,"head":"다음 상황에서 납부해야 하는 관세로 올바른 것은? (단, 모든 가격은 객관적이고 수량화할 수 있는 자료에 근거하는 것으로 가정한다.)","body":["- 수입물품 가격 : 10,000,000원","- 수입물품 가격에 포함된 한국에 도착한 후 발생한 설치비용 : 1,000,000원","- 수입물품 가격에 포함된 연불이자 : 500,000원","- 수입물품 가격에 포함되지 않은 한국에 도착할 때까지 발생한 보험료 : 50,000원 - 기본관세율 : 10%"],"opts":["1,000,000원","905,000원","855,000원","850,000원"],"ans":3,"passage":null,"topic":"관세법"},{"id":"61-0-23","subj":0,"no":23,"head":"다음의 물품을 수입할 때 적용할 수 있는 감면제도로 올바르게 짝지어진 것은?","body":["A. 수입 물품의 포장 용품으로 수입 후 1년 내에 다시 수출하는 물품","B. 정보처리기술을 응용한 공장 자동화 기계로 국내에서 제작하기 곤란한 물품","C. 수출 물품의 용기로서 다시 수입하는 물품"],"opts":["A : 재수입면세 B : 세율불균형물품의면세 C : 재수출면세","A : 재수출면세 B : 환경오염방지물품등에대한감면 C : 재수입면세","A : 재수출면세 B : 특정물품의면세 C : 재수입면세","A : 재수입면세 B : 학술연구용품의감면 C : 재수출면세"],"ans":2,"passage":null,"topic":"관세법"},{"id":"61-0-24","subj":0,"no":24,"head":"( ) 안에 들어갈 용어로 올바르게 짝지어진 것은?","body":["- 보세구역은 지정보세구역·특허보세구역 및 ( A )으로 구분하고,","- 지정보세구역은 지정장치장 및 ( B )으로 구분하며,","- 특허보세구역은 보세창고 · ( C ) · 보세전시장 · 보세공장 및 보세판매장으로 구분된다."],"opts":["A : 자유무역지역 B : 세관검사장 C : 보세건설장","A : 종합보세구역 B : 자율장치장 C : 보세반송장","A : 종합보세구역 B : 세관검사장 C : 보세건설장","A : 자유무역지역 B : 자율장치장 C : 보세반송장"],"ans":3,"passage":null,"topic":"관세법"},{"id":"61-0-25","subj":0,"no":25,"head":"다음 기사와 같이 원산지 위반 사례가 급증하고 있다. 다음 중 대한민국을 원산지로 볼 수 있는 것은?","body":["“중국산을 한국산으로…관세청, ‘라벨갈이’ 5년간 ‘1조원’ 적발”","- 지난해 일명 ‘라벨갈이’로 원산지를 바꿔치기하는 등 원산지표시 위반으로 적발된 물품이 5년 새 최대치를 기록했다.","- 출처 : 세정일보(24.10.22)"],"opts":["중국산 자동차와 함께 수입된 여분의 타이어","일본 국적의 선박에 의해서 대한민국 영해에서 채집 또는 포획한 어획물","대한민국 보세구역에 장치 중인 물품 중에 보존을 위하여 필요한 작업을 한 물품","대한민국 공장에서 당해 물품의 생산과정에 사용된 물품의 품목분류 상 6단위 품목번호와 다른 6단위 품목번호로 분류되는 물품으로 최종적으로 생산된 물품"],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"61-0-26","subj":0,"no":26,"head":"다음 설명하는 거래에서 해당 기업의 관세환급 방법에 대해 올바르게 짝지어진 것은?","body":["A. ㈜알파는 베트남에서 수입한 물품을 추가 가공하지 않고 그대로 일본에 수출하고 있다.","B. 중소기업 ㈜베타는 국내에서 구매한 원재료를 이용하여 마스크팩을 만들어 중국으로 수출하고 있다. (직전 2년간 매년도 환급실적은 7억원)","C. 대기업 ㈜감마는 중국산 원재료 및 국산 원재료로 TV모니터를 생산한 후 베트남에 수출하고 있다."],"opts":["A : 위약환급 B : 개별환급 C : 간이정액환급","A : 위약환급 B : 간이정액환급 C : 개별환급","A : 원상태환급 B : 간이정액환급 C : 개별환급","A : 원상태환급 B : 개별환급 C : 간이정액환급"],"ans":3,"passage":null,"topic":"관세환급"},{"id":"61-0-27","subj":0,"no":27,"head":"다음 ( ) 안에 들어갈 숫자 및 용어로 올바르게 짝지어진 것은?","body":["가. 관세 등을 환급받으려는 자는 물품이 수출 등에 제공된 날부터 ( A )년 이내에 관세청장이 지정한 세관에 환급신청을 해야 한다.","나. 세관장은 물품이 수출 등에 제공된 경우에는 수출신고를 수리한 날이 속하는 달의 ( B )부터 소급하여 ( C )년 이내에 수입된 해당 물품의 수출용 원재료에 대한 관세 등을 환급한다.","다. 환급신청일이 속하는 연도의 직전 2년간 매년도 환급실적(기초원재료납세증명서상의 발급금액을 포함)이 ( D )억원 이하인 중소기업은 간이정액환급을 신청할 수 있다."],"opts":["A : 5 B : 말일 C : 2 D : ８","A : 3 B : 말일 C : 1 D : ５","A : 5 B : 첫날 C : 2 D : ８","A : 3 B : 첫날 C : 1 D : ５"],"ans":1,"passage":null,"topic":"관세환급"},{"id":"61-0-28","subj":0,"no":28,"head":"자유무역협정(FTA) 관세법상 원산지증명서류에 관한 설명으로 잘못된 것은?","body":[],"opts":["원산지포괄증명이란 장기간에 걸쳐 반복적으로 선적되거나 수입신고 되는 동종 동질의 물품에 대하여 각 협정에서 정하는 기간 동안 최초의 원산지증명서를 반복하여 사용하는 것을 말한다.","원산지증명서 발급을 신청하려는 자는 수출물품의 수출통관이 완료되기 전까지 원산지증명서 발급신청서에 서류를 첨부하여 증명서 발급기관에 제출해야 한다.","수출물품의 생산에 사용되는 재료 또는 최종물품 생산자 등은 생산자 또는 수출자의 요청이 있는 경우 원산지확인서를 생산자 또는 수출자에게 제공할 수 있다.","수입자·수출자 및 생산자는 협정 및 FTA 관세법에 따른 원산지의 확인, 협정관세의 적용 등에 필요한 것으로서 원산지증빙서류 등을 5년의 범위에서 대통령령으로 정하는 기간(협정에서 정한 기간이 5년을 초과하는 경우에는 그 기간) 동안 보관하여야 한다."],"ans":2,"passage":null,"topic":"FTA·원산지"},{"id":"61-0-29","subj":0,"no":29,"head":"자유무역협정(FTA) 관세법상 원산지인증수출자에 관한 설명으로 잘못된 것은?","body":[],"opts":["원산지인증수출자는 품목별 인증수출자와 업체별 인증수출자가 있으며, 해당 물품에 대하여 자율적으로 원산지를 증명할 수 있으며, 원산지증명에 관해 간소한 절차를 적용받을 수 있다.","품목별 원산지인증수출자로 인증받으려는 자는 원산지인증 신청 품목(HS 4단위 기준)별 원산지소명서 등을 제출하여야 한다.","관세청장 또는 세관장은 원산지인증수출자가 원산지 증명능력 등 요건을 충족하지 못하게 된 경우에는 그 인증을 취소할 수 있다.","품목별 원산지인증수출자의 인증 유효기간은 인증을 받은 날부터 5년으로 한다."],"ans":2,"passage":null,"topic":"FTA·원산지"},{"id":"61-0-30","subj":0,"no":30,"head":"관세환급특례법상 수출물품 생산에 투입되어 소요량을 객관적으로 계산할 수 있는 원재료 중 관세를 환급받을 수 없는 것은?","body":[],"opts":["해당 수출물품의 포장용품","해당 수출물품 생산용 기계ㆍ기구 등의 작동 및 유지를 위한 물품 등 수출물품의 생산에 간접적으로 투입되어 소모되는 물품","해당 수출물품에 물리적으로 결합되는 물품","해당 수출물품에 화학적으로 결합되는 물품"],"ans":2,"passage":null,"topic":"관세환급"},{"id":"61-1-1","subj":1,"no":1,"head":"㈜KITA는 중국의 수출기업과 다음과 같은 대금결제 조건으로 가전제품의 수입 계약을 체결하였다. 이 수입 계약과 관련된 설명으로 가장 잘못된 것은?","body":["Payment Terms : by T/T in advance."],"opts":["㈜KITA는 신용장방식에 비해 상업위험이 높은 대금결제 조건을 선택했다.","㈜KITA는 신용장방식에 비해 은행수수료를 절감할 수 있는 대금결제 조건을 선택했다.","㈜KITA는 중국 수출기업의 선적서류를 은행을 통해 송부받는 것이 원칙이다.","이 수입계약의 결제방식은 일반적으로 판매자 우위 시장(seller’s market)에서 발생한다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"61-1-2","subj":1,"no":2,"head":"O/A 결제방식에 대한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 다른 조건이 동일하다면, 수입자는 CWO방식 보다는 O/A방식을 선호한다.","B. 국내 수출자는 O/A Nego를 통해 수출대금을 조기에 현금화할 수 있다.","C. O/A 결제방식은 수출자가 상업위험을 부담하게 된다.","D. 수입자가 물품을 인수하는 시점에 수출자의 채권이 발생한다."],"opts":["A, B","B, C","C, D","A, B, C, D"],"ans":1,"passage":null,"topic":"송금·추심·어음"},{"id":"61-1-3","subj":1,"no":3,"head":"우리나라 은행의 거래 관행을 고려할 때 가장 합리적으로 배열된 O/A 거래 절차는?","body":["A. 수출자와 수입자가 결제조건으로 O/A 결제가 포함된 매매계약을 체결한다.","B. 수출자가 수입자에게 선적서류를 송부하고, 거래은행에 선적 사실을 통지한다.","C. 수출자가 거래은행과 수출채권 양수도 계약을 체결한다.","D. 물품을 선적하고, 수입자에게 선적 사실을 통보하여 채권을 발생시킨다.","E. 수입자 거래은행이 수출자 거래은행에 송금한다."],"opts":["A → D → C → B → E","D → E → A → B → C","C → A → D → B → E","D → A → C → E → B"],"ans":3,"passage":null,"topic":"송금·추심·어음"},{"id":"61-1-4","subj":1,"no":4,"head":"추심결제방식에 대한 설명 중에서 가장 합당한 것은?","body":[],"opts":["추심지시서에 D/P인지 D/A인지 명시가 없는 경우 은행은 D/A로 간주한다.","D/P방식에서 수입자는 물품이 아닌 서류와 교환해서 대금을 결제해야 하는 위험이 있다. 수입자는 추심의뢰서에 선적전 검사증명서(Pre-shipment Inspection Certificate)를 요구함으로써 그 위험을 어느 정도는 줄일 수 있다.","D/A 방식에서 환어음에 대해 인수(acceptance)하는 주체는 수입자의 거래은행이다.","추심거래에서 추심의뢰은행은 대금지급을 확약한다."],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"61-1-5","subj":1,"no":5,"head":"추심결제방식에 대한 설명으로 잘못된 것은?","body":[],"opts":["추심에 관한 통일규칙에서 규정하는 상업서류(commercial documents)는 환어음과 송장, 운송서류가 포함된다.","D/P거래에서 환어음의 발행인(drawer)은 수출자가 된다.","추심의뢰인으로부터 추심의 취급을 의뢰받은 은행을 추심의뢰은행(collecting bank)이라고 한다.","화환추심의 경우 분할지급은 추심지시서에 특별히 수권된 경우에만 인정된다."],"ans":1,"passage":null,"topic":"송금·추심·어음"},{"id":"61-1-6","subj":1,"no":6,"head":"D/P 또는 D/A거래에 사용되는 추심의뢰서의 기재사항에 대한 설명으로 잘못된 것은?","body":[],"opts":["Tenor는 환어음의 만기를 말하는 것으로, D/P는 at sight, D/A는 at 60 days after sight 등으로 표기된다.","Proceeds to be remitted to you는 추심서류의 처리 방법을 말하는 것으로, 전신으로 보낼지 우편으로 보낼지를 표기한다.","Case of needs는 환어음에 대한 지급이 거절된 경우, 추심은행이 접촉해야 하는 예비지급인의 명칭과 주소를 기재한다.","Protest는 거절증서를 말하는 것으로, 추심의뢰인이 거절증서의 작성을 원하는지 여부를 표기한다."],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"61-1-7","subj":1,"no":7,"head":"지급수단으로서의 어음에 대한 설명으로 올바르지 못한 것은?","body":[],"opts":["어음에는 환어음과 약속어음이 있으며, 수표와 함께 현금을 대신하는 지급수단이다.","약속어음에서 발행인(drawer)은 채무자로서 지급인(drawee)이 되고, 상대방이 수취인(payee)이다.","환어음에서 지급인(drawee)은 채무자로서 제3자인 수입자 또는 은행이며, 수취인(payee)은 채권자로서 발행인(drawer)만 될 수 있다.","어음의 인수(acceptance)제도는 약속어음에는 없고, 환어음에는 있다."],"ans":3,"passage":null,"topic":"송금·추심·어음"},{"id":"61-1-8","subj":1,"no":8,"head":"화환신용장의 특성과 효용에 관한 설명으로 잘못된 것은?","body":[],"opts":["신용장거래에서 관계 당사자들은 서류로 거래하는 것이며 물품, 용역, 기타 의무이행으로 거래하는 것이 아니라는 추상성의 원칙이 있다.","신용장은 그 본질상 근거가 될 수 있는 매매계약 또는 기타 계약과는 별개라는 독립성의 원칙이 있다.","신용장을 이용하면 수입자는 수출자에 대한 신용위험을 해소할 수 있으며, 무역조건 협상에서 유리한 입장에 서게 된다.","은행은 다른 결제방식에 비해서 수수료 및 이자 등의 수익을 기대할 수 있기 때문에 신용장거래를 선호한다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"61-1-9","subj":1,"no":9,"head":"다음 중 신용장거래의 기본원칙과 관련한 설명으로 적절한 것은?","body":[],"opts":["개설은행이 파산한 수입자로부터 자금을 보상받지 못하면 매입은행에 지급한 매입대금의 반환을 요청할 수 있다.","개설은행이 매입대금을 상환했더라도 수입자가 법원으로부터 Injunction을 발급받았다면 수입자는 개설은행에 대한 보상을 거절할 수 있다.","원산지증명서를 요구서류로 추가하는 조건변경서를 받은 수익자가 거절의 통지를 하지 않았더라도 원산지증명서를 포함하여 제시할 의무는 없다.","선급금환수용 보증신용장(AP standby L/C)은 개설의뢰인에게 선급금의 반환을 요구한 후에 보증신용장 대금을 청구하므로 보증(bond)과 동일하게 2차 채무에 속한다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"61-1-10","subj":1,"no":10,"head":"신용장통일규칙에 따라서 신용장에는 반드시 이용가능성을 명시해야 한다. 다음 중 신용장을 사용방법(available with… by…)에 따라서 분류한 것은 어느 것인가?","body":[],"opts":["At sight L/C, Usance L/C, Installment L/C","Straight L/C, Freely L/C, Restricted L/C","Transferable L/C, Confirmed L/C, Revocable L/C","Payment L/C, Deferred Payment L/C, Acceptance L/C, Negotiation L/C"],"ans":4,"passage":null,"topic":"신용장"},{"id":"61-1-11","subj":1,"no":11,"head":"다음 중 화환신용장에 관한 설명으로 가장 옳은 것은?","body":[],"opts":["연지급신용장(DEF payment)의 수익자는 신용장이 환어음을 요구하지 않더라도 일람후정기출급 환어음(usance draft)을 포함하여 제시해야 한다.","중계무역을 하는 국내 수출자는 최종 수입국에서 개설되는 신용장에 ‘stale documents acceptable’의 문구를 포함할 것을 요청해야 한다.","Commercial invoice countersigned by applicant 같은 독소조항은 본질적으로 무효이므로 수익자는 신용장에 포함된 해당 조건의 삭제를 요청할 필요가 없다.","수입화물 선취 보상장(Letter of Guarantee)을 발급받아 화물을 수령한 수입자는 이후 개설은행이 하자 서류를 제시
