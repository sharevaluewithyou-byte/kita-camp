<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국제무역사 1급 합격 캠프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: 시험장처럼 차분하고 정확하게. 점수와 과락선이 늘 보인다.
   IDEA: CBT 시험지 + 성적표. 과락선(40)과 합격선(60)이 그어진 막대가 이 앱의 상징.
   PICTURE: 첫 화면은 과목별 예상 점수 막대 4개와 두 개의 기준선, 시험 중에는 문제지 자체.
   COLOUR and TYPE: 항구 청록 띠, 종이 흰색, 과락 빨강 하나. IBM Plex Sans KR, 점수는 Plex Mono.
   LAYOUT: 상단 HUD 띠, 본문 최대 880px 한 단; 시험 화면은 문제 + 번호판, 760px 아래 번호판은 접힘. */
:root{color-scheme:light dark;--bg:#eef2f1;--ink:#13211f;--mute:#566664;--sea:#0f5560;--sea2:#0b434c;--paper:#fffdf8;--line:#d3dcda;--stamp:#cf3229;--stampbg:#fdecea;--ok:#0f6f7a;--okbg:#e3f3f4;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1719;--ink:#e6eeec;--mute:#9fb2af;--sea:#0b3f47;--sea2:#082f35;--paper:#162629;--line:#2a3e42;--stampbg:#3a1b19;--ok:#58c2cc;--okbg:#11343a;--warn:#e0a43a}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0c1719;--ink:#e6eeec;--mute:#9fb2af;--sea:#0b3f47;--sea2:#082f35;--paper:#162629;--line:#2a3e42;--stampbg:#3a1b19;--ok:#58c2cc;--okbg:#11343a;--warn:#e0a43a}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.top{background:var(--sea2);color:#eaf4f3;position:sticky;top:0;z-index:10}
.top .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding:8px max(4vw,14px)}
.brand{font-weight:700;font-size:17px;background:none;border:0;color:#fff;min-height:44px;padding:0}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav button,.nav a{background:none;border:1px solid rgba(255,255,255,.35);color:#eaf4f3;border-radius:8px;padding:6px 12px;min-height:40px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center}
.nav button.on{background:#fff;color:var(--sea2);border-color:#fff;font-weight:600}
.wrap{max-width:880px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,14px)}
h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 10px;text-wrap:balance}
h2{font-size:clamp(21px,3vw,27px);line-height:1.25;margin:0 0 14px;text-wrap:balance}
h3{font-size:17px;margin:0 0 8px}
.hero{background:var(--sea);color:#eef6f5}
.hero .wrap{padding-bottom:28px}
.lead{color:#cfe3e1;margin:0 0 18px;max-width:42em}
.bars{display:grid;gap:12px;margin-top:6px}
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 64px;gap:12px;align-items:center}
.bar .nm{font-weight:600;font-size:15px}
.track{position:relative;height:30px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:#9ad7dc;border-radius:6px 0 0 6px;transition:width .6s}
.track i.low{background:#ff8f86}
.track .ln{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff}
.track .ln.f{background:#ffb4ae}
.bar .sc{font:600 18px "IBM Plex Mono",monospace;text-align:right;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:#cfe3e1;margin-top:10px}
.verdict{margin-top:16px;font-size:17px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cardb{text-align:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:150px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 0 var(--line)}
.cardb:hover{border-color:var(--ok)}
.cardb p{margin:0;color:var(--mute);font-size:15px}
.cardb .k{margin-top:auto;font:600 14px "IBM Plex Mono",monospace;color:var(--ok)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,28px);margin-bottom:18px}
.note{font-size:13px;color:var(--mute)}
.btn{background:var(--stamp);color:#fff;border:0;border-radius:10px;padding:11px 22px;min-height:46px;font-weight:700}
.btn.alt{background:var(--sea)}.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 13px;min-height:40px;font-size:15px}
.chip.on{border-color:var(--ok);background:var(--okbg);font-weight:600}
.chip:disabled{opacity:.4;cursor:default}
.lab{font-weight:600;font-size:15px;margin-top:4px}
/* 문제지 */
.qmeta{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px}
.qmeta b{color:var(--ink)}
.ctx{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:15px;max-height:62vh;overflow:auto}
.ctx .ch{font-size:13px;color:var(--mute);margin-bottom:6px}
.qh{font-size:17px;font-weight:600;margin:12px 0 10px;line-height:1.6}
.qh .no{font:600 17px "IBM Plex Mono",monospace;margin-inline-end:6px}
.body p,.ctx p{margin:0 0 6px}
.body{border-left:3px solid var(--line);padding-left:12px;margin:0 0 14px;font-size:15.5px}
.body .box,.ctx .box{border:1px solid var(--line);padding:10px 12px;border-radius:6px}
table{border-collapse:collapse;margin:6px 0 10px;font-size:14px;width:100%}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--bg)}
u{text-decoration-thickness:2px;text-underline-offset:3px}
.timg{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px;margin:6px 0 10px;overflow-x:auto}.timg img{display:block;width:100%;min-width:520px;height:auto}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;text-align:start;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;line-height:1.55}
.opt .c{font-size:18px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ok)}
.opt.sel{border-color:var(--sea);background:var(--okbg)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--stamp);background:var(--stampbg)}
.opt:disabled{cursor:default;color:inherit}
.fb{border-radius:10px;padding:12px 16px;margin-top:12px;border-left:6px solid}
.fb.good{background:var(--okbg);border-color:var(--ok)}.fb.bad{background:var(--stampbg);border-color:var(--stamp)}
.fb p{margin:2px 0}
/* 시험 화면 */
.exbar{position:sticky;top:60px;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.exbar .in{max-width:1100px;margin:0 auto;padding:8px max(4vw,14px);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.timer{font:600 20px "IBM Plex Mono",monospace;white-space:nowrap}
.timer.low{color:var(--stamp)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;min-height:40px;font-size:14px}
.tab.on{border-color:var(--sea);background:var(--sea);color:#fff}
.exam{max-width:1100px;margin:0 auto;padding:18px max(4vw,14px) 40px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;align-items:start}
.grid{position:sticky;top:130px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.grid .g{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.grid button{min-height:34px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font:600 13px "IBM Plex Mono",monospace;padding:0}
.grid button.a{background:var(--okbg);border-color:var(--ok)}
.grid button.cur{outline:2px solid var(--sea);outline-offset:1px}
.grid button.x{background:var(--stampbg);border-color:var(--stamp)}
.grid button.flag{box-shadow:inset 0 -4px 0 var(--warn)}
.nextprev{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .panel{max-width:440px;width:100%;margin:0}
/* 결과·지도 */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--bg);border-radius:10px;padding:12px 14px;border:2px solid transparent}
.stat.fail{border-color:var(--stamp)}
.stat b{display:block;font:600 26px "IBM Plex Mono",monospace}
.stat span{font-size:13px;color:var(--mute)}
.big{font:600 clamp(40px,7vw,60px)/1 "IBM Plex Mono",monospace}
.pass{color:var(--ok)}.failc{color:var(--stamp)}
.trow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 92px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.trow .tb{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.trow .tb i{display:block;height:100%;background:var(--ok)}
.trow .tb i.low{background:var(--stamp)}.trow .tb i.mid{background:var(--warn)}
.trow .v{font:600 14px "IBM Plex Mono",monospace;text-align:right;white-space:nowrap}
.trow button{grid-column:1/-1;justify-self:start}
.wl{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.wl li{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.wl .t{font-size:15px}
.empty{color:var(--mute);padding:18px 0}
@media(max-width:520px){.cards{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;gap:4px}.tab{padding:4px 2px;font-size:13px}.fn{display:none}.exbar .in{padding:6px 10px;gap:6px}.exbar .row{width:100%;justify-content:space-between}.exbar .btn{min-height:40px;padding:6px 18px}.top{position:static}.exbar{top:0!important}.exam{grid-template-columns:minmax(0,1fr)}.grid{position:static;order:2}.exbar{top:96px}.bar{grid-template-columns:66px minmax(0,1fr) 54px}.trow{grid-template-columns:minmax(0,1fr) 84px}.trow .tb{grid-column:1/-1;grid-row:2}}
@media(prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
</head>

<script>
const DATA={"59":{"date":"2024.8","q":[{"id":"59-0-1","subj":0,"no":1,"head":"대외무역법령상 무역거래의 대상(객체)에 해당하지 않는 것은?","body":[],"opts":["연구개발 등 대외무역법령에서 정하는 용역","무역거래가 가능한 동산으로서 물품","외국환거래법에서 정하는 채권을 나타내는 서류","소프트웨어와 같이 대외무역법 시행령에서 정하는 전자적 무체물"],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"59-0-2","subj":0,"no":2,"head":"대외무역법령상 전문무역상사제도에 관한 설명으로 잘못된 것은?","body":[],"opts":["전문무역상사로 지정을 희망하는 자는 전문무역상사 지정신청서, 사업자등록증, 중소기업 수출지원 기여에 관한 사업계획서 등을 갖추어 한국무역협회 회장에게 신청해야 한다.","대외무역법에서 전문무역상사제도를 2014년에 법제화해 종전의 종합무역상사제도와 병행 운영하고 있다.","산업통상자원부 장관은 신시장 개척, 신제품 발굴 및 중소․중견기업의 수출 확대를 위해 수출실적, 중소기업 제품 수출 비중 등을 고려해 무역거래자 중에서 전문무역상사를 지정․지원하고 있다.","산업통상자원부 장관은 농업․수산업 등 업종별 특성과 조합 등 법인의 조직 형태별 수출 특성을 고려해 고시하는 기준을 갖춘 무역거래자도 전문무역상사로 지정할 수 있다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"59-0-3","subj":0,"no":3,"head":"대외무역법령상 수출입 승인의 면제 대상에 해당하지 않는 것은?","body":[],"opts":["긴급히 처리해야 하는 물품 등으로서 정상적인 수출입 절차를 밟아 수출․수입하기에 적합하지 않은 물품","항공 관련 품목의 안전관리에 관한 사항의 이행을 위해 필요하다고 인정된 물품","주된 사업 목적을 달성하기 위해 부수적으로 수출․수입하는 물품","해외이주자가 해외 이주를 위해 반출하는 원자재, 시설재 및 장비로서 외교부 장관이나 외교부 장관이 지정하는 기관의 장이 인정하는 물품"],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"59-0-4","subj":0,"no":4,"head":"대외무역법령상 수출실적의 인정범위, 인정금액, 인정시점 등에 관한 설명으로 올바른 것은?","body":[],"opts":["북한으로의 유상이 아닌 무상반출도 수출실적 인정범위에 해당한다.","중계무역은 수출금액(CIF 가격)에서 수입금액(FOB 가격)을 공제한 가득액을 수출실적의 인정금액으로 한다.","수출통관이 이루어지지 않는 용역 또는 전자적 형태의 무체물의 수출실적 인정시점은 외국환은행 입금일이다.","수출신고필증에 재반입조건이 기재된 해외건설공사에 직접 사용되는 원료․기재, 공사용 장비 또는 기계류의 수출은 수출실적의 인정범위에 해당한다."],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"59-0-5","subj":0,"no":5,"head":"대외무역법령상 외화획득의 범위에 해당하는 것은?","body":[],"opts":["외국인으로부터 원화(KRW)를 받고 국내의 보세지역에 물품을 공급하는 경우","외국인과 임대차계약을 맺은 국내업체에 외화획득용 시설·기재를 인도하면서 외국인으로부터 원화(KRW)를 받는 경우","정부투자기관이 외국으로부터 받은 차관자금에 의한 국제경쟁입찰에 따라 국내에서 결제통화의 종류를 불문하고 유상으로 물품을 공급하는 경우","절충교역거래의 보완거래로서 무상으로 국내에서 제조된 물품 등을 국가기관에 공급하는 경우"],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"59-0-6","subj":0,"no":6,"head":"대외무역법령에 따른 전략물자의 수출입에 관한 설명으로 올바른 것은?","body":[],"opts":["전략물자에 해당하지 않아도 대량파괴무기와 그 운반수단인 미사일, 재래식 무기의 제조․개발․사용 또는 보관 등의 용도로 전용 가능성이 큰 물품 등을 수출하려는 자는 해당 물품의 수입자에게 대량파괴무기의 제조․개발 용도로 전용할 의도가 있음을 알았을 경우, 산업통상자원부 장관의 허가를 받아야 한다.","전략물자 판정에 관한 서류의 보관기간은 10년이다.","전략물자의 수출허가, 상황허가, 경유 또는 환적허가, 중개허가의 유효기간은 5년이다.","국제수출통제체제에서 정하는 물품의 제조․개발 또는 사용 등에 관한 기술로서 산업통상자원부 장관이 관계 행정기관의 장과 협의해 고시하는 기술은 일반에 공개되거나 기초과학연구에 관한 기술일지라도 수출허가를 받아야 한다."],"ans":1,"passage":null,"topic":"대외무역법"},{"id":"59-0-7","subj":0,"no":7,"head":"대외무역법령상 수출입 물품의 원산지 표시 방법과 원칙에 관한 설명으로 잘못된 것은?","body":[],"opts":["원산지 표시는 한글․한문 또는 영문으로 최종 구매자가 쉽게 판독할 수 있는 활자체로 해당 물품에 해야 한다.","수입한 물품을 국내에서 단순가공해 수출하는 경우에 원산지를 “한국산”으로 표시해도 된다.","무역거래자 또는 물품 등의 판매업자는 원산지를 거짓으로 표시하거나 원산지를 오인하게 만드는 표시를 하는 행위, 원산지 표시 대상 물품에 원산지 표시를 하지 않는 행위를 해서는 안 된다.","산업통상자원부 장관 또는 시․도지사는 원산지 표시 규정을 위반한 자에게 판매중지, 원상복구, 원산지 표시 등 대통령령으로 정하는 시정조치를 명할 수 있다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"59-0-8","subj":0,"no":8,"head":"대외무역법령상 원산지의 표시 등에 관한 설명으로 올바르지 못한 것은?","body":[],"opts":["원산지규정의 3대 요소는 원산지 판정, 원산지 확인, 원산지 표시이다. 이 중에서 원산지 표시는 대외무역법에 관세법 및 다른 법령에 비해서 자세하게 규정되어 있다.","원산지 표시는 “원산지: 국명”, “국명 산(産)”, “Made in 국명”, “Made by 제조자의 회사명, 주소, 국명” 등으로 표시할 수 있다.","원산지 표시 위반에 대해 위반행위의 종류와 정도에 따라서 징역형, 벌금, 과징금, 표시위반자의 공표 등의 벌칙을 받을 수 있다.","원산지 표시제도는 소비자뿐만 아니라 생산자를 보호하기 위한 제도이므로 모든 수입물품과 수출물품 자체에 원산지를 표시해야 한다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"59-0-9","subj":0,"no":9,"head":"대외무역법령상 수입수량 제한조치에 관한 설명으로 잘못된 것은?","body":[],"opts":["수입 급증에 따른 국내 산업의 피해를 구제하기 위한 세이프가드(safeguard)조치의 일환으로 수입수량 제한조치를 대외무역법에서 규정하고 있다.","산업통상자원부 장관이 수입수량을 제한하는 경우, 제한 수량은 최근의 대표적인 3년간의 수입량을 연평균수입량으로 환산한 수량 이상으로 해야 한다.","정부는 수입수량 제한조치를 시행하기 위해 이해 당사국과 해당 조치의 부정적 효과에 대한 적절한 무역보상을 놓고 협의해서는 안 된다.","수입수량 제한조치는 조치 시행일 이후 수입되는 물품에만 적용한다."],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"59-0-10","subj":0,"no":10,"head":"대외무역법령상 구매확인서의 발급에 관한 설명으로 올바른 것은?","body":[],"opts":["구매확인서를 발급한 후 신청 첨부서류의 외화획득용 원료․기재의 내용 변경 등으로 이미 발급받은 구매확인서와 내용이 상이한 경우에는 재발급할 수 없다.","구매확인서 발급자는 발급된 구매확인서를 근거로 2차 구매확인서를 발급할 수 있으며, 외화획득용 원료․기재의 제조․가공․유통 과정이 여러 단계일 경우에는 단 한 차례만 발급할 수 있다.","국내에서 외화획득용 원료․기재를 구매하려는 자나 구매한 자는 한국은행 총재 또는 전자무역기반사업자에게 구매확인서의 발급을 신청할 수 있다.","구매확인서를 발급받으려는 자가 전산설비를 갖추지 못했거나 기타 부득이한 사유로 전자문서를 작성하지 못하는 때에는 전자무역기반사업자에게 신청을 위탁할 수 있다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"59-0-11","subj":0,"no":11,"head":"관세법령 및 협정에서 규정하고 있는 품목분류체계 및 심사신청에 관한 설명으로 올바른 것은?","body":[],"opts":["HS코드는 HS협약에 의해 수출입 물품에 부여되는 상품분류 코드로서 국제적으로 4단위 소호까지는 공통적으로 사용한다. 5단위부터는 각국에서 세분해 사용할 수 있는데 우리나라는 현재 8단위(HSK)로 운용 중이다.","수출입신고 전에 대통령령으로 정하는 서류를 갖추어 관세청장에게 해당 물품에 적용될 별표 관세율표 또는 품목분류표상 품목분류의 사전심사를 신청할 수 있다.","HS 품목분류의 법적 구속력이 있는 것은 통칙뿐이며 주의 규정, 호와 소호의 용어는 권고사항이다.","품목분류 사전심사를 신청받은 관세청장은 해당 물품에 적용될 품목분류를 심사해 대통령령으로 정하는 기간 안에 신청인에게 결과를 통지해야 한다. 결과통지를 받은 신청인은 재심사를 신청할 수 없다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"59-0-12","subj":0,"no":12,"head":"관세법상 내국물품에 대한 개념으로 올바른 것을 모두 고른 것은?","body":["A. 우리나라에 있는 물품으로서 외국 물품이 아닌 것","B. 우리나라의 선박 등이 공해에서 채집하거나 포획한 수산물 등","C. 입항 전 수입 신고되었지만, 수리 전 물품","D. 수입신고 수리 전 반출승인을 받아 반출된 물품","E. 수입신고 전 즉시반출신고를 하고 반출된 물품"],"opts":["A, B","B, C, E","A, B, D, E","A, D, E"],"ans":3,"passage":null,"topic":"관세법"},{"id":"59-0-13","subj":0,"no":13,"head":"관세법령상 신고서류의 작성 및 보관, 보관기간에 관한 내용으로 잘못된 것은?","body":[],"opts":["수입신고필증 및 수입물품 가격결정에 관한 자료는 수입신고 수리일부터 5년 동안 보관해야 한다.","지식재산권 거래에 관련된 계약서 또는 이에 갈음하는 서류는 해당 신고 수리일부터 3년 동안 보관해야 한다.","수출신고필증 및 반송신고필증은 해당 신고의 수리일부터 3년 동안 보관해야 한다.","장부 및 증거서류를 작성‧보관해야 하는 자는 해당 장부와 증거서류의 전부 또는 일부를 정보처리시스템을 이용해 작성할 수 있다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"59-0-14","subj":0,"no":14,"head":"㈜KITA는 신속한 통관을 위해 ‘입항 전 수입신고’를 했다. 다음 중 관세법령상 해당 물품에 적용되는 관세율이 확정되는 시기로 올바른 것은?","body":[],"opts":["해당 물품이 선적되어 우리나라로 출발한 때","관세청에 적하목록을 제출한 때","납세의무자가 입항 전 수입신고를 한 때","해당 물품이 우리나라에 도착한 후 입항 전 수입신고가 수리된 때"],"ans":3,"passage":null,"topic":"관세법"},{"id":"59-0-15","subj":0,"no":15,"head":"관세법상 납세의무의 소멸 사유에 해당하는 것을 모두 고른 것은?","body":["A. 관세 납부","B. 관세징수권의 소멸시효 완성","C. 납부고지","D. 통고처분","E. 관세부과 취소"],"opts":["A, C, E","A, B, E","B, D","C, D"],"ans":2,"passage":null,"topic":"관세법"},{"id":"59-0-16","subj":0,"no":16,"head":"관세법상 과세가격의 결정을 위해 구매자가 실제로 지급했거나 지급해야 할 가격에서공제되지 않고 가산해야 하는 금액은 어느 것인가? (단, 모든 금액은 객관적이고 수량화할 수 있는 자료에 근거한다)","body":[],"opts":["수입항까지의 운임‧보험료","해당 물품의 수입 후 건설, 설치, 조립, 정비, 유지 또는 기술지원에 필요한 비용","우리나라에서 해당 수입물품에 부과된 관세 등의 세금과 그 밖의 공과금","연불조건의 수입에서 해당 수입물품에 대한 연불이자"],"ans":1,"passage":null,"topic":"관세법"},{"id":"59-0-17","subj":0,"no":17,"head":"관세법상 신고납부한 세액의 보정, 수정, 경정에 관한 설명으로 잘못된 것은?","body":[],"opts":["납세의무자가 신고납부한 세액이 부족하다는 것을 알게 되었을 경우, 신고납부한 날부터 6개월 안에 해당 세액의 보정을 세관장에게 신청할 수 있다.","납세의무자가 부족한 세액에 대한 보정을 신청하거나 수정 신고한 경우, 해당 신청 또는 신고한 날의 다음날까지 해당 관세를 납부해야 한다.","납세의무자는 신고납부한 세액의 과다를 알게 되었을 경우, 최초로 납세신고를 한 날부터 5년 안에 신고한 세액의 경정을 세관장에게 청구할 수 있다.","세관장은 경정 청구를 받은 날부터 3년 안에 세액을 경정하거나 경정해야 할 이유가 없다는 뜻을 청구한 자에게 통지해야 한다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"59-0-18","subj":0,"no":18,"head":"관세법상 조정관세를 부과할 수 있는 경우로 올바른 것을 모두 고른 것은?","body":["A. 수입 가격이 급등한 물품 또는 이를 원재료로 한 제품의 국내 가격을 안정시키기 위해 필요한 경우","B. 공중도덕 보호, 인간·동물·식물의 생명 및 건강 보호, 환경보전, 한정된 천연자원 보존 및 국제평화와 안전보장 등을 위해 필요한 경우","C. 유사물품 간에 현저히 불균형한 세율을 시정할 필요가 있는 경우","D. 농림축수산물 등 국제경쟁력이 취약한 물품의 수입 증가로 국내시장이 교란되거나 산업기반이 붕괴될 우려가 있어 이를 시정하거나 방지할 필요가 있는 경우","E. 원활한 물자 수급 또는 산업의 경쟁력 강화를 위해 특정 물품의 수입을 촉진할 필요가 있는 경우"],"opts":["A, B","B, D","C, D","D, E"],"ans":2,"passage":null,"topic":"관세법"},{"id":"59-0-19","subj":0,"no":19,"head":"㈜KITA가 수입하는 물품의 과세가격(CIF 가격)은 2,000,000원이고, 관세율 적용에 필요한 요건은 모두 충족되었다고 가정할 때, ㈜KITA가 납부해야 할 관세액은?","body":["A. 덤핑방지관세율: 15%","B. 기본관세율: 8%","C. FTA관세율: 2%","D. 조정관세율: 5%"],"opts":["600,000원","340,000원","300,000원","40,000원"],"ans":2,"passage":null,"topic":"관세법"},{"id":"59-0-20","subj":0,"no":20,"head":"㈜KITA는 미국 A사와 수입 계약을 체결하고, 견본(과세가격 미화 175달러)을 무상으로 받기로 했다. ㈜KITA의 견본에 대한 수입통관 방법 중에서 가장 정확한 설명은?","body":[],"opts":["미국 A사가 보내는 견본은 무상거래이기 때문에 수입신고를 할 필요가 없다.","미국 A사의 발송 견본은 비록 무상이지만 수입신고를 해야 한다. 다만, 무상이므로 신고가격은 미화 10달러 이내의 소액으로 한다.","미국 A사가 보내는 견본은 비록 무상이지만 과세가격 미화 175달러로 정확하게 수입신고를 해야 한다. 다만, 무상이므로 관세율은 0%로 관세를 납부하지 않는다.","미국 A사의 발송 견본은 비록 무상이지만 과세가격인 미화 175달러로 정확하게 신고해야 하며, 소액물품 등의 면세를 적용받아 관세가 면제된다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"59-0-21","subj":0,"no":21,"head":"㈜KITA는 베트남 A사로부터 물품을 수입해 국내 자사 창고에서 검수하는 과정에서 계약 내용과 다르게 품질이 현저히 떨어짐을 확인했다. 이에 대해 ㈜KITA가 취할 수 있는 통관 및 관세환급 방법에 관한 설명으로 잘못된 것은? (물품은 수입신고 당시의 성질과 형태가 변경되지 않았다)","body":[],"opts":["㈜KITA는 보세구역에 수입물품 전량을 반입했다가 다시 수출한 뒤 수입 시 납부한 관세 전부를 환급받았다.","㈜KITA는 전수 검수 결과, 일부 물품만 계약 내용과 다른 것을 확인해 일부 물품만 보세구역에 반입한 후 다시 수출했다. 환급세액 산출에 지장이 없어 일부 수출물품에 해당하는 관세를 환급받았다.","㈜KITA는 물품이 계약 내용과 다름을 항의하고, 해당 물품을 전량 폐기하고 새로운 물품을 받기로 베트남 A사와 합의했다. 이에 ㈜KITA는 보세구역에 물품을 반입한 뒤 미리 세관장의 승인을 받아 폐기한 후 관세 전부를 환급받았다.","물품을 폐기할 때는 보세구역에 반입 기한 제한이 없지만, 나머지는 수입신고 수리일로부터 2년 이내에 보세구역에 반입한 뒤 수출해야 관세를 환급받을 수 있다."],"ans":4,"passage":null,"topic":"관세환급"},{"id":"59-0-22","subj":0,"no":22,"head":"관세법령상 보세구역 중에서 영업용이 아닌 국가가 직접 운영하는 지정보세구역으로만짝지어진 것은?","body":["A. 보세창고 E. 종합보세구역","B. 지정장치장 F. 특허보세구역","C. 보세전시장 G. 보세공장","D. 세관검사장 H. 보세판매장"],"opts":["A, G","C, H","B, D","E, F"],"ans":3,"passage":null,"topic":"관세법"},{"id":"59-0-23","subj":0,"no":23,"head":"보세구역에서 할 수 있는 업무에 관한 설명으로 잘못된 것은?","body":[],"opts":["보세구역에 장치된 물품은 그 현상을 유지하기 위해 필요한 보수작업과 그 성질을 변하지 않게 하는 범위에서 포장을 바꾸거나 구분․분할․합병을 할 수 있다. 보수작업을 하려는 자는 세관장의 승인을 받아야 한다.","보세구역 장치 물품은 그 원형을 변경하거나 해체․절단 등의 작업을 할 수 있다. 이런 작업을 하려는 자는 세관장의 허가를 받아야 한다.","보세구역 장치 물품은 부패․손상되거나 그 밖의 사유로 인해 폐기할 수 있다. 이런 폐기 작업을 하려는 자는 세관장의 허가나 승인 없이 할 수 있다.","보세구역에 장치된 외국물품의 전부 또는 일부를 견본품으로 반출할 수 있다. 견본품을 반출하려는 자는 세관장의 허가를 받아야 한다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"59-0-24","subj":0,"no":24,"head":"관세법령상 수출입통관에 관한 설명으로 올바른 것은?","body":[],"opts":["우편물(서신 제외)은 관세법 제226조에 따라 세관장의 확인이 필요한 물품이라 하더라도 수입신고가 생략된다.","입항 전 수입신고가 수리된 물품은 해당 물품을 적재한 선박이나 항공기가 입항하기 전까지는 외국물품이다.","수출․수입신고는 화주 또는 관세사 등의 명의로 해야 한다. 다만, 수출신고의 경우에는 화주에게 해당 수출물품을 제조해 공급한 자의 명의로 할 수 있다.","체신관서가 외국으로 발송한 우편물은 관세법에 따라 적법하게 수출된 것으로 간주하지 않는다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"59-0-25","subj":0,"no":25,"head":"관세법상 납세자의 권리 불복절차에 관한 설명으로 잘못된 것은?","body":[],"opts":["관세법 규정에 따른 통고처분은 관세법상 행정심판제도의 불복청구의 대상이 아니다.","관세청장은 심사청구의 내용이 보정할 수 있다고 인정되면 20일 이내의 기간을 정해 심사청구인에게 해당 사항의 보정을 요구할 수 있다.","심사청구를 거친 처분에 대한 행정소송은 해당 결정을 받은 날로부터 20일 안에 제기해야 한다.","세관장은 부족한 세액을 징수하려는 경우, 미리 납세의무자에게 그 내용을 서면으로 통지해야 한다. 납세의무자는 해당 통지를 받은 날부터 30일 안에 기획재정부령으로 정하는 세관장에게 통지 내용의 적법성에 대한 ‘과세전적부심사’를 청구할 수 있다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"59-0-26","subj":0,"no":26,"head":"수출용 원재료에 대한 관세 등 환급에 관한 특례법상 수출용 원재료의 관세환급에 관한 설명으로 잘못된 것은?","body":[],"opts":["해외구매자와의 수출계약을 위해 무상으로 송부하는 견본용 물품의 수출도 환급대상 수출에 해당한다.","세관장은 물품이 수출 등에 제공된 경우, 수출신고 수리일로부터 소급해 1년 이내에 수입된 해당 물품의 수출용 원재료에 대한 관세 등을 환급한다.","환급신청자는 수출물품에 대한 원재료의 소요량을 계산한 소요량계산서를 작성하고, 그 소요량계산서에 따라 환급금을 산출한다.","수출된 물품이 계약조건과 서로 달라서 반품된 물품을 대체하기 위한 물품의 수출도 환급대상 수출에 해당한다."],"ans":2,"passage":null,"topic":"관세환급"},{"id":"59-0-27","subj":0,"no":27,"head":"수출용 원재료에 대한 관세 등 환급에 관한 특례법상 개별환급에 대한 설명으로 잘못된 것은?","body":[],"opts":["개별환급의 구비서류 및 환급금 계산이 복잡하여 이를 보완하기 위해 평균세액증명제도를 운영하고 있다.","개별환급방식으로 환급금을 산출하기 위해서는 소요량계산서를 작성해 수출물품의 제조에 소요된 원재료의 품명, 규격, 수량을 확인해야 한다.","환급금의 지급에 제한받는 수출용 원재료는 긴급관세, 할당관세, 계절관세를 적용한 물품뿐이다.","개별환급업체는 모든 수출물품에 대해 개별환급방법으로 신청해야 한다."],"ans":3,"passage":null,"topic":"관세환급"},{"id":"59-0-28","subj":0,"no":28,"head":"다음은 관세환급특례법상 수출용 원재료의 관세환급 중 ‘국내 거래 증명서류’에 관한 내용이다. 괄호에 들어갈 용어로 올바르게 짝지어진 것은?","body":["Ÿ A사는 베트남에서 신발끈을 직접 수입하고 관세 등을 납부했다.","Ÿ A사는 수입한 신발끈을 추가가공 없이 B사에 납품했다.","Ÿ C사는 인도에서 원피를 직접 수입하고 관세 등을 납부했다.","Ÿ C사는 수입한 원피로 가죽 갑피를 생산해 B사에 납품했다.","Ÿ B사는 A사가 납품한 신발끈과 C사가 납품한 가죽 갑피 및 다른 회사에서 납품받은 물품으로 신발을 생산해 중국으로 수출했다.","Ÿ B사는 수출통관 시 환급 신청인을 수출자로 했고, A사와 C사에 각각 구매확인서를 제공했다.","Ÿ B사는 관세환급 신청을 위해 A사에 ( ㉮ ), C사에 ( ㉯ )을/를 요청했다."],"opts":["㉮ 수입신고필증 · ㉯ 평균세액증명서","㉮ 수입세액분할증명서(수입분증) · ㉯ 기초원재료납세증명서(기납증)","㉮ 수입신고필증 · ㉯ 기초원재료납세증명서(기납증)","㉮ 수입세액분할증명서(수입분증) · ㉯ 평균세액증명서"],"ans":2,"passage":null,"topic":"관세환급"},{"id":"59-0-29","subj":0,"no":29,"head":"FTA관세법(자유무역협정의 이행을 위한 관세법의 특례에 관한 법률)상 용어의 정의가 올바른 것은?","body":[],"opts":["“체약상대국”이란 우리나라와 자유무역협정을 체결한 국가만을 말하고, 국가연합·경제공동체 또는 독립된 관세영역 등은 제외한다.","“원산지”란 관세의 부과․징수 및 감면, 수출입물품의 통관 등을 할 때 협정에서 정하는 기준에 따라 물품의 포장‧단순경유‧수리 등이 이루어진 것으로 보는 국가를 말한다.","“원산지증빙서류”란 우리나라와 체약상대국 간의 수출입물품의 원산지를 증명하는 서류와 그 밖에 원산지 확인을 위해 필요한 서류․정보 등을 말한다.","“협정관세”란 협정에 따라 체약상대국을 원산지로 하는 수입물품에 대해 관세를 추가하거나 세율을 연차적으로 인상해 부과해야 할 관세를 말한다."],"ans":3,"passage":null,"topic":"FTA·원산지"},{"id":"59-0-30","subj":0,"no":30,"head":"자유무역협정과 FTA관세법에서 규정하고 있는 원산지 결정기준에 관한 설명으로 올바른 것은?","body":[],"opts":["둘 이상의 국가에 걸쳐 여러 나라의 원산지 재료로 제조한 물품에 대해서는 실질적 변형기준인 가공공정기준을 우선하여 적용해야 한다.","원산지로 결정된 경우에도 해당 물품이 생산․가공 또는 제조된 후에 원산지가 아닌 국가를 경유해 운송되거나, 원산지가 아닌 국가에서 선적된 경우에는 원칙적으로 해당 물품의 원산지로 인정하지 않는다.","세번변경기준에서 CTH란 투입된 원산지 재료에 대한 HS 8단위와 수출제품 HS 8단위가 변경될 것을 요구하는 기준이다.","단순 가공으로 세번이 변경된 경우에는 “류”변경기준인 CC기준(HS 2단위)을 충족하면 원산지 상품으로 인정한다."],"ans":2,"passage":null,"topic":"FTA·원산지"},{"id":"59-1-1","subj":1,"no":1,"head":"송금결제 방식에 대한 설명으로 올바른 것은?","body":[],"opts":["수출자 입장에서 수출대금을 지급받지 못할 위험이 있는 O/A 방식의 경우, 한국무역보험공사의 수출보험에 가입함으로써 위험에 대응할 수 있다.","CAD 방식에서 수출자의 수출채권이 성립하는 시점은 물품 선적 후 선적통지를 하는 시점이다.","BWT 방식은 사전송금 방식에 해당한다.","사전송금 방식의 거래에서 수출자는 수입자에게 Advance Payment Guarantee의 발행을 요구해 상업위험을 관리할 수 있다."],"ans":1,"passage":null,"topic":"송금·추심·어음"},{"id":"59-1-2","subj":1,"no":2,"head":"O/A 방식의 특징에 관한 설명으로 잘못된 것은?","body":[],"opts":["O/A 방식 거래는 신용장 방식 거래에 비해 은행수수료가 저렴하다는 장점이 있다.","수출자는 수입자 거래은행과 O/A nego를 통해 수출대금을 조기에 회수한다.","수출자 입장에서 O/A 방식 거래가 신용장 방식 거래에 비해 신용위험이 일반적으로 더 크다.","O/A 방식 거래에는 신용장통일규칙이나 추심에 관한 통일규칙과 같이 적용할 수 있는 국제규칙이 없다."],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"59-1-3","subj":1,"no":3,"head":"다음 결제방식 중에서 결제위험을 기준으로 수출자에게 유리한 순서대로 나열된 것은?","body":["(제일 유리한 방식이 첫 번째에 위치)","<table><tr><th>A. 30 days after sight L/C B. Payment in advance by T/T C. Sight L/C<\/th><th>D. D/P at sight E. COD F. Open account<\/th><\/tr><\/table>"],"opts":["B → C → A → D → E → F","B → C → A → E → F → D","C → A → B → D → E → F","F → D → E → C → A → B"],"ans":1,"passage":null,"topic":"송금·추심·어음"},{"id":"59-1-4","subj":1,"no":4,"head":"추심결제 방식에 관한 설명으로 올바른 것은?","body":[],"opts":["추심거래에서 추심은행(collecting bank)은 수출자에게 대금지급을 확약한다.","모든 추심거래에는 URC 522이라는 국제규칙이 자동으로 적용된다.","D/A 방식은 어음의 만기일 측면에서 볼 때 기한부신용장 방식보다는 일람불신용장 방식에 더 가깝다.","추심지시서(Collection Instruction)에는 추심의 방식이 D/A인지 D/P인지 명시해야 하고, 만약 이런 명시가 없는 경우에는 D/P인 것으로 간주한다."],"ans":4,"passage":null,"topic":"송금·추심·어음"},{"id":"59-1-5","subj":1,"no":5,"head":"추심결제를 취급하는 은행의 의무와 책임에 관한 설명으로 잘못된 것은?","body":[],"opts":["은행은 추심 또는 어떠한 추심지시서를 취급해야 할 의무를 부담하지 않는다.","은행은 자신이 전달한 지시가 이행되지 않은 경우에도 아무런 책임을 부담하지 않는다.","추심은행은 제시된 서류들이 추심지시서에 열거된 것들과 외관상 일치하는지의 여부와 함께 내용도 심사할 의무가 있다.","추심은행은 부정확한 주소가 제공된 결과로 발생하는 어떠한 지연에 대해서도 책임을 지지 않는다."],"ans":3,"passage":null,"topic":"송금·추심·어음"},{"id":"59-1-6","subj":1,"no":6,"head":"화환신용장 거래의 기본원칙에 관한 설명 중 옳지 않은 것은?","body":[],"opts":["신용장 방식은 수출자의 대금 회수에 관한 위험을 낮춰주지만, 수입자의 물품 입수를 보장하지는 못한다.","수입자는 신용장 요구서류로 ‘선적 전 검사증명서’를 포함해 수출자의 사기 가능성을 억제할 수 있다.","신용장은 보증서(Letter of Guarantee or Suretyship)가 아니며, 환어음이나 수표와 같은 무조건의 지급 약속문서이다.","신용장통일규칙에는 사기에 관한 규정은 없으며, 법원의 지급 금지명령(injunction)은 신용장의 본질을 훼손하는 것으로 볼 수 있다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"59-1-7","subj":1,"no":7,"head":"화환신용장에 관한 설명 중 옳은 것은?","body":[],"opts":["연지급신용장은 환어음이 개입되지 않지만, 수익자는 만기 전 할인을 통해 자금을 미리 취득할 수도 있다.","송금 방식 shipper’s usance L/C의 경우, 매입은행은 상환은행의 상환수수료를 미입금 수수료(less charge)라는 이름으로 수익자에게 청구하게 된다.","선대신용장은 동일 업체와 동일한 물품을 반복적으로 거래할 때, 매번 거래마다 드는 신용장 개설 수수료, 시간 등의 절약을 위해 활용된다.","기탁신용장은 구상무역에서 주로 사용되는 것으로, ‘대응수입신용장’을 개설하는 때에만 해당 L/C가 유효하다는 조건이 있는 것을 의미한다."],"ans":1,"passage":null,"topic":"신용장"},{"id":"59-1-8","subj":1,"no":8,"head":"일람불 확인신용장에 관한 설명으로 올바른 것은?","body":["A. 확인수수료의 산정 기간은 신용장 개설일자부터 유효기일까지이다.","B. 확인은 수익자가 개설은행의 신용을 보완하기 위해 개설은행의 동의 없이 추가하면 신용장통일규칙에 따라 확인은행으로 인정받을 수 있다.","C. 신용장의 확인은 신용장 금액 또는 기간의 일부에도 할 수 있다.","D. 확인은행은 확인 후 신용장 조건이 변경되면 추가로 확인하거나 거절할 수 있다.","E. 매입신용장에서 환어음을 매입한 확인은행은 개설은행이 최종 지급을 거절할지라도 수익자에 대해 상환청구권을 행사할 수 없다."],"opts":["A, B, D","A, C, D","B, C, E","C, D, E"],"ans":4,"passage":null,"topic":"신용장"},{"id":"59-1-9","subj":1,"no":9,"head":"신용장의 양도와 대금양도(assignment of proceeds)에 관한 설명으로 올바른 것은?","body":[],"opts":["신용장의 양도는 L/C에 “transferable”이라는 단어가 반드시 있어야 하며, 대금양도는 L/C에 단어 “transferable”이 없어도 양도할 수 있다.","양도가능신용장은 제2의 수익자가 제3 또는 제4의 수익자에게 차례로 양도할 수 있다.","양도가능신용장은 원신용장 조건과 일치해야 하므로 보험 부보 비율의 증가는 불가능하다.","분할청구 또는 분할선적이 허용되더라도 신용장은 두 사람 이상의 제2 수익자에게 분할양도될 수 없다."],"ans":1,"passage":null,"topic":"신용장"},{"id":"59-1-10","subj":1,"no":10,"head":"화환신용장 거래에서 각종 서류의 수리 요건에 관한 설명으로 잘못된 것은?","body":[],"opts":["선하증권에 선장의 대리인이 서명할 때 선장의 이름을 기재하지 않더라도 대리인 자신의 이름을 기재해야 한다.","신용장이 항공운송을 요구하면서 환적을 금지하고 있는 경우라도 환적사실이 기재된 항공운송 서류는 수리할 수 있다.","신용장이 피보험자를 지정하지 않았다면, 보험서류에 피보험자로 개설은행, 개설의뢰인, 수익자를 포함한 누구나 기재할 수 있다.","신용장에서 보험서류 원본 1통과 사본 1통을 요구한 경우, 보험서류에 원본이 2부 발행되었다고 기재되었다면 원본 2통과 사본 1통을 제시해야 수리할 수 있다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"59-1-11","subj":1,"no":11,"head":"SWIFT 화환신용장에서 요구하는 서류 조건에 관한 설명으로 잘못된 것은?","body":["FULL SET OF CLEAN ON BOARD MARINE BILLS OF LADING MADE OUT TO THE ORDER OF ABC BANK MARKED FREIGHT PREPAID AND NOTIFY ACCOUNTEE."],"opts":["하자 없는 선하증권을 요구하지만, 반드시 \"CLEAN”이라는 단어가 들어갈 필요는 없다.","선하증권의 수하인(consignee)에 \"TO ORDER”라고만 기재하면 된다.","선하증권 전통을 요구하는 것이며, 통상 3부가 발행되므로 3부를 제시해야 한다.","운임은 선불이므로 CFR, CIF, CPT, CIP 등의 계약조건임을 알 수 있다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"59-1-12","subj":1,"no":12,"head":"하자 있는 선적서류의 매입방법에 관한 설명 중 신용장의 유효기간이 충분한 경우, 가장 안전한 처리방식은 어느 것인가?","body":[],"opts":["개설은행이 지급을 거절하면 수출자가 책임진다는 각서를 제출하고 매입","신용장의 조건을 하자 있는 서류와 일치하도록 변경한 후 매입","매입은행이 추심한 후 대금이 입금되었을 때 지급","매입은행이 하자 있는 서류를 개설은행의 승인을 위해 발송"],"ans":2,"passage":null,"topic":"신용장"},{"id":"59-1-13","subj":1,"no":13,"head":"다음 내용이 설명하고 있는 결제에 사용되는 서류는 무엇인가?","body":["A. 수입 화물이 도착했지만, 선하증권 원본이 없는 경우에 사용된다.","B. 수입자의 요청에 따라 개설은행이 운송인 앞으로 발행한다.","C. 해당 서류가 발행되면 개설의뢰인의 클레임 제기 권한은 제한된다.","D. 수입자가 이 서류를 운송인에게 제시해 물품을 수령할 수 있다."],"opts":["Aval(approval)","T/R(Trust Receipt)","L/G(Letter of Guarantee)","Surrender B/L"],"ans":3,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"59-1-14","subj":1,"no":14,"head":"SWIFT 신용장의 각 항목에 관한 해설로 올바른 것은?","body":[],"opts":["[42C Draft at: 90 days from B/L date]로 기재된 경우, B/L date를 포함하지 않으며, B/L date는 선적일을 가리킨다.","[43P Partial shipment: allowed]로 기재된 경우, 분할선적이 허용되므로 수익자는 반드시 분할해야 하며 전체 수량을 1회에 선적할 수는 없다.","[48 Period for Presentation: 15 days from B/L date]로 기재된 경우, B/L date를 포함하며 B/L date는 선적일을 가리킨다.","[49 Confirmation Instructions: CONFIRM]으로 기재된 경우, 통지은행은 반드시 확인을 추가해야 하며 확인을 추가하지 않은 채 신용장을 통지할 수는 없다."],"ans":1,"passage":null,"topic":"신용장"},{"id":"59-1-15","subj":1,"no":15,"head":"SWIFT로 통지된 화환신용장에 관한 설명으로 잘못된 것은?","body":["43P: Partial Shipments : Allowed","41D: available with/by : ABC Bank by Negotiation","46A: documents required : + Signed commercial Invoice in Quintuplicate","+ Full set of Clean On Board Ocean Bills of Lading.... 49: confirmation instructions : WITHOUT"],"opts":["분할선적은 허용된다.","수익자가 대금을 받기 위한 은행이 ABC은행으로 지정된 지급신용장이다.","반드시 서명된 상업송장 5부와 원본 선하증권 원본 전부를 제시해야 한다.","확인에 대한 지시는 없으므로 무확인신용장이다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"59-1-16","subj":1,"no":16,"head":"UCP 600이 적용되는 화환신용장에 관한 내용으로 올바른 것은?","body":["A. 화환신용장에서 원본 서류를 요청한 경우, 반드시 원본 “ORIGINAL” 표기가 있는 서류가 제시되어야 한다.","B. 개설은행이 서류상 불일치로 지급을 거절하기로 했다면, 서류 제시일의 다음날로부터 5영업일 이내에 해당 내용을 제시은행에 통보해야 한다.","C. 화환신용장에서 별도 선적기한을 지정하지 않은 경우, 화환신용장의 개설일자 이전의 선적서류도 수리될 수 있다.","D. 선적일에 관해 “prompt”, “on or about” 등의 모호한 표현이 사용되었다면, 그 단어들은 무시해도 된다.","E. “Negotiation”은 일치하는 제시에 대해 지정은행이 만기일 이전에 대금을 지급하며 환어음을 매수하는 것으로 항상 환어음이 제시되어야 한다."],"opts":["A, B","C, D, E","B, C","B, C, E"],"ans":3,"passage":null,"topic":"신용장"},{"id":"59-1-17","subj":1,"no":17,"head":"UCP 600에서 규정한 내용으로 잘못된 것은?","body":[],"opts":["신용장은 취소 여부에 대한 표시가 없더라도 취소가 불가능하다.","신용장은 일람지급, 연지급, 인수 또는 매입 중 하나의 이용 방법이 명시되지 않으면 무효이다.","신용장은 이용할 수 있는 은행이 지정되지 않으면 모든 은행에서 이용할 수 있다. 그러나 이용 은행이 지정되었다면 개설은행에서는 이용할 수 없다.","제시는 신용장에 의해 이루어지는 개설은행 또는 지정은행에 대한 서류의 인도 혹은 인도된 서류 자체를 의미한다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"59-1-18","subj":1,"no":18,"head":"UCP 600에서 정의되지 않은 표현에 관한 ISBP의 내용 중 잘못된 것은?","body":[],"opts":["선적서류(shipping documents)는 선하증권, 해상화물운송장, 항공화물운송장 등 운송과 관련된 서류만을 말한다.","기간 경과 운송서류 수리가능(stale documents acceptable)은 신용장의 유효기일 이전에 제시되는 것을 전제로 서류가 선적일 후 달력상 21일 후에도 제시될 수 있다는 의미이다.","제3자 서류 수리 가능(third party documents acceptable)은 환어음을 제외하고, 신용장이나 UCP 600에서 발행인이 명기되지 않은 모든 서류는 수익자 이외의 기명된 자연인이나 실체에 의해 발행될 수 있음을 의미한다.","수출국(exporting country)은 수익자의 주소가 있는 국가, 물품의 원산지국, 운송인이 물품을 수령한 국가, 물품 선적국 또는 물품 발송국 중의 어느 하나를 의미한다."],"ans":1,"passage":null,"topic":"신용장"},{"id":"59-1-19","subj":1,"no":19,"head":"ISBP 등 국제규칙에 근거한 환어음의 설명으로 올바른 것은?","body":[],"opts":["기한부 환어음의 만기 산정을 위해서는 반드시 선적일자가 표시되어야 한다.","환어음의 숫자 금액과 문자 금액은 서로 일치해야 하지만, 서로 다를 경우 문자 금액을 기준으로 환어음을 심사한다.","만기를 정하기 위해 사용된 전치사 “from”은 명시된 일자를 포함하고, “after”는 명시된 일자를 제외한다.","만기일이 휴일이면 상환은 이전 은행영업일에 이루어져야 한다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"59-1-20","subj":1,"no":20,"head":"Standby L/C에 관한 설명으로 잘못된 것은?","body":[],"opts":["Standby L/C는 지급보증 대상은행이 특정인에게 금융지원, 채무보증 등을 해줄 수 있도록 개설하는 화환신용장이다.","수출입과 관련된 보증에는 수출선수금 환급보증, 현지금융 담보보증, 수출계약 이행보증 등이 있다.","Standby L/C의 장점은 이행보증용과 금융보증용 등으로 사용되는 용도의 다양성이다. 반면에 단점은 부당청구(unfair calling)의 가능성이 있다는 것이다.","명시적 언급이 있다면 Standby L/C에도 ISP 98과 UCP 600이 적용될 수 있다."],"ans":1,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"59-1-21","subj":1,"no":21,"head":"다음 결제조건 가운데 포페이팅으로 활용이 가능한 것은?","body":[],"opts":["CAD at 60 days after sight","O/A at 30 days","D/P at 90 days from B/L date","D/A at 60 days after sight (Aval 추가 조건)"],"ans":4,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"59-1-22","subj":1,"no":22,"head":"팩터링 방식의 수출입에 관한 설명으로 잘못된 것은?","body":[],"opts":["팩터링 거래에서 수출자가 선적 후 선적서류를 수출팩터에게 양도하면, 수출팩터는 서류 확인 후 수출자에게 전도금융을 제공하고 관련 수수료를 수출자에게 청구한다.","팩터링은 팩터의 소구권(recourse right) 여부에 따라서 소구권이 있는 팩터링과 없는 팩터링으로 구분된다.","포페이팅은 ICC에서 제정한 국제규칙(URF 800)이 있는 반면에, 팩터링은 아직 국제규칙이 제정되어 있지 않다.","국제팩터링은 기한부 결제방식인 신용장과 추심 거래에서 팩터가 수출자로부터 외상 매출채권을 매입하는 국제금융기법의 일종이다."],"ans":4,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"59-1-23","subj":1,"no":23,"head":"결제에 관한 국제규칙 가운데 신용장과 관련된 규칙만으로 짝지어진 것은?","body":[],"opts":["UCP 600 － ISBP 821 － ISP 98 － eUCP","UCP 600 － URC 522 － URR 525 － URBPO 750","ISP 98 － URC 522 － ISBP 821 － UCC","ISP 98 － URBPO 750 － URF 800 － UCC"],"ans":1,"passage":null,"topic":"신용장"},{"id":"59-1-24","subj":1,"no":24,"head":"한국무역(주)은 유로화로 수입대금을 지급한다. 이 회사의 외환 담당자는 보유하고 있던 미 달러화를 유로화로 환전하기 위해 은행에 문의했다. 각 은행이 제시한 EUR/USD 환율이 다음과 같다면, 이 회사는 어떤 환율로 거래하는 것이 가장 좋은가?","body":["(단, 은행의 수수료는 없음. 환율표시에서 앞에 있는 것이 기준통화)","<div class=\"timg\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2MAAACvCAAAAABVmFmHAAAH5klEQVR42u2d25LjKBBEKyf0/7+c8yBbAoQulttGMudETIzare2NySa5FAUlBwB8kH9IAIDHAPAYAKwwREQIHQA+gkePibgHwEcQc0UA1mMAeAwA8BgAHgPAYwCAxwDwGAAeAwA8BoDHAACPAcSX8u4hvpUfGhHhUHj6zM9vOHt18dLjtfkpvPG/Ic2bcQyW3lB+JGLpHTs7hyQpDrwGjGPR1WGijW9ILka8wjvjEJj8JGnxI/PX1odUBjrGMai7wtuerb4GeAzOjjLenxRq5RmYK8L7XrUSx47PzxiLGOvwGOu2/COp/vH2a57WeZoXfWY9xlyx7xmi1nynvblg+doYRHGwRGMc62qHzCf3tKxDw0/tNc3rNosrkvBYn7F77Uc8HKrcIeaN13ATc0WYnXEgRHjspcOvAR7rNryx8Ym3V2O7Aybgsa7dppf3sHYWaIxmeKxzO9VN4OpLOmax3SwsovZ4LHoKMZZ7WSpMojLrPvt2dccsf03pf5J8gc++mgrAffffP9tStPVkZ8ypb4qXojjbsr4L8HzNWvyAZA+OX/v3/IXHLvZLueLPgtO/AuaK1xzrgPUYxJe3qQGPARYDPAaAx4BBEY8BAB4DwGMAeAwA8BgAHgMI7hoggQfg0x5jHyXIrEWeT+WfMlcEYD0GgMcAAI8B4DEAPAYAeAwAjwHgMQDAY7+NdPxTdAlqI8Eb5aDFtQEvl8nGY7B3i/CiYdWu3V5PFPypO+3ruujovSWa7mU2HgtuuKkcgXjYpSz7LO/Y6ods5heOhtR00fxXm94Ij92koem124R/vyStj92y7EcnVTfTV2Qi5nHDW7orva/NvW/rpaLU9Ho8PHbHfttcnf9njhEeg2Xdsa0Won4HMh3xTSke6zFGrzGiqOowprQCoPMP+h3qNYURlc0WnQtmEVdk1HoGO9a72zGs70Wc/1dvAVAcXpRJDuc90KSPs67q4zLhsUvXi96czGgR1s8+sH5alzOLMlfC/J+XCY/df6tILnZr1dtYX6mEXYnKt+p78NidLn7S69HFH196+Ywv5a+qR1wRgHGMUtDocueCbHjs+vunWkmr6uP2UJ9LN2Mcg1OtTH+TQPTjG4peyzdTm+kDHrt5NESL5vX7mR6KzZMvhSxlf1S6z3gM1iKNHnebnSWF9BC795YuG5v2j28xV4S92YwVi+MaThuf+5wqWmvJ016a09+LNOGxy3fTPlkrxf1FP85EgTg/1q3P/GZK0Y8GHd/WpYFMjGM/Gs82ulxlx4xxDACPAeAxAMBjAHgMAI8BAB4DwGMA0W/qNgDE326LDxTe6TQrCXm+lc/NXBGA9RgAHgMAPAaAxwDwGADgMQA8BoDHAKAbj0m1R4CgpsT5mwR96MZpADx2xmEO4SfAY39nKi+/8lSxV1+tPn/pVNtEg/T+bZV1JI085SXAtedex7Hl6GXu356+sGKuRzI/ly/1kgR/SJ7xrfm5lTxDW6Hq/+ikKEKXg5gqh5D8GN3HP8/WUpSx7cNkR+UZe+3kuZE8/65Ys15JJHE6Q9pXVNEvD+hGnq233Gnsvry8XImxpjfs7g5q2z7Zt3eh1 :["1.41","1.47","1.53","1.56"],"ans":2,"passage":null,"topic":"외환·환리스크"},{"id":"59-1-27","subj":1,"no":27,"head":"한국정유(주)는 수입대금을 달러로 지불한다. 이 회사가 3개월 후 지급 예정인 수입대금의 환율 상승 위험을 보기의 방안으로 각각 헤지했다면, 3개월 후 현물환율이 1,380 원이 되었을 때 가장 유리한 결과를 낳는 것은?","body":[],"opts":["선물환으로 달러 매입, 선물환율 1,390원","행사가 1,370원의 콜옵션 매입, 프리미엄 달러당 30원","행사가 1,390원의 풋옵션 매도, 프리미엄 달러당 20원","아무런 행동도 취하지 않다가 3개월 후 당시 현물환율로 결제"],"ans":3,"passage":null,"topic":"외환·환리스크"},{"id":"59-1-28","subj":1,"no":28,"head":"환리스크 관리의 내부적 기법에 관한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 리딩(leading)은 외화자금의 결제시기를 최대한 앞당기는 것을 말하며, 래깅(lagging)은 외화자금의 결제시기를 최대한 늦추는 것이다.","B. 향후 환율의 강세가 예상되는 통화를 지급해야 할 때 래깅 전략을 사용하는 것이 바람직하다.","C. 네팅(netting)은 일정 기간 발생하는 채권과 채무를 개별적으로 결제하지 않고, 서로 상계한 차액만을 결제함으로써 비용 절감과 리스크를 줄이는 방법이다.","D. 가격정책(price policy)은 수출입 가격을 수시로 조정하거나 거래통화를 조정해 환리스크에 대응하는 방법이다."],"opts":["A, C","A, C, D","C, D","B, C, D"],"ans":2,"passage":null,"topic":"외환·환리스크"},{"id":"59-1-29","subj":1,"no":29,"head":"환리스크 관리의 외부적 기법에 관한 설명 중 잘못된 것은?","body":[],"opts":["통화선물은 특정한 거래소에서 이루어지는 불특정 다수와의 거래이며, 선물환은 장외시장에서 당사자 간의 1대1 거래이다.","통화스왑은 장래 특정 시점 또는 기간의 환리스크를 회피하기 위해 보유한 금융자산 또는 부채의 통화를 다른 통화로 변경하는 방법이다.","통화선물은 상대방과의 합의에 따라 계약 단위나 결제일을 자유롭게 정할 수 있지만, 선물환은 계약 단위나 결제일이 사전에 표준화되어 있다.","통화옵션은 통화를 장래의 특정 일자 또는 기간에 정해진 행사가격으로 매입 혹은 매도할 수 있는 권리이다."],"ans":3,"passage":null,"topic":"외환·환리스크"},{"id":"59-1-30","subj":1,"no":30,"head":"다음 신문기사의 제목에서 외환시장에 알려질 경우, 달러/원 환율의 상승을 초래할 뉴스로 잘못된 것은?","body":[],"opts":["“미국의 FRB, 달러 기준금리를 연내 2, 3차례 추가 인상할 방침 밝혀”","“국내 주식시장에서 외국인 투자자들의 주식매도, 향후에도 급증할 전망”","“한국의 7월 중 경상수지, 예상보다 크게 악화된 150억 달러 적자로 반전”","“반도체 및 자동차 수출 호조로 하반기 수출목표 2배 이상 초과 달성은 무난할 듯”"],"ans":4,"passage":null,"topic":"외환·환리스크"},{"id":"59-2-1","subj":2,"no":1,"head":"무역계약의 법적 성격에 관한 설명으로 올바르게 짝지어진 것은?","body":["A. 양 당사자가 계약상의 의무를 부담하는 계약","B. 계약의 당사자가 서로 대가적 의미(급부)가 있는 출연을 하는 계약","C. 당사자의 의사 합치, 즉 합의만으로 성립하는 계약","D. 서면 또는 일정한 양식을 필요로 하지 않는 계약"],"opts":["A 쌍무계약 · B 유상계약 · C 불요식계약 · D 낙성계약","A 쌍무계약 · B 유상계약 · C 낙성계약 · D 불요식계약","A 유상계약 · B 낙성계약 · C 쌍무계약 · D 불요식계약","A 낙성계약 · B 쌍무계약 · C 불요식계약 · D 유상계약"],"ans":2,"passage":null,"topic":"계약 일반"},{"id":"59-2-2","subj":2,"no":2,"head":"Incoterms 2020의 사용에 관한 설명으로 올바른 것은?","body":[],"opts":["FCA는 매도인이 지정장소에서 매수인이 지정한 운송인에게 물품을 인도했을 때 위험이 이전되므로 수취선하증권(Received B/L)의 발행만 가능하다.","CIP와 CIF는 모두 별도의 합의가 없다면 매도인은 최소 부보 조건인 ICC(C) 범위에서 부보해야 한다.","DAP는 매도인이 물품을 지정목적지에서 도착 운송수단에서 양하한 상태로, DPU는 매도인이 물품을 지정목적지에서 도착 운송수단에 실어둔 채 양하 준비된 상태로 매수인의 처분하에 두거나 그렇게 인도된 물품을 조달함으로써 인도한다.","D규칙의 경우 매도인은 제3자 운송인과 운송계약을 체결하지 않고 자신의 운송수단으로도 운송할 수 있다."],"ans":4,"passage":null,"topic":"인코텀즈"},{"id":"59-2-3","subj":2,"no":3,"head":"Incoterms 2020의 일부 조건을 아래 표의 기준으로 요약한 것 중에서 잘못된 것은?","body":[],"opts":["EXW · 위험이전 수출국 지정 인도장소 · 비용분기점 · 운송방식 모든 운송 · 수출통관 수입자 · 해상보험 의무 없음","CIF · 위험이전 지정 선적항(본선) · 비용분기점 지정 목적항 · 운송방식 해상 운송 · 수출통관 수출자 · 해상보험 수출자 ICC(C) 조건","FCA · 위험이전 수출국 지정 인도장소 · 비용분기점 · 운송방식 모든 운송 · 수출통관 수출자 · 해상보험 의무 없음","DAP · 위험이전 도착지 운송수단에서 양하 · 비용분기점 · 운송방식 모든 운송 · 수출통관 수입자 · 해상보험 수출자 ICC(A) 조건"],"ans":4,"passage":null,"topic":"인코텀즈"},{"id":"59-2-4","subj":2,"no":4,"head":"Incoterms 2020의 분류 및 설명으로 잘못된 것은?","body":[],"opts":["해상 및 내수로 운송방식에만 사용되어야 하는 조건은 FAS, FOB, CFR, CIF이다.","매도인이 적하보험을 부보해야 하는 조건은 CIP 및 CIF이다.","Incoterms 2020에서 F규칙은 매수인이 운송계약을 체결해야 하는 조건이다.","본선인도 조건인 FOB, CFR, CIF 조건의 위험 분기점은 본선 난간(ship’s rail)이다."],"ans":4,"passage":null,"topic":"인코텀즈"},{"id":"59-2-5","subj":2,"no":5,"head":"Vienna Convention(1980)이 적용되는 범위에 관한 설명으로 잘못된 것은?","body":[],"opts":["국제사법 규칙에 따라 체약국법이 적용되는 경우, 영업소가 서로 다른 국가에 있는 당사자 간의 물품매매계약에 적용된다.","선박, 항공기의 매매에는 적용되지 않는다.","물품을 주문한 당사자가 그 제조 또는 생산에 필요한 재료의 중요한 부분을 공급하는 경우는 매매계약으로 보지 않는다.","물품을 공급하는 당사자의 의무의 주된 부분이 노무 그 밖의 서비스 공급이 있는 계약에도 적용된다."],"ans":4,"passage":null,"topic":"계약 성립·CISG"},{"id":"59-2-6","subj":2,"no":6,"head":"Vienna Convention(1980)에서 매수인의 계약위반에 대한 매도인의 구제수단을 설명한 것 중에서 올바르게 짝지은 것은?","body":["A. 다른 구제수단과 병행해 행사할 수 있는 대표적인 구제수단이다.","B. 의무불이행이 근본적인 계약위반에 해당하거나, 추가 기간 내에 매수인이 의무를 이행하지 않을 때 사용할 수 있는 가장 강력한 구제수단이다.","C. 매수인이 매도인의 요청을 받은 후 상당 기간 내에 해당 명세를 확정하지 않으면, 매도인은 매수인의 요구사항을 참작해 스스로 물품의 명세를 확정할 수 있다."],"opts":["A 계약이행청구권 · B 손해배상청구권 · C 계약해제권","A 대체물인도청구권 · B 추가기간지정권 · C 손해배상청구권","A 추가기간지정권 · B 물품명세확정권 · C 대체물인도청구권","A 손해배상청구권 · B 계약해제권 · C 물품명세확정권"],"ans":4,"passage":null,"topic":"계약 성립·CISG"},{"id":"59-2-7","subj":2,"no":7,"head":"다음 중 무역계약의 조건에 관한 설명으로 잘못된 것은?","body":[],"opts":["견본매매를 할 때“Quality to be as per sample”과 같이 완곡한 표현을 사용하는 것이 수출자 입장에서 유리하다.","UCP 600은 살물(bulk cargo)의 경우 명시적인 과부족 용인 약관이 없더라도 5%의 과부족을 허용하고 있다.","포장의 견고성에 대한 의무는 매매계약 조건에도 불구하고 매도인에게 부과된다.","UCP 600은 선적일을 실제 선적일이 아닌 서류발행일을 기준으로 한다."],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"59-2-8","subj":2,"no":8,"head":"무역계약의 본질과 특성에 관한 설명으로 잘못된 것은?","body":[],"opts":["무역계약의 특수성은 당사자 간 주계약인 매매계약을 이행하기 위해 운송계약, 보험계약, 결제계약 등 종속계약이 따른다는 점이다.","무역계약의 해석은 강행규정이 있으면 최우선 적용되고, 이어서 명시조건인 계약조건, 묵시조건인 관습법, CISG 등 준거법 순서로 적용된다.","매도인(seller)은 거래단계별로 결제에서는 beneficiary(수익자), drawer(발행인), 운송에서는 consignee(수하인), ship owner(화주) 등의 명칭으로 부른다.","무역계약은 국제물품매매계약(Contract for the International Sale of Goods)을 말하는 것으로서 국내계약과 다르게 양 당사자가 다른 국가(법역)에 위치해야 한다."],"ans":3,"passage":null,"topic":"계약 일반"},{"id":"59-2-9","subj":2,"no":9,"head":"국제물품매매계약의 성립요건으로서 청약과 승낙에 관한 설명 중 올바른 것을 모두 고른 것은?","body":["A. 계약성립의 가장 중요한 요소는 계약당사자 간 의사표시의 합치이다.","B. 청약은 특정인 앞으로 유효기간을 정해서 충분한 내용으로 조건을 제시하는 확정적인 의사표시이다.","C. 의사표시의 효력 발생 시기에 대해 대부분의 입법례는 청약은 발신주의, 승낙은 도달주의를 택하고 있다.","D. 서식의 표제에 ”offer“라는 단어가 사용되어야 청약으로 간주되기 때문에 어떠한 경우도 Proforma Invoice는 청약으로 간주되지 않는다.","E. 조건부 승낙은 청약의 거절이며 또 다른 청약인 반대청약(counter offer)이다."],"opts":["A, C, D","A, B, E","B, C, D","B, D, E"],"ans":2,"passage":null,"topic":"계약 성립·CISG"},{"id":"59-2-10","subj":2,"no":10,"head":"다음 무역계약 체결 절차에 사용되는 서식 및 내용 중에서 일반적인 계약체결 절차에 따를 때 올바른 순서대로 나열된 것은?","body":["<table><tr><th>A. Circular Letter B. Business Proposal C. Sales Contract D. Buyer List / Seller List<\/th><th>E. Offer Sheet / Order Sheet F. Inquiry G. Acceptance / Acknowledgement<\/th><\/tr><\/table>"],"opts":["B → A → F → C → D → E→ G","D → A → F → B → E → G → C","D → F → B → E → G → A → C","F → A → B → G → E → C → D"],"ans":2,"passage":null,"topic":"계약 일반"},{"id":"59-2-11","subj":2,"no":11,"head":"1차 산물은 규격이 통일되지 않아 무역계약상 품질 결정에 많은 어려움이 있다. 다음 거래 물품과 품질 결정 기준에 관한 설명 중 올바른 것을 모두 고른 것은?","body":["A. 원면, 생사는 USQ(Usual Standard Quality) 거래가 적합하다.","B. 목재류, 냉동 어류는 GMQ(Good Merchantable Quality) 거래가 적합하다.","C. 곡물류, 과일류는 FAQ(Fair Average Quality) 거래가 적합하다.","D. 인삼, 오징어는 Sales by Sample 거래가 적합하다."],"opts":["A, B","B, C","A, B, C","A, B, D"],"ans":3,"passage":null,"topic":"거래조건"},{"id":"59-2-12","subj":2,"no":12,"head":"선적조건과 관련된 신용장 거래에 관한 설명으로 잘못된 것은?","body":[],"opts":["할부선적의 경우 수입자가 판매계획과 능력, 시황 등을 고려해 수차례에 걸쳐 물품공급을 요청할 수 있으며, 수출자는 할부 물량별로 지정한 선적기간 내에 선적해야 한다.","할부선적은 어느 할부한 부분에 대한 선적을 위반했더라도 당해 선적분을 제외한 장래의 모든 할부한 부분에 대해서는 신용장을 사용할 수 있다.","분할선적은 수출자의 수출품 생산용 원자재의 재고 상황 등을 고려해 사용될 수 있으며, 계약 물품을 여러 차례 나누어 운송한다.","신용장에 금지표시(prohibited/not allowed)가 없으면 분할선적이 가능하다."],"ans":2,"passage":null,"topic":"거래조건"},{"id":"59-2-13","subj":2,"no":13,"head":"무역계약의 포장조건에서 화인(shipping mark)에 관한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 주화인(main mark)은 다른 화물과의 식별을 위해 특정한 기호(symbol)를 표시하고, 그 안에 수입자의 상호 등을 약자로 표시한다.","B. 주의표시(care mark)는 화물 취급상 주의할 점을 외장의 측면에 한다. 예를 들어 화물이 물에 젖지 않도록 지시하는 마크 등을 표시한다.","C. 도착항(port mark)은 화물이 잘못된 곳으로 운송되는 것을 막기 위해 선택적으로 표시하며, 복수 항로의 경우는 “New York via Seattle”과 같이 표시한다.","D. NM(No Mark) cargo는 선적항과 상자 번호가 없는 무인화물로서 화물이 수출화주에게 회수되지 못해 손해를 입힐 수 있다."],"opts":["A, B","A, B, D","B, C, D","A, B, C, D"],"ans":1,"passage":null,"topic":"거래조건"},{"id":"59-2-14","subj":2,"no":14,"head":"다음 무역거래 조건 중 청약이나 주문에서 반드시 약정해야 하는 기본 무역조건으로서중요도가 상대적으로 낮은 것은?","body":[],"opts":["Unit price: US$1.90/pc FCA COEX, Incoterms 2020","Commodity &amp; Descriptions: Automobile Tubes","Quantity: 6,000pcs","Origin: Republic of Korea"],"ans":4,"passage":null,"topic":"계약 성립·CISG"},{"id":"59-2-15","subj":2,"no":15,"head":"무역계약상 주요 조건의 약정과 해석 등에 관한 설명으로 잘못된 것은?","body":[],"opts":["품질조건의 점검매매(sale by inspection)에서 매수인이 거래물품을 수입지의 소재지에서 실제로 점검해 품질을 결정하는 방법에는 BWT 거래와 COD 거래 등이 있다.","수량조건의 중량을 표시하는 중량톤은 Metric ton(M/T)으로 약정해야 1,000kg(2,204lbs)으로 해석되며, 총중량, 순중량 등도 구분해 표시하는 것이 바람직하다.","결제조건 결정에서 매도인이 우위에 있으므로 대부분 경우에 “사전송금→L/C→D/P․ D/A→O/A 방식” 순으로 매도인에게 유리하게 결정되는 것이 거래관행이다.","가격조건은 “Price: US$125.75/set FCA Seoul Coex warehouse, Incoterms 2020”과 같이 거래통화, 수량단위, 무역거래조건, 비용의 분기점, Incoterms 버전 등을 표시하는 것이 바람직하다."],"ans":3,"passage":null,"topic":"계약 일반"},{"id":"59-2-16","subj":2,"no":16,"head":"무역계약서의 체결 방식 중 정식계약 방식에 관한 설명으로 잘못된 것은?","body":[],"opts":["개별계약 방식은 거래할 때마다 구체적인 거래조건을 합의하는 방식으로 최초 거래나 1회로 종결되는 거래에 사용된다.","포괄계약 방식은 동일한 상대방과 유사한 내용으로 거래가 반복적으로 이루어지는 경우, 일반거래조건에 관한 협정을 체결해 기본원칙을 규정하는 방식이다.","포괄계약서는 전면사항과 이면사항으로 구성되어 품질, 수량, 가격, 선적, 결제 등 주요 조건을 구체적으로 규정하기 때문에 해당 건의 무역거래에 바로 이용할 수 있다.","일반거래조건은 특정 종류의 거래에 적용하기 위해 미리 작성된 정형화된 계약조건을 가리키며, 계약서 표제로 “General terms &amp; conditions”라고 쓰는 경우가 많다."],"ans":3,"passage":null,"topic":"계약 일반"},{"id":"59-2-17","subj":2,"no":17,"head":"소송 이외의 클레임 해결방법인 대체 분쟁 해결수단(ADR)에 관한 설명으로 잘못된 것은?","body":[],"opts":["Intercession: 공정한 제3자가 일방 당사자 또는 쌍방의 의뢰에 따라 분쟁사건에 개입하여 해결을 위해 조언하는 것으로 알선이라 한다.","Conciliation: 당사자 쌍방이 합의해 제3자를 조정인으로 선임하고, 그가 제시하는 조정안에 동의함으로써 분쟁을 해결하는 방법이다. 조정은 중재절차 개시 전에 진행될 수 있는 분쟁해결 방법의 하나다.","Arbitration: 공정한 제3자를 중재인으로 선임하고, 중재인의 판정에 복종함으로써 클레임을 해결하는 방법이다. 중재는 1회의 판정으로 종결되며 중재에 의뢰한 사건은 소송에 의해 다룰 수 없다.","Waiver of claim: 당사자들이 자주적인 교섭을 통해 합의점을 발견함으로써 분쟁을 원만하게 해결하는 방법이다. 계약서에 당사자가 서로 양보할 것, 분쟁을 종료할 것, 그 뜻을 약정할 것 등 3가지 요건이 필요하다."],"ans":4,"passage":null,"topic":"클레임·분쟁"},{"id":"59-2-18","subj":2,"no":18,"head":"무역계약에서 중재에 관한 설명으로 잘못된 것은?","body":[],"opts":["사전 중재합의는 계약당사자들이 계약서에 다른 조항과 함께 중재조항을 포함해 계약 체결과 동시에 중재합의까지 완성하는 것이 일반적이다.","중재계약은 중재지, 중재기관, 준거법이 포함되어야 한다. 특히 중재지는 중재장소가 있는 곳이므로 중재지가 “Seoul, Korea”인 경우 중재장소도 “Seoul, Korea”로 일치해야 한다.","중재조항의 중재기관 명칭은 정확히 기재되어야 한다. 중재기관이 명확하지 않은 경우, 일방이 중재를 신청하더라도 상대방이 해당 중재기관의 관할을 부인하면 중재 진행에 중대한 차질이 발생할 수도 있다.","중재판정은 법원의 확정판결과 동일한 효력이 있고 New York Convention(1958)의 체약국일 때 외국에서도 중재판정의 승인 및 집행이 보장된다. 그러나 중재판정은 재판판결과 같이 그 자체로서 집행력이 없으므로 패소자의 국가에서 강제집행을 허용하는 법원의 집행판결로 적법함을 선고받아야 한다."],"ans":2,"passage":null,"topic":"클레임·분쟁"},{"id":"59-2-19","subj":2,"no":19,"head":"다음 상황에 적합한 Incoterms 2020의 조건을 모두 올바르게 고른 것은?","body":["A. 한국의 매수인이 중국의 매도인으로부터 포장기계를 수입하는 계약을 체결","B. 중량화물(heavy weight cargo)이므로 매도인이 매수인과 합의한 수입국 공장까지 화물 파손의 위험, 운임 및 기타 비용을 부담해 운송하는 조건으로 진행","C. 수입통관 및 관세는 매수인이 부담","D. 해상적하보험은 매도인이 부담"],"opts":["CFR, CIF, CIP","CIP, CIF, DAP, DPU","CPT, CIP, DAP, DPU","DAP, DPU"],"ans":4,"passage":null,"topic":"인코텀즈"},{"id":"59-2-20","subj":2,"no":20,"head":"다음 운송서류에 기재된 선적일 중에서 계약위반이 되는 것을 모두 고른 것은?","body":["- 무역계약서의 최종선적일은 모두 8월 31일로 동일함","A. 발행일이 9월 1일이고 선적일(on board date)이 8월 30일로 기재된 선하증권","B. 발행일이 8월 30일이고 본선적재 부기일(on board notation)이 9월 1일로 기재된 선하증권","C. 운송인의 화물 수취일이 8월 30일, 발행일이 8월 31일, 본선적재 부기일이 9월 1일로 기재된 선하증권","D. 특정 비행일자 부기일이 8월 31일, 발행일이 9월 1일로 기재된 항공화물운송장"],"opts":["A, D","A, B, D","B, C","B, C, D"],"ans":3,"passage":null,"topic":"운송"},{"id":"59-2-21","subj":2,"no":21,"head":"다음 국제법규 및 규칙 중에서 국제물품매매계약과 관련된 것으로만 짝지어진 것은?","body":[],"opts":["Vienna Convention － UCP 600 － URC 522","Incoterms 2020 － ICC(2009) － URBPO 750","Incoterms 2020 － CISG － New York Convention","Vienna Convention － Hamburg Rules － Rotterdam Rules"],"ans":3,"passage":null,"topic":"인코텀즈"},{"id":"59-2-22","subj":2,"no":22,"head":"다음 상황을 고려해 수출자 A가 취해야 할 사전 또는 사후의 위험관리방안 중에서 올바른 것을 모두 고른 것은?.","body":["가. 자동차 부품 생산업체인 A는 미국 바이어 B와 수출계약을 체결했다.","나. B가 매수인으로서 계약상 우위에 있기에 결제조건을 O/A 90 days로 합의했다.","다. 별도 계약서를 작성하지 않고 품명, 수량, 가격, 결제, 선적조건 등 기본사항만을 기재한 P/I(Proforma Invoice)로 진행하고 기타 협의가 필요한 사항은 구두로 합의했다.","라. A는 정상적으로 납품했으나, B는 만기일까지 결제하지 않았다.","마. B는 A가 납품한 제품의 하자로 동 제품을 사용해 제작한 완성품도 하자품이 되어서 거래처로부터 손해배상 청구를 받았다고 밝혔다. 이에 B는 오히려 A에게 손해배상을 청구할 수 있다고 주장했다.","바. 결국 A는 B로부터 대금을 받지 않는 조건으로 합의하고 거래를 마무리 지었다.","A. 신용조회 및 수출보험 가입","B. 계약서 작성 시 품질조건을 명확하게 규정","C. P/I를 근거로 중재 신청","D. 공인검사기관 지정","E. 분쟁해결 방법을 서면으로 합의"],"opts":["A, B, C, E","A, B, C, D, E","A, B, D, E","A, B, E"],"ans":3,"passage":null,"topic":"해상보험"},{"id":"59-2-23","subj":2,"no":23,"head":"국제물류 실무에 관한 설명 중 잘못된 것은?","body":[],"opts":["국제물류는 국내물류보다 확대된 영역으로 무역 중심의 생산과 소비가 2개국 이상에 걸쳐 이루어지는 경우, 생산 및 소비의 시간적 공간적 차이를 극복하기 위해 재화를 대상으로 하는 물리적 국제경제 활동이다.","제3자 물류는 외부의 전문 물류업체와 계약을 맺고 물류 업무를 위탁(outsourcing)하는 것이다.","국제물류는 국민경제적 측면에서 수출입물품의 최적 유통과 물류비 절감이 가능해 경제발전과 물가안정에 이바지하고 있다.","최근 홍해 사태로 인해 수에즈 운하 통행이 어려워지면서 수출입업체들이 대부분 항공운송으로 전환함에 따라 항공운임만 폭등하고 있다."],"ans":4,"passage":null,"topic":"운송"},{"id":"59-2-24","subj":2,"no":24,"head":"무역운송 및 운임에 관한 설명 중 잘못된 것은?","body":[],"opts":["Box rate: 화물의 종류나 중량에 관계없이 컨테이너당 정한 운임","BAF: 유가 인상으로 인한 손실을 방지하기 위해 부과되는 유류할증료","Detention charge: 화주가 컨테이너 또는 트레일러를 대여받아 규정된 기간 내에 반환하지 못해 부과되는 벌과금","CBM: FCL cargo에 대해 컨테이너당 부과하는 운임단위"],"ans":4,"passage":null,"topic":"운송"},{"id":"59-2-25","subj":2,"no":25,"head":"선하증권과 해상화물운송장에 관한 내용 중 잘못된 것은?","body":[],"opts":["선하증권은 화물수취증, 운송계약의 증빙, 권리증권의 기능을 한다.","컨테이너 운송에서 선하증권에 부지약관의 내용인 “shipper’s load &amp; count”나 “said by shipper to contain” 또는 비슷한 효력을 갖는 문언이 포함된 운송서류는 수리된다.","Sea Waybill도 Surrender B/L과 마찬가지로 원본 없이 화물을 찾을 수 있는 서류이다.","Sea Waybill은 Master Sea Waybill만 발행될 수 있고 House Sea Waybill은 불가능하다."],"ans":4,"passage":null,"topic":"운송"},{"id":"59-2-26","subj":2,"no":26,"head":"선하증권에 반드시 기재해야 하는 법정 기재 사항이 아닌 것은?","body":[],"opts":["B/L No: 화물의 처리와 서류 취급의 편의를 위해 기재한다. 통상 선적항과 양륙항의 알파벳 첫머리 글자를 이용하고 번호는 일련번호로 쓴다.","Ocean Vessel: 선적한 화물에 대한 권리의 특정성을 부여하기 위해 화물을 수송하는 선박명은 기재한다.","Consignee: T/T 방식에서는 수입자의 상호 및 주소가 기재되지만, 신용장 방식에서는 L/C에 표시된 문구에 따라 주로 지시식(to order)으로 기재된다.","Port of Discharge: 양륙항이 기재되지 않으면 화물을 인도할 곳이 없게 되기 때문에 선적항과 함께 화물의 양륙항 및 국명을 기재한다."],"ans":1,"passage":null,"topic":"운송"},{"id":"59-2-27","subj":2,"no":27,"head":"해상 정기선 컨테이너 해상운임에 관한 내용으로 잘못된 것은?","body":[],"opts":["컨테이너 운임은 해상운임과 컨테이너 처리비용 등의 부대비용이 추가되어 부과된다.","기본운임 중에서 선불운임은 수입자가 선적지에서 운임을 선지급하는 것으로 CIF, CFR 조건 등에 활용되며, 선사는 B/L 발급 시 운임을 징수한다.","THC는 CY 등 터미널에서 화물을 처리할 때 소요되는 비용을 말하며 선사들이 해상운임과 분리해 징수하고 있다.","해상운임에 대해 운송인과 수출입 화주 사이에 인식의 차이가 있으므로 운송계약을 체결할 때 기본운임 외에 추가되는 부대운임을 면밀하게 살펴야 한다."],"ans":2,"passage":null,"topic":"운송"},{"id":"59-2-28","subj":2,"no":28,"head":"해상보험의 정의와 관련 계약의 설명 중 올바른 내용들로만 묶인 것은?","body":["A. 영국해상보험법에는 “해상보험계약은 보험자가 피보험자에 대해 계약에 따라 합의한 방법과 범위 내에서 해상손해, 즉 해상사업에 수반되는 손해를 보상할 것을 인수하는 계약”이라고 정의하고 있다.","B. 해상보험은 18세기 후반에 미국에서 처음 시작되었다.","C. 해상보험을 보험기간에 따라 구분하면 기간보험, 항해보험, 혼합보험 등이 있다.","D. 보험계약자는 보험계약과 관련해 확정 통지를 하면서 필요할 경우, 확정 통지한 목적물에 관한 보험가입증명서를 보험자로부터 발급받을 수 있다.","E. 선명 미확정보험은 보험증권상에 “to be declared”로 표기되며 포괄보험에 속한다."],"opts":["A, B, D","A, D, E","A, B, C","A, C, D"],"ans":4,"passage":null,"topic":"해상보험"},{"id":"59-2-29","subj":2,"no":29,"head":"해상보험증권 구약관과 신약관의 보험조건을 설명한 내용 중 잘못된 것은?","body":[],"opts":["FPA 조건의 담보위험은 화재, 강도, 투하, 폭발 등으로 인한 손해에 보상할 수 있다.","All Risks 조건에서 FPA와 WA 조건의 담보위험 일체와 구약관 면책위험은 제외하고 특약으로 보험자가 수락하면 담보위험으로 처리될 수 있는 전쟁, 파업, 폭동, 내란 등이 있다.","ICC(A)는 구약관의 All Risks 조건의 담보위험과 동일하며, 보상범위가 신․구약관의 6개 보험조건 중에 가장 넓다.","ICC(B) 조건은 ICC(C)보다는 보상범위가 넓으나 구약관의 All Risks보다는 보상범위가 좁다."],"ans":3,"passage":null,"topic":"해상보험"},{"id":"59-2-30","subj":2,"no":30,"head":"해상보험에 대한 설명으로 올바른 것을 모두 고른 것은?","body":["A. Incoterms 2020에서 CIF 조건은 별도 합의가 없다면 매도인이 매수인을 위해 ICC(A) 또는 ICC(A/R) 110%로 부보해야 한다.","B. 구약관은 S.G.Policy와 특별약관 ICC(FPA, WA, A/R) 조건을 말하며, 신약관은 1982년에 제정된 ICC(A, B, C) 조건을 말한다.","C. 구약관에서 담보 범위가 넓은 것에서 좁은 순으로 표시하면 ICC(FPA) → ICC(WA) → ICC(A/R)이다.","D. WA 3%란 손실액이 3% 미만인 경우는 보상하지 않고, WAIOP는 손실액의 다과에 관계없이 보상하는 WA의 특약사항이다.","E. 보험료(insurance premium)는 보험자의 위험부담에 대해 보험계약자가 지급하는 보수를 말한다.","F. 보험금(claim amount)은 담보위험으로 피보험자가 입은 재산상의 손해에 대해 보험자가 지급하는 보상금이다."],"opts":["A, B, C, D","A, B, D, F","B, D, E, F","B, C, D, E"],"ans":3,"passage":null,"topic":"해상보험"},{"id":"59-3-1","subj":3,"no":1,"head":"다음 offer의 내용상 밑줄 친 (A)～(D) 중에서 내용이 부적절한 것은?","body":["We are pleased to offer the article(s) mentioned below as per the conditions and details described as follows.","<table><tr><th>Item No.<\/th><th>Description<\/th><th>Unit<\/th><th>Quantity<\/th><th>Unit Price<\/th><th>Amount<\/th><\/tr><tr><td>NB-1 NB-3<\/td><td>100% Nylon Fabrics 19” length 24” length<\/td><td>yd yd<\/td><td>500 500<\/td><td>US$1.00 US$2.00<\/td><td>US$500.00 US$1,000.00<\/td><\/tr><\/table>","<u>(A) Delivery Term: CFR Busan, Korea<\/u>","<u>(B) Shipment : Within 1 month after receipt of order<\/u>","Destination : New York, USA","Inspection : Maker’s inspection shall be final","<u>(C) Payment : By an irrevocable sight L/C in favor of us<\/u>","<u>(D) Validity : By July 31, 2023<\/u>","We look forward to your valued order for the above offer.","Yours faithfully,"],"opts":["(A)","(B)","(C)","(D)"],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-2","subj":3,"no":2,"head":"다음 offer에 관한 내용 중 올바른 것으로만 짝지어진 것은?","body":["Dear Sirs,","We are pleased to make the below offer:","Description : Duster (Model No. ASD-12)","Quantity : 2,000 pcs","Price : US$12.00/pc CIP Nhasa Shiva sea port in India","(subject to Incoterms 2020)","Shipment : Within 30 days after an order","Payment : By an irrevocable L/C at sight in our favor (subject to UCP 600) Validity : By the end of October, 2023","(A) The seller should dispatch the goods by October 31, 2023 for the performance of the contract.","(B) The seller should procure insurance for ICC(C) if this offer is accepted.","(C) The seller may present a full set of negotiable bills of lading issued and marked freight payable at destination if this offer is accepted.","(D) The seller may determine the shipping port unless otherwise agreed.","(E) This is a firm offer which makes the offeror to be bound if it is validly accepted."],"opts":["(A), (C)","(B), (D)","(C), (D)","(D), (E)"],"ans":4,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-3","subj":3,"no":3,"head":"다음 주문서의 내용 중에서 잘못된 것은?","body":["Dear Mr. Jennings,","Thank you very much for your letter of March 12 with a price list and samples. We are pleased to make our order (No. ABC-123) as below.","Products : strapped casual sandals for women (Catalog No. WXE-34)","Quantity : 2,000 pairs","Unit Price : USD25.00/pair CIP New York (subject to Incoterms 2020)","Total Amount: USD50,000.00","Payment : Draft at 30 days after sight under irrevocable L/C","Shipment : By April 30, 2023","Insurance : ICC(B) to be effected by the seller","Packing : 20 pairs in a carton box","We have instructed our bank to issue a letter of credit for the amount of this order. You will soon hear from Woori Bank in your country."],"opts":["The quality of the goods will be determined when the goods are handed over to the first carrier at a departing place.","The seller should procure an insurance for maximum coverage from the departing place to the arriving place.","An irrevocable acceptance L/C will be issued.","The seller will be advised of issuance of L/C by Woori Bank."],"ans":2,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-4","subj":3,"no":4,"head":"Incoterms 2020이 규정하고 있는 내용만으로 짝지어진 것은?","body":["A. the place of delivery for fulfillment of delivery obligation","B. validity of the contract for carriage","C. the point where the risk is transferred from the seller to the buyer","D. the place where the insurance becomes effective","E. the point when the contract for sales of goods becomes valid"],"opts":["A, C","B, C","A, C, D","B, C, D, E"],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-5","subj":3,"no":5,"head":"다음 서신으로 유추할 수 있는 수출자와 수입자 간의 Incoterms 2020상 정형거래조건에 관한 매매계약 내용으로 잘못된 것은?","body":["Dear Sir/Madam,","Please quote for collection from our company, in Austin, U.S.A. and delivery to Incheon port, the arriving port.","Our goods are:","- 15 rice cookers, 220∼230V","- 20 dressing table assembly kits, packed in wooden boxes","- 20 stool chairs, W31×D31×H46(cm)","The dressing table assembly kits and stool chairs are protected against knocks by wooden boxes and the invoiced value of the goods is US$4,000. The freight will be paid by our customer once the goods are delivered at the arriving port."],"opts":["FCA term may be used in a contract between the seller and the buyer.","The buyer will pay for the carriage from Austin, U.S.A. to the arriving place.","The seller will pay for carriage up to Austin, U.S.A.","The delivery of goods to the buyer takes place at Incheon port."],"ans":4,"passage":null,"topic":"서신·이메일"},{"id":"59-3-6","subj":3,"no":6,"head":"Incoterms 2020의 각 조건에서 매도인의 의무에 관한 설명으로 잘못된 것은?","body":[],"opts":["FCA: The seller fulfills delivery obligation when the goods are loaded on the means of transport arranged by the buyer at the seller’s premises.","CPT: The seller must provide the buyer, at the buyer’s request, with information in the possession of the seller that the buyer needs for obtaining insurance.","DAP: The seller must deliver the goods by placing them at the disposal of the buyer on the arriving means of transport ready for unloading at the named place of destination.","DDP: The seller should clear the goods and pay any cost or duty for import but not for export."],"ans":4,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-7","subj":3,"no":7,"head":"다음 서신의 밑줄 친 (A), (B)에 들어갈 내용이 올바르게 짝지어진 것은?","body":["KITA Co., Ltd.","513, Yeongdong-daero, Gangnam-gu, Seoul, Republic of Korea","Order Sheet","July 1, 2024. Baby &amp; Children Inc.","27, Penrose Avenue, Cherrybrook, NSW,","2126, Australia.","We would like to order the following goods subject to the terms and conditions given below.","Item : Baby Climber","Quantity : 1,500pcs","Shipment : Within 30 days after receipt of your L/C","Payment : By an irrevocable L/C in favour of  <u>(A)<\/u>","and draft at 60 days after sight","Price : USD150.00 CIF  <u>(B)<\/u>","Yours very truly,"],"opts":["(A) KITA Co., Ltd. · (B) port of Incheon","(A) Baby &amp; Children Inc. · (B) port of Sydney","(A) KITA Co., Ltd. · (B) port of Sydney","(A) Baby &amp; Children Inc. · (B) port of Incheon"],"ans":4,"passage":null,"topic":"서신·이메일"},{"id":"59-3-8","subj":3,"no":8,"head":"다음은 무역계약상 어떤 조항에 관한 내용인가?","body":["During the Terms of Agreement, the Franchisee shall not engage, directly or indirectly, either independently or as an employee, on its behalf or in the name for any other person in a similar business in a Territory where it would compete with a member of the franchised network, including the Franchisor."],"opts":["Territorial exclusivity clause","Non-competition clause","Guarantee clause","Technical assistance clause"],"ans":2,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-9","subj":3,"no":9,"head":"다음은 국제물품매매계약서의 일부분이다. 계약서의 내용으로 잘못된 것은?","body":["Art. 2 Characteristics of the goods","2.1 It is agreed that any information relating to the goods and their use, such as weight, dimension, capacities, colors and other data contained in catalogs shall not take effect as terms of the contract unless expressly referred to in the contract.","2.2 Unless otherwise agreed, the buyer does not acquire any property rights in software, drawings, etc. which may have been made available to him.","2.3 It is agreed that the goods are suitable for the purpose for which they are intended by their very nature or which is evident from the contract of sale.","2.4 If express reference is made in the contract of sale to technique, safety, quality or other regulations and documents clearly designated in the agreement, even if not attached to the contract, the seller shall be deemed to have knowledge of these."],"opts":["If both contracting parties do not agree expressly in the contract any information contained in catalogs is not considered as terms of the contract.","The seller does not need to provide the buyer with property rights of drawings which are available to the buyer.","The seller should provide the goods conforming to the purpose which is clearly intended in the contract.","When the seller expressly refers to any other document clearly designated in the contract, if it is not attached to the contract it will be considered that the seller does not have its knowledge."],"ans":4,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-10","subj":3,"no":10,"head":"다음 무역계약서상 밑줄 친 조항(clause) (A～C)의 제목이 올바르게 짝지어진 것은?","body":["(A) <u><\/u>: Should the occurrence of events not contemplated by the parties fundamentally alter the equilibrium of the present contract, thereby placing an excessive burden on one of the parties in the performance of its contractual obligations, that party may proceed as follows:","(B) <u><\/u>: In the event of avoidance of this contract or rejection of the goods, the seller shall be entitled to resell or otherwise dispose of the goods to third parties, regardless of trademarks, designs, patents, copyrights, utility models etc., associated with the goods. The buyer shall not raise any objection to such disposition.","(C) <u><\/u>: If the issuance of the letter of credit is delayed due to causes for which the buyer is liable, the buyer shall pay the seller an amount equivalent to three-tenths of one percent (0.3%) of the amount of the relevant letter of credit for each full week of delay."],"opts":["(A) Force majeure · (B) Secrecy · (C) Claim resolution","(A) Delayed performance · (B) Escalator · (C) Infringement","(A) Hardship · (B) Product release · (C) Liquidated damages","(A) Entire · (B) Infringement · (C) Delayed performance"],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-11","subj":3,"no":11,"head":"다음 국제물품매매계약서의 내용 중에서 잘못된 것은?","body":["11.1 Unless otherwise agreed, the buyer shall examine the goods as soon as possible after their arrival at destination and shall notify the seller in writing of any lack of conformity of the goods within 15 days from the date when the buyer discovers or ought to have discovered the lack of conformity.",".............","13.1 A party is not liable for a failure to perform any of his obligations in so far as he proves:","(a) that the failure was due to an impediment beyond his control, and","(b) that he could not reasonably be expected to have taken into account the impediment and its effects upon his ability to perform at the time of the conclusion of the Contract, and","(c) that he could not reasonably have avoided or overcome it or its effects."],"opts":["별도 합의가 없는 한, 매수인은 물품이 목적지에 도착한 후 15일 이내에 물품의 하자를 매도인에게 통지해야 한다.","계약위반 당사자의 면책을 위해서는 계약을 위반한 당사자가 계약 의무를 이행할 수 없게 된 사유(장애)를 계약 체결 시 합리적으로 고려할 수 없었음을 입증해야 한다.","계약위반 당사자의 면책을 위해서 계약위반 당사자가 장애나 장애로 인한 결과를 극복하는 것이 불가능했음을 입증해야 한다.","계약위반 당사자의 면책을 위해서 계약위반 당사자가 계약 불이행이 본인의 통제를 벗어난 불가항력적 사유로 인한 것임을 입증해야 한다."],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-12","subj":3,"no":12,"head":"다음 신용장에 따라 발행된 용선계약부 선하증권상 출발항과 도착항의 기재가 올바르게 된 것을 모두 고른 것은?","body":["MT700 Issue of a Documentary Credit","44E Port of Loading : Korean Port","44F Port of Discharge : Chinese Port","46A Documents Required","+ Full set of clean on board charter party B/L ......","<table><tr><th><\/th><th>Port of Loading<\/th><th>Port of Discharge<\/th><\/tr><tr><td>A<\/td><td>Incheon port<\/td><td>Chinese port<\/td><\/tr><tr><td>B<\/td><td>Busan port in Korea<\/td><td>Shanghai port in China<\/td><\/tr><tr><td>C<\/td><td>Korean port<\/td><td>Chinese port<\/td><\/tr><tr><td>D<\/td><td>Korean port<\/td><td>Shanghai port<\/td><\/tr><\/table>"],"opts":["A, B","B","B, D","C, D"],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"59-3-13","subj":3,"no":13,"head":"화환신용장의 조건이 아래와 같을 때 올바른 설명은?","body":["MT700 Issue of a Documentary Credit","31D Expiry date and place: 10th, April 2023 in our country","41D Available with ... by : Issuing bank ...by Payment","46A Documents required:","+ Inspection Certificate issued by official inspector","+ Certificate of Origin issued by beneficiary"],"opts":["The beneficiary must present an inspection certificate issued and signed by an inspection company working solely in the importing country.","If the beneficiary presents required documents to seller’s bank within expiry date of the credit, the issuing bank cannot refuse to accept this document on the basis of expiration even if the issuing bank received this documents after 10th April.","The issuing bank cannot refuse to accept an inspection certificate issued by any party including beneficiary.","The issuing bank may accept a certificate of origin issued by chamber of commerce in exporting country."],"ans":4,"passage":null,"topic":"신용장·결제"},{"id":"59-3-14","subj":3,"no":14,"head":"다음 서신에서 밑줄 친 (A)～(D)에 해당하는 당사자로 잘못된 것은?","body":["Dear Mr. Kevin,","<u>(A) We<\/u> have arranged with <u>(B) Barclays Bank<\/u> for an irrevocable Letter of Credit in your favor for US$56,000. <u>(C) You<\/u> will receive the L/C through <u>(D) KEB Hana Bank<\/u> in your city within 10 days."],"opts":["(A) We – applicant","(B) Barclays Bank – issuing bank","(C) You – beneficiary","(D) KEB Hana Bank – paying bank"],"ans":4,"passage":null,"topic":"서신·이메일"},{"id":"59-3-15","subj":3,"no":15,"head":"다음 서신을 바탕으로 올바른 내용으로만 짝지어진 것은?","body":["Dear Sirs,","Thank you for Sales Contract No. AS-32. We found all the particulars to be correct.","We have instructed the National Bank of Dubai to issue an irrevocable L/C for USD35,000 in your favor and this will remain valid until June 20, 2023. This credit will be confirmed by the advising bank, KEB Hana Bank in Seoul and they will accept your draft drawn on them at 60 days after sight for the amount of your invoice.","Of course, we believe that you will execute our order in accordance with the terms in the L/C.","Very truly yours,","(A) A confirmed L/C is issued.","(B) The seller should draw a sight draft.","(C) The amount of the draft should be the same as that of the invoice.","(D) This order is effective by June 20, 2023.","(E) KEB Hana Bank is a paying bank."],"opts":["(A), (C)","(B), (D)","(C), (E)","(D), (A)"],"ans":1,"passage":null,"topic":"서신·이메일"},{"id":"59-3-16","subj":3,"no":16,"head":"다음 대금결제에 관한 설명 중 밑줄 친 (A), (B)에 들어갈 용어가 올바른 것은?","body":["<u>(A)<\/u>  means the handling by banks of documents in accordance with instructions received, in order to deliver documents against payment and/or against acceptance.","<u>(B)<\/u>  is an act of a payee, drawee, endorser or holder of a bill, check, or o he inferior quality to the Busan General Agent of the President Lines, New York, as we believed this was due to rough handling of the bales.","However, an investigation by a licensed INTECO surveyor has revealed that the deterioration is attributable to the coarse raw wool. For further details, please refer to the enclosed surveyor’s report.","Accordingly, we are compelled to make a claim on the matter and to ask you to make up for the deterioration, amounting to US$4,800 specified in the surveyor’s report. Your prompt settlement of this claim will be appreciated.","Faithfully yours,"],"opts":["During transportation, the packaging was damaged, so the quality of goods is not up to that of the samples.","The report written by the INTECO surveyor will be sent upon request.","This letter is sent to the Busan General Agent of the President Lines for claims regarding the quality of wool product.","The writer is claiming compensation for depreciation amounting to US$4,800."],"ans":4,"passage":null,"topic":"서신·이메일"},{"id":"59-3-22","subj":3,"no":22,"head":"위 서신의 밑줄 친 (A)에 들어가기에 적절하지 않은 것은?","body":[],"opts":["After careful investigation, it must have been caused by unskilled packing on our part, and it resulted in the delivery of the wrong consignment.","It appears that it will be impossible to deliver the goods within the date stipulated on account of manufacturer’s labor shortage.","We have contacted the shipping company and found out that they are on strike and the goods are still on board.","Unfortunately, due to unexpected circumstances, there was a delay in production. Consequently, the delivery will be late."],"ans":1,"passage":"59-3-22","topic":"서신·이메일"},{"id":"59-3-23","subj":3,"no":23,"head":"위 비즈니스 메일의 제목으로 적절한 것은?","body":[],"opts":["Claim in quality","Re: Advice of shipment","Apologies for non-performance","Shipment enquiry"],"ans":3,"passage":"59-3-22","topic":"서신·이메일"},{"id":"59-3-24","subj":3,"no":24,"head":"위 서신에 대한 설명으로 올바른 것은?","body":[],"opts":["This letter serves as a reminder about issuance of L/C for the buyer.","According to the contract, the risk of the goods is transferred from the seller to the buyer after on board.","The writer is inquiring about the possibility of adjustment of L/C amount.","To ensure timely delivery, the order needs to be placed by August 31st."],"ans":2,"passage":"59-3-24","topic":"서신·이메일"},{"id":"59-3-25","subj":3,"no":25,"head":"위 서신에 대한 답장 내용으로 적절하지 않은 것은?","body":[],"opts":["Citibank has just notified us that they have received a Letter of Credit(No. HN-701) for your order(No. 2406).","We plan to ship your order on the 21st of this month aboard the M.V. \"Sun Star”.","Unfortunately, a discrepancy between the L/C and our contract regarding the port of shipment is causing us some difficulty in fulfilling your order.","We haven't received any reply from you regarding L/C for your order(No.2406) yet, despite our several previous inquiries. Could you please respond to our request?"],"ans":4,"passage":"59-3-24","topic":"서신·이메일"},{"id":"59-3-26","subj":3,"no":26,"head":"위 서신의 목적으로 가장 적절한 것은?","body":[],"opts":["Report of damaged goods","Request for extended payment terms","Request for substitute products","Claim on delay in shipment"],"ans":4,"passage":"59-3-26","topic":"서신·이메일"},{"id":"59-3-27","subj":3,"no":27,"head":"위 서신의 밑줄 친 (A)에 들어가기에 가장 적절한 문장은?","body":[],"opts":["Considering these circumstances, we propose accepting the shipment with a 20% price reduction.","The enclosed survey report indicates the damage was likely caused by inadequate packaging.","We kindly request that you reship the replacement items at your earliest convenience and at no additional cost to us.","We are unsure of the cause at this time but have initiated an immediate investigation with our shipping partner to determine the reason for the issue."],"ans":1,"passage":"59-3-26","topic":"서신·이메일"},{"id":"59-3-28","subj":3,"no":28,"head":"다음 서신의 내용을 논리 전개에 따라 가장 잘 배열한 것은?","body":["Dear Mr. Lee,","(A) <u>While we were impressed with the samples, unfortunately, your current prices are not competitive with other offers we've received.<\/u>","(B) <u>This lower price would allow you to capitalize on the growing market for wet sheets.<\/u>","(C) <u>Thank you for your email on March 30 offering 5,000 wet sheets for sweaty skin at US$7.50 per piece CIF Bangkok.<\/u>","(D) <u>Our goal is to work with you for the majority of this business; however to do so, we require a more competitive price of approximately US$5.50 per piece.<\/u> We'd appreciate a prompt response to let us know if this revised price is possible. Thank you for your time and consideration.","Sincerely,"],"opts":["(C)－(D)－(A)－(B)","(A)－(C)－(D)－(B)","(C)－(A)－(D)－(B)","(C)－(D)－(B)－(A)"],"ans":3,"passage":null,"topic":"서신·이메일"},{"id":"59-3-29","subj":3,"no":29,"head":"다음 서신의 밑줄 (A)～(D) 중에서 문맥상 가장 어색한 것은?","body":["To whom it may concern:","This letter confirms the shipment of your order No. 56 for Color Television Sets model AB201. The shipment departed on August 30 aboard the M.V. \"Kumgang-ho.\" <u>(A) While we originally planned to use a different vessel, a last-minute cancellation necessitated this change.<\/u> Fortunately, the \"Kumgang-ho\" sailed on the same day as originally planned, ensuring no delay in your order. <u>(B) We are indeed very sorry to have troubled you so much due to the unexpected delay.<\/u>","<u>(C) We've enclosed copies of the following shipping documents for your reference:<\/u> Invoice(3copies), Certificate of Origin(1copy), Bill of Lading(1copy), Packing List(1copy), Insurance Policy(1copy), and Inspection Certificate(1copy).","We trust that the order will arrive in good condition. <u>(D) Please accept our draft upon presentation.<\/u>","We look forward to doing business with you in the future.","Sincerely,"],"opts":["(A)","(B)","(C)","(D)"],"ans":2,"passage":null,"topic":"서신·이메일"},{"id":"59-3-30","subj":3,"no":30,"head":"다음 주어진 문장을 영작한 것 중에서 적절하지 않은 것은?","body":[],"opts":["당사는 선적서류를 오늘 받았고 귀사의 일람불 환어음은 개설은행을 통해 지급되었습니다. ⇒ We have received the shipping documents today and your sight draft was duly honored by the L/C issuing bank.","포장을 뜯자마자 당사는 물품의 색상이 샘플의 색상과 같지 않음을 발견했습니다. ⇒ Upon unpacking the goods, we found that the colors of the goods are not the same as those of the sample.","당사는 이 클레임이 대한상사중재원의 중재규정에 의해 해결되기를 바랍니다. ⇒ We hope that this claim will be settled in accordance with the arbitration rules of the Korean Commercial Arbitration Board.","이 물품을 당사가 반송해야 하는지 또는 20퍼센트 할인해서 판매할 수 있도록 할 것인지 알려주십시오. ⇒ Please let us know if you want us to replace the goods or let us sell them at a discount of 20 percent."],"ans":4,"passage":null,"topic":"서신·이메일"}],"p":{"59-3-22":{"head":"다음 비즈니스 서신의 내용을 읽고 질문에 답하시오.","body":["Dear Sir:","We would like to express our sincere regret for your complaint of August 10, that we have not yet been able to execute your order No. 381.","<u>(A) .<\/u>","However, we have been doing everything possible in our power to deliver the goods within a week, and are now arranging for shipment.","We assure you that we will take every precaution against such trouble arising in the future.","Yours faithfully,"]},"59-3-24":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Sirs,","We're pleased to let you know that we have instructed our Gangnam Branch in Seoul to open an irrevocable Letter of Credit for US$300,000 in your favor. This credit will remain valid until August 31 at our bank, KB Bank. A notification will be sent through Citibank via registered mail in the coming days.","To ensure smooth processing of the payment, please attach the following documents to your sight draft when presented through your bank: Full sets of Bill of Lading, three commercial invoices, one insurance policy, three packing lists, and certificates along with the list of weight and/or measurement.","Since you quoted us a CIF Busan price, the credit amount will cover your invoice, freight, and insurance costs.","We trust that you will fulfill our order(No.2406) for six hundred units of your DB400S7B i3-7 computer model, maintaining the excellent service we have come to expect.","Yours truly,"]},"59-3-26":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Mr. Chang","We're writing to follow up on your email regarding Order No. 156. In the email, you mentioned airmailing our special neckties via American Airlines on December 10, with an estimated arrival a week before Christmas.","Unfortunately, the shipment only arrived yesterday, three weeks behind schedule. We didn't receive any follow-up email explaining about the delay.","As you may recall, we emphasized the importance of receiving the goods by December 20th at the latest to ensure they were available for Christmas sales. Due to the delay, we now have excessive stock.","<u>(A)<\/u>","We would appreciate it if you could explain the reason for the delay and let us know if you are open to our proposal.","Sincerely,"]}}},"60":{"date":"2024.11","q":[{"id":"60-0-1","subj":0,"no":1,"head":"대외무역법령에서 규정하고 있는 수출입의 정의가 잘못된 것은?","body":[],"opts":["사용대차(使用貸借), 증여 등 무상거래라도 국내에서 외국으로 물품이 이동하는 것은 수출이다.","보세판매장에서 외국인에게 국내에서 수리 또는 개조된 물품을 매도하는 것은 수출이 아니다.","외국에서 외국으로 유상 인수하는 물품 중에서 산업통상자원부 장관이 정해 고시하는 기준에 해당하는 것은 수입이다.","거주자가 비거주자에게 산업통상자원부 장관이 정해 고시하는 방법으로 대통령령으로 정하는 용역을 제공하는 것은 수출이다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"60-0-2","subj":0,"no":2,"head":"대외무역법상 무역 관련 시설에 해당하지 않는 것은?","body":[],"opts":["일정 기준을 충족하는 무역견본품을 전시할 수 있는 시설과 기준 인원을 수용할 수 있는 회의실을 갖춘 무역전시장","무역전문인력을 양성할 수 있는 시설로 일정 규모를 갖춘 무역연수원","회의용 시설로서 연면적과 최대 수용인원에서 일정 규모를 갖춘 컨벤션센터","문화체육관광부 장관의 추천에 의해 산업통상자원부 장관이 지정한 외화획득 및 관광진흥에 기여도가 높은 관광시설"],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"60-0-3","subj":0,"no":3,"head":"대외무역법령상 다음 설명에 해당하는 특정 거래형태로 올바르게 연결된 것은?","body":["A. 가공임을 지급하는 조건으로 외국에서 가공할 원료의 전부 또는 일부를 거래 상대방에게 수출하거나 해외에서 조달해 가공한 후 가공물품 등을 수입하거나 외국으로 인도하는 수출입","B. 수출할 것을 목적으로 물품 등을 수입해 보세구역 및 자유무역지역 이외의 국내에 반입하지 않고 수출하는 무역","C. 수출대금은 국내에서 영수하지만 국내에서 통관되지 않은 수출물품 등을 외국으로 인도하거나 제공하는 수출"],"opts":["A. 위탁가공무역 B. 중계무역 C. 외국인도수출","A. 위탁가공무역 B. 연계무역 C. 임대수출","A. 수탁가공무역 B. 중개무역 C. 외국인도수출","A. 수탁가공무역 B. 연계무역 C. 위탁판매수출"],"ans":1,"passage":null,"topic":"대외무역법"},{"id":"60-0-4","subj":0,"no":4,"head":"대외무역법령에서 규정하고 있는 수출‧수입실적의 인정 범위에 대한 설명으로 올바른 것은?","body":[],"opts":["대북한 유상 반출실적은 수출실적에서 제외한다.","해외건설공사에 직접 사용되는 원료ㆍ기재, 공사용 장비 또는 기계류를 수출한 후 재반입을 하는 경우는 수출실적으로 인정된다.","산업통상자원부 장관이 지정하는 생산자의 수출물품 포장용 골판지상자의 공급은 수출실적으로 인정된다.","외국인으로부터 대금을 영수하고 외화획득용 시설기재를 외국인과 임대차계약을 맺은 국내업체에 인도하는 경우는 수출실적으로 인정되지 않는다."],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"60-0-5","subj":0,"no":5,"head":"대외무역법령상 외화획득용 원료‧기재의 수입자는 부득이한 사유로 당초 목적 외의 용도로 사용하려면 승인을 받아야 한다. 당초 목적 외의 용도로 사용할 수 있는 부득이한 사유로 올바른 것을 모두 고른 것은?","body":["A. 제품 생산을 수탁한 공장의 도산 등으로 인해 생산이 지연되는 경우","B. 화재나 천재지변에 따라 외화획득 이행이 불가능하게 된 경우","C. 해당 품목이 수입승인 대상에서 제외되어 수입에 대응하는 외화획득을 이행할 필요가 없는 경우","D. 수입된 원료가 형질이 변해 외화획득 이행물품의 생산에 사용할 수 없게 된 경우E. 외화획득용 원료·기재로 생산된 물품 등의 제조에 고도의 기술이 필요해 외화획득이행에 앞서 시험제품을 생산할 필요가 있는 경우"],"opts":["A, B, E","B, C, D","B, D, E","C, D, E"],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"60-0-6","subj":0,"no":6,"head":"대외무역법령에서 규정하고 있는 원산지 표시에 관한 설명으로 잘못된 것은?","body":[],"opts":["원산지를 특정하기 어려운 물품으로, 중고물품의 경우에는 “Imported from 국명”으로 원산지를 표시할 수 있다.","진열용 견본품이나 개인이 자가소비용으로 수입하는 물품으로서 세관장이 타당하다고 인정하는 물품일 경우, 원산지를 표시하지 않을 수 있다.","밀봉된 의약품과 같이 상거래 관행상 최종구매자에게 포장, 용기에 봉인되어 판매되는 수입물품은 해당 물품의 최소포장, 용기 등에 원산지를 표시할 수 있다.","원산지 표시 대상 물품은 “국명 산(産)”, “국명 제(製)”, “Product of 국명”, “Made by 물품 제조자의 회사명, 주소, 국명” 등으로 원산지를 표시할 수 있다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"60-0-7","subj":0,"no":7,"head":"대외무역법령상 수입수량 제한조치에 관한 설명으로 올바른 것은?","body":[],"opts":["수입수량 제한조치는 조치 시행일 3년 전부터 수입된 물품부터 적용하며, 적용기간은 4년을 넘어서는 안 된다.","산업통상자원부 장관이 수입수량을 제한하는 경우 제한수량은 ‘기준 수량’ 미만으로 해야 하며, 해당 산업의 심각한 피해를 방지하거나 구제하기 어렵다고 명백히 인정될 때만 기준 수량 이상으로 제한할 수 있다.","산업통상자원부 장관은 시행 중인 수입수량 제한조치에 대해 무역위원회가 조치내용 변경이나 적용기간 연장을 건의하면 건의 접수일부터 1개월 안에 결정하고 결과를 통보해야 한다.","수입수량 제한조치의 적용기간을 연장하는 때에는 해당 조치의 적용기간과 덤핑방지관세 또는 상계관세의 부과기간 및 연장기간을 전부 합산한 기간이 8년을 넘어서는 안 된다."],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"60-0-8","subj":0,"no":8,"head":"내국신용장과 구매확인서에 관한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 내국신용장은 산업통상자원부 장관이 정하는 바에 따라 외국환은행의 장이 발급해 국내에서 통용되는 신용장이다.","B. 구매확인서를 발급받으려는 자가 전산 설비를 갖추지 못했거나 기타 부득이한 사유로 전자문서를 작성하지 못하는 때에는 외국환은행의 장에게 위탁해 신청할 수 있다.","C. 국내에서 외화획득용 원료·기재를 구매하려는 자는 한국은행 총재 또는 전자무역 기반사업자에게 구매확인서 발급을 신청할 수 있다.","D. 외국환은행의 장 또는 전자무역 기반사업자는 외화획득용 원료·기재 구매확인서를 전자무역문서로 발급하고 신청자에게 해당 사실을 통보할 때 승인번호, 개설 및 통지일자, 발신기관 전자서명 등 최소한의 사항만 알릴 수 있다.","E. 외국환은행의 장 또는 전자무역 기반사업자는 2차 구매확인서를 발급할 수 있으며, 외화획득용 원료·기재의 제조·가공·유통(완제품의 유통 포함)과정이 여러 단계인 경우에는 각 단계별로 순차로 발급할 수 있다."],"opts":["A, D","C, D","B, E","D, E"],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"60-0-9","subj":0,"no":9,"head":"관세법령상 품목분류체계 및 품목분류사전심사 신청에 관한 설명으로 올바른 것은?","body":[],"opts":["법적인 목적상 품목분류는 부(部)·류(類)·절(節)의 표제, 각 호(號)의 용어와 관련 부나 류의 주(註)에 따라 결정한다.","HS 품목분류의 법적 구속력이 있는 것은 통칙, 주의 규정과 호와 소호의 용어이다. 이 중 호(heading)는 류(chapter)에 속한 전체 물품을 각각 6단위의 번호로 나눈 것이다.","HS 품목분류표의 분류체계는 부, 류, 호, 소호로 세분되며, 10단위 코드인 HSK는 우리나라 관세통계통합품목분류표에서 추가 세분류한 것이다.","품목분류사전심사 신청을 받은 관세청장은 신청 접수일부터 30일 안에 해당 물품에 적용될 품목분류를 심사해 신청인에게 통지해야 한다. 통지를 받은 자는 통지일로부터 60일 이내에 재심사를 신청할 수 있다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"60-0-10","subj":0,"no":10,"head":"관세법상 용어의 정의 중에서 올바른 것은?","body":[],"opts":["복합환적은 동일한 세관의 관할 구역에서 입국 또는 입항하는 운송수단에서 출국 혹은 출항하는 운송수단으로 물품을 옮겨 싣는 것을 말한다.","입항 전 수입신고가 된 물품은 내국물품으로 간주한다.","탁송품은 상업서류, 견본품, 자가사용물품 등을 국제무역선(기) 또는 국경출입차량을 이용한 물품의 송달을 업으로 하는 자(물품을 휴대해 반출입하는 것을 업으로 하는 자를 포함)에게 위탁해 국내에 반입하거나 외국으로 반출하는 물품이다.","우리나라와 FTA를 체결한 국가의 선박으로 공해상에서 채집 또는 포획한 수산물을 국내에 반입하는 것은 관세법상 수입이다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"60-0-11","subj":0,"no":11,"head":"관세법상 기간 및 기한의 계산에 관한 내용으로 잘못된 것은?","body":[],"opts":["관세법상 기간을 계산할 때 수입신고 수리 전 반출승인을 받은 경우, 반출일을 수입신고의 수리일로 본다.","기한이 토요일 및 일요일인 경우에 그 다음날을 기한으로 한다.","기간의 계산은 관세법에 특별한 규정이 있는 것을 제외하고는 ‘민법’에 따른다.","국가관세종합정보시스템, 연계정보통신망 또는 전산처리설비가 대통령령으로 정하는 장애로 가동이 정지돼 관세법에 따른 기한까지 관련 신고, 신청, 승인, 허가, 수리, 교부 등을 할 수 없게 되는 경우에 장애가 복구된 날의 다음날을 기한으로 한다."],"ans":1,"
