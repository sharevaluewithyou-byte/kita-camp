거래만 가능하고 투기거래는 허용되지 않는다.","C. 거래하는 사람들은 상대방에 대한 신용위험을 부담해야 한다.","D. 거래단위와 만기 결제일은 상대방이 동의하면 자유롭게 결정할 수 있다."],"opts":["A","B, C","A, C","B, D"],"ans":1,"passage":null,"topic":"외환·환리스크"},{"id":"62-1-28","subj":1,"no":28,"head":"다음 중 한국무역보험공사에서 취급하는 수출기업의 일반형 환변동보험에 대한 설명으로 가장 적절하지 않은 것은?","body":[],"opts":["신용도가 낮거나 금액이 적어서 은행과의 선물환거래가 힘든 중소기업의 환리스크 관리를 위해 개발되었다.","결제환율은 미래의 환율을 미리 확정하는 환율로 계약 당시의 현물환율과 스왑레이트를 감안하여 결정된다.","만기에 보장환율이 결제환율보다 높으면, 수출기업은 보장환율과 결제환율의 차이를 보험금으로 수령한다.","만기에 결제환율이 보장환율보다 높으면, 수출기업은 보장환율과 결제환율의 차이를 한국무역보험공사에 지불해야 한다."],"ans":2,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"62-1-29","subj":1,"no":29,"head":"다음 한국의 ㈜을화패션이 사용하고 있는 환리스크 관리기법은 무엇인가?","body":["A. ㈜을화패션은 국내에서 원단을 베트남 공장으로 보내 의류를 만들어 국내로 들여와 판매하고 있다.","B. 국내 본사는 베트남 현지 공장에 총 USD 1,200,000상당의 원단을 3차례에 걸쳐 공급했다.","C. 베트남 공장으로부터 총 USD 2,100,000상당의 의류를 4차례에 걸쳐 납품받았다.","D. 본사와 현지 공장은 매번 결제하지 않고 USD 900,000을 한 번에 송금하기로 했다.","E. 이 회사는 환전과 송금수수료를 줄이고 환노출을 USD 900,000으로 줄일 수 있었다."],"opts":["매칭(matching)","상계(netting)","리딩과 래깅(leading and lagging)","자산․부채관리(asset-liability management)"],"ans":2,"passage":null,"topic":"외환·환리스크"},{"id":"62-1-30","subj":1,"no":30,"head":"(주)한국무역은 다음과 같은 조건으로 3개월 만기 달러 콜옵션(유럽식)을 매도하였다. 3 개월 이후 옵션 만기일에 USD/KRW 현물환율이 1,490원으로 결정되었다면, 옵션 프리미엄을 고려할 때 결과적으로 이 회사가 달러를 매도한 환율은 얼마인가? (환율표시에서 앞의 통화가 기준통화)","body":["<table><tr><th>구분<\/th><th>환율, 프리미엄<\/th><\/tr><tr><td>USD/KRW 현물환율<\/td><td>1,490<\/td><\/tr><tr><td>행사가격<\/td><td>1,450<\/td><\/tr><tr><td>옵션 프리미엄<\/td><td>달러당 30원<\/td><\/tr><\/table>"],"opts":["1,450","1,470","1,480","1,490"],"ans":3,"passage":null,"topic":"외환·환리스크"},{"id":"62-2-1","subj":2,"no":1,"head":"국제거래의 기본인 계약자유의 원칙을 국제상사계약원칙의 근거로 설명한 것 중에서 잘못된 것은?","body":[],"opts":["당사자는 자유로이 계약을 체결하고, 계약의 상대방을 선택할 자유가 있다.","당사자가 계약의 내용을 결정하는데 강행규정에 의한 제한은 고려하지 아니한다.","계약이나 진술, 그 밖의 어떠한 행위가 특정한 방식(form)으로 행해지거나 증명될 것을 요구하지 않는다.","유효하게 체결된 계약은 양 당사자를 구속하지만, 계약조건, 당사자 합의 또는 국제상사계약원칙에 따라서 유효하게 성립된 계약의 변경이나 종료도 가능하다."],"ans":2,"passage":null,"topic":"계약 성립·CISG"},{"id":"62-2-2","subj":2,"no":2,"head":"Incoterms 2020의 조건에 관한 설명으로 잘못된 것은?","body":[],"opts":["DAT(터미널인도조건)를 DPU(도착지양하인도조건)로 변경하였다.","CIF는 ICC(A) 조건으로 부보 수준을 강화하였고, CIP는 ICC(C) 조건을 유지하였다.","FCA와 D 조건에서 운송의무 및 비용 조항에 보안 관련 요건을 포함시켰다.","FCA에서 당사자의 합의로 본선적재 표시가 있는 선하증권을 요구할 수 있도록 하였다."],"ans":2,"passage":null,"topic":"인코텀즈"},{"id":"62-2-3","subj":2,"no":3,"head":"Incoterms 2020의 조건별 기준에 관한 설명 중 잘못된 것은?","body":[],"opts":["EXW · 위험의 분기점 (Seller→Buyer) 매도인 작업장 구내 · 비용의 분기점 (Seller→Buyer) 매도인 작업장 구내 · 수출통관 의무 매수인 · 항공운송 사용 가능","FCA · 위험의 분기점 (Seller→Buyer) 매수인이 지정한 운송인에게 인도 · 비용의 분기점 (Seller→Buyer) 수출지에서 운송인에게 인도 · 수출통관 의무 매도인 · 항공운송 사용 가능","CFR · 위험의 분기점 (Seller→Buyer) 지정선적항 본선 적재 · 비용의 분기점 (Seller→Buyer) 지정선적항 본선 적재 · 수출통관 의무 매도인 · 항공운송 사용 불가","DDP · 위험의 분기점 (Seller→Buyer) 수입국 내 목적지점 반입 · 비용의 분기점 (Seller→Buyer) 수입국 내 목적지점 반입 (관세 불포함) · 수출통관 의무 매수인 · 항공운송 사용 가능"],"ans":4,"passage":null,"topic":"인코텀즈"},{"id":"62-2-4","subj":2,"no":4,"head":"Vienna Convention(1980)의 적용 범위에 관한 설명으로 잘못된 것은?","body":[],"opts":["해당 협약의 적용 여부를 결정하는 데에 당사자나 계약의 민사적·상사적 성격을 고려해야 한다.","당사자는 협약의 적용을 배제할 수 있다.","매매된 물품의 소유권에 관하여 계약이 미치는 효력에는 관련이 없다.","물품으로 인하여 발생한 사람의 상해에 대한 매도인의 책임에는 적용되지 않는다."],"ans":1,"passage":null,"topic":"계약 성립·CISG"},{"id":"62-2-5","subj":2,"no":5,"head":"Vienna Convention(1980)에서 규정한 본질적 계약위반에 관한 설명으로 올바른 것은?","body":[],"opts":["위반 당사자가 계약위반의 결과를 예견하지 못했더라도 실질적 손실이 있는 경우에는 본질적인 위반이다.","분할선적을 허용한 계약에서 특정 분할분의 의무 불이행이 그 분할 부분의 본질적 계약위반에 해당한다면 전체 계약에 대해서 해제할 수 있다.","이행기일 이전에도 상대방의 본질적 계약위반이 명백한 경우에는 계약을 해제할 수 있다.","매수인에게 위험이 이전되었다면 매도인이 본질적 계약위반을 한 경우라도 권리구제의 행사를 할 수 없다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"62-2-6","subj":2,"no":6,"head":"국제계약 관련 규칙인 CISG와 UNIDROIT 원칙에 대한 설명 중에서 잘못된 것은?","body":[],"opts":["CISG는 1980년에 UNCITRAL(UN국제거래법위원회)이 제정한 국제물품매매계약에 관한 협약(국제조약)이다. UNIDROIT 원칙은 1994년에 UNIDROIT(국제사법통일협회)가 제정한 국제상사계약을 위한 원칙이다.","CISG는 국제법으로서 제정 이후 개정되지 못하였지만, UNIDROIT 원칙은 각국의 학자들이 만든 원칙으로 지금까지 여러 번 개정되는 유연성을 보였다.","국제계약을 체결하는 당사자는 준거법(governing law)으로 CISG를 선택할 수 있지만, UNIDROIT 원칙은 선택할 수 없다.","CISG는 국제물품매매에만 사용될 수 있지만, UNIDROIT 원칙은 물품 및 서비스의 거래를 포함한 대부분 국제상사계약에 사용될 수 있다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"62-2-7","subj":2,"no":7,"head":"무역계약의 법률적 성격에 관한 설명으로 잘못된 것은?","body":[],"opts":["무역계약은 매매 당사자의 합의 외에 소유권 이전 등과 같은 법률적 사실이 있어야 성립된다.","무역계약은 매매 당사자 쌍방이 각각의 계약상 의무를 부담한다.","무역계약은 형식에 상관없이 의사를 전달함으로써 계약을 성립할 수 있다.","무역계약은 매매 당사자가 상호 간에 대가적 관계에 있는 급부를 할 것을 목적으로 성립된다."],"ans":1,"passage":null,"topic":"계약 일반"},{"id":"62-2-8","subj":2,"no":8,"head":"다음 중 청약(offer)에 대한 설명으로 올바른 것으로만 짝지어진 것은?","body":["A. 청약은 유효기간의 설정이나 철회 불가 의사 등 구속력의 유무에 따라 확정청약과 불확정청약으로 구분될 수도 있다.","B. 확정청약은 피청약자가 청약의 유효기간 내에 승낙하면 계약이 성립된다.","C. 불확정청약은 청약 자체에 구속력이 없으므로 상대방의 승낙에 따라 계약이 성립된다.","D. 청약은 거절, 취소, 당사자의 사망, 단순한 추가 청약의 발송에 의해 소멸된다."],"opts":["A, B","B, C","C, D","A, D"],"ans":1,"passage":null,"topic":"계약 성립·CISG"},{"id":"62-2-9","subj":2,"no":9,"head":"청약자가 구두 청약(oral offer)으로 상대방에게 승낙은 반드시 서면(in writing)으로 하라고 했지만 피청약자가 구두(oral)로 승낙한 경우, 이에 대한 해석으로 옳은 것은?","body":[],"opts":["구두 승낙도 승낙(acceptance)으로 인정되어 계약이 성립된다.","구두 승낙은 새로운 청약(counter offer)으로 인정되지 않는다.","구두 승낙은 청약의 거절로 인정되지 않는다.","구두 승낙은 승낙의 거절과 새로운 청약(counter offer)으로 인정된다."],"ans":4,"passage":null,"topic":"계약 성립·CISG"},{"id":"62-2-10","subj":2,"no":10,"head":"CISG와 UNIDROIT 원칙을 기준으로 국제상사계약의 성립에 대한 설명 중 잘못된 것은?","body":[],"opts":["계약은 청약에 대한 승낙에 의하거나, 합의를 보여주기에 충분한 당사자의 행위로 체결될 수 있다.","상시 거래관계에 있는 당사자가 「일정 기한까지 응답하지 않으면 승낙으로 간주한다」는 청약을 받고, 기한 내에 아무런 응답을 하지 않으면 승낙한 것으로 본다.","청약의 효력은 의사표시가 상대방에게 도달한 때 발생한다는 점에서 CISG와 UNIDROIT는 동일하다.","청약은 계약을 성립하기에 충분하게 확정적이고, 상대방이 승낙하면 그에 구속된다는 청약자의 의사표시가 있어야 한다."],"ans":2,"passage":null,"topic":"계약 성립·CISG"},{"id":"62-2-11","subj":2,"no":11,"head":"특수한 거래형태의 수출입에 대한 설명으로 잘못된 것은?","body":[],"opts":["외국인도수출은 물품이 외국에서 외국으로 이동하는 1건의 수출거래이고, 중계무역은 반드시 물품을 국내로 반입하는 수입과 제3국으로 수출하는 2건의 거래로 구성된다.","중계무역과 중개무역은 중간에 개입한 자의 자격이 계약관계에서의 본인인지 아닌지에 따라 구분된다.","구상무역은 하나의 계약서로 거래가 이루어지고, 대응 수입 의무를 제3국에 전가할 수 있다.","대응구매는 수출과 수입이 별도의 계약서로 거래가 이루어지고, 대응 수입 의무를 제3국에 전가할 수 있다."],"ans":1,"passage":null,"topic":"계약 일반"},{"id":"62-2-12","subj":2,"no":12,"head":"무역계약의 기본조건 중 수량측정단위(개수)에 관한 설명이 잘못된 것은?","body":[],"opts":["dozen = 12 pieces","gross dozen = 12 dozen = 12×12 pieces","small gross = 12 dozen = 12×10 pieces","great gross = 12×12×12 pieces"],"ans":3,"passage":null,"topic":"거래조건"},{"id":"62-2-13","subj":2,"no":13,"head":"다음 중 견본매매(sales by sample)에 관한 설명으로 올바른 것은?","body":[],"opts":["Original sample은 수출자가 운송인의 검사를 거친 후, clean B/L을 수취하여 수입자에게 제공하는 견본이다.","Buyer’s sample은 수출자가 품질확인을 위해 수입자에게 보내는 견본이다.","Counter sample은 견본을 수령한 자가 색상·규격 등 original sample의 일부 또는 전부를 수정하여 제시하는 견본이다.","Duplicate sample은 임상시험이나 연구 목적으로만 사용되는 의약품이나 동물용 의료기기를 위한 견본이다."],"ans":3,"passage":null,"topic":"운송"},{"id":"62-2-14","subj":2,"no":14,"head":"무역계약의 주요 조건에 대한 설명으로 잘못된 것은?","body":[],"opts":["“Packing shall be in export standard packing”이라 할 때 포장의 견고성에 대한 의무는 매도인에게 부과된다.","Approximate Quantity 조건은 D/P나 D/A 등과 같은 추심결제방식에서 수량의 10%의 과부족을 기본으로 인정한다.","컨테이너 복합운송은 일반적으로 Berth term이 적용되므로 선적과 양하 비용이 별도로 발생하지 않는다.","계약체결의 당사자로서 책임 소재를 분명히 하기 위해서 “Privity of contract” 또는 “Principal to principal basis”를 약정한다."],"ans":2,"passage":null,"topic":"계약 일반"},{"id":"62-2-15","subj":2,"no":15,"head":"다음 중 무역계약과 관련된 내용에 대한 설명으로 올바른 것은?","body":[],"opts":["비밀유지계약(Non-Disclosure Agreement)은 본 협상에 앞서 체결되며, 협상이 결렬되면 동 계약서에 설정된 기간과 상관없이 효력이 소멸된다.","의향서(LOI)는 계약체결 또는 협상 전 단계에서 일방이 계약체결을 위한 적극적인 관심을 보이는 의사표시에 불과하므로 LOI의 구체적인 내용과 상관없이 법적인 구속력은 없다.","계약서의 표제(Title)는 계약 내용 전체를 대표하는 용어가 사용되므로 계약 내용과 일치하는 용어를 사용하여야 한다. 만약 표제를 계약 내용과 다르게 기재하거나 기재하지 않으면 그 계약서는 무효가 될 수 있다.","포괄계약은 반복 거래를 전제로 일반거래조건을 미리 정해두는 계약이며, 이후 개별 거래는 해당 조건에 따라 청약과 승낙을 통해 확정된다."],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"62-2-16","subj":2,"no":16,"head":"무역계약 체결에 사용되는 서식(form)에 대한 설명 중에서 가장 올바른 것은?","body":[],"opts":["MOU(양해각서)라는 명칭을 사용하고 있다면, 공식적인 계약체결 이전단계의 서식이므로 내용과 상관없이 법적 문서로서 구속력이 없다.","Master contract(포괄계약서)를 가지고 해당 건의 물량, 가격 등을 확정하는 청약서나 주문서 없이도 바로 수출입을 할 수 있다.","견적송장(Proforma Invoice)을 사용했다면 계약이 주요 조건을 제시하고, 상대방이 이를 승낙 했더라도 계약서로서 효력은 없다.","무역계약의 약식 형태로서 매도인이 작성하는 청약서(Offer sheet)와 매수인이 작성하는 구매주문서(Order sheet)가 사용된다."],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"62-2-17","subj":2,"no":17,"head":"다음은 일반거래조건약정서(Agreement on General Terms Conditions of Business)의한 조항이다. 해당 조항과 관련이 깊은 내용은?","body":["Title to the product sold by the seller shall transfer to the buyer only upon the seller’s receipt of full payment as specified in this agreement or the applicable individual contracts."],"opts":["Delivery of Goods","Transfer of risk","Payment of Proceeds","Title of Product"],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"62-2-18","subj":2,"no":18,"head":"다음의 상황에 대비하기 위해서 매도인이 취할 수 있는 계약조항 및 대응방안으로올바른 것을 모두 고른 것은?","body":["1. COMMODITY: 1 SET OF CONCRETE BOOM PUMP","2. PRICE : USD 300,000.00","3. PAYMENT : D/A 120 DAYS","4. 분쟁 내용:","① 매수인이 선적서류를 인수했으나, 계약 당시 매도인이 시세보다 가격을 높게 책정하였음을 이유로 대금결제 지연","② 계약 당시에는 수입국가의 건설경기가 좋았지만 현재는 악화되어 매수인은 원래 수입가격으로는 판매가 거의 불가능","5. 매수인의 요구: 계약금액의 30% 할인","6. 매도인의 주장: 계약금액의 10% 할인 수용","A. NON-WAIVER CLAUSE B. LIMIT OF LIABILITY CLAUSE","C. CREDIT INQUIRY D. K-SURE에 수출보험 가입","E. L/C PAYMENT F. 수입국 MARKET RESEARCH"],"opts":["B, C, D, E","A, C, E, F","C, D, E, F","B, C, D, F"],"ans":3,"passage":null,"topic":"해상보험"},{"id":"62-2-19","subj":2,"no":19,"head":"상사중재에 관한 설명으로 올바른 것은?","body":[],"opts":["유효한 중재계약은 법원에 소송을 제기할 수 없는 직소 금지의 효력이 있다. 다만, 중재계약의 무효, 효력상실, 이행불능의 경우에는 소송의 제기가 가능하다.","중재조항이 포함된 계약서의 주요 부분이 어떠한 사유로 무효가 된 경우에는 중재조항도 무효가 된다.","상사중재는 전문가에 의한 판단, 단심제, 신속한 분쟁해결, 중재절차의 공개, 외국에서의 강제집행 가능, 저렴한 비용 등을 특징으로 한다.","중재합의가 유효하게 성립하려면 중재조항에 중재지, 중재기관, 중재인, 중재 사용언어가 반드시 포함되어야 한다."],"ans":1,"passage":null,"topic":"클레임·분쟁"},{"id":"62-2-20","subj":2,"no":20,"head":"다음 중 매도인 ‘Y’의 계약위반에 대해서 매수인 ‘X’가 취할 수 있는 구제수단으로잘못된 것은? (Vienna Convention 1980을 준거법으로 한다.)","body":["A. 매수인 ‘X’는 과일 통조림 제조를 위해서 미국의 매도인 ‘Y’와 오렌지 수입 계약을 체결하였다.","B. ‘X’는 제품을 인수한 후, 일부 오렌지가 계약 품질에 미치지 못하는 불량품임을 확인하였다.","C. 이에 ‘X’는 ‘Y’에게 클레임을 제기하고 적절한 조치를 요구하였다."],"opts":["대체품 인도 청구","대금감액 청구","이행기간 연장","하자보완 청구"],"ans":1,"passage":null,"topic":"계약 성립·CISG"},{"id":"62-2-21","subj":2,"no":21,"head":"다음 중 청약자 ‘X’와 피청약자 ‘Y’의 무역계약 협상에 대한 설명으로 올바른 것은?","body":["(Vienna Convention 1980을 적용하기로 한다.)","A. 5월 1일: X는 Y에게 모니터 100개, UNIT PRICE USD 100, 계약체결일로부터 60일 이내에 선적, 청약일로부터 15일 이내에 승낙하는 조건으로 청약","B. 5월 20일: Y는 X에게 모니터 200개, UNIT PRICE USD 80, 계약체결일로부터 30일 이내에 선적조건으로 승낙","C. 5월 21일: X는 Y에게 모니터 200개, UNIT PRICE USD 100, 계약체결일로부터 60일 이내에 선적, 5월 31일까지 승낙하는 조건","D. 5월 31일: Y는 X에게 USD 16,000 전신송금 완료"],"opts":["5월 20일에 Y가 X의 5월 1일자 청약에 대해서 승낙하면서 계약이 성립되었고, 계약금액은 5월 31일에 전신송금 되었다.","5월 1일에 X가 보낸 청약은 확정청약인데 5월 21일 X가 발송한 청약서의 조건은 수량이 200개로 변경되어 있다. 따라서 5월 21일자 X의 청약은 무효이므로 Y가 유효기간 이내에 승낙하더라도 계약은 성립되지 않는다.","5월 1일 X가 발송한 청약에 대해 5월 20일자 Y의 승낙은 무효이고, X의 5월 21일 청약에 대해서 Y가 5월 31일에 USD 16,000을 전신송금하였으므로 계약은 성립되지 않는다.","5월 21일에 X가 보낸 청약에 대해서 Y가 5월 31일에 전체 계약금액의 일부 금액인 USD 16,000을 전신으로 송금하였으므로 5월 31일에 계약이 성립되었다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"62-2-22","subj":2,"no":22,"head":"우리나라 무역거래자가 금액 기준으로 상대적으로 사용이 가장 많은 정형거래조건과 세관에서 수출입 통계를 집계하는 기준으로 사용되는 정형거래조건은?","body":[],"opts":["FOB · CIF · FOB · CIF","FCA · CPT · FCA · CPT","CFR · CIF · CIF · FOB","EXW · DAP · EXW · DDP"],"ans":1,"passage":null,"topic":"계약 일반"},{"id":"62-2-23","subj":2,"no":23,"head":"무역계약의 이행을 위해서 제3자와의 종속계약이 필요한 무역조건에 관한 내용으로 잘못된 것은?","body":[],"opts":["결제조건에서 당사자는 결제 위험을 고려하여 결제수단, 결제시기, 결제통화를 결정하고, 위험도에 따라 가격조건을 연동하여 결정한다.","보험조건에서 위험에 대한 손해 발생 가능성과 관련하여 보험조건, 보험부보 통화, 보험금 청구지 등을 결정한다.","인도조건에서 운임과 부대비의 절감, 운송기간과 안전성, 업무처리 편의성 등을 고려하여 운송계약 체결 당사자, 운송방식, 분할선적, 환적 등을 결정한다.","수량조건에서 중량화물에 대한 단위를 도량형의 혼선을 피하려고 metric ton으로 결정한다."],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"62-2-24","subj":2,"no":24,"head":"선하증권 작성요령에 관한 설명 중 잘못된 것은?","body":[],"opts":["Freight Payable at은 출발지에서 운임을 내는 조건의 수출일 때, 송화인이 운임을 지급하는 장소를 기재한다.","Notify Party는 신용장 개설의뢰인 또는 수입자가 지정하는 대리인이 기재된다. 신용장에는‘Notify Accountee’라고 기재된다.","Freight and Charge는 화물 운송에 따른 제반 비용의 명세로서 운송인이 기재하지만, 운송 실무에서는 기재하지 않는 경우도 많다.","Place of Delivery는 운송인이 책임지고 화물을 수하인에게 인도해야 하는 장소이며, Final Destination은 화물의 최종 목적지로 그 지역까지 운임이 계상되어 있지 않으면 단지 참고사항에 불과하다."],"ans":1,"passage":null,"topic":"운송"},{"id":"62-2-25","subj":2,"no":25,"head":"국제운송서류에 관련한 내용을 표현한 것 중 잘못된 것은?","body":[],"opts":["Multimodal Transport B/L, Combined Transport B/L, Intermodal Transport B/L은 모두 복합운송증권으로 분류된다.","Bill of Lading for Ocean shipment or Multimodal Transport로 표기된 운송서류는 해상운송과 복합운송 서비스를 제공하는 운송인이 발급하는 선하증권이다.","Air Waybill에는 House Air Waybill과 Master Air Waybill이 있는데 각각 항공화물운송 주선업자와 항공사 대리점이 발행한다.","선하증권은 일반적으로 유가증권이며 유통성이 있으나, 복합운송증권은 통상 유가증권이 아니며 유통성이 제한되는 국제운송서류이다."],"ans":4,"passage":null,"topic":"운송"},{"id":"62-2-26","subj":2,"no":26,"head":"정기선 해상운송의 할증료 또는 부대요금에 대한 설명으로 잘못된 것은?","body":[],"opts":["지체료(detention charge)는 화주가 컨테이너 또는 트레일러를 무료 사용기간(free time) 내에 반환하지 못할 경우 부과되는 부대비용이다.","터미널화물처리비(THC)는 수출화물은 CY 입고부터 본선 선측까지, 수입화물은 본선 선측에서 CY 출고까지 부과하는 부대비용이다.","통화할증료(CAF)는 미 달러화에 대한 원화 환율이 상승할 경우, 해상운임에 대한 선사의 손실을 보전하기 위해 부과되는 할증료다.","유류할증료(BAF)는 선박의 주 연료인 벙커유의 가격이 상승할 경우, 선사의 손실을 보전하기 위해 부과하는 할증료다."],"ans":3,"passage":null,"topic":"운송"},{"id":"62-2-27","subj":2,"no":27,"head":"운송 클레임에 관한 해결 내용 중 가장 바람직한 것은?","body":[],"opts":["운송사고가 발생하면 화주는 우선적으로 운송인에게 지급한 해상운임과 항공운임을 반환할 것을 서면으로 요청한다.","선사나 항공사 등 운송인과 보험회사 모두가 클레임 청구에 대해서 보상에 대한 책임을 각서로 답하지 않으면, 화주는 지체 없이 변호사를 선임하여 클레임 청구자의 손해산정금액과 변호사 비용을 청구한다.","운송사고가 발생하면 화주는 우선 사고를 낸 운송당사자에게 서면으로 손해배상을 청구하고 운임의 지급 여부와 관계없이 운임은 입금해야 한다. 이에 운송인은 보험회사에 보험금 청구를 할 수 있는 제반 서류 일체를 피보험자에게 제공한다.","손해배상 청구자는 손해배상청구액에서 아직 지급하지 못한 운임이 있다면 그 금액만큼 제하고 운송인에게 청구하면 된다."],"ans":3,"passage":null,"topic":"운송"},{"id":"62-2-28","subj":2,"no":28,"head":"적하보험의 일반적인 내용 중 올바른 내용만으로 구성된 것은?","body":["A. 상법에서 해상보험의 정의는 “해상보험계약의 보험자는 해상사업에 관한 사고로 인하여 생길 손해를 보상할 책임이 있다”라고 규정하고 있다.","B. 적하보험의 경우 보험자의 책임 판단과 보험금 지급까지의 사항은 개별보험회사의 규정에 따른다.","C. 해상보험계약은 손해보험의 일종으로, 원칙적으로 손해보상계약이다.","D. 항공으로 운송되는 화물의 경우에도 적하보험에 가입해야 하고, 이 경우 협회항공화물약관이 사용된다.","E. 보험계약자의 고지의무는 보험증권 발급 이후라도 보험자에게 서면으로 제출하면 고지의무는 충족한다."],"opts":["A, B, D","A, D. E","B, C, E","A, C, D"],"ans":4,"passage":null,"topic":"해상보험"},{"id":"62-2-29","subj":2,"no":29,"head":"ICC(W.A)와 ICC(F.P.A)는 모두 열거책임주의를 택하고 있다. 다음 중 담보범위와 관련하여 ICC(W.A)에서는 보상하지만, ICC(F.P.A)에서는 보상하지 않는 손해는?","body":[],"opts":["좌초, 침몰, 대화재가 발생한 경우의 단독해손","선적, 환적, 양하 중의 매 포장 단위당의 전손","악천후에 의한 해수 손","화재, 폭발, 충돌, 접촉 및 피난항에서의 양하로 인한 손해"],"ans":3,"passage":null,"topic":"해상보험"},{"id":"62-2-30","subj":2,"no":30,"head":"화물별 대표 사고 유형에 대한 처리내용 중 잘못된 것은?","body":[],"opts":["섬유류는 특별한 사고 없이 화물 자체 혹은 포장재에 있던 수분으로 인한 한유(汗濡)가 발생하였다면, SWEAT 특약이 없으면 보상되지 않는다.","곡물 및 사료는 부족손의 경우에 A/R 또는 A조건에서도 부족손에 대한 추가 담보가 없으면 보상되지 않는다.","유리 및 요업제품은 파손 위험을 보상받고자 한다면 A/R 또는 A조건이라도 특약을 별도로 가입해야 하며, 보험자가 허락한 경우에만 보상받을 수 있다.","컨테이너화물은 화물이 선창과 갑판 모두에 적재될 것을 고려하여 보험요율을 산정하고 있다."],"ans":4,"passage":null,"topic":"해상보험"},{"id":"62-3-1","subj":3,"no":1,"head":"다음 중 청약의 종류가 나머지와 다른 하나는?","body":[],"opts":["We offer the goods at USD 5.00 per piece CIF Long Beach, CA, USA subject to market fluctuation.","You may keep the item for one week. If you decide to purchase it, please send us USD 500.00. If not, you may return it without any obligation on your part.","We would like to make the following offer provided we receive your acceptance by April 20, 2025.","We make the following offer to you on a first-come, first-served basis subject to the terms and conditions below."],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"62-3-2","subj":3,"no":2,"head":"이 서신에 대한 설명 중 잘못된 것은?","body":[],"opts":["This letter sufficiently fulfills the definite requirement for an offer under the United Nation Convention on Contract for International Sale of Goods(1980).","The offeror is indicating an intention to be bound if the offeree accepts the offer.","This is a revocable offer.","The offeror is a buyer."],"ans":3,"passage":"62-3-2","topic":"서신·이메일"},{"id":"62-3-3","subj":3,"no":3,"head":"위 서신에 대한 답신으로 승낙서에 들어갈 내용으로 올바른 것은?","body":[],"opts":["The goods will be shipped provided that full payment is made in advance.","We can accept your offer on the condition that all shipping costs are borne by you.","The shipment will be made as soon as the L/C is issued.","We can quote you USD 4.20/dozen CIF LA for a minimum order of 1,000 dozen."],"ans":3,"passage":"62-3-2","topic":"서신·이메일"},{"id":"62-3-4","subj":3,"no":4,"head":"위 서신의 내용을 UN국제물품매매법(CISG 1980), Incoterms 2020 등 국제무역규칙에따라 해석할 때 잘못된 설명은?","body":[],"opts":["This offer becomes effective when it reaches the buyer.","The seller fulfills his delivery obligation by placing the goods on board at Shanghai port.","The seller should hand over the shipping documents to the buyer through the issuing bank.","If the buyer accepts this offer on April 21, 2025, the acceptance is considered to be a new offer."],"ans":2,"passage":"62-3-4","topic":"서신·이메일"},{"id":"62-3-5","subj":3,"no":5,"head":"주어진 서신의 조건상 가격에 포함되는 항목을 모두 기재한 것은?","body":["(A) inland transport in the seller’s country","(B) unloading charge at destination","(C) customs clearance for import","(D) maritime transport","(E) loading charges for inland transport in the seller’s country","(F) insurance for maritime transport"],"opts":["(A), (B)","(A), (D), (E)","(A), (D), (E), (F)","(D), (E), (F)"],"ans":3,"passage":"62-3-4","topic":"서신·이메일"},{"id":"62-3-6","subj":3,"no":6,"head":"국제물품매매계약에 관한 UN협약(CISG 1980)의 적용이 제외되는 매매의 형태만 고른 것은?","body":["A. Sales by auction","B. Sales of small craft","C. Sales of equipment for ships","D. Sales of shares and investment securities","E. Sales of gas"],"opts":["A, B, D","C, D, E","B, C, D","A, D, E"],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"62-3-7","subj":3,"no":7,"head":"Incoterms 2020의 정형거래조건 중 나머지 거래조건과 다른 하나는?","body":[],"opts":["This term may be used for any mode or modes of transport.","The buyer should make a contract for international transportation.","The risk is transferred from the seller to the buyer when the goods are loaded on the vessel.","The seller is not obliged to procure insurance to cover the buyer’s risk."],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"62-3-8","subj":3,"no":8,"head":"다음 중 Incoterms 2020의 DPU 조건에 관한 내용으로 잘못된 것은?","body":[],"opts":["The seller should ensure that unloading at the named place can be arranged.","If the buyer fails to organize import clearance, the goods will be held up at a port or inland terminal in the destination country and the buyer bears all associated risks.","If a specific point for delivery is not agreed or is not determined by practice, the seller may select the point at the named place of destination that best suits its purpose.","The buyer must pay the costs of those checking operations (such as checking quality, measuring, weighing, and counting) that are necessary for the purpose of delivering the goods."],"ans":4,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"62-3-9","subj":3,"no":9,"head":"위 계약서 내용으로 올바른 것을 모두 고르면?","body":["(A) The seller is required to procure insurance for the goods from Busan Port to New York Port.","(B) The seller may choose the port of shipment.","(C) The contract provides particulars to be included in the shipping mark.","(D) The seller is required to draw a time draft on the issuing bank and submit it with all documents required in the L/C.","(E) The seller should make the shipment within 60 days after the offeree’s acceptance becomes effective."],"opts":["(A), (C)","(B), (D), (E)","(C), (E)","(C), (D), (E)"],"ans":3,"passage":"62-3-9","topic":"계약·CISG·인코텀즈"},{"id":"62-3-10","subj":3,"no":10,"head":"위 계약의 조건에 따라 매도인이 매수인에게 제시해야 하는 운송서류로 올바른 것은?","body":[],"opts":["The first original copy of all the negotiable bills of lading issued and marked freight payable at destination","A full set of negotiable bills of lading issued and marked freight payable at destination","The first original copy of all the negotiable bills of lading issued and marked freight prepaid","A full set of negotiable bills of lading issued and marked freight prepaid"],"ans":4,"passage":"62-3-9","topic":"계약·CISG·인코텀즈"},{"id":"62-3-11","subj":3,"no":11,"head":"다음은 어떤 조항의 내용인가?","body":["This agreement shall supersede any and all prior agreements, understandings, arrangement, promises, representations, warranties and/or contracts of any kind or nature whatsoever, whether oral or written, and whether expressed or implied, by or between the parties or their officers, directors, or employees, with respect to the subject matter hereof."],"opts":["Non-waiver","Entire agreement","Infringement","Consideration"],"ans":2,"passage":null,"topic":"서신·이메일"},{"id":"62-3-12","subj":3,"no":12,"head":"다음은 계약서의 일부이다. 그 내용으로 옳지 않은 것은?","body":["· Quantity: An order shall be accepted so long as the quantity exceeds 1,000 KGS, subject to a variation of plus or minus three percent at the Seller’s option.","· Payment: Draft(s) shall be drawn at sight, documents attached, for the full invoice amount under an irrevocable credit which shall be established within 10 days after conclusion of the contract. Business against D/P draft without L/C should be subject to the Seller’s previous consent in each case.","· Shipment: The Seller shall not be responsible for any delay in shipment due to the Buyer’s failure to provide a timely documentary credit. The Seller shall not be responsible for any damages incurred by the Buyer due to the delayed arrival of the ship designated by the Buyer beyond the prearranged date of shipment."],"opts":["The delivery by the seller of 1,030 KGS of the contract goods does not constitute a breach of contract.","The buyer may choose to make the payment either by letter of credit or by documentary collection.","The seller shall not be liable for late shipment caused by the buyer’s delay in issuance of L/C.","The buyer should make a contract of carriage for the delivery of the goods."],"ans":2,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"62-3-13","subj":3,"no":13,"head":"다음 환어음의 밑줄 친 부분(A～D)에 대한 설명으로 잘못된 것은?","body":["BILL OF EXCHANGE","NO. 220204PU JUNE 10, 2024 MEXICO","FOR USD 10,000.―","AT 60 DAYS AFTER B/L DATE OF THE FIRST BILL OF EXCHANGE (SECOND OF THE SAME TENOR AND DATE BEING UNPAID)","PAY TO <u>(A) WOORI BANK<\/u> OR ORDER THE SUM OF US DOLLARS TEN THOUSAND ONLY VALUE RECEIVED AND CHARGE THE SAME TO THE ACCOUNT OF <u>(B) HOLLY TRADE CO., LTD<\/u>.","DRAWN UNDER THE HSBC BANK, SEOUL, KOREA","L/C NO: U-10428-01 DATED MAY 17, 2024","TO: <u>(C) THE HSBC BANK<\/u>,","SAMSUNG-RO 3GA, GANGNAM-GU, SEOUL, KOREA","<u>(D) CONNIE’S FARMER<\/u>"],"opts":["(A) It is the payee and the negotiating bank that is usually designated as the payee under a negotiation L/C.","(B) It is the applicant who is obliged to pay when shipping documents are presented.","(C) It is the negotiating bank that examines the shipping documents presented by the seller and negotiates the draft if the documents comply with the terms of the L/C.","(D) It is the party who orders the drawee to pay a specified sum of money to the payee."],"ans":3,"passage":null,"topic":"신용장·결제"},{"id":"62-3-14","subj":3,"no":14,"head":"다음 서신의 밑줄 친 New York City Bank, Singapore의 역할로 올바른 것을 모두 고른 것은?","body":["Dear Mr. Jennings,","We would like to inform you that the Bank of America of LA has opened an irrevocable letter of credit in your favor for the amount of USD 180,000. The credit will be confirmed and advised by the <u>New York City Bank, Singapore<\/u>, and they will honor your draft drawn at 60 days after sight.","We hope that there will be no delays in shipment and that you pay close attention to the packing of the goods.","Thank you.","(A) confirming bank (B) advising bank (C) accepting bank","(D) paying bank (E) negotiating bank (F) issuing bank"],"opts":["(A), (B), (C)","(A), (B), (C), (D)","(A), (B), (C), (D), (E)","(A), (B), (C), (D), (E), (F)"],"ans":1,"passage":null,"topic":"서신·이메일"},{"id":"62-3-15","subj":3,"no":15,"head":"다음 신용장의 밑줄 친 서류(A)와 (B)의 수리 요건에 모두 해당되는 것은?","body":["· currency code amount : USD 10,000.00","· available with by : ANY BANK BY NEGOTIATION","· <u>(A) drafts<\/u> at : AT SIGHT","· documents required","- <u>(B) COMMERCIAL INVOICE<\/u> IN DUPLICATE","- PACKING LIST IN TRIPLICATE","※ This documentary credit is subject to the Uniform Customs and Practice for Documentary Credit(2007 Revision, ICC Publication No.600)."],"opts":["They should all be originals.","They should be issued by or drawn by the beneficiary.","They should be issued to or drawn on the applicant.","They should be dated and signed."],"ans":2,"passage":null,"topic":"신용장·결제"},{"id":"62-3-16","subj":3,"no":16,"head":"위 서류에 대한 설명 중 옳지 않은 것은?","body":[],"opts":["This document is used in transactions where financial instruments such as a letter of credit are not used and third parties are not involved.","This document is negotiable and its rights can be transferred through endorsement.","As the consignee is named in this document, only the named consignee is entitled to receive the goods.","This document is a simple receipt for the goods and the original document is not required to be presented upon delivery of the goods."],"ans":2,"passage":"62-3-16","topic":"운송·보험"},{"id":"62-3-17","subj":3,"no":17,"head":"위 서류의 밑줄 친 부분(A)을 무엇이라 하는가?","body":[],"opts":["On Board Notation","Shipment Mark","More or Less Clause","Unknown Clause"],"ans":4,"passage":"62-3-16","topic":"운송·보험"},{"id":"62-3-18","subj":3,"no":18,"head":"다음 중 해상보험에 관한 설명으로 잘못된 것은?","body":[],"opts":["Where the subject-matter insured is destroyed, or so damaged as to cease to be a thing of the kind insured, or where the assured is irretrievably deprived thereof, there is a constructive total loss.","Salvage charges mean the charges recoverable under maritime law by a salvor independently of contract.","A valued policy is a policy which specifies the agreed value of the subject-matter insured.","A particular average loss is a partial loss of the subject-matter insured, caused by a peril insured against, but not amounting to a general average loss."],"ans":1,"passage":null,"topic":"운송·보험"},{"id":"62-3-19","subj":3,"no":19,"head":"다음 서신의 밑줄 친 (A)에 들어갈 가장 적절한 문장은?","body":["Dear Mr. Park:","<u>(A) .<\/u> Unfortunately, we are not able to meet the price that you have suggested for our speaker system, Model DD-9920. Please understand that we would very much like to help you in this matter but we have already cut the price down to the absolute minimum.","As an excellent substitute for the article, we would like to recommend our Model DD-9910 which is very similar to Model DD-9920 in quality but at a lower price. We are ready to offer you a special discount of 5% on our Model DD-9910 to help you introduce it to the market. That would lower the price to USD 118.75 per unit.","We truly hope you will take advantage of this offer, which we will gladly honor until the 30th of July.","Very truly yours,"],"opts":["Thank you for sending us your offer and samples of the digital speaker system DD-9920.","We have received your letter requesting a price reduction for our offer.","We would like to thank you for your initial order for our speakers and warmly welcome you as one of our valued customers.","We, as the Seller, hereby confirm that we have sold to you, as the Buyer, the following goods under the terms and conditions as stated below and on the reverse side hereof."],"ans":2,"passage":null,"topic":"서신·이메일"},{"id":"62-3-20","subj":3,"no":20,"head":"다음 중 주어진 문장의 영작이 올바른 것은?","body":[],"opts":["귀사가 10월 30일 전에 선적을 보증한다면 100다스의 시험주문을 할 용의가 있습니다. → We are willing to place a trial order of 100 dozen if you guarantee shipment on or about October 30.","당사의 통상 결제조건은 지급인도조건 또는 사전송금방식이지만 이번 경우에는 인수도조건을 수락할 용의가 있습니다. → Although our usual terms are documents against payment or deferred T/T, we are willing to accept documents against acceptance terms in this case.","당사 선적 담당 직원의 실수로 상이한 물품이 선적되었음을 알리게 되어 유감입니다. → We regret to inform you that substandard quality has been shipped due to a mistake by our shipping clerk.","각 도자기는 두꺼운 종이로 개별 포장하여 짚으로 채운 다음 일련번호 No. 1-50으로 표시한 나무상자에 넣어 선적해 주십시오. → Each piece of chinaware is to be individually wrapped in thick paper, packed in straw, and shipped in wooden crates marked No. 1 to 50."],"ans":4,"passage":null,"topic":"서신·이메일"},{"id":"62-3-21","subj":3,"no":21,"head":"다음 서신에서 언급된 다른 서신(밑줄 부분)의 내용으로 가장 적절한 것은?","body":["Dear Sir(s),","We are writing to you about Order No. VC58391, for the supply of 60 dynamos(Artex model 55). Although we have been in contact with you on several occasions, most recently by <u>the letter dated June 9th<\/u>, to inquire about the delivery of these dynamos, we have not received any reply from you. We understand that you agreed to deliver these dynamos on June 3rd. However, we have not yet received them.","It is essential that we deliver this consignment to our Greek customers on time. This is an initial order from them, and it would give us an opportunity of starting a business in the Greek market. Our deadline for delivery is June 28th. If we do not receive the dynamos within the next five days, our customers will cancel the order. We would like to make it clear that we are still awaiting your delivery, and if any loss occurs from this delay, we will take legal action.","Yours faithfully,"],"opts":["We have decided to cancel Order No. VC58391 as we no longer require the dynamos. Please confirm the cancellation at your earliest convenience.","Since the dynamos have arrived earlier than expected, we would like to place an additional order for the same model. Please let us know the availability.","As previously agreed, the dynamos were supposed to be delivered on June 3rd. Please confirm whether they have been dispatched.","Thank you for your prompt response regarding the shipment of the dynamos. We appreciate your confirmation that they have already been dispatched."],"ans":3,"passage":null,"topic":"서신·이메일"},{"id":"62-3-22","subj":3,"no":22,"head":"위 서신의 목적으로 가장 적절한 것은?","body":[],"opts":["To notify that the payment had already been settled.","To apologize for a delay in the delivery.","To request an extension of a payment deadline.","To request immediate payment for a previously placed order."],"ans":3,"passage":"62-3-22","topic":"서신·이메일"},{"id":"62-3-23","subj":3,"no":23,"head":"위 서신 이전에 매도인이 송부한 서신의 내용으로 적절하지 않은 것은?","body":[],"opts":["Considering the circumstances you have outlined and your history of prompt payments, we are pleased to grant you an extension until the end of the August.","We are writing to remind you that your payment for the May statement is now overdue.","If you have already sent the payment, please disregard this reminder.","We understand that delays can occur, but we must emphasize the importance of timely payments."],"ans":1,"passage":"62-3-22","topic":"서신·이메일"},{"id":"62-3-24","subj":3,"no":24,"head":"위 서신에 대한 설명으로 옳지 않은 것은?","body":[],"opts":["The writer has a plan to place regular and large orders.","The letter is intended to accept the offer of the bicycles.","The letter requests a current bicycle catalog and price list.","The writer highlights their position as a leading bicycle retailer in Seoul."],"ans":2,"passage":"62-3-24","topic":"서신·이메일"},{"id":"62-3-25","subj":3,"no":25,"head":"위 서신의 밑줄 친 부분 (A)에 들어갈 가장 적절한 문장은?","body":[],"opts":["Could you please send us one sample of each model: men's, women's, and children's?","We are confident you will be pleased with the quality of the bicycle.","We would be grateful if you could indicate whether you offer special discounts for bulk orders or long-term partnerships","We believe that strategic investment in our company will not only yield significant returns but also solidify a long-term, mutually beneficial partnership."],"ans":3,"passage":"62-3-24","topic":"서신·이메일"},{"id":"62-3-26","subj":3,"no":26,"head":"다음 서신의 내용을 논리 전개에 따라 가장 잘 나열한 것은?","body":["Dear Mr. Williams,","Upon the arrival of the S.S. Rola at Busan port on March 10th, it was immediately apparent that Case No. 12, containing the radio receivers, had sustained significant damage, with one side of the case visibly split.","A thorough inspection, conducted by a local insurance surveyor in the presence of your shipping company's agents, revealed the extent of the damage. <u>(A) We demand immediate compensation for the loss of the eight damaged radio receivers. (B) We are attaching the surveyor's detailed report and the shipping agents' signed statement, both of which irrefutably document the damage incurred during transit. (C) We hold your company fully responsible for the damages to these goods. (D) The case, invoiced as containing 24 radio receivers, suffered severe damage to eight units, rendering them unusable.<\/u> Failure to address this matter promptly will necessitate further action to recover our losses.","Yours truly,"],"opts":["(B)-(C)-(D)-(A)","(B)-(A)-(C)-(D)","(D)-(A)-(C)-(B)","(D)-(B)-(C)-(A)"],"ans":4,"passage":null,"topic":"서신·이메일"},{"id":"62-3-27","subj":3,"no":27,"head":"다음 서신에서 밑줄 친 (A)-(D) 중 문맥상 가장 어색한 것은?","body":["Dear Mr. Wang,","<u>(A) We inform you that Korea First Bank, Seoul has issued an irrevocable credit No. PP3012 for USD 550,000 in your favor covering the shipment of the goods under Sales Contract No. SC398 today.<\/u>","<u>(B) We have reviewed the L/C and noticed a discrepancy. It currently states \"freight prepaid,\" while our agreement was based on FOB terms. (C) As you know, FOB indicates that the buyer is responsible for the ocean freight, meaning the L/C should specify \"freight collect.\"<\/u>","<u>(D) Could you please arrange for your bank to amend the L/C to reflect \"freight collect\" instead of \"freight prepaid\"?<\/u> To ensure timely shipment, we need to receive the amendment notice by the end of this week.","Thank you for your prompt attention to this matter.","Sincerely,"],"opts":["(A)","(B)","(C)","(D)"],"ans":1,"passage":null,"topic":"서신·이메일"},{"id":"62-3-28","subj":3,"no":28,"head":"다음 중 주어진 문장의 영작으로 적절하지 않은 것은?","body":[],"opts":["이번 달 동안에만 당사의 모든 제품에 대하여 20% 할인해 주는 특별오퍼를 제공해 드립니다. ⇒ We are pleased to make a special offer of 20% discount on all our products for this month only.","원자재의 가격이 꾸준히 상승하고 있어 다음 달에는 가격이 확실히 인상될 것입니다. ⇒ The price of products has been steadily rising, so we are sure it will increase further next month.","귀사의 메모리칩에 대한 오퍼를 받아들일 수 없습니다. 귀사가 언급한 가격보다 훨씬 낮은 가격으로 다른 경로를 통해 같은 품질의 물품을 제공받고 있습니다. ⇒ We are not in a position to accept your offer of memory chips. We are obtaining the same quality through another channel at a price far below what you quoted.","납품일 변경을 하고 싶습니다. 귀사께서 납품기간을 단축해주시면 귀사의 제안을 받아드릴 수 있습니다. ⇒ We would like to request a revision in the delivery date. We will accept your offer if you can shorten the delivery period."],"ans":2,"passage":null,"topic":"서신·이메일"},{"id":"62-3-29","subj":3,"no":29,"head":"대화의 순서가 가장 자연스럽게 연결된 것은?","body":[],"opts":["(D) - (B) - (E) - (A) - (C)","(D) - (A) - (C) - (E) - (B)","(C) - (E) - (B) - (A) - (D)","(C) - (A) - (D) - (B) - (E)"],"ans":2,"passage":"62-3-29","topic":"서신·이메일"},{"id":"62-3-30","subj":3,"no":30,"head":"위 대화의 주제로 가장 적절한 것은?","body":[],"opts":["Discussing target customers","Launching a new product","Talking about distribution channels","Negotiating pricing strategy"],"ans":3,"passage":"62-3-29","topic":"서신·이메일"}],"p":{"62-3-2":{"head":"다음 서신의 일부를 읽고 질문에 답하시오.","body":["We are pleased to make you the following offer, provided that your reply reaches us by June 20, 2025.","","Items: Men’s cotton socks","Price: USD 4.20/dozen CIF LA","Quantity: 500 dozen","Payment: by a sight L/C in your favor","Shipment: within 10 days after issuance of L/C"]},"62-3-4":{"head":"다음 서신을 보고 질문에 답하시오.","body":["We are pleased to offer the following article under the terms and conditions described below.","","· Description : Ladies’ Polyester Knit Jacket (Style No. 2025NF)","· Unit Price : USD 120.00/pc CIF Shanghai port (Incoterms 2020)","· Quantity : 500 pcs","· Payment : Draft at sight under an irrevocable L/C in our favor","· Shipment : within 30 days after receipt of L/C","· Validity : April 20, 2025"]},"62-3-9":{"head":"다음 계약서의 일부를 읽고 질문에 답하시오." is purely temporary. Before the end of the month, payments are due to us from a number of our regular customers, who are notably prompt payers.","We very much regret having to make this request, but we hope you will be able to grant it.","Yours very truly,"]},"62-3-24":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Sir or Madam,","We are writing from Seoul, South Korea, and would greatly appreciate receiving your latest catalog and price list for your range of bicycles, particularly models for men, women, and children.","As the leading bicycle retailer in Seoul, where cycling is increasingly popular for both commuting and leisure, we have observed a growing demand for quality bicycles in the South Korean market. We believe your products would be a valuable addition to our inventory.","If your bicycles meet our quality standards and are competitively priced for the South Korean market, we anticipate placing regular and substantial orders.","To maintain our competitive pricing and support our business growth, <u>(A)<\/u> . We are prepared to commit to a mutually agreed-upon annual minimum order quantity, tailored to the specific demands of the South Korean market.","We look forward to your prompt response and the possibility of establishing a successful business relationship in South Korea.","Yours faithfully,"]},"62-3-29":{"head":"다음 비즈니스 대화를 읽고 질문에 답하시오.","body":["· Your new dairy product is performing very well in the market.","· <u>(A) What’s your selling strategy? How did you promote and distribute it?<\/u>","· <u>(B) Thanks. They are aggressively promoting and selling our dairy product.<\/u>","· <u>(C) Actually, we contracted with one of the largest retail stores in France.<\/u>","· <u>(D) Yeah. I’m very surprised by its sales performance over the last few months.<\/u>","· <u>(E) Wow, congratulations!<\/u>"]}}},"63":{"date":"2025.8","q":[{"id":"63-0-1","subj":0,"no":1,"head":"대외무역법령상 규정하고 있는 ‘물품 등’의 정의에 관한 설명으로 잘못된 것은?","body":[],"opts":["물품 등에는 무역거래에서 사용되는 신용장, 우편환, 대통령령으로 정하는 환어음 등이 포함된다.","물품 등에는 출판업과 영상·오디오 기록물 제작 및 배급업이 포함된다.","물품 등에는 국내의 법령 또는 대한민국이 당사자인 조약에 따라 보호되는 특허권·상표권·프로그램저작권 등이 포함된다.","물품 등에는 부호·문자·음성·음향·이미지·영상 등을 디지털 방식으로 제작하거나 처리한 자료 또는 정보 등이 포함된다."],"ans":1,"passage":null,"topic":"대외무역법"},{"id":"63-0-2","subj":0,"no":2,"head":"우리나라의 대외무역법령에서 수출입승인사항의 변경신고 대상에 해당하지 않는 것은?","body":[],"opts":["원산지","승인 조건","도착항(수출입의 경우 모두 해당)","수출입 물품 등의 용도(수출입승인 용도가 지정된 경우에만 해당)"],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"63-0-3","subj":0,"no":3,"head":"우리나라의 대외무역법령에서 규정하고 있는 특정거래형태의 수출입에 관한 설명이다. 다음 각 괄호 ( )에 들어갈 용어로 올바른 것은?","body":["A. 위탁판매수출이란 물품 등을 ( A )으로 수출하여 해당 물품이 판매된 범위 안에서 대금을 결제하는 계약에 의한 수출을 말한다.","B. 위탁가공무역이란 ( B )을 지급하는 조건으로 외국에서 가공할 원료의 전부 또는 일부를 거래 상대방에게 수출하거나 외국에서 조달하여 이를 가공한 후 가공물품 등을 수입하거나 외국으로 인도하는 수출입을 말한다.","C. 임대수출이란 임대 계약에 의하여 물품 등을 수출하여 일정 기간 후 다시 수입하거나 그 기간이 만료 전 또는 만료 후 해당 물품 등의 ( C )을 이전하는 수출을 말한다.","D. 외국인수수입이란 수입대금은 국내에서 지급되지만, 수입물품 등은 ( D )에서 인수하거나 제공받는 수입을 말한다."],"opts":["( A ) 유환 · ( B ) 가득액 · ( C ) 사용권 · ( D ) 외국","( A ) 유환 · ( B ) 가공임 · ( C ) 소유권 · ( D ) 국내","( A ) 무환 · ( B ) 가득액 · ( C ) 사용권 · ( D ) 국내","( A ) 무환 · ( B ) 가공임 · ( C ) 소유권 · ( D ) 외국"],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"63-0-4","subj":0,"no":4,"head":"대외무역법령상 외화획득용 원료ㆍ기재의 수입 등에 대한 설명 중 올바른 것은?","body":[],"opts":["외화획득용 원료의 수량은 외화획득을 위한 물품 등의 1단위를 생산하기 위하여 제공되는 외화획득용 원료의 표준 소요량을 말한다.","외화획득용 원료를 수입한 자가 직접 외화획득의 이행을 하는 경우, 외화획득 이행기간은 수입통관일 또는 공급일로부터 1년이다.","외화획득 이행의무자의 책임이 없는 사유로 외화획득의 이행을 할 수 없게 된 경우에는 외화획득용 원료ㆍ기재의 사후관리를 하지 아니할 수 있다.","외화가득율이 30% 이상인 군납용 물품 등을 생산하는 데 소요되는 원료는 외화획득용 원료로 인정된다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"63-0-5","subj":0,"no":5,"head":"다음 중 대외무역법령에서 규정하고 있는 전략물자의 수출 허가 등의 제한이 필요한 기술에 해당하는 것은?","body":[],"opts":["해외 원자력시설에서의 검사 등을 통한 기술","일반에 공개된 기술","기초과학연구에 관한 기술","특허 출원에 필요한 최소한의 기술"],"ans":1,"passage":null,"topic":"대외무역법"},{"id":"63-0-6","subj":0,"no":6,"head":"대외무역법령에서 규정하는 전략물자의 수출입에 대한 설명으로 잘못된 것은?","body":[],"opts":["산업통상자원부 장관은 상황허가 신청을 받은 경우에 조건부로 허가할 수 있다.","「방위사업법」에 따라 허가를 받은 방위산업물자 및 국방과학기술이 전략물자에 해당하는 경우에도 대외무역법상 수출허가를 받아야 한다.","산업통상자원부장관이 정하여 고시하는 기술을 수출하려는 경우에는 허가의 유효기간을 달리 정할 수 있다.","전략물자 해당 여부를 확인하고자 하는 자는 해당 물품 등에 대하여 전문기관에 판정을 신청할 수 있다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"63-0-7","subj":0,"no":7,"head":"대외무역법령에서 규정하는 정부 간 수출계약에 대한 설명으로 잘못된 것은?","body":[],"opts":["정부 간 수출계약과 관련하여 정부는 어떠한 경우에도 경제적 이익을 갖지 아니하고, 경제적 책임 및 손실을 부담하지 아니한다.","정부 간 수출계약 전담기관은 대한무역투자진흥공사이며, 전담기관은 정부 간 수출계약과 관련하여 당사자의 역할을 수행한다.","국내 기업은 정부 간 수출계약이 체결된 경우 그 계약 내용을 성실히 이행하여야 하며, 국내 기업은 보증ㆍ보험의 제공 등 계약 이행 보증 조치를 취하여야 한다.","정부 간 수출계약이란 외국 정부의 요청이 있는 경우에 전담기관이 국내 기업을 대신하거나 함께 당사자가 되어 방위산업 물품 등을 유상으로 수출하기 위하여 외국 정부와 체결하는 수출계약을 말한다."],"ans":4,"passage":null,"topic":"대외무역법"},{"id":"63-0-8","subj":0,"no":8,"head":"우리나라의 대외무역법령에서 규정하고 있는 원산지판정기준에 관한 설명 중 올바른 것은?","body":[],"opts":["공구는 기계 등과 함께 수입되어 동시에 판매되더라도 해당 기계와 별개로 구분하여 원산지를 판정해야 한다.","포장용품과 내용품을 각각 별개로 구분하여 수입신고 하도록 규정된 경우에는 포장용품의 원산지는 내용품의 원산지와 구분하여 결정한다.","촬영된 영화용 필름은 그 영화가 촬영된 나라를 원산지로 한다.","전자적 형태의 무체물은 그것을 제작하거나 처리한 나라를 원산지로 본다."],"ans":2,"passage":null,"topic":"대외무역법"},{"id":"63-0-9","subj":0,"no":9,"head":"대외무역법령상 수출입의 질서 유지에 관한 설명으로 올바른 것은?","body":[],"opts":["무역거래자는 환차익을 목적으로 물품 등의 수출 또는 수입가격을 조작하여서는 아니 된다.","산업통상자원부장관은 수출입과 관련하여 분쟁이 발생한 경우 관련된 진술 또는 서류의 제출을 요구할 수는 있으나 분쟁을 조정할 수는 없다.","산업통상자원부장관은 우리나라 또는 교역상대국의 관련 법령에 위반되는 경우, 물품 등의 가격, 수량, 품질 등에 관하여 필요한 조정을 명할 수 있다.","선적 전 검사와 관련하여 수출자와 선적 전 검사기관 간에 분쟁이 발생하였을 경우 분쟁의 중재를 담당할 기관으로 대한상공회의소를 지정할 수 있다."],"ans":3,"passage":null,"topic":"대외무역법"},{"id":"63-0-10","subj":0,"no":10,"head":"대외무역법령에서 규정하는 내국신용장과 구매확인서에 관한 설명으로 올바른 것은?","body":[],"opts":["외국환은행의 장 또는 전자무역 기반 사업자는 외화획득용원료·기재 구매확인서를 전자무역 문서로 발급하고 신청한 자에게 발급 사실을 알릴 때 승인번호, 개설 및 통지일자, 발신기관 전자서명 등 최소한의 사항만 알릴 수 있다.","구매확인서를 발급받으려는 자가 전산 설비를 갖추지 못하였거나 기타 부득이한 사유로 전자문서를 작성하지 못하는 때에는 외국환은행의 장에게 위탁하여 신청할 수 있다.","내국신용장이란 기획재정부장관이 정하는 바에 따라 지정거래 외국환은행의 장이 발급하여 국내에서 통용되는 신용장을 말한다.","한국무역협회 또는 전자무역 기반 사업자는 발급된 구매확인서에 의하여 2차 구매확인서를 발급할 수 있으며, 외화획득용 원료·기재의 제조·가공·유통(완제품 유통 제외)과정이 여러 단계인 경우에는 각 단계별로 순차로 발급할 수 있다."],"ans":1,"passage":null,"topic":"대외무역법"},{"id":"63-0-11","subj":0,"no":11,"head":"다음 내용 중 잘못된 것은?","body":["∙ 품목번호 : 3304.99.1000 / 기초화장용 제품류 (Skin care cosmetics)","∙ 원산지 : 원산지표시대상(Y)","∙ 관세 : 기본관세(A) : 8% / WTO협정관세(C) : 6.5%","∙ FTA협정 : EU(FEU1) 0% / 중국(FCN1) 0% / 미국(FUS1) 0%","∙ 감면·환급 : 간이정액환급액(10원)"],"opts":["HS Code는 6자리까지 국제적으로 표준화되어 있다. 대한민국은 10자리를 사용하고 있으며, 8자리 또는 9자리를 사용하는 국가도 있다.","기초화장용 제품류는 33류, 3304호, 3304.99 소호에 분류되고 있다.","HS Code는 원산지 표시부터 관세율, FTA 협정, 감면 및 환급, 내국세 정보 등 다양한 정보를 가지고 있다. 정확한 HS Code 확인을 위해 관세청에 심사를 요청하는 제도를 품목분류 사전심사제도라고 한다.","HS Code의 법적 구속력을 갖는 3대 구성요소는 첫째 통칙, 둘째 주(note), 셋째 부(section)와 류(chapter)의 표제 용어이다."],"ans":4,"passage":null,"topic":"FTA·원산지"},{"id":"63-0-12","subj":0,"no":12,"head":"다음은 관세법상 용어의 정의이다. 괄호 안에 들어갈 단어로 맞게 짝지어진 것은?","body":["가. 외국물품을 우리나라에서 소비 또는 사용하는 것은 ( )이다.","나. 국내에 도착한 외국물품이 수입통관 절차를 거치지 아니하고 다시 외국으로 반출되는 것을 ( )이라고 한다.","다. 우리나라의 선박 등이 공해에서 채집하거나 포획한 수산물은 ( )물품이다.","라. 인천항에 페리로 입항한 물품이 부산항으로 운송되어 컨테이너선으로 옮겨 실어 출항하는 것은 ( )이다."],"opts":["가 수입 · 나 수출 · 다 외국 · 라 환적","가 사용신고 · 나 반송 · 다 외국 · 라 복합환적","가 사용신고 · 나 수출 · 다 내국 · 라 환적","가 수입 · 나 반송 · 다 내국 · 라 복합환적"],"ans":4,"passage":null,"topic":"관세법"},{"id":"63-0-13","subj":0,"no":13,"head":"관세법상 기간과 기한에 대한 설명으로 잘못된 것은?","body":[],"opts":["관세법에 따른 기간을 계산할 때 수입신고 수리 전 반출승인을 받은 경우에는 반출일을 수입신고의 수리일로 본다.","관세법에 따른 기한이 공휴일인 경우에는 그 다음 날을 기한으로 한다.","세관장은 천재지변으로 인해 관세법에 따른 청구를 정해진 기한까지 할 수 없다고 인정되는 경우, 1년을 넘지 않는 범위에서 기한을 연장할 수 있다.","납부고지를 한 경우, 관세의 납부기한은 납부고지를 받은 날부터 15일 이내이다."],"ans":1,"passage":null,"topic":"관세법"},{"id":"63-0-14","subj":0,"no":14,"head":"다음 예시에서 ㈜KITA의 수입 시 과세물건 수량 및 관세율로 옳은 것은?","body":["- 24.11.03. : ㈜KITA는 독일업체와 자동차부품(A) 100,000개 수입 계약 체결","- 24.12.05. : 독일업체가 계약 물품 선적","- 25.01.01. : 법령 개정 및 시행 (자동차부품(A)의 관세율이 기존 8%에서 10%로 인상)","- 25.01.04. : 부산항 창고 물품 반입, 일부 부품(100개) 미선적 확인","- 25.01.08. : ㈜KITA 수입신고"],"opts":["과세물건 : 100,000개 관세율 : 10%","과세물건 : 100,000개 관세율 : 8%","과세물건 : 99,900개 관세율 : 10%","과세물건 : 99,900개 관세율 : 8%"],"ans":3,"passage":null,"topic":"관세법"},{"id":"63-0-15","subj":0,"no":15,"head":"다음 각각의 경우에 납세의무자가 올바르게 짝지어진 것은?","body":["가. ㈜KITA는 국내 A사로부터 수입 대행을 위탁받아 수입신고를 하였다.","나. ㈜KITA는 베트남에서 수입한 물품을 수입신고 3일 전에 국내 B사에 B/L 양수도","거래를 통해서 양도하였다.","다. ㈜KITA는 한국의 운송사 C사를 통해, 영국에서 출발하여 싱가포르를 거쳐 대한민국에 도착한 물품을 수입신고 하였다."],"opts":["가 ㈜KITA · 나 ㈜KITA · 다 ㈜KITA","가 A사 · 나 B사 · 다 ㈜KITA","가 ㈜KITA · 나 ㈜KITA · 다 C사","가 A사 · 나 B사 · 다 C사"],"ans":2,"passage":null,"topic":"관세법"},{"id":"63-0-16","subj":0,"no":16,"head":"다음 중 납세의무의 소멸 등과 관련하여 올바른 것을 모두 고른 것은?","body":["A. 관세를 부과할 수 있는 기간에 관세가 부과되지 아니하고 그 기간이 만료된 때에는 납세의무가 소멸한다.","B. 부정한 방법으로 관세를 포탈하였거나 환급 또는 감면받은 경우에는 관세를 부과할 수 있는 날부터 10년이 지나면 부과할 수 없다.","C. 납세자가 잘못 납부하거나 초과하여 납부한 금액, 또는 그 밖의 관세 환급청구권은 그 권리를 행사할 수 있는 날부터 5년 이내에 행사하지 않으면 소멸시효가 완성된다.","D. 관세징수권의 소멸시효는 납부고지, 부과취소, 관세충당, 통고처분, 교부청구의 사유로 중단된다."],"opts":["A, B, C","A, B, D","A, C, D","B, C, D"],"ans":1,"passage":null,"topic":"관세법"},{"id":"63-0-17","subj":0,"no":17,"head":"다음 수입물품의 과세가격을 합리적인 기준에 따라 결정하는데 기초로 사용할 수 없는 가격은 어느 것인가?","body":[],"opts":["임차수입물품 : 동일 또는 유사물품의 국내 수출 시 공개된 가격자료에 따른 가격","중고물품 : 관련 법령에 따른 감정기관의 감정가격","여행자휴대품 : 외국에서 통상적으로 거래되는 가격으로서 객관적으로 조사된 가격","수입신고 전 변질된 물품 : 제3국으로 수출하는 가격에서 보험 보상액을 뺀 가격"],"ans":4,"passage":null,"topic":"관세법"},{"id":"63-0-18","subj":0,"no":18,"head":"관세법령상 세액의 확정 및 정정에 대한 설명으로 올바른 것은?","body":[],"opts":["세관장은 납세신고를 받으면 수입신고서에 기재된 사항과 관세법상 확인사항 등을 심사하고, 신고한 세액에 대하여 관세 채권 확보가 곤란한 경우에는 수입신고 수리한 후 즉시 세액심사를 한다.","관세를 체납하고 있는 자가 신고하는 물품이라도, 체납액이 10만 원 미만인 경우에는 수입신고 수리 전에 세액심사를 하지 아니한다.","세관장은 경정 청구를 받은 날부터 30일 이내에 세액을 경정하거나, 경정할 이유가 없다는 뜻을 청구인에게 통지하여야 한다.","납세의무자는 신고한 세액을 납부하기 전에 과부족이 있음을 알게 된 경우, 그 세액을 보정할 수 있다. 이 경우 보정 신청 다음 날까지 관세를 납부하여야 한다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"63-0-19","subj":0,"no":19,"head":"관세법에서 규정하는 관세율의 종류에 대한 설명으로 잘못된 것은?","body":[],"opts":["긴급관세는 해당 국내 산업의 보호 필요성, 국제통상관계 등을 검토하여 부과 여부와 그 내용을 결정하고, 부과한 경우 기획재정부장관은 긴급관세부과의 부정적 효과에 대한 무역보상방법에 관하여 협의를 할 수 있다.","수입가격이 급등한 물품 또는 이를 원재료로 한 제품의 국내가격을 안정시키기 위하여 필요한 경우에는 조정관세를 부과할 수 있다.","관세 양허율이 국내외 가격 차보다 낮은 농림축산물의 수입이 급증한 경우, 해당 농림축산물에 대해 특별긴급관세를 부과할 수 있다.","관세 또는 무역에 관한 국제협정이나 양자 간의 협정 등에 규정된 우리나라의 권익을 부인하거나 제한하는 경우에는 보복관세를 부과할 수 있다."],"ans":2,"passage":null,"topic":"관세법"},{"id":"63-0-20","subj":0,"no":20,"head":"국내 수입자 B는 중국의 수출자 A로부터 공작기계 1대를 CIF 조건으로 수입하면서, 물품 대금으로 USD 1,000을 지급하였다. A는 운송인과 운송 및 보험계약을 체결하고 해상 운임 및 보험료로 USD 100을 지급하였다. B가 수입통관 시 납부할 관세는? (단, 관세율 8%, 부가세 10%, 과세환율 1,000원/USD, 그 외의 사항은 고려하지 않는다.)","body":[],"opts":["80,000원","188,000원","88,000원","169,200원"],"ans":1,"passage":null,"topic":"관세법"},{"id":"63-0-21","subj":0,"no":21,"head":"다음 중 관세법령상 용도세율의 적용에 대한 설명이 잘못된 것은?","body":[],"opts":["용도에 따라 세율을 다르게 정하는 물품을 세율이 낮은 용도에 사용하여 해당 물품에 그 낮은 세율의 적용을 받으려는 자는 세관장에게 신청하여야 한다.","미리 세관장으로부터 해당 용도로만 사용할 것을 승인받은 경우에는 용도세율 적용의 신청을 생략할 수 있다.","용도세율이 적용된 물품은 그 수입신고의 수리일부터 3년의 범위에서 해당 용도 외의 다른 용도에 사용하거나 양도할 수 없다. 다만, 미리 세관장의 승인을 받은 경우에는 그러하지 아니하다.","용도세율이 적용된 물품을 해당 용도 외의 다른 용도에 사용하려는 자에게 양도한 경우에는 그 양수인으로부터 즉시 관세를 징수한다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"63-0-22","subj":0,"no":22,"head":"수입신고가 수리된 물품이 계약 내용과 다르고, 신고 당시의 성질이나 형태가 변경되지 아니한 경우에 관세를 환급할 수 있는 것을 모두 고르시오.","body":["A. 보세구역에 외국으로부터 수입된 해당 물품을 수입신고 수리일부터 1년 이내에 반입하였다가 다시 수출한 경우","B. 자유무역지역 중 관세청장이 수출물품을 일정기간 보관하기 위하여 필요하다고 인정하여 고시하는 장소에 외국으로부터 수입된 해당 물품을 수입신고 수리일부터 1년 이내에 반입하였다가 다시 수출한 경우","C. 통관우체국에 외국으로부터 수입된 해당 물품을 수입신고 수리일부터 1년 이내에 반입하였다가 다시 수출한 경우","D. 보세공장에서 생산된 물품을 수입신고 수리일부터 1년 이내에 보세공장에 해당 물품을 다시 반입한 경우"],"opts":["A, B, C, D","A, B","A, B, C","A, B, D"],"ans":1,"passage":null,"topic":"관세환급"},{"id":"63-0-23","subj":0,"no":23,"head":"관세법상 보세화물의 관리와 관련하여 올바른 것을 모두 고른 것은?","body":["A. 국제무역선에서 물품을 하역하기 전까지는 세관장의 승인 없이 외국 물품의 일부를 견본품으로 반출할 수 있다.","B. 보세구역에 장치된 물품의 원형을 변경하거나 해체ㆍ절단 등의 작업을 하려는 자는 세관장의 허가를 받아 해당 작업을 할 수 있다.","C. 수입될 물품의 보수작업의 재료로 외국물품도 사용할 수 있다.","D. 세관공무원은 보세구역에 반입된 물품 또는 국제무역선에 적재된 물품에 대하여 검사상 필요하면 그 물품의 일부를 견본품으로 채취할 수 있다.","E. 지정장치장에 반입한 물품은 화주 또는 반입자가 그 보관의 책임을 진다."],"opts":["A, B, C","A, D, E","B, C, D","B, D, E"],"ans":4,"passage":null,"topic":"관세법"},{"id":"63-0-24","subj":0,"no":24,"head":"관세법상 수입신고의 처리에 관한 설명으로 잘못된 것은?","body":[],"opts":["세관장은 수입신고가 적법하게 이루어졌을 때에는 이를 지체없이 수리하고 신고인에게 신고필증을 발급하여야 한다.","수입신고 물품은 원칙적으로 신고가 수리되기 전에는 운송수단, 관세통로, 하역통로로부터 반출하여서는 아니 된다.","세관장은 수입신고서의 기재사항 중 일부가 경미하게 미비되고, 신고 수리 후 보완이 가능하다고 인정되는 경우에는 수리 후 이를 보완하게 할 수 있다.","수입신고 물품이 관세법에 규정된 장치 장소에서 반출된 경우, 정당한 이유가 있는 때에 한하여 이를 취하할 수 있다."],"ans":4,"passage":null,"topic":"관세법"},{"id":"63-0-25","subj":0,"no":25,"head":"관세법상 수입신고에 대한 내용으로 잘못된 것은?","body":[],"opts":["수입하는 물품을 보세창고에 반입한 자는 반입일로부터 30일 이내에 수입신고를 하여야 한다.","관세법 제241조에 따른 수입신고는 화주 또는 관세사 등의 명의로 하여야 한다.","외국통화로 표시된 가격을 내국통화로 환산하는 경우에 관세법 제17조에 따른 날이 속하는 주의 전주의 외국환매도율을 평균하여 관세청장이 과세환율을 정한다.","수입하려는 물품의 신속한 통관이 필요할 때에는 대통령령으로 정하는 바에 따라 해당 물품을 적재한 선박 또는 항공기가 입항하기 전에 수입신고를 할 수 있다."],"ans":3,"passage":null,"topic":"관세법"},{"id":"63-0-26","subj":0,"no":26,"head":"다음 ( ) 안에 들어갈 용어로 올바른 것은?","body":["A. 관세청장은 단일 수출용원재료에 의하여 둘 이상의 제품이 동시에 생산되는 등 생산공정이 특수한 수출물품과 중소기업 수출물품에 대한 관세 등의 환급 절차를 간소화하기 위하여 필요하다고 인정하는 경우에는 대통령령으로 정하는 바에 따라 수출용원재료에 대한 관세 등의 평균 환급액 또는 평균 납부세액 등을 기초로 수출물품별로 ( )를 정하여 고시할 수 있다.","B. ( )에 정하여진 금액은 해당 물품을 생산하는 데 드는 수출용원재료를 수입한 때에 납부하는 관세 등으로 보아 환급한다.","C. ( )를 적용받을 수 있는 자는 대통령령으로 정하는 바에 따라 관세청장에게( )를 정하여 고시할 것을 요청할 수 있다."],"opts":["정액환급률표","환급세액표","소요량기준표","평균납부세액표"],"ans":1,"passage":null,"topic":"관세환급"},{"id":"63-0-27","subj":0,"no":27,"head":"수출용원재료에 대한 관세 등 환급에 관한 특례법령상 수출용원재료에 대한 관세 등의 환급업무에 관한 설명으로 올바른 것은?","body":[],"opts":["평균세액증명서는 수출용 원재료를 구매하는 자의 신청에 의하여 그가 매월 수입한 수출용 원재료의 품목별 물량과 단위당 평균세액을 증명하는 서류를 말한다.","기초원재료납세증명서는 구매확인서에 의해 거래된 경우에 한해 수입된 상태 그대로 거래된 수출용원재료에 대한 납부세액을 증명하는 서류를 말한다.","평균세액증명서는 세관장과 관세청장이 정하는 기준에 해당되는 수출용 원재료를 구매한 자 또는 해당 구매자로부터 위임받은 관세사가 발행할 수 있다.","수입세액분할증명서는 세관장과 관세청장이 정하는 기준에 해당되는 내국신용장 등에 의하여 물품을 공급한 자 또는 해당 공급한 자의 위임받은 관세사가 발행할 수 있다."],"ans":4,"passage":null,"topic":"관세환급"},{"id":"63-0-28","subj":0,"no":28,"head":"다음 중 자유무역협정(FTA)관세법령상 협정관세 사후 적용신청에 관한 설명으로 잘못된 것은?","body":["∙ ㈜KITA는 2025년 2월 5일 베트남에서 제조된 화장품을 수입 신고하였으며, 관세를 납부한 후 해당 물품은 2025년 2월 7일에 수입신고가 수리되었다.","∙ 그러나 회사는 수입신고 시 FTA 협정관세 적용신청을 하지 않았고, 이후 해당 사실을 인지하여 2025년 5월 30일에 세관에 협정관세 사후 적용을 신청하였다.","∙ ㈜KITA는 해당 물품이 한-베트남 FTA 적용 대상에 해당한다는 점과 원산지 정보가 전자적으로 교환되었음을 근거로 하여 원산지증명서 원본 제출을 생략하려 하였다."],"opts":["㈜KITA는 2025년 2월 5일 수입 신고일로부터 1년 이내에 사후 적용을 신청하였으므로 신청 요건을 충족한다.","전자적 정보 교환 대상국이라 하더라도 세관장이 요청하는 경우에는 원산지증명서의 제출을 요구할 수 있다.","협정관세 적용을 신청한 ㈜KITA는 이미 납부한 세액의 경정 청구를 할 수 있다.","경정 청구를 받은 경우 세관장은 그 청구를 받은 날부터 2개월 이내에 협정관세의 적용 및 세액의 경정 여부를 ㈜KITA에게 통지하여야 한다."],"ans":1,"passage":null,"topic":"FTA·원산지"},{"id":"63-0-29","subj":0,"no":29,"head":"다음 중 자유무역협정(FTA)관세법령에서 규정하고 있는 FTA 원산지결정기준에 관한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 완전생산기준은 해당 물품이 2개국 이상에 걸쳐 생산된 경우 최종 생산·가공을 수행한 국가를 원산지로 인정하는 기준이다.","B. 세번변경기준은 해당 물품의 품목번호와 그 생산에 사용된 원산지 재료의 품목번호가 일정 단위 이상 다른 경우, 해당 물품을 최종적으로 생산한 국가를 원산지로 인정하는 기준이다. 이 기준은 둘 이상의 국가에서 생산된 경우에 적용될 수 있다.","C. 부가가치기준은 일정 수준 이상의 부가가치를 창출한 국가를 원산지로 인정하는 것으로 이는 둘 이상의 국가에서 생산된 경우에 적용될 수 있다.","D. 해당 물품이 원산지국에서 생산되었더라도 원산지가 아닌 국가를 경유하여 운송되거나 원산지가 아닌 국가에서 선적된 경우에는 원산지로 인정받을 수 없다. 단, 보세구역에서 일시적으로 보관된 경우는 예외이다."],"opts":["A, B","A, C","B, D","C, D"],"ans":4,"passage":null,"topic":"FTA·원산지"},{"id":"63-0-30","subj":0,"no":30,"head":"자유무역협정(FTA)관세법령상 원산지증명서의 유효기간이 다른 것은?","body":[],"opts":["칠레와의 협정","캐나다와의 협정","뉴질랜드와의 협정","이스라엘과의 협정"],"ans":4,"passage":null,"topic":"FTA·원산지"},{"id":"63-1-1","subj":1,"no":1,"head":"외국환거래법과 관련된 설명 중에서 잘못된 것은?","body":[],"opts":["외국환거래법은 외국환에 대한 거래행위인 지급과 영수 등에 관한 법이다.","거주성의 판단은 국적과 관련하여 한국인은 거주자, 외국인은 비거주자이다.","국내에 있는 외국 정부의 공관에 근무하는 외국인은 비거주자이다.","외국환거래의 관리는 Negative system(원칙적 자유-예외적 규제) 방식으로 한다."],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"63-1-2","subj":1,"no":2,"head":"다음 중 O/A 결제방식에 대한 설명으로 올바른 것을 모두 고른 것은?","body":["A. 수출자는 자신이 발행한 환어음에 ‘AVAL’을 표기하여 대금 회수의 위험을 회피할 수 있다.","B. 수출자는 O/A NEGO를 활용하여 외상매출채권을 매각하여 조기에 현금화할 수 있다.","C. 수출자가 물품의 선적을 완료한 시점에 수출채권이 발생한다.","D. 수입자는 물품을 인도받고 품질을 확인한 후에 대금을 결제할 수도 있다.","E. 수입자는 만기일에 매입은행으로 물품 대금을 송금하여야 한다."],"opts":["A, B, C","A, C, D","B, D, E","C, D, E"],"ans":3,"passage":null,"topic":"송금·추심·어음"},{"id":"63-1-3","subj":1,"no":3,"head":"다음 중 송금결제방식의 특징에 대한 설명으로 올바른 것은?","body":[],"opts":["환어음을 사용하기 때문에 어음법이 적용된다.","한국의 결제통계에서 가장 많이 사용되는 방식으로 관련한 국제규칙이 있다.","신용장방식에 비해서 수출자의 대금 미회수 위험이 낮으므로 은행수수료도 낮다.","송금방식은 주로 전신송금을 사용하기 때문에 T/T라고 줄여 부르기도 한다."],"ans":4,"passage":null,"topic":"송금·추심·어음"},{"id":"63-1-4","subj":1,"no":4,"head":"다음 중 송금결제방식의 종류와 지급 시기에 대한 설명으로 잘못된 것은?","body":[],"opts":["CAD, COD, D/P, Sight L/C는 물품 또는 서류의 상환으로 대금이 지급되는 면에서 동시 결제방식으로 분류할 수 있다.","Open Account는 수출자가 선적을 이행하고 물품이 수입국에 도착한 이후에 대금을 청구하기 때문에 「물품 도착 조건부 사후송금 결제방식」의 형태이다.","CAD, COD 방식은 동시지급방식으로 분류할 수 있지만, 선적 후 결제가 이루어진다는 측면에서 사후지급방식의 의미도 지닌다.","CAD, COD 방식은 선적서류나 물품이 수입자 또는 수입자의 대리인에게 인도된 후 대금결제가 이루어진다."],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"63-1-5","subj":1,"no":5,"head":"다음 중 추심거래에 관련된 은행에 대한 설명으로 올바른 것을 모두 고르시오.","body":["A. 환어음의 지급인은 결제은행 또는 지급은행이 되어야 한다.","B. 추심은행은 제시된 서류가 추심지시서와 외관상 일치하는지를 확인하여야 한다.","C. 추심은행은 추심된 자금을 수취한 후 5영업일 이내에 추심의뢰은행에게 지급하여야 한다.","D. 추심의뢰은행은 수출자가 제시한 선적서류를 심사하지 않아도 된다.","E. 수출자는 추심지시서를 작성하여 추심은행에게 직접 제시하여야 한다."],"opts":["A, E","B, D","B, C, D","A, C"],"ans":2,"passage":null,"topic":"송금·추심·어음"},{"id":"63-1-6","subj":1,"no":6,"head":"다음 중 환어음에 대한 설명으로 잘못된 것은?","body":[],"opts":["환어음은 요식증권으로서 일정한 형식을 갖추어야 유효하다.","환어음의 본질은 제3자에 대한 금전의 지급 위탁증권이다.","환어음은 주로 국제거래에서 사용되지만, 국내 거래에서 사용될 수도 있다.","환어음의 발행인과 지급인은 L/C의 경우에는 모두 개설은행, D/P의 경우에는 모두 수입상이다."],"ans":4,"passage":null,"topic":"송금·추심·어음"},{"id":"63-1-7","subj":1,"no":7,"head":"신용장에 대한 설명 중 올바른 것은?","body":[],"opts":["신용장에 그 기초가 되는 계약에 대한 명시적 언급이 있다면 개설은행은 그 계약 내용에 구속된다.","화환신용장 거래에서 매입은행은 서류 심사와 함께 그 서류와 관련된 물품에 대한 심사를 동시에 할 의무가 있다.","구매자 위주의 시장에서는 일반적으로 신용장 방식보다는 송금방식이 선호된다.","수입자는 화환신용장 거래에서 원하는 품질의 물품이 도착하지 않는다면 대금을 거절할 권한을 갖고 있다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"63-1-8","subj":1,"no":8,"head":"신용장의 종류와 관련된 설명으로 잘못된 것은?","body":[],"opts":["연지급신용장에서는 환어음이 요구되지 않는다.","인수신용장에서 개설은행은 개설의뢰인을 지급인으로 하는 환어음이 사용되도록 개설해서는 안 된다.","지급신용장은 일람출급으로 사용되고, 기한부로는 사용되지 않는다.","클린신용장은 화환신용장에 비해 부당 청구의 가능성이 훨씬 낮다."],"ans":4,"passage":null,"topic":"신용장"},{"id":"63-1-9","subj":1,"no":9,"head":"SWIFT 신용장의 41A(available with... by... )에 명시되어야 하는 신용장 유형을 모두 고르시오.","body":["A. negotiation E. deferred payment","B. transferable F. irrevocable","C. confirm G. reimburse","D. acceptance H. payment"],"opts":["A, D, E, H","B, C, F, G","A, C, D, H","A, B, D, H"],"ans":1,"passage":null,"topic":"신용장"},{"id":"63-1-10","subj":1,"no":10,"head":"기한부 신용장인 Shipper’s Usance L/C와 Banker’s Usance L/C에 대한 설명이 잘못된 것은?","body":[],"opts":["Usance 기준 외상기간 이자 부담 · Shipper’s Usance 수출상 · Banker’s Usance 수입상","Usance 기준 환어음 지급인 · Shipper’s Usance 개설은행 · Banker’s Usance 개설은행 / 해외 인수은행","Usance 기준 환어음 만기 표시 · Shipper’s Usance 기한부 · Banker’s Usance 기한부","Usance 기준 환가료 산출 기간 · Shipper’s Usance 기한부 기간 · Banker’s Usance 기한부 기간"],"ans":4,"passage":null,"topic":"신용장"},{"id":"63-1-11","subj":1,"no":11,"head":"신용장 실무와 관련된 설명으로 잘못된 것을 모두 고른 것은?","body":["A. 확인은행은 조건변경서를 통지한 시점부터 그에 대한 취소 불가능한 결제(honour) 또는 매입 의무를 부담한다.","B. 수입신용장 개설을 신청할 때 국내의 수입업체는 거래은행과 외국환거래약정을 체결하고, 보험증권도 반드시 제출해야 한다.","C. 수익자 입장에서 ‘Inspection Certificate issued and signed by applicant’라는 신용장 조건은 독소조항에 해당하므로, 해당 조건의 삭제를 요구하는 것이 바람직하다."],"opts":["A, B","B, C","C, A","A, B, C"],"ans":1,"passage":null,"topic":"신용장"},{"id":"63-1-12","subj":1,"no":12,"head":"SWIFT로 국내 통지은행을 통해 수익자에게 통지된 다음 수출신용장 조건에 대한 설명으로 올바른 것은?","body":["31D(DATE AND PLACE OF EXPIRY) : 251030 AT OUR COUNTER","41D(AVAILABLE WITH...BY) : ISSUING BANK BY PAYMENT","43P(PARTIAL SHIPMENTS) : NOT ALLOWED","43T(TRANSSHIPMENT) : ALLOWED","44C(LATEST DATE OF SHIPMENT) : 251020","48(PERIOD FOR PRESENTATION) : ALL DOCUMENT(S) MUST BE","PRESENTED WITHIN 10 DAYS","AFTER DATE OF SHIPMENT","BUT WITHIN CREDIT VALIDITY"],"opts":["이 신용장 조건에서는 유효기일인 2025년 10월 30일까지 수출국 은행에 서류가 제시되어야 한다.","이 신용장 조건에서는 매입(negotiation)이 허용되지 않는다.","이 신용장 조건에서는 환적이 허용되지 않는다.","이 신용장에서는 최종선적일을 2025년 10월 30일로 정하고 있다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"63-1-13","subj":1,"no":13,"head":"화환신용장을 발행한 개설은행의 의무에 관한 설명 중 잘못된 것은?","body":[],"opts":["개설은행은 신용장 조건에 일치하는 서류제시에 대해 결제 또는 매입하고, 서류를 송부한 지정은행에 신용장 대금을 상환할 의무를 부담한다.","신용장에 의한 개설은행의 결제의무는 통지은행이 신용장을 수익자에 통지하는 시점부터 발생한다.","개설은행의 의무는 수익자의 동의 없이는 취소 또는 변경될 수 없다.","개설은행의 지정은행에 대한 상환약정은 개설은행의 수익자에 대한 약정으로부터 독립적이다."],"ans":2,"passage":null,"topic":"신용장"},{"id":"63-1-14","subj":1,"no":14,"head":"한국의 중계상 A는 베트남에 신용장을 양도하여 자동차 부품을 조달해 미국에 수출할 계획이다. 중계상 A가 은행에 신용장 양도를 요청하고 베트남 공급자는 양도된 신용장 조건에 따라 요구서류를 양도은행에 제출하였다. 제2 수익자인 베트남 공급처가 양도은행에 제시한 서류 중에서 제1 수익자인 중계상이 교체하여 개설은행에 제출할 수 있는 서류는 무엇인가?","body":[],"opts":["송장과 환어음","송장과 선하증권","송장과 포장명세서","송장과 원산지증명서"],"ans":1,"passage":null,"topic":"신용장"},{"id":"63-1-15","subj":1,"no":15,"head":"화환신용장에서 요구한 다음의 서류 중 발행자의 서명이 없어도 되는 서류는?","body":[],"opts":["Commercial Invoice","Bill of Lading","Insurance Policy","Inspection Certificate"],"ans":1,"passage":null,"topic":"신용장"},{"id":"63-1-16","subj":1,"no":16,"head":"화환신용장의 조건은 다음과 같다. 화환신용장에서 요구한 원산지증명서에 대한 설명 중 잘못된 것은?","body":["Form of Documentary Credit: IRREVOCABLE","Documents Required:","+ COMMERCIAL INVOICE","+ OCEAN BILL OF LADING MADE OUT TO ORDER OF ISSUING BANK","+ PACKING LIST","+ CERTIFICATE OF ORIGIN"],"opts":["원산지증명서는 서명되어야 한다.","원산지증명서의 수하인을 개설의뢰인으로 기재해도 된다.","상공회의소에서 발행한 원산지증명서만 수리된다.","원산지증명서는 수출업자나 송하인이 수익자가 아닌 경우 복수의 서류에서 상이한 송장번호, 송장일자 및 선적경로로 표기될 수 있다."],"ans":3,"passage":null,"topic":"신용장"},{"id":"63-1-17","subj":1,"no":17,"head":"보증신용장(Standby L/C)과 은행보증서(Demand Guarantee)에 대한 설명으로 잘못된 것은?","body":[],"opts":["양자는 기본계약과는 별개인 독립성의 원칙이 적용되어 독립된 지급 의무를 진다.","보증신용장은 외형상 신용장 형식을 따르며, 관련 국제규칙으로 ISP 98과 UCP 600이 적용된다.","은행보증서는 보증서 형식으로 발행되며, 관련 국제규칙으로 URDG 758이 적용된다.","실무에서 보증신용장은 주로 호주계 은행이 발행하고, 은행보증서는 주로 아시아계 은행이 선호한다."],"ans":4,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"63-1-18","subj":1,"no":18,"head":"수출팩토링에 대한 설명으로 적절하지 않은 것은?","body":[],"opts":["수출팩토링은 수출팩터의 신용을 바탕으로 이루어지는 신용장거래로서, 수출팩터가 수입상의 신용에 따라 수출채권 매입 여부를 결정한다.","한국에서 상환청구권 없는(without recourse) 팩토링을 취급하는 실적은 한국수출입은행이 가장 많다.","수출팩토링은 수출자가 수출채권을 금융기관에 매각하여 자금을 조기에 회수하는 방식이다.","팩토링 수수료는 수출자가 부담하고, 수출자는 수수료를 수출 원가에 반영한다."],"ans":1,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"63-1-19","subj":1,"no":19,"head":"결제의 위험도 차원에서 일반적으로 결제방식과 시기가 수입자에게 유리한 순으로 나열된 것은?","body":["A. COD(Cash on Delivery)","B. Payment in advance by T/T","C. D/A(Documents against Acceptance)","D. O/A(Open Account)","E. At sight L/C"],"opts":["B → D → A → C → E","E → C → D → A → B","D → A → C → E → B","A → B → E → C → D"],"ans":3,"passage":null,"topic":"송금·추심·어음"},{"id":"63-1-20","subj":1,"no":20,"head":"다음 각 상황에서 위험관리에 활용할 수 있는 수단의 연결이 가장 부적절한 것은?","body":[],"opts":["수입자의 상품 입수 관련 위험관리 → 선적전 검사(Pre-shipment Inspection)","수출자의 선적불이행 관련 위험관리 → Performance Bond","수입자의 선지급 관련 위험관리 → Revolving credit","수출자의 외상 수출(O/A 30 days) 대금회수 관련 위험관리 → 무역보험"],"ans":3,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"63-1-21","subj":1,"no":21,"head":"다음 상황에 대한 해설로 가장 적절한 것은?","body":["A. ㈜한국무역은 라오스에 소재하는 제조기업과 임가공을 위한 계약을 체결하였다.","B. 임가공에 필요한 핵심 부품을 국내에서 구매하여 원상태로 라오스로 수출했다.","C. 임가공에 필요한 원자재를 중국에서 구매하여 라오스에서 납품받았다.","D. 가공된 완성품을 라오스에서 미국에 소재하는 기업에 판매하였다."],"opts":["B – 국내 구매를 위해 내국신용장을 이용하면 부가세 영세율을 적용받을 수 있다.","C – 원자재 수입용 신용장의 수익자와 요구서류인 송장의 화주가 다르면 하자 서류가 된다.","D - 완성품을 라오스에서 미국으로 직접 운송하면 수출실적을 인정받을 수 없다.","D – 미국기업과의 거래에 신용장을 사용한다면, 신용장에 “stale B/L acceptable”이라는 조건을 포함시켜야 한다."],"ans":1,"passage":null,"topic":"신용장"},{"id":"63-1-22","subj":1,"no":22,"head":"각 보기 중 밑줄 친 당사자가 수출입거래의 위험을 회피하기 위해 취한 방안으로 가장 부적절한 것은?","body":[],"opts":["선지급 조건을 피하는 수입자에게 <u>수출자<\/u>는 선급금 환수용 보증서 제공을 조건으로 선지급 조건을 수용하도록 협상한다.","COD조건 대신에 신용장 결제를 요구하는 수출자에게 <u>수입자<\/u>는 수출자가 발행한 선적전 검사증명서를 신용장 조건에 포함하여 수출자의 사기 가능성을 억제한다.","기계류 수입 거래에서 수출자에게 <u>수입자<\/u>는 하자담보를 위해 ISP 98이 적용되는 warranty standby L/C를 요구한다.","CAD조건을 요구하는 수출자에게 <u>수입자<\/u>는 COD 30days 조건으로 변경을 요구한다."],"ans":2,"passage":null,"topic":"보증·팩토링·무역보험"},{"id":"63-1-23","subj":1,"no":23,"head":"외국환은행 대고객 매매율에서 당발송금, 타발추심, 수입신용장 결제 등의 거래에 적용되는 환율은?","body":[],"opts":["T/T selling rate","Cash selling rate","T/T buying rate","T/C buying rate"],"ans":1,"passage":null,"topic":"외환·환리스크"},{"id":"63-1-24","subj":1,"no":24,"head":"다음 중 통화선물(Currency Futures)거래에 대한 설명으로 잘못된 것은?","body":[],"opts":["헤지 목적의 거래보다는 차익을 노리는 투기 목적의 거래가 훨씬 많다.","특정한 거래소 장내에서 다수 대 다수의 거래가 이루어진다.","납부해야 할 증거금은 참가자의 신용도에 따라 차등 적용된다.","원활한 거래 체결을 위하여 거래단위(계약) 규모와 결제일이 표준화되어 있다."],"ans":3,"passage":null,"topic":"외환·환리스크"},{"id":"63-1-25","subj":1,"no":25,"head":"다음은 현재 외환시장의 상황을 나타낸 것이다. 이때 USD/KRW 통화옵션의 프리미엄에 대한 설명으로 옳지 않은 것은? (환율 표시에서 앞의 통화가 기준통화)","body":["<div class=\"timg\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2kAAACqCAAAAAASd1j9AAAL2klEQVR42u2d25ajOhBDrVn8/y9rHnIz4CuYAOmthzndOSRNMLKryoUkBwDA4fjHJQAApgEA0wAAzZhCCEFcBwAOhacQgqiKAHAoRPQIAHkaADANAADTAIBpAMA0EG5SygLhhvtp4KJsYvsFpoHBtPL8Jz3J5ngFi4/R6zcFx2ucow/7HANlYRpIr2cPbujBkdcviUXu9dqLU5CKPA10wItVLIQQ7HV+tiTf4xDN8zmyOpgGtvAvCjWTqZyXZRPWOZgGysVFNwWZOWLCMJgGttXxVSUa7IJpoD1MdJC0gYz6/EezH0Cg9giSuZZyO2rPNE3BijO2aEmznj++fwAwDeTLHyruhPlJJKr8RI9gfxCZzcKciiA/bxB9WzANhCHtJDGx8q1ccA2mgVxRUa01kAzVHP9APAnTQJpMrmxd9zCXJQ2mgfXa9Gl4XO+YJVc6Q6VA7RF0UO3Jo2e/sEL8q+IaiFdvdKlzkmLkddJrxuKCtY59B4HLDS3R4/UaiAF5GoCOAKYBANMAgGkAAJgGAEwDAAT80wC4FtMoHIPw/T14/NMAAORpAMA0AABMAwCmAQDTAACBJ0HDQT4v/dVsxBV/eKhh2kD9DpcUclw/1gGDweuMoxZifT53QoRpxce+nNS9cWl6NOqmJ+6SKzjhM6d4VB7Wjl8fI5jW63+UOxZ2XUG+L/gjYjT3vnrprTxo6K9TDaYVWZIYDtcPhXSnWfI4sidevGpREbnDSHr5mtPaVhDt++YFoSPyf65mCkSP5wqaqr5+PQZpFX3ArwsFJy6EHY85kYrImeVeOSabiubTVqDSeOlARDm5dBM9nj4ZztYp5zZdFAkHu0xKcGKZ3zmXK50xSDCt7rO5mhK1XMkingqSnZ+5yR8x6ERzwSkzIUyL1yknM+zVtGjodHXldbfHLjDtywYUKfZo3ROiTJ+BovwAGp5OtfoT4IJpF9pSc7Han3s/six3GGN/eaRg2qrsEU2IOr0vFezvGF6ucMGm9nitqa9OKbOQXTFq1KwPNT9Chmk4U4BtW6Lh2QDyagV5e8idHYnAtMSU5/KL6S5jwbqLVLbCq4c4Nn5sGFWcCu9BSnCy3uOlb2OZNY1AEQR0RAD4EdlkmAYINGAaAESPAACYBgBMAyDgVAhAOOY5P5jG/hDAqRCnQgDI0wAAMA0AmAYATAMAwDQAYFq49n6OtHdDSOO2kcSWU8ATNPxtlZfFbpBmhnf7HhdNu+SJR98OVu1ZmKy9tafxBB3jClNXj1P9ejc42yX/p5t1Dz4ngMnhbqfC2XjqPUN+ZKffUiOsaWHPE0pK+2mVZV7khVvr6pAxznZVl0MTUo6Q7VkFJdGrOBUeI1/bxE5HQu46ssmPBevohNwztXD
