"선물환거래와 한국거래소에서 거래되는 미국달러 선물의 상품명세 및 그 활용 등에 대한 다음 설명 중 잘못된 것은?","body":[],"opts":["두 거래를 활용하는 기업은 거래하는 방법 등에서는 차이가 있지만 거의 같은 헤지 결과를 달성할 수 있다.","한국거래소에서 거래되는 미국달러 선물의 거래단위는 USD 100,000이다.","미국달러 선물을 활용하는 경우 증거금을 적립해야 하므로 신용도가 우수한 기업들은 주로 선물환거래를 많이 활용한다.","은행이 대고객 선물환거래를 하기 이전에 그 거래가 실수요와 관련됨을 확인하여야 한다."],"ans":2,"passage":null,"topic":"외환·환리스크"},{"id":"63-1-30","subj":1,"no":30,"head":"숏 포지션이 있는 A기업이 헤지 목적으로 향후 달러/원 환율이 큰 폭으로 상승할 것으로 예상하면서 비용은 옵션 프리미엄 수준으로 제한하려고 할 때, 선물환거래의 대안이될 수 있는 옵션 전략은 무엇인가?","body":[],"opts":["콜옵션 매입","콜옵션 매도","풋옵션 매입","풋옵션 매도"],"ans":1,"passage":null,"topic":"외환·환리스크"},{"id":"63-2-1","subj":2,"no":1,"head":"무역계약에 대한 설명으로 잘못된 것은?","body":[],"opts":["무역계약은 국제물품매매계약으로서 매도인 관점에서는 수출계약이다.","무역계약은 당사자가 서로 다른 국가에 영업소를 두고 체결하는 국제계약이다.","무역계약은 클레임 예방을 고려해 매도인과 매수인이 서면으로 체결해야만 유효하다.","무역계약의 특수성은 매매계약 이행을 위해 제3자와의 종속계약이 수반된다는 점이다."],"ans":3,"passage":null,"topic":"계약 일반"},{"id":"63-2-2","subj":2,"no":2,"head":"무역계약의 해석순서와 관련하여 (A)와 (B)에 들어갈 내용으로 올바른 것은?","body":["∙ 국제무역계약 체결에서 거래조건을 모두 명시하는 것은 현실적으로 불가능하다.","∙ 계약서에서 약정한 조건 외에도 공백이 존재할 수 있으므로, 이를 보완하기 위해 국제적으로 인정된 ( A )이 적용된다.","∙ 그러나 ( A )으로도 계약의 모든 공백을 메우는 것은 불가능하기 때문에 명시적 또는 묵시적으로 정해지지 않은 부분의 해석을 위해 당사자 간에 합의한 ( B )을 기준으로 해석하는 것이 일반적이다."],"opts":["(A) 정형거래조건 · (B) 중재조항","(A) 중재조항 · (B) 거래관습","(A) 거래관습 · (B) 정형거래조건 조항","(A) 거래관습 · (B) 준거법"],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"63-2-3","subj":2,"no":3,"head":"다음 조건으로 체결되는 무역계약의 법률적 특성을 모두 고른 것은?","body":["1. 물품: 3D 프린터용 소프트웨어","2. 수량: 1EA","3. 가격: USD 100,000.00","4. 결제: T/T WITHIN 30 DAYS AFTER THE DATE OF PROFORMA INVOICE","5. 인도: - 방식: 매수인의 이메일주소로 파일(소프트웨어)을 첨부하여 전송","- 기한: 2025년 이내, 정확한 기한은 추후 구두 합의","6. 별도의 계약서 없이 상기 조건이 기재된 매도인의 ‘PROFORMA INVOICE’를","계약서로 대체하기로 구두 합의","A. 유상계약 B. 편무계약 C. 낙성계약","D. 요물계약 E. 불요식계약 F. 쌍무계약"],"opts":["A, C","B, D, E","A, C, E, F","B, C, D, E, F"],"ans":3,"passage":null,"topic":"계약 일반"},{"id":"63-2-4","subj":2,"no":4,"head":"Incoterms 2020의 조건들을 기준에 따라 분류한 것이 옳은 것만으로 짝지어진 것은?","body":["A. 해상 및 내수로 운송 방식에만 사용되는 조건 : FAS, FOB, CFR, CIF","B. 매도인이 주운임(main freight)을 부담하는 조건 : EXW, FCA, FAS, DAP, DPU, DDP","C. 위험의 분기점과 비용의 분기점이 다른 조건 : CFR, CIF, CPT, CIP","D. 적출지(수출지)의 지명이 표기되어야 하는 조건 : EXW, FCA, FAS, FOB","E. 매도인이 도착지에서 물품을 양하(unloading)할 의무가 있는 조건 : DAP, DDP"],"opts":["A, B, C","A, C, D","B, D, E","C, D, E"],"ans":2,"passage":null,"topic":"인코텀즈"},{"id":"63-2-5","subj":2,"no":5,"head":"컨테이너운송의 경우에 Incoterms 2020 사용 등에 관한 설명으로 잘못된 것은?","body":[],"opts":["컨테이너를 이용한 운송의 경우에는 절대 FOB 조건을 사용할 수 없다.","컨테이너를 이용한 운송의 경우에는 매도인이 물품을 본선에 인도하는 것이 곤란하므로, CY 또는 CFS에서 운송인에게 인도하는 것이 편리하다.","컨테이너를 이용한 운송의 경우에는 FCA, CPT, CIP 조건 사용을 권장한다.","매도인의 위험 이전은 FCA 조건이 FOB 조건보다 먼저 발생한다."],"ans":1,"passage":null,"topic":"인코텀즈"},{"id":"63-2-6","subj":2,"no":6,"head":"다음 중 Incoterms 2020의 조건 중에서 보험계약을 체결하는 자와 사고 발생 시 보험금을 받는 자가 다른 조건만으로 연결된 것은?","body":[],"opts":["FOB – CFR","FCA – CPT","CIF - CIP","EXW – DDP"],"ans":3,"passage":null,"topic":"인코텀즈"},{"id":"63-2-7","subj":2,"no":7,"head":"Incoterms 2020과 CISG의 관계에 관한 설명으로 잘못된 것은?","body":[],"opts":["Incoterms 2020은 매매계약 당사자의 권리와 의무에 중점을 두고, CISG는 매매계약 당사자의 계약위반에 대한 권리구제에 중점을 두고 있으므로 상호 독립적 관계에 있다.","Incoterms 2020은 법률이 아닌 관습이지만, 유엔협약인 CISG보다 우선할 수 있다.","계약의 성립에 관해서는 CISG가 Incoterms 2020에 우선한다.","Incoterms 2020이 물품의 인도에 관하여 CISG보다 구체적 규정을 두고 있다."],"ans":1,"passage":null,"topic":"인코텀즈"},{"id":"63-2-8","subj":2,"no":8,"head":"계약의 성립 시기에 대해 CISG와 UNIDROIT 국제상사계약원칙을 가장 잘 설명한 것은?","body":[],"opts":["CISG는 승낙이 도달한 시점, UNIDROIT는 발송한 시점을 기준으로 계약이 성립한다.","CISG는 승낙이 발송한 시점, UNIDROIT는 도달한 시점을 기준으로 계약이 성립한다.","CISG와 UNIDROIT는 모두 승낙이 도달한 시점을 기준으로 계약이 성립한다.","CISG와 UNIDROIT는 모두 승낙이 발송한 시점을 기준으로 계약이 성립한다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"63-2-9","subj":2,"no":9,"head":"계약에 적용되는 규칙으로서 UNIDROIT 국제상사계약원칙에 관한 설명으로 잘못된 것은?","body":[],"opts":["계약에서 지정된 법의 일반원칙이나 상인법 등을 구현하는 규범으로서 UNIDROIT의 적용이 가능하다.","당사자에 의한 준거법의 선택이 없는 경우에 UNIDROIT의 적용이 가능하다.","국내법을 해석하고 보충하는 수단으로는 UNIDROIT를 적용할 수 없다.","국제적 통일법 문서를 해석하고 보충하는 수단으로서 UNIDROIT의 적용이 가능하다."],"ans":3,"passage":null,"topic":"계약 성립·CISG"},{"id":"63-2-10","subj":2,"no":10,"head":"국제 상거래 계약에서 일반적으로 인정되는 계약의 기본원칙 중에서 잘못된 것은?","body":[],"opts":["계약자유의 원칙(Freedom of Contract): 당사자는 서로 합의하여 계약의 형식, 내용 등을 자유롭게 정할 수 있다.","계약 준수의 원칙(Pacta sunt servanda): 체결된 계약은 반드시 이행되어야 한다.","신의성실의 원칙(Principle of Good Faith): 계약의 해석과 이행에서 상대방의 이익을 합리적으로 고려하면서 성실하게 행동해야 한다.","작성자 유리의 원칙(Contra Proferentem Rule): 계약서나 문서의 내용이 모호할 경우에는 문서 작성자 입장을 고려하여 유리하게 해석한다."],"ans":4,"passage":null,"topic":"계약 일반"},{"id":"63-2-11","subj":2,"no":11,"head":"다음 ( )안에 들어갈 조건부 청약으로 올바르게 짝지어진 것은?","body":["∙ ( A )은 매수 희망자의 승낙이 도착했을 때 물품이 판매되지 않고 재고가 있는","경우에만 계약이 성립된다는 것을 조건으로 하는 청약이다.","∙ ( B )은 오퍼와 함께 현품을 보내서 상대방이 사용해 보아 만족할 것을 조건으로","하는 청약이다.","∙ ( C )은 발행되어도 구속력이 없어 상대방이 승낙하더라도 계약이 성립되지 않고,","다시 청약자의 최종 수락이 있어야만 계약이 성립되는 청약이다."],"opts":["(A) 최종확인조건부청약 · (B) 승인조건부청약 · (C) 선착순판매조건부청약","(A) 최종확인조건부청약 · (B) 선착순판매조건부청약 · (C) 승인조건부청약","(A) 선착순판매조건부청약 · (B) 최종확인조건부청약 · (C) 승인조건부청약","(A) 선착순판매조건부청약 · (B) 승인조건부청약 · (C) 최종확인조건부청약"],"ans":4,"passage":null,"topic":"계약 성립·CISG"},{"id":"63-2-12","subj":2,"no":12,"head":"BWT(보세구역 인도조건)에 관한 다음 설명 중 잘못된 것은?","body":[],"opts":["수출자는 자신의 책임하에 수입국 내의 관리인을 지정하고 물품을 수입국 내 보세창고에 반입시킨다.","물품은 수출국에서 유환(有換)으로 반출된 후, 수입국 현지에서 물품 구매 계약이 체결되어 판매된다.","거래선을 발굴하여 매매계약이 성립되기 전까지는 수입자가 정해지지 않은 상태에서 거래가 진행된다.","보세구역 내에서 판매되지 않은 물품은 반송이 가능하다."],"ans":2,"passage":null,"topic":"계약 일반"},{"id":"63-2-13","subj":2,"no":13,"head":"국제비즈니스 계약으로서 대리점계약과 판매점계약에 대한 설명으로 잘못된 것은?","body":[],"opts":["기업은 해외 진출을 위한 수출의 한 형태로 국제판매점계약과 국제대리점계약을 고려할 수 있다.","국제판매점은 본인으로부터 수수료를 취하고, 국제대리점은 매매차익을 취하는 방식이라는 점에서 차이가 존재한다.","국제대리점은 외국의 본인(수출상) 명의로 계약을 체결하면서 대리인 역할을 한다.","국제판매점은 외국의 본인(수출상)으로부터 물품을 구매하여 자신의 이름으로 제3자에게 판매한다."],"ans":2,"passage":null,"topic":"계약 일반"},{"id":"63-2-14","subj":2,"no":14,"head":"다음 ( )안에 들어갈 품질조건이 올바르게 짝지어진 것은?","body":["∙ ( A ): 주로 농수산물의 선물매매에 이용되는 조건으로, 선적 시 선적 장소에서","당해 계절의 상품들의 ( A ) 품질로 간주된다.","∙ ( B ): 목재, 냉동 어류 등의 거래에 이용되는 조건으로, 견본 이용이 곤란하거나","외관상 제품 내부의 품질을 알 수 없는 물품에 주로 사용된다.","∙ ( C ): 주로 원사 거래에 이용되는 조건으로, 공인검사기관 또는 공인표준기준에","의하여 ( C ) 품질을 표준품으로 결정하는 조건이다."],"opts":["(A) 판매적격품질조건 · (B) 평균중등품질조건 · (C) 보통품질조건","(A) 판매적격품질조건 · (B) 보통품질조건 · (C) 평균중등품질조건","(A) 평균중등품질조건 · (B) 판매적격품질조건 · (C) 보통품질조건","(A) 평균중등품질조건 · (B) 보통품질조건 · (C) 판매적격품질조건"],"ans":3,"passage":null,"topic":"거래조건"},{"id":"63-2-15","subj":2,"no":15,"head":"무역계약의 수량조건 및 선적조건에 관한 다음 설명 중 잘못된 것은?","body":[],"opts":["신용장방식에서 살물(bulk cargo)은 명시적인 과부족용인약관이 없더라도 5%의 과부족이 허용된다.","송금, 추심방식은 과부족이 발생할 수 있는 물품에 대해 수출자가 계약서에 과부족용인 조항을 명시하지 않고 과부족이 발생하는 경우 계약위반이 될 수 있다.","컨테이너 복합운송의 경우에는 일반적으로 Berth Term이 적용되므로 화주가 선적·양하의 비용을 모두 부담해야 한다.","신용장방식에서 선적일의 증명은 운송서류에 발행일만 있는 경우는 발행일, 선적일이 별도로 있는 경우는 선적일을 기준으로 한다."],"ans":3,"passage":null,"topic":"거래조건"},{"id":"63-2-16","subj":2,"no":16,"head":"무역계약에서 포장조건(Terms of Packing)을 정할 때 고려해야 할 요소가 아닌 것은?","body":[],"opts":["포장비용 부담의 주체","수출입 국가의 운송 및 포장재에 대한 규제사항","FCL 또는 LCL cargo에 따른 화인의 표시 방법","물품 가격 등 수입자의 관세와 내국세 신고에 필요한 사항"],"ans":4,"passage":null,"topic":"거래조건"},{"id":"63-2-17","subj":2,"no":17,"head":"무역계약의 선적조건(Terms of Shipment)에 관한 설명으로 올바른 것은?","body":[],"opts":["신용장 거래에서 선적이 시급하면 immediate shipment, prompt shipment, as soon as possible shipment 등 즉시선적조건을 약정하는 것이 좋다.","신용장에 환적을 금지하는 규정이 있다면, 환적 예정 선하증권은 물품이 선하증권에 의해 트레일러 또는 컨테이너선에 선적되었음이 증명되는 경우라도 절대 수리될 수 없다.","선적지연의 원인이 매도인이 통제할 수 없는 불가항력이라면 매도인이 면책된다. 그러나 매매계약에서 불가항력 사유, 면책사항이 포함한 불가항력조항을 설정하여 두는 것이 권장된다.","신용장에서 선적 기간을 정할 때 사용되는 to, until, from, between 등의 전치사는 언급된 일자 및 일자들을 제외한다."],"ans":3,"passage":null,"topic":"거래조건"},{"id":"63-2-18","subj":2,"no":18,"head":"개별계약서의 이면사항이나 포괄계약서의 한 조항으로 약정하는 「Hardship Clause」 에 대하여 잘 설명하고 있는 것은?","body":[],"opts":["이 조항은 제조되고 판매된 물품이 소비자나 제3자의 신체 또는 재산에 손상과 손해를 끼쳤을 경우 제조자, 무역업자, 유통업자, 원자재 생산자 등에게 배상책임을 물을 수 있는 책임에 대하여 매도인과 매수인이 약정하는 내용이다.","이 조항에 단순히 “Act of God”만을 기재한다면, 홍수나 지진과 같은 자연재해는 포함되지만, 파업이나 원자재의 부족 등은 포함되지 않는 것으로 해석될 수 있다.","이 조항은 계약체결 시에 예상치 못했던 경제적 또는 기타 사정의 변경으로 인해 계약대로의 이행이 심히 곤란해져 계약의 본질적 변경이 불가피해진 경우를 대비하는 것이다.","이 조항은 본 계약서가 당사자의 합의를 전부 표시하고 있는 유일한 합의서이며, 그 이외의 내용은 인정할 수 없다는 내용이다."],"ans":3,"passage":null,"topic":"클레임·분쟁"},{"id":"63-2-19","subj":2,"no":19,"head":"매도인의 계약위반에 따른 매수인의 구제 수단에 관한 설명으로 잘못된 것은?","body":[],"opts":["계약해제권은 매도인이 계약을 근본적이고 본질적으로 위반한 경우에 행사할 수 있다.","하자보완청구권은 물품에 계약과 일치하지 않는 하자가 있는 경우, 그 보완을 매수인이 청구할 수 있는 권리이다.","대체품인도청구권은 부적합 물품의 하자 통지와 함께 합리적인 기간 내에 대체품의 인도를 청구할 수 있는 권리이다.","물품명세확정권은 물품이 계약과 일치하지 않는 경우, 매수인이 물품의 명세를 스스로 확정할 수 있는 권리이다."],"ans":4,"passage":null,"topic":"클레임·분쟁"},{"id":"63-2-20","subj":2,"no":20,"head":"다음 중 소송과 중재에 대한 설명으로 올바른 것은?","body":[],"opts":["소송은 당사자가 처분할 수 있는 사법의 분쟁만을 대상으로 한다.","소송은 중재에 비해 비용이 상대적으로 저렴하고 강제집행면에서 유리하다.","중재는 복잡한 절차와 삼심제도를 특징으로 하므로 소송에 비해 오래 걸린다.","중재는 비공개주의를 원칙으로 하므로, 기업 또는 개인의 비밀이 보장되어 소송에 비해 대외신용도의 침해 우려가 적다."],"ans":4,"passage":null,"topic":"클레임·분쟁"},{"id":"63-2-21","subj":2,"no":21,"head":"무역계약에 관한 설명으로 올바른 것은?","body":[],"opts":["계약의 주요 내용을 포함하고 있는 견적송장(Proforma Invoice)은 청약의 유인이기 때문에 이에 대한 승낙만으로는 절대 계약이 성립되지 않는다.","수입자 입장에서는 무역계약의 선적일은 무조건 빠를수록 유리하다.","클레임 제기기간은 당사자 간에 약정이 있으면 해당 기간 안에 제기하면 되지만, CISG에서는 약정이 없는 경우에도 제척기간 2년을 넘길 수 없다.","중재판정은 법원의 확정판결과 동일한 효력을 지니며, 뉴욕협약을 통해 모든 국가에서 외국중재판정의 승인 및 집행을 보장받는다."],"ans":3,"passage":null,"topic":"계약 일반"},{"id":"63-2-22","subj":2,"no":22,"head":"다음이 설명하는 국제 민간 무역기관은?","body":["A. Incoterms, UCP 등 다양한 국제무역규칙을 제정ㆍ개정한다.","B. 국제중재법원을 운영하고, 국제중재규칙을 통해 상거래 분쟁을 해결한다.","C. 무역에 사용하는 분야별 국제표준계약서를 제공한다.","D. 국제기업 행동강령 등을 통해 지속 가능한 무역환경을 조성한다.","E. 무역실무 관련 교육과 자료를 출판ㆍ보급한다."],"opts":["국제무역센터 (ITC: International Trade Centre)","세계무역기구 (WTO: World Trade Organization)","국제상업회의소 (ICC: International Chamber of Commerce)","국제무역법위원회 (UNCITRAL: UN Commission on International Trade Law)"],"ans":3,"passage":null,"topic":"계약 일반"},{"id":"63-2-23","subj":2,"no":23,"head":"무역계약에서 주계약과 종속계약에 관한 설명으로 잘못된 것은?","body":[],"opts":["CIP 조건은 수출자가 반드시 적하보험을 부보해야 하므로, 제시되는 가격에는 보험료가 포함되어야 한다.","대표적인 종속계약인 운송계약, 보험계약, 결제계약을 체결하는 당사자는 반드시 Incoterms 조건에 따라 결정된다.","무역계약의 이행을 위한 종속계약으로서, 운송계약과 보험계약은 물품인도를 위해, 결제계약은 대금지급을 위해 체결된다.","수출자가 운임 또는 보험료를 할인 등으로 저렴하게 이용할 수 있는 경우, Incoterms의 F-조건보다는 C-조건을 활용하는 것이 가격 경쟁력 차원에서 유리할 수 있다."],"ans":2,"passage":null,"topic":"계약 일반"},{"id":"63-2-24","subj":2,"no":24,"head":"다음 지문에서 설명하는 복합운송의 경로는 무엇인가?","body":["아시아 국가의 항만에서 파나마운하를 경유하여 북미 동해안 항구(예: 뉴욕항)까지 해상운송하고, 그곳에서 철도로 환적하여 내륙의 주요 지점까지 운송하는 방식이다."],"opts":["MLB(Mini-Land Bridge)","IPI(Interior Point Intermodal)","OCP(Overland Common Point)","RIPI(Reversed Interior Point Intermodal)"],"ans":4,"passage":null,"topic":"운송"},{"id":"63-2-25","subj":2,"no":25,"head":"다음 중 정기선 컨테이너 화물의 부대비용에 관한 설명으로 잘못된 것은?","body":[],"opts":["Demurrage : 항해용선계약에서 허용된 정박기간을 초과한 일수에 대해 용선자가 선주에게 지불하기로 약정한 금액","Terminal Handling Charge : 수출화물은 컨테이너가 CY에 입고된 순간부터 본선의 선측까지, 수입화물은 본선의 선측에서 CY 게이트를 통과하기까지 화물의 이동에 수반되는 비용","Detention Charge : 화주가 컨테이너 또는 트레일러를 대여받은 후 정해진 시간(free time) 내에 반환하지 못할 경우 운송인에게 지불해야 하는 벌금 성격의 비용","CFS Charge : CFS에서 LCL화물의 혼재, 적입, 적출, 분류작업에 수반되는 비용"],"ans":1,"passage":null,"topic":"운송"},{"id":"63-2-26","subj":2,"no":26,"head":"무역운송 인프라 설명 중 잘못된 내용인 것은?","body":[],"opts":["컨테이너선은 초창기에 정기항로에 취항할 일반화물선을 전용선으로 했으므로 선형에 의한 분류, 하역 장비 장착에 의한 분류, 하역방식에 의한 분류 등으로 구분한다.","항만은 해륙 운송의 중계지로 육상 운송된 화물의 원활한 선적과 양하를 위한 시설을 갖추고 산업활동이 이루어지고 있는 장소를 의미한다.","내륙컨테이너기지는 항만 또는 공항이 아닌 내륙기지로서 컨테이너 집화, 통관, 컨테이너 수리, 화물주선, 재고관리, 포장, 내륙운송 등의 업무를 처리할 수 있다.","공항은 항공기 운항의 중심지로서 여객과 화물의 기지로 운영되고 있으며, 항공화물 터미널의 하역 장비에는 Gantry Crane, Transporter, Dolly, Rich Stacker, Straddle Carrier 등이 있다."],"ans":4,"passage":null,"topic":"운송"},{"id":"63-2-27","subj":2,"no":27,"head":"피보험자의 의무 내용에 대한 설명 중에서 올바른 내용들로 짝지어진 것은?","body":["A. 고지의무는 보험계약을 체결하기 위한 교섭 중 또는 계약 성립 이전에 이행되어야 한다.","B. 고지의무의 이행은 보험계약자가 관련 서류를 보험자에게 직접 제출하는 형태로만 이루어진다.","C. 보험사고의 위험을 감소시키는 사항은 고지하지 않아도 고지의무 위반이 되지 않는다.","D. 워런티를 위반하면, 보험자는 그 시점부터 보상책임을 면하게 된다.","E. 보험증권 원본을 갖고 있으면 보험료를 지불한 것으로 인정되어 무조건 보상을 받을 수 있다."],"opts":["A, B, D","A, D. E","A, B, C","A, C, D"],"ans":4,"passage":null,"topic":"해상보험"},{"id":"63-2-28","subj":2,"no":28,"head":"보험클레임의 처리에 관한 내용 중에서 올바르지 않은 것은?","body":[],"opts":["화물에 손해가 발생하였을 때는 지체 없이 손상 화물의 양하지 또는 그 인접 지역의 보험사 본지점 또는 대리점에 통지하여 손해 사정 절차를 받는 것이 필요하다.","피보험자는 현실적으로 발생한 혹은 발생할 화물의 손해를 방지, 경감할 의무가 있다.","피보험자가 취해야 할 조치 중에 사고에 대한 책임이 있는 당사자에게 손해배상청구권의 보전 및 행사가 있다.","손해통지의무와 손해방지의무, 구상권 보전의무는 공동해손이 발생한 경우에만 행하는 피보험자의 보험클레임 처리 행위이다."],"ans":4,"passage":null,"topic":"해상보험"},{"id":"63-2-29","subj":2,"no":29,"head":"2009년 협회적하약관(ICC 2009) 운송약관 상 보험자의 책임이 개시되는 시점으로 올바른 것은?","body":[],"opts":["보험목적물이 운송의 개시를 위해 보험증권 상 명시된 장소의 창고 혹은 보관장소를 떠날 때","보험목적물이 운송의 개시를 위해 보험증권 상 명시된 장소의 창고 혹은 보관장소에서 운송수단에 적재된 때","보험목적물이 운송의 개시를 위해 운송차량 혹은 운송용구에 적재할 목적으로 보험증권 상 명시된 장소의 창고 혹은 보관장소에서 처음 이동할 때","보험목적물이 선박에 적재된 때"],"ans":3,"passage":null,"topic":"해상보험"},{"id":"63-2-30","subj":2,"no":30,"head":"다음 중 해상손해의 보상에 관한 설명으로 올바른 것은?","body":[],"opts":["구조료(salvage charge)는 구조계약과 관계없이 임의로 구조한 자에게 구조의 성공 여부와 관계없이 지급된다.","손해방지비용은 물적손해 등에 대한 보상액과 손해방지 비용의 합계가 보험금액을 초과하는 경우에도 보상한다.","특별비용은 단독해손에 포함된다.","추정전손이 있는 경우 현실전손과 같이 전손에 해당하는 보험금을 청구하기 위해서는 보험목적물을 보험자에게 대위하여야 한다."],"ans":2,"passage":null,"topic":"해상보험"},{"id":"63-3-1","subj":3,"no":1,"head":"다음은 어떤 청약(offer)에 해당하는가?","body":["Regarding your e-mail of June 20, 2025, please be informed that we are not in a position to accept your offer of silk handkerchiefs under the terms you proposed. It is likely that we will be able to procure the same product at a significantly lower price through another channel. We would appreciate it if you could consider revising your quotation, as we are keen to continue doing business with you."],"opts":["Firm offer","Original offer","Free offer","Counter offer"],"ans":4,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"63-3-2","subj":3,"no":2,"head":"서신의 내용상 밑줄 친 (A)에 들어갈 적절한 문장은?","body":[],"opts":["This article is no longer manufactured because it has become outdated.","We will make every effort to fill your order so that the goods will be shipped in time.","As our factory is at present fully occupied with orders, we regret to decline your order.","We are sorry that we have not been able to serve you this time, but as soon as conditions return to normal, we will contact you."],"ans":1,"passage":"63-3-2","topic":"서신·이메일"},{"id":"63-3-3","subj":3,"no":3,"head":"위 서신의 표제로 적절하지 않은 것은?","body":[],"opts":["Response to Order","Recommendation of a Substitute","Decline of Order","Confirmation of Contract"],"ans":4,"passage":"63-3-2","topic":"서신·이메일"},{"id":"63-3-4","subj":3,"no":4,"head":"위 서신의 밑줄 친 부분을 대체하기에 가장 적절한 것은?","body":[],"opts":["we would like to make an offer subject to the availability of stock when the order is made","we are pleased to offer you the goods below, subject to market fluctuation","it is our pleasure to make an offer that is valid","we are making an offer on sale or return"],"ans":3,"passage":"63-3-4","topic":"서신·이메일"},{"id":"63-3-5","subj":3,"no":5,"head":"다음 중 위 서신의 내용에 대한 설명으로 잘못된 것은?","body":[],"opts":["USD 25.00/kg includes costs for transportation and insurance to New York, USA.","A sight draft will be drawn to the issuing bank for payment under the L/C.","This is a firm offer proposing terms and conditions, which are effective until July 31, 2025.","The shipment will be made within 30 days after payment is made under the L/C."],"ans":4,"passage":"63-3-4","topic":"서신·이메일"},{"id":"63-3-6","subj":3,"no":6,"head":"국제물품매매계약에 관한 UN협약(CISG 1980)상 아래 예시의 밑줄 친 (A)에 들어갈 청약의 효력 소멸 사유는?","body":["On May 1, Seller delivered to Buyer an offer that stated: “I will hold this offer open until June 1.” On May 7, Buyer delivered to Seller the following: “I cannot accept your offer since the price is too high,” but on May 10, Buyer delivered to Seller the following: “I hereby accept your offer of May 1.” Seller immediately informed Buyer that this “acceptance” was not effective because of the earlier <u>(A)<\/u> : Buyer replied that this was not true because Seller has promised to hold the offer open until June 1."],"opts":["Withdrawal","Validity","Rejection","Revocation"],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"63-3-7","subj":3,"no":7,"head":"다음은 국제물품매매계약에 관한 UN협약(CISG 1980)의 일부이다. 공란 (A), (B), (C) 에 들어가기에 가장 적절한 내용으로 짝지어진 것은?","body":["The Convention governs only the ( A ) of the contract of sale and the rights and obligations of the seller and the buyer arising from such a contract. In particular, except as otherwise expressly provided in this Convention, it is not concerned with:","(i) the ( B ) of the contract or of any of its provisions or of any usage;","(ii) the ( C ) which the contract may have on the property in the goods sold."],"opts":["A effect · B application · C validity","A validity · B formation · C effect","A conclusion · B formation · C validity","A formation · B validity · C effect"],"ans":4,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"63-3-8","subj":3,"no":8,"head":"Incoterms 2020의 DPU 규칙에서 매도인의 의무가 아닌 것은?","body":[],"opts":["The seller must enter into relevant contracts of carriage with the various carriers up to the named place.","The seller must pay for unloading charges at the place of destination.","The seller must bear import duty and taxes.","The seller must bear the cost of delivery up to the agreed destination."],"ans":3,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"63-3-9","subj":3,"no":9,"head":"다음 서신의 내용으로 유추할 수 있는 매매계약 내용으로 잘못된 것은?","body":["Dear Sirs,","On behalf of our customer, we would like to request a freight quotation for collection from Yangsan ICD, Korea and delivery to Auckland port, the arriving port. Our goods are:","∙ 20 dressing table assembly kits, packed in wooden boxes","∙ 20 stool chairs, W31xD31xH46 (cm)","The dressing table assembly kits and stool chairs are protected against knocks by wooden boxes and the invoice value of the goods is USD 5,000. The freight will be paid by our customer once the goods are delivered at the arriving port.","Very truly yours,"],"opts":["FCA term may be used in a contract between the seller and the buyer.","The seller fulfills his/her delivery obligation when the goods are handed over to the carrier at Yangsan ICD.","The seller will procure an insurance to Auckland port.","The costs for transportation to Yangsan ICD are included in USD 5,000."],"ans":3,"passage":null,"topic":"서신·이메일"},{"id":"63-3-10","subj":3,"no":10,"head":"다음은 계약서 내용의 일부이다. 어떤 조항의 내용인가?","body":["Should the opening of the letter of credit be delayed due to reasons for which the Buyer is responsible, the Buyer shall pay to the Seller an amount equivalent to three-tenths of one percent (0.3%) of the contract value."],"opts":["Liquidated damage clause","Entire agreement clause","Non-waiver clause","Frustration clause"],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"63-3-11","subj":3,"no":11,"head":"다음은 무역계약서 내용의 일부이다. 조건에 대한 일반적인 설명으로 잘못된 것은?","body":["∙ Description: Duster (Model No.ASE-23)","∙ Quantity : 2,000 pieces","∙ Price : USD 12.00/pcs CIP New York (subject to Incoterms 2020)","∙ Shipment : within 30 days after an order","∙ Payment : By an irrevocable L/C at sight (subject to UCP 600)"],"opts":["A negotiable bill of lading marked freight prepaid should be issued.","A usance bill of exchange should be drawn on the buyer.","The seller has a contractual obligation to procure insurance with maximum coverage to New York.","The risk of the goods will be transferred when the goods are handed over to the first carrier."],"ans":2,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"63-3-12","subj":3,"no":12,"head":"다음은 무역계약서의 일부이다. 계약서의 내용으로 틀린 것은?","body":["This Agreement shall become effective on the date it is signed by both parties and shall remain in force for a period of three (3) years. No later than six (6) months prior to the expiration of this term, the parties shall engage in discussions regarding the renewal of the Agreement. If both parties mutually agree to renew, the Agreement shall be extended for an additional three (3) years, either under the same terms and conditions or as amended by mutual consent. If no agreement on renewal is reached, this Agreement shall automatically terminate upon the conclusion of the initial three (3) year period."],"opts":["This contract becomes effective from when both parties sign the contract.","This contract may be extended if both parties agree to do so six months before the contract terminates.","The terms and conditions of this contract may be revised upon its renewal for an additional three-year period.","In the absence of an agreement to the contrary, this contract will be renewed for another three years."],"ans":4,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"63-3-13","subj":3,"no":13,"head":"위 신용장에 대한 설명으로 잘못된 것은?","body":[],"opts":["This is an irrevocable and negotiable letter of credit and allows partial shipments.","The seller may choose a shipping port in Korea.","The seller could not invoice for USD 4,000,000 under this L/C.","The seller is responsible for arranging the vessel and paying the freight."],"ans":3,"passage":"63-3-13","topic":"신용장·결제"},{"id":"63-3-14","subj":3,"no":14,"head":"위 신용장 조건에 따라 수익자가 제시한 서류 중 수리가능 한 서류제시에 해당하는 것은?","body":[],"opts":["Commercial invoices and certificate of origin, both issued by the seller","A Bill of Lading stating that the freight is prepaid to Laem Chabang, Thailand","A Bill of Lading stating the consignee is Siam Tinplate Co., Ltd., and the consignor is POSCO INTERNATIONAL CO., LTD","A Bill of Lading issued on September 12th, 2025, at Busan, Korea"],"ans":2,"passage":"63-3-13","topic":"신용장·결제"},{"id":"63-3-15","subj":3,"no":15,"head":"다음은 어떤 신용장에 대한 설명인가?","body":["This credit refers to a credit instrument, that is issued or drawn without requiring any supporting documents other than the financial document itself, like bill of exchange. Therefore, under this credit, no shipping documents are attached because it is not conditioned upon the presentation of any documents proving shipment or delivery."],"opts":["Back-to-back credit","Red clause credit","Revolving credit","Clean credit"],"ans":4,"passage":null,"topic":"신용장·결제"},{"id":"63-3-16","subj":3,"no":16,"head":"매입신용장 하에서 발행이 되는 환어음의 밑줄 친 부분(A~D)에 해당하는 당사자가 올바르게 짝지어진 것은?","body":["AT XXXXX SIGHT OF THE FIRST BILL OF EXCHANGE (SECOND OF THE SAME TENOR AND DATE BEING UNPAID) PAY TO <u>(A)<\/u>  OR ORDER THE SUM OF US DOLLARS FIFTY EIGHT THOUSAND SEVEN HUNDREDS ONLY VALUE RECEIVED AND CHARGE THE SAME TO ACCOUNT OF <u>(B)<\/u>  DRAWN UNDER BANK OF AMERICA, SEATTLE, U.S.","L/C NO.: LC-8935-23-100 DATED 2025.04.03.","TO: <u>(C)<\/u>","","<u>(D)<\/u>","G.D.HONG, President"],"opts":["(A) issuing bank · (B) buyer · (C) negotiating bank · (D) seller","(A) confirming bank · (B) seller · (C) issuing bank · (D) buyer","(A) negotiating bank · (B) buyer · (C) issuing bank · (D) seller","(A) paying bank · (B) seller · (C) negotiating bank · (D) buyer"],"ans":3,"passage":null,"topic":"신용장·결제"},{"id":"63-3-17","subj":3,"no":17,"head":"다음 서신의 내용상 계약 당사자 간에 합의한 결제방식은?","body":["We are pleased to inform you that the order(No.ABZ-12) has been loaded onto the MV Arirang, which sails tomorrow and is due in Jakarta on 3 May, 2025.","The shipping documents have been handed over to Seoul Bank with our draft drawn on you for USD 300,000.00 at 90 days after sight. Seoul Bank will forward the documents to HSBC, who may advise you for collection by next week.","Also, we have sent the certificate of test that you asked for. However, we wonder if this is for reselling purposes. We should point out that your customers would only be covered by the warranty provided that the goods are not modified in any way."],"opts":["L/C (Letter of Credit)","D/P (Documents against Payment)","D/A (Documents against Acceptance)","T/T (Telegraphic Transfer)"],"ans":3,"passage":null,"topic":"서신·이메일"},{"id":"63-3-18","subj":3,"no":18,"head":"다음 서신의 내용상 공란 (A)에 들어갈 가장 적절한 용어는?","body":["Dear Mr. Smith,","Upon receiving your letter dated on September 18, which enclosed Invoice No.W-562, I was surprised to find that you had included a draft for USD 23,600.00 requesting my  <u>(A)<\/u>  to clear my account with you.","In all our previous transactions, I have consistently settled my accounts promptly via banker’s draft, and at no point have you raised any objections to this payment method. Therefore, I see no reason to change the system that has worked well for both of us.","Unless there are specific reasons for this change, I regret to inform you that I cannot accept your draft. Accordingly, I am returning it with this letter. Unless I hear otherwise from you, I will assume that you agree to continue with our previous arrangement, and I will settle the outstanding amount punctually by banker’s draft when payment is due at the end of next month.","Sincerely,"],"opts":["endorsement","collection","acceptance","acknowledgment"],"ans":3,"passage":null,"topic":"서신·이메일"},{"id":"63-3-19","subj":3,"no":19,"head":"다음 공란 (A)와 (B)에 들어갈 적절한 서류끼리 연결된 것은?","body":["A ( A ) is a document which evidences a contract of carriage by sea and the taking over or loading of the goods by the carrier, and by which the carrier undertakes to deliver the goods against surrender of the documents. A ( B ) is a document commonly used in international trade to allow a carrier to release goods to the consignee who is not yet in possession of the original ( A ). A ( B ) assures the carrier that he/she will not suffer from any financial loss by having released the goods to a consignee in the absence of the ( A )."],"opts":["A Letter of Guarantee · B Seaway Bill","A Bill of Lading · B Letter of Guarantee","A Bill of Lading · B Letter of Indemnity","A Seaway Bill · B Bill of Lading"],"ans":2,"passage":null,"topic":"운송·보험"},{"id":"63-3-20","subj":3,"no":20,"head":"다음의 컨테이너 운송 관련 비용에 대한 설명 중 옳은 내용만 고른 것은?","body":["A. Bunker Adjustment Factor is a surcharge to cover fluctuations in the price of currency.","B. Heavy Lift Surcharge is a surcharge fee imposed for cargo that exceeds weight limitations.","C. Wharfage is the fee charged for the use of the wharf facilities.","D. CFS Charge is a fee for consolidation, deconsolidation, and other activities performed in a container freight station, and it is particularly charged for full container load shipments.","E. Terminal Handling Charges are the fees charged for the storage and positioning of containers in the port area.","F. Detention Charges are fees levied against shippers for holding onto a container for less than the agreed free time."],"opts":["A, B, C","A, B, D","B, C, E","C, E, F"],"ans":3,"passage":null,"topic":"운송·보험"},{"id":"63-3-21","subj":3,"no":21,"head":"다음은 영국해상보험법(MIA)의 보험계약 성립에 관한 내용의 일부이다. 공란 (A)에 들어갈 올바른 용어는?","body":["A contract of marine insurance is deemed to be concluded when the proposal of the assured is accepted by the ( A ), whether the policy be then issued or not; and, for the purpose of showing when the proposal was accepted, reference may be made to the slip or covering note or other customary of the contract."],"opts":["insurer","policy holder","insured","agent"],"ans":1,"passage":null,"topic":"계약·CISG·인코텀즈"},{"id":"63-3-22","subj":3,"no":22,"head":"위 서신의 목적으로 가장 적절한 것은 무엇인가?","body":[],"opts":["To acknowledge its carelessness and propose to dispatch substitute items","To apologize for improper packaging and offer a refund for damaged goods","To let the recipient know that he/she is responsible for the damaged shipment","To explain who is responsible for breakage in transit and what action will be taken"],"ans":4,"passage":"63-3-22","topic":"서신·이메일"},{"id":"63-3-23","subj":3,"no":23,"head":"위 서신 이전에 매수인이 송부한 서신의 내용으로 적절하지 않은 것은?","body":[],"opts":["As these goods are unusable, we are formally lodging a claim for this breakage.","We received the recent order for glassware today, and regret to inform you that upon inspection, we discovered significant breakage in one of the cases.","We regretfully inform you that the goods ordered on July 20 have not been delivered to us.","We have attached photographs of the damaged items and the packaging for your review."],"ans":3,"passage":"63-3-22","topic":"서신·이메일"},{"id":"63-3-24","subj":3,"no":24,"head":"위 서신에 대한 내용으로 잘못된 것은?","body":[],"opts":["The price list enclosed quotes prices on a CIF basis for any order of less than 3,000 sets.","It specifies that the selling prices include insurance to the port of arrival.","It is an introductory letter sent by a seller to a potential new client.","The seller become aware of the recipient's interest in Korean electronic goods through Mr. Kim Sung-Kon."],"ans":1,"passage":"63-3-24","topic":"서신·이메일"},{"id":"63-3-25","subj":3,"no":25,"head":"위 서신의 밑줄 친 (A)에 들어갈 적절한 문장은?","body":[],"opts":["could you please send us one sample of model HD-0023?","we are prepared to offer an 8% discount on your initial trial order.","we would be grateful if you could offer special discounts for bulk orders or long-term partnerships.","we accept payment via direct bank transfer for your convenience."],"ans":2,"passage":"63-3-24","topic":"서신·이메일"},{"id":"63-3-26","subj":3,"no":26,"head":"다음 밑줄 친 부분(A~D)을 논리 전개에 따라 가장 잘 나열한 것은?","body":["Dear Mr. Barnes,","Regarding Order No. 1029/36, please note that it was shipped on May 22, 2025, aboard the SS Samanda, which is expected to arrive in Dover on June 3.","As per your request, we have already notified your agent, Rod Ericson, to arrange for the consignment's onward delivery to you.","<u>(A) These documents include the shipped clean bill of lading (No. 482619), invoice (No. EH2811), and insurance certificate (AR 109 1123). (B) In the meantime, we've enclosed a catalog of our new models. (C) We are confident you'll be very pleased with the machines and that they will find a strong market in your country. (D) Once you have accepted our bill, the relevant documents will be released by our bank's agents, Bonanza Bank Ltd. at High Street, Dover.<\/u> We believe you'll be particularly interested in the machines featured on pages 69-73. We look forward to hearing from you again soon.","Yours truly,"],"opts":["(C)-(A)-(B)-(D)","(C)-(D)-(B)-(A)","(D)-(A)-(C)-(B)","(D)-(C)-(A)-(B)"],"ans":3,"passage":null,"topic":"운송·보험"},{"id":"63-3-27","subj":3,"no":27,"head":"다음 서신에서 밑줄 친 부분(A~D) 중 문맥상 가장 어색한 것은?","body":["Dear Mr. Merton,","We are writing in response to the bill received today for goods shipped via the S.S. \"Ambassador,\" which we are unable to accept.","As per our prior agreement, these goods were sent to us on consignment. <u>(A) The delayed delivery of the consignment has resulted in significant commercial detriment. (B) We did not provide authorization for you to draw on us for this shipment.<\/u>","<u>(C) Additionally, we have not yet found buyers for these goods at the invoiced price, and they remain in our inventory. (D) It appears there has been an error in billing given the consignment terms.<\/u>","We will continue our efforts to sell the goods, though we anticipate having to offer them at prices lower than those stated. Please find the unaccepted draft returned with this letter.","We request your review and correction of this billing error.","Sincerely,"],"opts":["(A)","(B)","(C)","(D)"],"ans":1,"passage":null,"topic":"서신·이메일"},{"id":"63-3-28","subj":3,"no":28,"head":"다음 중 주어진 문장을 영작한 것 중 그 내용이 잘못된 것은?","body":[],"opts":["조만간 상품들을 선적할 것이므로 신용장을 빠른 시일 내에 개설해주실 것을 요청합니다. ⇒ We will soon be ready for shipment of the goods and, therefore, ask you to open a letter of credit as soon as possible to enable us to effect the shipment on time.","귀사를 수익자로 미화 18만불 상당의 취소불능신용장을 LA의 Bank of America측에서 개설하였음을 통보합니다. ⇒ We would like to notify you that the Bank of America in LA has opened an irrevocable letter of credit in your favor for the amount of USD 180,000.","귀사의 신용장 No. 7의 유효기간을 5월 15일까지 연장해 주실 것을 요청합니다. ⇒ We request that your L/C No. 7 be amended, extending its validity to May 15.","신용장을 검토한 결과, 운송료가 착불조건인데, FOB 조건이므로 운송료를 선불로 수정해 주시기 바랍니다⇒ After reviewing the letter of credit, we noted that the freight is indicated as prepaid. Since the shipment is under FOB terms, we kindly request that you amend it to collect."],"ans":4,"passage":null,"topic":"서신·이메일"},{"id":"63-3-29","subj":3,"no":29,"head":"이메일의 밑줄 친 부분을 대체하기에 그 의미가 다른 문장은?","body":[],"opts":["We are sorry that we cannot give you sufficient information regarding the credit standing of the firm.","We would advise you to proceed with caution in your dealing with the firm in question.","We regret our inability to inform you of anything concerning the firm mentioned.","As our relationship with the firm is limited, it would be advisable for you to instruct an inquiry agency to investigate the matter."],"ans":2,"passage":"63-3-29","topic":"서신·이메일"},{"id":"63-3-30","subj":3,"no":30,"head":"위 비즈니스에서 활용된 신용조회처는 무엇인가?","body":[],"opts":["Bank Reference","Credit Rating Company","Trade Reference","Consulate Inquiry"],"ans":3,"passage":"63-3-29","topic":"서신·이메일"}],"p":{"63-3-2":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear James,","Thank you for your order of September 1 for 20 units of Portable Radio Set A102, 10 units of Cassette Tape Recorder B84, and 10 units of Microphone C59. We have Portable Radio Set A102 and Cassette Tape Recorder B84 in stock, unfortunately Microphone C59 is out of stock.  <u>(A) .<\/u> Our new model C60 has recently been launched, and we are seeing wide popularity. We would like you to consider this model instead of C59.","The other two items will be shipped to you as soon as possible.","Your prompt reply by email regarding C60 would be appreciated.","Yours very truly,"]},"63-3-4":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Sirs,","We thank you for your inquiry of April 12, 2025, and <u>we take much pleasure in offering you the following, subject to your reply received<\/u> at the end of July 2025.","∙ Commodity: Blueberry Powder","∙ Quantity : 10,000 KG","∙ Price : USD 25.00/kg CIP New York, USA","∙ Shipment : Within 30 days after receipt of your L/C","∙ Payment : Confirmed L/C at sight in our favor","We look forwarding to furthering our partnership.","Very truly yours,"]},"63-3-13":{"head":"다음은 신용장의 일부이다. 아래 내용을 읽고 질문에 답하시오.","body":["40A: FORM OF DOCUMENTARY CREDIT: IRREVOCABLE","31D: DATE AND PLACE OF EXPIRY: 15 SEP 2025 KOREA","50: APPLICANT: SIAM TINPLATE CO., LTD.","59: BENEFICIARY: POSCO INTERNATIONAL CO., LTD.","32B: CURRENCY CODE, AMOUNT: USD 3,800,000","39A: PERCENTAGE CREDIT AMOUNT TOLERANCE: 10/10","41A: AVAILABLE WITH...BY...: ANY BANK BY NEGOTIATION","43P: PARTIAL SHIPMENTS: ALLOWED","44A: PLACE OF TAKING IN CHARGE / RECEIPT：ANY PORT OF KOREA","44B: PLACE OF FINAL DESTINATION: LAEM CHABANG , THAILAND","44C: LATEST DATE OF SHIPMENT: 30 AUG 2025","45B: DESCRIPTION OF GOODS AND/OR SERVICES","BLACK PLATE FOR TIN PLATE","CFR LAEM CHABANG, THAILAND.","46A: DOCUMENTS REQUIRED","+SIGNED COMMERCIAL INVOICE IN 3 COPIES","+FULL SET (3/3) ORIGINAL CLEAN ON BOARD OCEAN BILLS OF LADING MADE OUT TO ORDER OF KITA BANK, MARKED 'FREIGHT PREPAID' AND NOTIFY APPLICANT","+PACKING LIST IN 3 COPIES","+CERTIFICATE OF ORIGIN ISSUED BY CHAMBER OF COMMERCE"]},"63-3-22":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Mark,","We're very sorry to hear that one of the glassware cases from your invoice dated the 10th of this month arrived broken.","Since we packed the goods in our usual way, we believe the damage was caused by rough handling from the shipping company. Also, because the goods were sold on FOB Busan, we are not responsible for this breakage in transit.","Nonetheless, we will immediately contact ABC Marine Insurance Co., Inc. to negotiate a resolution on your behalf.","Yours truly,"]},"63-3-24":{"head":"다음 서신을 읽고 질문에 답하시오.","body":["Dear Andrew,","We are very pleased to learn from our friend, Mr. Kim Sung-Kon, who recently returned from your city, that you are highly interested in Korean electronic goods. As Mr. Kim may have already informed you, we maintain strong business relationships with several leading manufacturers in Korea and enjoy a well-established reputation for exporting our products to European markets.","Our enclosed catalog provides an overview of our product lines. The accompanying price list quotes prices on a CIF European port basis for a minimum order of 3,000 sets. However, <u>(A) .<\/u>","Regarding payment, our company policy require all transactions to be conducted via an irrevocable Letter of Credit (L/C).","Yours truly,"]},"63-3-29":{"head":"다음 비즈니스 이메일을 읽고 질문에 답하시오.","body":["<div class=\"box\">To: customors@sm.co.kr<br>Subject: Re: Credit Inquiry<br>Dear Anthony:<br>We are writing in response to your email dated April 10th inquiring about Jason Co. which had furnished us as a reference to you.<br><u>At this time we are sorry to say that our transactions with this firm have been so small and infrequent that we do not feel justified in making any recommendations regarding their financial standing and creditworthiness one way or the other.<\/u><br>Once again, we regret that we could not provide you with any concrete information that may encourage you to commence doing business with them.<br>If you feel we may be of further assistance, please do not hesitate to ask.<br>Sincerely yours,<\/div>"]}}}};

<script>
{

 if(/^(위|이|상기)\s/.test(q.head.replace(/<[^>]+>/g,''))&&!q.body.length){const arr=d.q.filter(x=>x.subj===q.subj&&x.no<q.no&&x.body.length);const pv=arr[arr.length-1];if(pv)return{head:`${pv.no}번 문제의 지문`,body:pv.body}}return null}

/* 약점 지도 */
function map(){nav('map');
 app.innerHTML=`<div class="wrap"><h2>약점 지도</h2><p class="note">주제별 누적 정답률입니다. 빨강은 과락선(40%) 아래, 노랑은 합격선(60%) 아래입니다. 주제 분류는 문제 내용으로 자동으로 나눈 것이라 일부 어긋날 수 있습니다.</p>
 ${SUBJ.map((sn,s)=>{const rows=TOP[s].map(t=>{const qs=Object.values(Q).filter(q=>q.subj===s&&q.topic===t);let n=0,ok=0,tried=0;for(const q of qs){const v=ST.stats[q.id];if(v){n+=v.n;ok+=v.ok;tried++}}return{t,qs:qs.length,n,ok,tried,r:n?ok/n:null}}).sort((a,b)=>(a.r??2)-(b.r??2));
 return `<div class="panel"><h3>${sn}</h3>${rows.map(x=>`<div class="trow"><span>${x.t}</span><div class="tb"><i class="${x.r==null?'':x.r<.4?'low':x.r<.6?'mid':''}" style="width:${x.r==null?0:Math.round(x.r*100)}%"></i></div><span class="v">${x.r==null?'안 풀어 봄':Math.round(x.r*100)+'%'}</span><span class="note" style="grid-column:1/-1">기출 ${x.qs}문항 중 ${x.tried}문항 풀어 봄 <button class="chip" style="min-height:34px;margin-inline-start:8px" data-a="mapGo" data-k="${s}|${x.t}">이 주제 풀기</button></span></div>`).join('')}</div>`}).join('')}</div>`;scrollTo(0,0)}
/* 이벤트 */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,c=ST.cur;
 switch(a){
 case'home':clearInterval(T);return home();
 case'mockSetup':clearInterval(T);return mockSetup();
 case'mexam':selExam=+b.dataset.n;document.querySelectorAll('[data-a=mexam]').forEach(x=>x.classList.toggle('on',x===b));return;
 case'mockStart':return mockStart();
 case'mockResume':V={s:0,i:0};return mock();
 case'mockDiscard':ST.cur=null;save();return mockSetup();
 case'mpick':c.ans[BYEX[c.exam].filter(q=>q.subj===V.s)[V.i].id]=+b.dataset.i;save();return mock();
 case'mtab':V={s:+b.dataset.s,i:0};return mock();
 case'mgo':V.i=+b.dataset.i;return mock();
 case'mprev':if(V.i>0)V.i--;else if(V.s>0){V.s--;V.i=29}return mock();
 case'mnext':if(V.i<29)V.i++;else if(V.s<3){V.s++;V.i=0}else return mockAsk();return mock();
 case'mflag':{const id=BYEX[c.exam].filter(q=>q.subj===V.s)[V.i].id;c.flag[id]=!c.flag[id];save();return mock()}
 case'mockAsk':return mockAsk();
 case'closeModal':return document.querySelector('.modal')?.remove();
 case'mockSubmit':return mockSubmit(false);
 case'review':RV={k:+b.dataset.k,s:0,i:0};return review();
 case'rtab':RV.s=+b.dataset.s;RV.i=0;return review();
 case'rgo':RV.i=+b.dataset.i;return review();
 case'rprev':RV.i--;return review();case'rnext':RV.i++;return review();
 case'rback':return mockResult(RV.k);
 case'drillSetup':clearInterval(T);return drillSetup();
 case'dex':{const n=+b.dataset.n;DS.ex.has(n)&&DS.ex.size>1?DS.ex.delete(n):DS.ex.add(n);return drillSetup()}
 case'dsub':{const s=+b.dataset.s;DS.s.has(s)&&DS.s.size>1?DS.s.delete(s):DS.s.add(s);for(const k of [...DS.t])if(!DS.s.has(+k.split('|')[0]))DS.t.delete(k);return drillSetup()}
 case'dtop':{const k=b.dataset.k;DS.t.has(k)?DS.t.delete(k):DS.t.add(k);return drillSetup()}
 case'dord':DS.order=b.dataset.o;return drillSetup();
 case'dcnt':DS.cnt=+b.dataset.c;return drillSetup();
 case'drillStart':return drillStart();
 case'dpick':{if(D.a!=null)return;const q=D.L[D.i];D.a=+b.dataset.i;const ok=D.a===q.ans;if(ok)D.ok++;rec(q,ok);return drill()}
 case'dnext':if(D.i<D.L.length-1){D.i++;D.a=null;return drill()}return drillEnd();
 case'drillEnd':return drillEnd();
 case'wrong':clearInterval(T);return wrong();
 case'wrongAll':return wrongRun(Object.keys(ST.wrong).filter(i=>Q[i]));
 case'wrongSub':return wrongRun(Object.keys(ST.wrong).filter(i=>Q[i]&&Q[i].subj===+b.dataset.s));
 case'map':clearInterval(T);return map();
 case'mapGo':{const [s,t]=b.dataset.k.split('|');DS={ex:new Set(EXAMS),s:new Set([+s]),t:new Set([b.dataset.k]),order:'new',cnt:0};return drillStart()}
 }});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea')||document.querySelector('.modal'))return;const k=e.key;
 if(/^[1-4]$/.test(k)){const o=document.querySelectorAll('.opt')[+k-1];if(o&&!o.disabled){o.click();e.preventDefault()}}
 else if(k==='ArrowRight'){document.querySelector('[data-a=mnext],[data-a=rnext]:not(:disabled)')?.click()}
 else if(k==='ArrowLeft'){document.querySelector('[data-a=mprev]:not(:disabled),[data-a=rprev]:not(:disabled)')?.click()}
 else if(k==='Enter'&&document.querySelector('[data-a=dnext]')){document.querySelector('[data-a=dnext]').click();e.preventDefault()}});
home();
}
</script>
</body>
</html>
